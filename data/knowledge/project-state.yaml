project_state:
  simulation:
    status: in_progress
    notes:
      - README, architecture, and logical data schemas are authored.
      - Domain model design is the next major planning step.

  concealment:
    status: normalized
    notes:
      - Hidden is a formal state.
      - Concealment is the subsystem, not the granted effect.
      - Hidden preserves its acquiring roll as the active value.

  ailments:
