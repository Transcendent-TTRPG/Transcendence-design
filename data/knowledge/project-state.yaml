      - First-contact affliction rule established (corebook ch11).

  natural_weapon_audit:
    status: complete
    notes:
      - All 12 species audited. Each species now has a biologically distinct natural weapon effect.
      - Naghii Cola Desorientado, Sauri Cola T.D. penalty, Drak'kai Mordisco Aterrorizado (max die),
        Drak'kai Garras forced displacement, Loxod Colmillos Aturdido, Ursari Garras T.D. -1/rango,
        Formix Mordisco Confundido, Chelicer Garras Sobrecargado, Panin Mordisco Conmocionado,
        Luphran Mordisco no reactions, Luphran Garras no reactions generated, Zarnag Mordisco +Ritmo.
      - No two species share the same trigger + output combination.

  drakkai_technique_pass:
    status: complete
    notes:
