# Entidades del Limbo — autoridad de diseño
#
# Referencia cruzada:
#   - data/system/limbo-manifestations.yaml → vestigios, vínculos, flujo ambiental
#   - data/system/ailments.yaml             → aflicciones por sentido
#   - docs/system/limbo-entities.md         → referencia narrativa y guía de autoría
#
# El Tauma es la energía elemental del mundo. Los Primordiales son entidades
# compuestas de Tauma puro — toda entidad del Limbo es un Primordial.
# El Tauma en sí no equivale a las criaturas: la energía y la entidad son distintas,
# como el carbono y los seres vivos.

meta:
  version: "1.0"
  status: draft
  last_updated: "2026-05-24"

# ──────────────────────────────────────────────────────
# TAXONOMÍA DE CRIATURAS
# ──────────────────────────────────────────────────────

taxonomia_criaturas:
  descripcion: >
    Toda criatura pertenece a una de tres naturalezas. La naturaleza determina
    su relación con el Tauma, no su peligrosidad ni su categoría de combate.
  tipos:
    - id: mortal
      nombre_es: Mortal
      nombre_en: Mortal
      descripcion: >
        Criatura biológica sin capacidad inherente para percibir o manipular Tauma.
        No puede interactuar con el Limbo por sí sola. El Tauma es invisible e
        inaccesible para ella. Los vestigios y vínculos son los únicos mecanismos
        por los que un Mortal puede canalizar Tauma — y solo si los descubre.

    - id: anomalia
      nombre_es: Anomalía
      nombre_en: Anomaly
      descripcion: >
        Criatura de base biológica que ha integrado el Tauma en su propia estructura
        por exposición prolongada a zonas de alta condensación taumática. El Tauma
        no fue adquirido — se volvió parte de la criatura evolutivamente. No necesita
        un objeto conducto ni un canal externo: el Tauma fluye a través de su propio
        cuerpo porque su biología se reorganizó para recibirlo directamente. El Tauma
        existe en todas partes (filtrándose desde el Limbo de forma continua), y las
        Anomalías son criaturas que evolucionaron para ser receptores naturales de esa
        energía. Su naturaleza taumática refleja el Tauma dominante de la zona en la
        que habitaron.
      ejemplos:
        - una bestia que habita una tundra con alta condensación de Tauma elemental
          de hielo puede desarrollar la capacidad de canalizar ese Tauma a través de
          su tracto respiratorio — sin objeto, sin ritual, sin entidad vinculada

    - id: primordial
      nombre_es: Primordial
      nombre_en: Primordial
      descripcion: >
        Entidad compuesta enteramente de Tauma puro. No posee estructura biológica
        convencional. Toda entidad del Limbo es un Primordial. Su existencia en el
        mundo físico puede ser imperceptible para la mayoría: sin capacidad de detección
        adecuada, una criatura no percibe al Primordial directamente — solo puede percibir
        sus efectos en el entorno, o no percibir nada en absoluto antes de morir. Los
        Primordiales son fuerzas con escala de existencia que trasciende la comprensión
        ordinaria; su presencia en el mundo físico no requiere que sean "vistos" para
        ser devastadores.

# ──────────────────────────────────────────────────────
# NIVELES DE ENTIDAD
# ──────────────────────────────────────────────────────

alcance_vestigios_vinculos:
  descripcion: >
    Los vestigios y vínculos son mecanismos de acceso al Tauma exclusivos de
    criaturas humanoides — PJs y PNJs humanoides. Los monstruos (Anomalías y
    Primordiales) no usan vestigios ni vínculos: su relación con el Tauma es
    directa, estructural o constitutiva. Las reglas de descubrimiento, aflicción
    y Cordura de este archivo aplican solo al contexto humanoide.

niveles_entidad:
  descripcion: >
    Todo Primordial pertenece a uno de cuatro niveles. El nivel determina su
    coherencia como entidad, su potencia taumática, el tipo de manifestación
    que puede dejar y los requisitos para interactuar con ella.
  nota_nivel_vs_pistas: >
    El nivel determina las cargas (cuánto Tauma queda) y el NR necesario para
    sostener un vínculo — no la perturbación o amenaza de las pistas. Las pistas
    dependen de la naturaleza e intención de la entidad. Una entidad de nivel
    Fragmento puede generar pistas profundamente perturbadoras si su naturaleza
    es así; un Soberano puede ser sutil. El poder y el horror son dimensiones
    independientes.
  niveles:
    - id: fragmento
      nombre_es: Fragmento
      nombre_en: Fragment
      descripcion: >
        Residuo taumático con cohesión mínima. Sin voluntad definida ni intención
        clara. Es Tauma bruto que ha adquirido la mínima forma necesaria para dejar
        una huella. Sus efectos son débiles. Siempre arquetípico — no existen
        Fragmentos únicos.
      coherencia: mínima — sin voluntad clara
      unicidad: siempre arquetípico
      vestigio:
        disponible: true
        cargas: "2–5"
        nota: >
          Efectos menores. Se agotan rápido. Descartables por diseño. El Narrador
          determina el valor exacto dentro del rango en secreto al colocar el objeto.
      vinculo:
        disponible: true
        nr_minimo: 1
        nota: >
          Accesible desde el inicio del juego. Requiere aflicción activa del sentido
          vinculado. El costo en cordura es bajo, el efecto también.

    - id: entidad
      nombre_es: Entidad
      nombre_en: Entity
      descripcion: >
        Voluntad reconocible. Naturaleza e intención propias. La mayoría de vestigios
        y vínculos del juego provienen de este nivel. Puede ser malévola, benévola,
        juguetona, indiferente, desesperada u otras disposiciones. Casi siempre
        arquetípica — el mismo tipo de entidad puede existir en múltiples instancias
        a lo largo del mundo y la historia.
      coherencia: definida — naturaleza e intención propias
      unicidad: casi siempre arquetípico
      vestigio:
        disponible: true
        cargas: "5–10"
        nota: >
          Recurso valioso de duración incierta. El agotamiento es un momento
          significativo aunque no necesariamente narrativo.
      vinculo:
        disponible: true
        nr_minimo: 3
        nota: >
          Requiere progresión real en competencias. El efecto escala con la
          severidad de la aflicción activa del portador.

    - id: soberano
      nombre_es: Soberano
      nombre_en: Sovereign
      descripcion: >
        Identidad marcada y poder alto. Semi-único o único dentro de su arquetipo.
        Sus efectos son significativos y sus intenciones, complejas. Interactuar
        con un Soberano tiene consecuencias narrativas además de mecánicas —
        la entidad tiene agenda. Diseñar un Soberano implica construir un personaje
        con historia, no solo un efecto.
      coherencia: fuerte — identidad individual marcada
      unicidad: puede ser único
      vestigio:
        disponible: true
        cargas: "10–15"
        nota: >
          Objeto de historia o mitología. Su agotamiento es un evento narrativo
          que el Narrador puede preparar.
      vinculo:
        disponible: true
        nr_minimo: 5
        nota: >
          Solo personajes con competencias significativamente avanzadas pueden
          sostener la conexión sin consecuencias severas. El costo en cordura
          escala con la severidad de la aflicción.

    - id: abismal
      nombre_es: Abismal
      nombre_en: Abyssal
      descripcion: >
        Antiguo. Potencialmente único. Su escala de influencia puede afectar el
        mundo, no solo a un individuo. No deja vestigios — si alguna vez estuvo
        en un objeto, lo transformó en un vínculo permanente o lo destruyó.
        Su presencia en el mundo físico no es una mecánica de progresión: es un
        evento de ficción.
      coherencia: absoluta — voluntad singular e historia propia
      unicidad: frecuentemente único
      vestigio:
        disponible: false
        nota: >
          Los Abismales no dejan vestigios. Su huella en un objeto crea un vínculo
          permanente o destruye el objeto.
      vinculo:
        disponible: true
        nr_minimo: null
        condicion: narrativa — ningún NR lo desbloquea
        nota: >
          Un vínculo Abismal es un evento de campaña, no una adquisición de
          progresión. Requiere una circunstancia específica de la ficción. Sus
          consecuencias sobre la cordura son permanentes y de alcance narrativo.

# ──────────────────────────────────────────────────────
# UNICIDAD
# ──────────────────────────────────────────────────────

unicidad:
  descripcion: >
    Toda entidad del Limbo es arquetípica o única. Esto determina si su vestigio
    o vínculo es irrepetible o si existen múltiples instancias del mismo tipo
    distribuidas a lo largo del mundo y la historia.
  tipos:
    - id: arquetipico
      nombre_es: Arquetípico
      nombre_en: Archetypal
      descripcion: >
        Existen muchas instancias del mismo tipo de entidad. Una entidad de vuelo
        puede estar en una pluma en un continente y en una vasija en otro, siglos
        después. La categoría de capacidad es la misma; la naturaleza, intención y
        comportamiento de cada instancia son propios.
      implicacion_narrativa: >
        Distintas culturas, épocas y regiones pueden haber conocido versiones del
        mismo arquetipo con nombres, objetos y rituales diferentes. Todos se refieren
        a la misma clase de entidad, no a la misma entidad. Esto puede ser fuente
        de conflictos entre facciones que creen poseer algo único.

    - id: unico
      nombre_es: Único
      nombre_en: Singular
      descripcion: >
        Solo existe una instancia de esta entidad en el Limbo. Su vestigio o vínculo
        no puede estar en dos lugares. Si el objeto que lo contiene se destruye,
        la entidad se disuelve o regresa permanentemente al Limbo.
      implicacion_narrativa: >
        Un objeto único puede ser el centro de conflictos entre facciones, culturas
        o periodos históricos. Su destrucción tiene consecuencias irreversibles para
        la entidad y para quienes dependían de ella.

# ──────────────────────────────────────────────────────
# SCHEMA DE ENTIDAD — PROPIEDADES REQUERIDAS PARA AUTORÍA
# ──────────────────────────────────────────────────────

entity_schema:
  descripcion: >
    Propiedades que el Narrador debe definir al diseñar una entidad del Limbo.
    Este schema aplica a vestigios y vínculos por igual. Una entidad bien diseñada
    es un personaje con naturaleza e intención propias — no un ítem mágico.
  propiedades:
    - campo: id
      tipo: string
      descripcion: Identificador único de esta entidad.
      requerido: true

    - campo: nombre
      tipo: string
      descripcion: >
        Nombre de la entidad, si lo tiene. No toda entidad es nombrable. Los Fragmentos
        rara vez tienen nombre; los Soberanos y Abismales casi siempre.
      requerido: false

    - campo: nivel
      tipo: enum [fragmento, entidad, soberano, abismal]
      requerido: true

    - campo: naturaleza
      tipo: >
        string — valores de referencia (no es lista cerrada):
        malévola, benévola, juguetona, indiferente, desesperada, predatoria,
        contemplativa, servicial, hostil, posesiva, curiosa
      descripcion: >
        Disposición base de la entidad. Afecta cómo entrega pistas y qué quiere
        del portador. No es un valor moral — una entidad benévola puede ser
        igualmente peligrosa que una malévola si sus objetivos divergen.
      requerido: true

    - campo: intencion
      tipo: string
      descripcion: >
        Qué quiere esta entidad del portador o del mundo. Puede ser simple
        (alimentarse de la aflicción acumulada) o compleja (completar algo
        que no pudo antes de quedar atrapada). Guía el contenido de las pistas
        y el comportamiento de la entidad a lo largo del tiempo.
      requerido: true

    - campo: sentidos
      tipo: list of enum [vista, oido, olfato, gusto, tacto]
      descripcion: >
        Sentido(s) a través del cual la entidad se comunica y genera aflicciones.
        Un vestigio de sentido único solo genera aflicciones de ese sentido.
        Un vínculo multi-sentido requiere aflicción activa en todos los sentidos
        vinculados para poder usarse.
      requerido: true
      min_sentidos: 1

    - campo: unicidad
      tipo: enum [arquetipico, unico]
      requerido: true

    - campo: arquetipo
      tipo: string
      descripcion: >
        Si es arquetípico, a qué familia pertenece. Permite agrupar entidades del
        mismo tipo aunque sean instancias distintas. Ejemplos: vuelo, percepción
        temporal, fuerza bruta, ilusión, memoria.
      requerido: si unicidad == arquetipico

    - campo: capacidad_categoria
      tipo: >
        string — categorías de referencia (no es lista cerrada):
        locomocion, percepcion, temporal, fisica, informacion, ambiental, biologica, mental
      descripcion: >
        Categoría general del efecto que otorga. Define el tipo de capacidad
        sin especificar los detalles mecánicos exactos.
      requerido: true

    - campo: objeto_preferente
      tipo: string
      descripcion: >
        Tipo de objeto en el que esta entidad tiende a impregnarse. No es
        obligatorio — el Tauma puede estar en cualquier objeto — pero el objeto
        preferente tiene coherencia con la naturaleza, capacidad y sentido de la
        entidad. Ignorarlo deliberadamente puede crear misterio o subvertir
        expectativas.
      requerido: false

    - campo: claves_pista
      tipo: list of string
      descripcion: >
        Imágenes, sensaciones o patrones recurrentes que esta entidad usa para
        comunicarse. Son la materia prima que el Narrador (o el sistema de IA)
        usa para generar pistas consistentes con la identidad de esta entidad
        a lo largo del tiempo. Deben reflejar la naturaleza, el sentido vinculado
        y la intención.
      requerido: true
      min_items: 3

    - campo: vestigio
      tipo: object
      descripcion: Completar solo si esta entidad se diseña como vestigio.
      campos_hijo:
        - campo: cargas
          tipo: string
          descripcion: >
            Rango de cargas según el nivel (ver niveles_entidad). El Narrador
            determina el valor exacto en secreto al colocar el objeto.
        - campo: efecto
          tipo: string
          descripcion: Descripción mecánica del efecto al usar el vestigio.
      requerido: si se diseña como vestigio

    - campo: vinculo
      tipo: object
      descripcion: Completar solo si esta entidad se diseña como vínculo.
      campos_hijo:
        - campo: nr_minimo
          tipo: integer (1, 3, 5) o null
          descripcion: >
            NR promedio mínimo requerido para usar el vínculo.
            Fragmento: 1 · Entidad: 3 · Soberano: 5 · Abismal: null (narrativo).

        - campo: identidad_tematica
          tipo: string
          descripcion: >
            La idea central que da forma a todos los efectos del vínculo. Todo camino
            y toda convergencia deben ser expresiones de esta identidad.
          requerido: true

        - campo: caminos
          tipo: list of object (uno por sentido vinculado)
          descripcion: >
            Cada camino corresponde a un sentido vinculado. Los caminos son completamente
            independientes: acceder a uno no requiere tener canal en los otros.
          estructura_camino:
            - campo: sentido
              tipo: enum [vista, oido, olfato, gusto, tacto]
            - campo: tematica
              tipo: string
              descripcion: Cómo este sentido se expresa dentro de la identidad_tematica.
            - campo: leve
              tipo: string
              descripcion: Efecto con aflicción Leve en este sentido.
            - campo: moderado
              tipo: string
              descripcion: Efecto acumulado con aflicción Moderada en este sentido.
            - campo: grave
              tipo: string
              descripcion: Efecto acumulado con aflicción Grave en este sentido.
          requerido: true

        - campo: convergencia
          tipo: object
          descripcion: >
            Solo para vínculos con más de un sentido vinculado. Efecto que se desbloquea
            cuando todos los caminos tienen aflicción activa. Su potencia usa la severidad
            mínima entre todos los sentidos vinculados.
          estructura:
            - campo: descripcion
              tipo: string
              descripcion: Síntesis temática — qué representa la convergencia de todos los caminos.
            - campo: leve
              tipo: string
            - campo: moderado
              tipo: string
            - campo: grave
              tipo: string
          requerido: si sentidos vinculados > 1
      requerido: si se diseña como vínculo

# ──────────────────────────────────────────────────────
# SENTIDOS Y AFLICCIONES DEL VACÍO
# ──────────────────────────────────────────────────────

sentidos_aflicciones:
  descripcion: >
    Cada sentido tiene aflicciones asociadas. La aflicción específica
    que desarrolla un portador depende de la entidad y de cómo elige comunicarse.
    El sentido vinculado de un vestigio o vínculo determina qué grupo de aflicciones
    puede generarse al interactuar con él. Los efectos negativos y positivos
    completos de cada aflicción se encuentran en data/system/ailments.yaml.
  sentidos:
    - id: vista
      nombre_es: Vista
      nombre_en: Sight
      aflicciones:
        - id: esquizofrenia_paranoide
          nombre_es: Esquizofrenia Paranoide
        - id: agnosia_visual
          nombre_es: Agnosia Visual
        - id: alucinaciones_visuales
          nombre_es: Alucinaciones Visuales

    - id: oido
      nombre_es: Oído
      nombre_en: Hearing
      aflicciones:
        - id: tinnitus
          nombre_es: Tinnitus
        - id: hiperacusia
          nombre_es: Hiperacusia
        - id: eco_persistente
          nombre_es: Eco Persistente

    - id: olfato
      nombre_es: Olfato
      nombre_en: Smell
      aflicciones:
        - id: phantosmia
          nombre_es: Phantosmia
        - id: hiperosmia
          nombre_es: Hiperosmia

    - id: gusto
      nombre_es: Gusto
      nombre_en: Taste
      aflicciones:
        - id: disgeusia
          nombre_es: Disgeusia
        - id: compulsion_alimentaria
          nombre_es: Compulsión Alimentaria

    - id: tacto
      nombre_es: Tacto
      nombre_en: Touch
      aflicciones:
        - id: formicacion
          nombre_es: Formicación
        - id: anestesia_parcial
          nombre_es: Anestesia Parcial
        - id: hipertacto
          nombre_es: Hipertacto

# ──────────────────────────────────────────────────────
# MECANICA DE DESCUBRIMIENTO
# ──────────────────────────────────────────────────────

descubrimiento:
  principio_central: >
    El Tauma permanece fijo en el objeto. El portador es el canal por el que la energía
    se expresa en el mundo físico. Para que ese canal exista, la materia orgánica del
    portador debe quedar impregnada de Tauma en el sentido vinculado — eso es exactamente
    lo que produce una Aflicción. Sin aflicción activa en el sentido vinculado,
    no hay canal. Sin canal, no hay vestigio activable intencionalmente. Por eso no es
    posible intentar activar un vestigio antes de haberlo descubierto: el canal que lo
    haría posible es el propio cuerpo del portador, y ese canal no existe hasta que el
    Tauma lo crea.

  estados:
    sin_descubrir:
      descripcion: >
        El portador puede detectar que el objeto tiene algo — por Instinto, Resonancia,
        Taumaturgia o Teología — pero no comprende el patrón real del vestigio.
        No puede usarlo intencionalmente. La primera interacción significativa genera
        la primera Aflicción en el sentido vinculado, abriendo el canal inicial.
    descubierto:
      descripcion: >
        El portador ha comprendido el patrón real del vestigio y puede usarlo de forma
        intencional dentro de sus requisitos de uso. En este estado conoce:
        nombre real (si existe), sentido vinculado, requisitos de uso e identidad del efecto.

  primera_afliccion:
    descripcion: >
      La primera interacción significativa con el vestigio — sostenerlo en un momento de
      necesidad real, manipularlo con intención, activarlo sin comprender lo que hace —
      genera automáticamente una Aflicción de severidad Leve en el sentido
      vinculado. Esta es la apertura del canal. Sin ella, la entidad no tiene medio para
      llegar al mundo físico a través del portador.
    nota_diseño: >
      La aflicción se acumula por interacción, no por uso intencional. Interactuar con el
      vestigio — ya sea para descubrirlo o para usarlo — incrementa la aflicción del sentido
      vinculado. El descubrimiento no controla esta acumulación; solo desbloquea el uso
      intencional. Un portador que descubre el vestigio en la primera pista puede usarlo
      de inmediato, pero seguirá acumulando aflicción cada vez que lo use. Un portador que
      tardó más en descubrirlo llegó con una aflicción más severa, lo que le da pistas más
      claras desde el inicio del uso. La velocidad de descubrimiento depende del razonamiento
      del jugador, no de una progresión mecánica fija — el mundo no impone una curva de
      aprendizaje; el personaje la recorre a su propio ritmo.

  deteccion_previa:
    descripcion: >
      Antes de interactuar con el objeto, un personaje con las especializaciones adecuadas
      puede detectar que tiene carga taumática. La detección no equivale al descubrimiento:
      identifica que algo existe, pero no revela el patrón de uso ni abre el canal.
    especializaciones:
      - id: instinto
        caracteristica: Aura
        tipo: involuntaria, pasiva
        que_entrega: >
          El personaje siente que el objeto "no pertenece" — atracción o repulsión profunda
          sin razón articulable. Sin precisión sobre tipo de manifestación, sentido vinculado
          ni intensidad. La señal es real pero irreducible.
        cuando: automático al estar en presencia del objeto; no requiere acción deliberada
        no_entrega: tipo de manifestación, sentido vinculado, intensidad, patrón de uso

      - id: resonancia
        caracteristica: Aura
        tipo: activa, dirigida
        que_entrega: >
          El personaje puede percibir la carga esencial del objeto: confirma la presencia
          de Tauma, puede distinguir si la señal es activa (vínculo) o residual (vestigio),
          puede estimar si la señal es intensa o débil.
        cuando: acción deliberada de sintonía aural con el objeto
        no_entrega: sentido vinculado exacto, patrón de uso, identidad o nivel de la entidad

      - id: taumaturgia
        caracteristica: Intelecto
        tipo: activa, analítica
        que_entrega: >
          Analiza la firma estructural del Tauma: distingue vestigio de vínculo con certeza,
          identifica el sentido vinculado, puede estimar la intensidad relativa y clasificar
          aproximadamente el nivel de la entidad (fragmento / entidad / soberano).
        cuando: observación directa con tiempo suficiente para análisis formal
        no_entrega: patrón de uso específico, intención de la entidad, nombre real

      - id: teologia
        caracteristica: Intelecto
        tipo: activa, doctrinal
        que_entrega: >
          Reconoce señales del Limbo según la doctrina de la tradición religiosa que conoce.
          Puede confirmar que el objeto tiene presencia del Limbo e inferir qué clase de
          entidad podría estar implicada según los signos codificados en esa tradición.
          Interpreta por doctrina, no por análisis directo.
        cuando: requiere conocimiento previo de signos de la tradición y observación del objeto
        no_entrega: comprensión taumática estructural — es interpretación religiosa, no ciencia del Tauma

  pistas:
    descripcion: >
      Las pistas son la forma en que la entidad se comunica a través del canal del portador.
      La entidad no elige palabras ni imágenes libremente — usa el canal disponible: la
      aflicción activa del portador en el sentido vinculado. El portador no oye voces; experimenta
      lo que su aflicción le permite experimentar, pero la entidad colorea ese canal con sus
      claves_pista y su naturaleza propia.
      El Narrador construye pistas combinando las claves_pista de la entidad con el efecto
      positivo de la aflicción activa del portador. No requiere preparación elaborada:
      el sistema le entrega los materiales.
    severidad_claridad:
      - severidad: Leve
        claridad: >
          Críptica e impresionista. El portador experimenta algo relacionado con el efecto del
          vestigio, pero la señal admite múltiples interpretaciones. Abre el canal; no da respuestas.
      - severidad: Moderado
        claridad: >
          Reconocible. El patrón comienza a tomar forma. El portador puede relacionar pistas
          previas y empezar a inferir la función real, aunque no todo está claro todavía.
      - severidad: Grave
        claridad: >
          Decodificable. La función del vestigio se vuelve comprensible. El costo al portador
          es alto, pero la señal es suficientemente clara para entender qué hace el objeto y cómo se usa.

  procedimiento:
    descripcion: >
      El descubrimiento no es una tirada única — es un proceso de acumulación de comprensión.
      No existe un número fijo de pistas necesarias: el jugador declara cuando considera que
      su personaje ha comprendido suficiente, y el Narrador confirma o deniega.
    pasos:
      - numero: 1
        accion: >
          Primera interacción significativa con el objeto → primera Aflicción
          en el sentido vinculado (severidad Leve) → canal abierto.
      - numero: 2
        accion: >
          El Narrador genera una pista usando las claves_pista de la entidad combinadas con
          el efecto positivo de la aflicción activa del portador. La claridad depende
          de la severidad de la aflicción.
      - numero: 3
        accion: >
          El portador acumula pistas a lo largo de interacciones sucesivas. La aflicción puede
          incrementarse en severidad (produciendo pistas más claras, a mayor costo) o mantenerse.
      - numero: 4
        accion: >
          Cuando el jugador considera que su personaje ha comprendido suficiente, declara el
          descubrimiento: describe qué entiende sobre el objeto — su efecto, el sentido vinculado
          y los requisitos de uso.
      - numero: 5
        accion: >
          El Narrador confirma o deniega. La declaración debe coincidir sustancialmente con
          el efecto real (identidad del efecto), el sentido vinculado y los requisitos de uso.
          No se exige terminología exacta — basta con que capture el patrón verdadero.
      - numero: 6
        accion: >
          Si confirmado: estado descubierto activo. El portador puede usar el vestigio de forma
          intencional dentro de sus requisitos. No puede activarlo sin haber alcanzado este paso.

  transferencia:
    regla: >
      Si el portador transfiere el objeto a otro, el estado de descubrimiento se reinicia.
      El canal era del portador original — su cuerpo fue impregnado de Tauma en ese sentido.
      El nuevo portador no tiene esa impregnación: empieza sin canal y sin descubrimiento.
    excepcion: >
      Si la ficción establece explícitamente que el portador original transmitió la comprensión
      del patrón al nuevo portador — por entrenamiento directo, enseñanza prolongada o ritual
      específico — el nuevo portador puede comenzar ya con el conocimiento del patrón. Pero el
      canal físico debe construirse igual: la primera Aflicción del sentido vinculado sigue siendo
      necesaria para que el vestigio pueda usarse.
    nota_diseño: >
      La excepción de herencia no es automática. El Narrador juzga si la ficción justifica la
      transferencia de comprensión. Quien enseña el patrón de un vestigio debe haber podido
      articularlo — y esa articulación es difícil cuando el conocimiento vino principalmente
      de pistas crípticas.

# ──────────────────────────────────────────────────────
# MECÁNICA DE VÍNCULOS
# ──────────────────────────────────────────────────────

vinculos_sistema:
  principio_central: >
    Un vínculo no otorga un efecto puntual — otorga una identidad. El portador adquiere
    una forma, un modo de existir y combatir que el vínculo hace posible. Esa identidad
    no genera poder nuevo: modifica cómo se expresan las competencias y capacidades del
    portador. Si un vínculo produce sombras que atacan, el daño de esos ataques viene de
    las competencias de arma del portador — no del vínculo. El Tauma no crea de la nada;
    estructura, canaliza y transforma lo que ya existe.

  estructura:
    identidad_tematica: >
      Cada vínculo tiene una idea central que da forma a todos sus efectos. Todo camino
      y toda convergencia deben ser expresiones de esa misma identidad.
    caminos:
      descripcion: >
        Cada sentido vinculado corresponde a un camino — una línea de escalado independiente
        con su propia temática dentro de la identidad central. Cada camino tiene tres etapas,
        una por severidad de la aflicción del sentido correspondiente (Leve, Moderado, Grave).
        Las etapas son acumulativas: Moderado incluye lo de Leve; Grave incluye lo de Moderado.
    convergencia:
      descripcion: >
        Cuando el portador tiene aflicción activa en todos los sentidos vinculados, se
        desbloquea la convergencia — efectos que ningún camino produce por separado,
        que representan la síntesis de todos los caminos en la identidad central.
        La potencia de la convergencia usa la severidad mínima entre todas las aflicciones
        activas de los sentidos vinculados.

  acceso_por_sentido:
    regla: >
      Los caminos de un vínculo multi-sentido son completamente independientes. El portador
      puede usar un camino si tiene aflicción activa en el sentido correspondiente,
      independientemente de los otros sentidos vinculados. Sin canal en el sentido de un
      camino — sin aflicción de ese sentido — ese camino no existe para el portador.
    convergencia_requiere_todos: >
      La convergencia solo se desbloquea cuando todos los sentidos vinculados tienen
      aflicción activa. Si falta uno, la convergencia no está disponible aunque los
      demás caminos estén activos.

  costo:
    cordura:
      descripcion: >
        Usar un vínculo cuesta Cordura. La Cordura es la reserva de integridad psíquica
        del portador frente a la presencia continua del Limbo. El costo exacto por uso
        es una pregunta abierta — ver E-02.
      formula_base: "Cordura = 3 + (Compostura × 2)"
      estado: confirmado
      distincion_critica: >
        Los vestigios aumentan la aflicción al usarse. Los vínculos no. El uso de un
        vínculo solo cuesta Cordura — no incrementa la aflicción del portador. La aflicción
        en un portador de vínculo crece durante el descubrimiento, no durante el uso.
        Esto permite que un personaje sin experiencia previa con vestigios desarrolle
        aflicciones suficientes para acceder al vínculo solo a través del proceso de
        descubrimiento.

  viabilidad:
    principio: >
      Todos los vínculos son comparables en poder — son identidades distintas, no tiers
      de efectividad. El sistema no impone umbrales de severidad mínima por vínculo
      específico: el escalado emerge de la severidad de las aflicciones activas del
      portador. Un vínculo de Fragmento y uno de Soberano son igual de viables como
      formas de combate; lo que los diferencia es la escala de consecuencias narrativas
      y el NR necesario para sostener la conexión.

  descubrimiento:
    regla: >
      El descubrimiento de un vínculo sigue exactamente el mismo mecanismo que el de
      un vestigio. Ver sección descubrimiento. La primera interacción abre el canal en
      cada sentido vinculado que toque el portador. Las pistas llegan a través de esos
      canales. El jugador declara cuando comprende el patrón; el Narrador confirma.
    multi_sentido: >
      El portador puede descubrir los caminos de un vínculo multi-sentido de forma
      progresiva. Puede comprender el camino de Vista antes de abrir el canal de Tacto.
      La declaración de descubrimiento puede ser parcial: cada camino comprendido
      es usable de forma intencional; los caminos sin canal abierto o sin comprensión,
      no. La convergencia requiere que todos los caminos hayan sido descubiertos.

# ──────────────────────────────────────────────────────
# PREGUNTAS DE DISEÑO ABIERTAS
# ──────────────────────────────────────────────────────

open_questions:
  - id: E-01
    pregunta: >
      ¿Las Anomalías tienen acceso diferenciado a vestigios y vínculos por su
      sensibilidad natural al Tauma, o el acceso es igual para Mortales y Anomalías?
    destino: sistema de entidades / sistema de aflicciones

  - id: E-02
    pregunta: >
      ¿El costo en Cordura de los vínculos es fijo por uso o escala con la
      severidad de la aflicción activa del portador?
    nota: >
      Resuelto parcialmente: el uso de vínculos cuesta Cordura (no incrementa aflicción).
      Cordura = Compostura × 2 (placeholder). Queda por diseñar el costo específico
      por uso y si varía por nivel de entidad, número de sentidos activos o severidad.
    destino: sistema de Cordura — cuando se diseñe

  - id: E-03
    estado: resuelto
    decision: >
      El nivel de entidad no afecta la naturaleza de las pistas — solo determina las
      cargas (coherencia del Tauma residual) y el NR requerido para sostener un vínculo.
      Las pistas dependen de la naturaleza e intención de la entidad. El Narrador puede
      hacer pistas de un Fragmento devastadoras o pistas de un Soberano profundamente
      sutiles. El poder y el horror son dimensiones independientes.

  - id: E-04
    estado: resuelto — diseño documentado en seccion evolucion_y_consciencia_colectiva

  - id: E-05
    pregunta: >
      ¿El costo exacto en Cordura por uso de vínculo? ¿Varía por nivel de entidad,
      número de sentidos activos o severidad de las aflicciones?
    nota: abierto hasta que existan vínculos diseñados y el sistema de Compostura esté definido
    destino: sistema de Cordura

# ──────────────────────────────────────────────────────
# NATURALEZA ELEMENTAL DEL TAUMA
# ──────────────────────────────────────────────────────

naturaleza_elemental:
  descripcion: >
    El Tauma no es una energía uniforme. Se organiza en naturalezas elementales,
    cada una con múltiples caras posibles según la consciencia colectiva que la ha
    moldeado en esa zona a lo largo del tiempo. La naturaleza elemental del Tauma
    de una zona determina el tipo de Anomalías que la habitan, el tipo de Primordiales
    que pueden manifestarse en ella y la identidad de cualquier vínculo o vestigio
    producido allí.
  elementos:
    - id: fuego
      caras_posibles: [destrucción, transformación, renovación, sanación]
    - id: viento
      caras_posibles: [libertad, caos, transmisión, vacío]
    - id: tierra
      caras_posibles: [permanencia, opresión, sustento, muerte lenta]
    - id: agua
      caras_posibles: [adaptación, corrupción, memoria, disolución]
    - id: luz
      caras_posibles: [revelación, exposición, purificación, ceguera]
    - id: oscuridad
      caras_posibles: [ocultamiento, consumo, descanso, olvido]
  nota: >
    Esta lista no es exhaustiva ni cerrada. El Narrador puede definir caras adicionales
    según la historia de la zona. La cara dominante no es inherente al elemento —
    emerge de lo que las criaturas y las comunidades de esa zona han hecho con él.

# ──────────────────────────────────────────────────────
# EVOLUCIÓN Y CONSCIENCIA COLECTIVA
# ──────────────────────────────────────────────────────

evolucion_y_consciencia_colectiva:
  descripcion: >
    El Tauma de una zona no es estático. Se alimenta de la consciencia colectiva de
    las criaturas que la habitan. A lo largo de períodos largos, los rituales, las
    creencias, los eventos de alta intensidad emocional o espiritual y los patrones
    de comportamiento sostenidos de una comunidad moldean el Tauma del área.
    Este proceso no es únicamente un aumento de poder — puede cambiar la naturaleza
    del Tauma y, con ella, la naturaleza de las entidades que lo habitan.

  mecanismo:
    descripcion: >
      La consciencia colectiva actúa como un catalizador que orienta la energía elemental
      del Tauma hacia una cara específica. Una comunidad de adoradores de la sangre y
      la destrucción en una zona de Tauma de fuego orienta ese fuego hacia destrucción.
      Generaciones de sanadores que veneran el mismo fuego pueden reorientarlo hacia
      sanación. El Tauma no juzga — absorbe la intensidad acumulada de lo que está a
      su alrededor.
    factores_aceleradores:
      - rituales de alta intensidad colectiva
      - eventos traumáticos o eufóricos de escala comunitaria
      - exposición prolongada de una generación completa a las mismas condiciones
      - presencia de un Primordial cuya naturaleza refuerza la del área

  efectos_sobre_entidades:
    anomalias: >
      Las Anomalías que nacen o evolucionan en zonas con Tauma orientado hacia una
      cara específica desarrollan esa cara en su naturaleza. Una bestia de fuego en
      una zona de fuego-destrucción es diferente a la misma especie en una zona de
      fuego-renovación — no solo en efecto mecánico sino en comportamiento, en
      qué amenaza representa y en qué tipo de vestigio podría dejar si fuera a
      generar uno.
    primordiales: >
      Un Primordial puede evolucionar de nivel si la consciencia colectiva del área
      es suficientemente intensa y prolongada. Este ascenso no es un simple incremento
      de poder: la naturaleza de la entidad puede cambiar radicalmente — un Fragmento
      de fuego-transformación puede volverse una Entidad de fuego-destrucción si la
      zona fue consumida por siglos de guerra y fanatismo. El cambio de naturaleza
      puede dejar a quienes conocían la entidad anterior completamente desorientados.

  implicacion_narrativa: >
    El mundo es inhóspito no solo porque las amenazas existen, sino porque las
    propias criaturas y comunidades — deliberada o inconscientemente — moldean el
    Tauma de sus zonas, creando las condiciones de las amenazas que las acechan.
    El fanatismo de un culto puede convertir la zona de sus rituales en un lugar
    donde lo sobrenatural se vuelve estructuralmente hostil. La desesperación
    acumulada de una ciudad puede orientar el Tauma local hacia la cara más oscura
    de su elemento. El mundo reacciona a las criaturas que lo habitan.
