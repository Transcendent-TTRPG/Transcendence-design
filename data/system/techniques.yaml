  - name: Robar el Ángulo
    name_en: Steal the Angle
    status: authored_example
    purpose: >
      Add a novice Naghii-origin Flexible Weapons Technique using the
      Unpredictability profile, giving the tail/flexible-weapon core a false
      line expression that creates a concrete positional or response consequence
      instead of a generic attack bonus.
    origin:
      main: Flexible Weapons
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Controlled Misreading
      focus: Skirmish / Feint And Angle Theft
      holder: Naghii flexible-line skirmishers
      transmission: tail_feint_and_flexible_line_drills
      availability: Common
      adaptation_notes: >
        The Technique originates in Naghii tail and flexible-weapon practice:
        the visible curve teaches the target to defend the wrong path.
        Non-Naghii can learn it with whips, chains, cords, hooked flexible
        tools, or other weapons that can credibly present one line and resolve
        through another without supernatural extension.
    category: attack
    type: active
    trigger: >
      The user attacks a creature that can perceive the visible flexible line
      and is close enough for the user's curve, wrap, or snap to threaten an
      off-angle contact.
