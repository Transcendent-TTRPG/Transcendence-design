      source: Naghii
      seed: Projection Of Interpretation
      focus: Exploration / Scout Marking
      holder: Naghii Saa projection scouts
      transmission: saa_projection_and_archive_scout_marking_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Saa-Naghii projection practice: a reading
        is not complete until it can be made consequential at distance.
        Outsiders can learn analogous methods with pigment darts, venom
        projectors, marked arrows, chemical tracers, and other visible or
        scent-bearing ranged delivery tools prepared through a munition kit.
    category: attack
    type: active
    trigger: >
      The user has a ranged line to a creature whose movement, concealment, or
      immediate route must remain readable.
    requirements:
      level: null
