      focus: Endurance / Preservation Bearing
      holder: Sauri ordeal guards and preservation bearers
      transmission: ordeal_chambers_wound_bearing_rites_and_preservation_guard_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Sauri endurance and preservation training,
        where initiates learn to choose what function cannot be allowed to fail
        first. Outsiders can learn an equivalent through medical-field
        survival, poison-handling discipline, military pain management, rescue
        carrying drills, or other traditions that train deliberate function
        preservation under bodily degradation.
    category: utility
    type: reactive
    trigger: >
      The user is about to resolve a physical action, maintain a held duty, or
      finish a short exploration beat while already suffering one concrete
      bodily penalty source that would slow, penalize, or interrupt that
      function.
    requirements:
      level: null
