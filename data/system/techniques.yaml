        - user_has_space_to_resolve_from_a_different_angle
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires drilling visible false curves, delayed snaps, and off-angle
          contact without relying on random flailing.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Naghii tail instructor or flexible-weapon teacher can correct the
          learner when the false line becomes too obvious or too uncontrolled.
      material_cost: null
      access_notes: >
        Common among Naghii guards and duelists who favor tail analogues,
        flexible tools, and controlled misreading over heavy force.
      final_validation: one_successful_supervised_false_line_execution
    target: creature
    range: profile_bearing_reach
    area: single
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the user resolves the chosen false-line consequence, the
        target re-centers without answering the user, or the scene no longer
        tracks the immediate exchange.
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other: []
    saving_roll:
      model: contextual
      effect_on_success: >
        Resolve through the hostile exchange created by the false line. If the
        target answers successfully, the contact may still be a normal attack
        if appropriate, but the false-line consequence does not apply.
    description: >
      The user shows one curve and resolves through another, making the target
      answer the visible line while the real contact steals the useful angle.
    effect: >
      Make a Flexible Weapons attack or equivalent tail/tendril Technique check
      against the target. If the Technique resolves successfully, both
      false-line consequences apply: steal position, letting the user shift up
      to 1 meter around the target within profile-bearing reach without
      provoking a reaction from that target; and spoil response, giving the
      target a situational penalty equal to the user's Flexible Weapons rank
      bonus (+1 at Novice, +2 at Adept, +3 at Expert, +4 at Master, +5 at
      Consummate, +6 at Transcendent) on its next immediate reaction,
      counterattack, or opposed exchange against the user before it re-centers.
      This does not force the target to move, does not immobilize it, and does
      not create broad zone control.
    scaling: >
      The spoil response penalty scales by Flexible Weapons rank: +1 at Novice,
      +2 at Adept, +3 at Expert, +4 at Master, +5 at Consummate, and +6 at
      Transcendent. Higher rank may allow subtler false lines or tighter
      positional shifts, but Novice use still keeps the Technique tightly
      bounded to one target and one short immediate-response window.
    cost_note: >
      Rhythm 4 / Attrition 1 is deliberate. The Technique is broader than a
      narrow reactive catch, but its payoff remains tightly bounded: one target,
      one small positional conversion, one short response penalty, and no
      lasting control once the immediate exchange settles.
    restrictions:
      - requires_a_flexible_surface_that_can_present_one_line_and_resolve_through_another
      - requires_the_target_to_perceive_the_visible_line
      - requires_space_to_resolve_from_a_different_angle
      - applies_to_one_creature_only
      - does_not_force_target_movement
      - does_not_immobilize_or_grapple_by_itself
      - does_not_create_broad_zone_control
      - does_not_function_against_targets_that_cannot_be_misled_by_visible_contact_geometry
    tags:
      - attack
      - disruption
      - mobility
      - false_read
  - name: Leer el Calor del Paso
    name_en: Read the Heat of the Step
    status: authored_example
    purpose: >
      Add a novice Naghii-origin utility Technique rooted in Perception and
      Layered Sensing, giving the species a non-weapon rank 1 expression that
      produces immediate tactical information from a present creature's living
      signals instead of becoming a passive bonus.
    origin:
      main: Perception
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Layered Sensing
      focus: Exploration / Reconnaissance
      holder: Naghii ruin scouts
      transmission: ruin_scout_trace_reading_drills
      availability: Common
      adaptation_notes: >
        The Technique originates in Naghii tongue, heat, vibration, and scent
