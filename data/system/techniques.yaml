      autónomo in the ATB. The difficulty is set by the total number of active
      ciclos autónomos present at the moment of the roll: 1 = Fundamental,
      2-3 = Desafiante, 4-5 = Rigurosa, 6-7 = Exigente, 8+ = Extrema. On
