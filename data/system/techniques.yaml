      target's operation, your attacks that specifically target that same zone
      gain a bonus to their A.R. equal to +1 per technique rank, as long as
      the attack plausibly exploits the same failure line or a directly
      connected one.

      Valid follow-through includes driving back into the same torn line on
      that zone, cutting the structure now compensating for that zone's first
      wound, striking the fastening, plate edge, joint, membrane, or support
      now carrying the bad load for that zone, or attacking the connected
      side that zone is overusing to keep from collapsing further.

