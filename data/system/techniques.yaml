      holder: Sauri court witnesses and sovereign stillness guards
      transmission: court_bearing_drills_temple_witness_rites_and_sovereign_guard_stillness_training
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Sauri court, ordeal, and witness-bearing
        traditions, where visible fracture becomes politically dangerous the
        moment the wrong observer can use it. Outsiders can learn an equivalent
        through disciplines of ceremonial bearing, command presence under
        scrutiny, expedition leadership posture, or other training that teaches
        control of what escapes outward without relying on explicit lies.
    category: utility
    type: reactive
    trigger: >
      During combat or exploration under pressure, one creature or group under
