      transmission: plague_camp_discipline_corpse_team_instruction_and_horror_labor_steadiness_drills
      availability: Common
      adaptation_notes: >
        The Technique comes from Zarnag who must keep one needed task alive
        while others recoil from filth, taboo, or contamination. Non-Zarnag
        can adapt it through any tradition that teaches functional steadiness
        inside horrifying work rather than abstract courage.
    category: utility
    type: reactive
    trigger: >
      The user or one adjacent ally is targeted by one immediate attempt of
      horror, disgust, taboo dread, or contamination pressure that would
      impose a concrete penalty, interruption, or collapse risk on one
