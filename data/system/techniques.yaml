  - name: Dar de Comer a la Segunda Mano
    name_en: Feed the Second Hand
    status: authored_example
    purpose: >
      Add a Zarnag novice close-combat Technique for dual wielding that turns
      a same-body two-hand sequence into immediate close fouling of one useful
      piece instead of only extra contact.
    origin:
      main: Claws + Dagger
      secondary:
        - Dagger + Hooked Sidearm
        - Two Short Blades
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Zarnag
      seed: The Scavenger Follows The Weak Line
      focus: False Hand / Off-Hand Fouling
      holder: Zarnag side-pair cutters, carcass-openers, and tunnel-close fighters
      transmission: false_hand_pairing_drills_off_hand_fouling_work_and_close_side_sequence_practice
      availability: Common
      adaptation_notes: >
        The Technique comes from Zarnag who use one ready hand to keep the
        answer occupied while the second hand spoils something useful before
        the body fully resets. Non-Zarnag can adapt it with any believable
        pair of light close surfaces that can foul one body's gear, guard, or
        carried function at nearly the same instant.
    category: attack
    type: active
    trigger: >
      The user is already in close contact with one target and has two ready
      light close surfaces on different hands that can threaten the same body
      before the answer fully resets.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment:
        - two_ready_light_close_surfaces_on_different_hands
      states:
        - requires_same_target_close_contact
        - requires_believable_off_hand_follow_through
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires practicing how to let the first hand occupy the answer
          without overextending so far that the second hand loses its line.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          Zarnag close workers teach how to make two light lines arrive as one
          ugly sequence instead of as two disconnected swings.
      material_cost: null
      access_notes: >
        Common among Zarnag who work in tunnels, pits, body lines, and other
        close spaces where one hand fixes the answer and the other must spoil
        something useful before the opening disappears.
      final_validation: one_successful_supervised_same_target_dual_wield_fouling_sequence_under_close_pressure
    target: creature
    range: close_contact
    area: single
    duration:
      model: conditional
      value: until_end_of_targets_next_activation_or_first_use_of_the_displaced_piece
      sustain_rule: null
      end_rule: displaced_piece_ends_on_interact_use_or_end_of_targets_next_activation
    cost:
      rhythm_cost: 6
      attrition_cost: 2
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
    saving_roll:
      model: defense_roll_per_attack
      effect_on_success: >
        Each attack in the sequence resolves against the target's normal D.R.
        separately.
    description: >
      One hand keeps the answer busy. The other hand spoils what the answer
      needed to keep working.
    effect: >
      Declare two ready light close surfaces on different hands: claw and
      dagger, dagger and hooked sidearm, two short blades, or another
      believable same-target pairing.

      Make one close attack against the target with the first declared
      surface.

      If the first attack fails to connect, the sequence ends there.

      If the first attack connects, resolve it normally. Then immediately make
      one second close attack against the same target with the second declared
      off-hand surface at no additional Rhythm cost.

      If the second attack also connects, choose one useful piece on that same
      target that one of the two contacts plausibly fouled, displaced, or
      partially stripped: a shield edge, wrist guard, hanging tool, mask tie,
      belt-fastened item, sling position, sheath mouth, grip wrap, hand-held
      implement, or similar nearby practical piece.

      That piece becomes displaced until the end of the target's next
      activation or until the target spends Interactuar to set it right,
      whichever comes first.

      While displaced, the first A.R., D.R., or S.R. that directly depends on
      that exact piece suffers a penalty of 1 per rank bonus of the
      competency used for this Technique. Once such a roll resolves, the
      displaced state ends whether the target corrected it or not.

      The second attack is part of the same Technique use. It cannot target a
      different creature, cannot include movement, and cannot be replaced by a
      second Technique, free grapple, or other extra process.

      This Technique does not create broad multi-target pressure. It is one
      short same-body close sequence that also leaves one practical piece
      fouled or out of place if both contacts land.
    scaling: >
      This Technique scales through the user's improving ability to land both
      close attacks and make the fouled piece matter more once displaced. It
      does not widen into extra attacks beyond the second hand or spread
      across multiple targets.
    cost_note: >
      Rhythm 6 / Attrition 2 is deliberate. The generic two-weapon basic
      action is broader and slower. This Technique is faster, but if both
      contacts land it also fouls one useful piece and can tax its first
      dependent roll. That extra payoff is why the Attrition rises to 2.
    restrictions:
      - requires_two_ready_light_close_surfaces_on_different_hands
      - both_attacks_must_target_the_same_creature
      - the_second_attack_only_happens_if_the_first_attack_connects
      - the_displaced_piece_effect_only_happens_if_both_attacks_connect
      - the_user_must_name_one_real_piece_that_the_two_contacts_could_have_plausibly_fouled_or_partially_stripped
      - only_the_first_roll_that_depends_on_that_exact_piece_is_penalized
      - does_not_grant_movement_retargeting_or_multi_target_pressure
      - the_second_attack_cannot_be_replaced_by_another_technique_grapple_or_extra_process
      - does_not_bypass_normal_defense_or_armor
    tags:
      - attack
      - dual_wield
      - close_sequence
      - paired_surfaces
