        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated drills under hostile scrutiny: remaining outwardly
          legible as unbroken while exhausted, in pain, frightened, under
          pursuit pressure, or pressured by watchers who are waiting for
          visible fracture.
      guided_training:
        allowed: true
        study_hours: 3
        practice_hours: 4
        mentor_required: true
        notes: >
          A Sauri court tutor, ritual speaker, guard captain, or similar mentor
          can correct when the learner suppresses too late, overacts into
          obvious falsehood, or allows pain and strain to escape through small
          visible tells that hostile readers could exploit in the field.
      material_cost: null
      access_notes: >
        Restricted within Sauri court-bearing, ritual witness, sovereign
        retinue, and high-pressure escort traditions. Non-Sauri access requires
        training that teaches visible composure under hostile observation
        rather than inner calm alone.
      final_validation: one_successful_preserved_bearing_under_hostile_scrutiny
    target: self
    range: self
    area: one_observing_creature_or_group_involved_in_the_triggering_resolution
    duration:
      model: until_trigger
      value: one_triggering_read_or_pressure_resolution
