        - attacker_is_within_weapon_reach
        - user_has_a_credible_flexible_contact_line_to_the_attackers_weapon_arm_or_execution_line
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling the recognition of weapon commitment arcs and the
          timing of the flexible contact so that it reaches the arm or weapon
          line before the action locks in rather than after.
      guided_training:
        allowed: true
