  - name: Pasar Como Parte del Fondo
    name_en: Pass as Part of the Background
    status: authored_example
    purpose: >
      Add a novice Zarnag Sigilo Technique that expresses survival by gaining
      a narrow, situational Oculto state inside foul ambient conditions rather
      than by pure invisibility, fear, or broad disguise.
    origin:
      main: Sigilo
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Zarnag
      seed: Work The Bad Ground Without Becoming The New Problem
      focus: Bad-ground passage / profile suppression
      holder: Zarnag corpse-line hands, ruin-scavengers, trench workers, and foul-settlement runners
      transmission: corpse_line_crossing_drills_ruin_scavenge_patience_and_foul_settlement_profile_suppression_practice
      availability: Common
      adaptation_notes: >
        The Technique comes from Zarnag who survive not by vanishing cleanly
        but by becoming one more expected ugliness in a place already crowded
        with rot, labor, smoke, ruin, or bad routine. Outsiders can adapt it
        through stealth traditions centered on profile suppression inside
        disorder rather than on elegance or pure silence alone.
    category: utility
    type: active
    trigger: >
      The user wants to cross up to 4 meters of watched space without being
      cleanly registered as the new threat on that line.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Sigilo
      equipment: []
      states:
        - the_declared_path_is_already_under_watch_notice_or_loose_perception_by_one_or_more_creatures
        - the_user_is_not_yet_cleanly_identified_as_the_hostile_subject_of_that_line
        - the_crossed_space_is_not_totally_empty_clean_and_featureless
        - there_is_enough_background_disturbance_clutter_traffic_smoke_foul_labor_ruin_noise_hanging_material_debris_or_other_believable_ambient_explanation_for_the_passage
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires practice suppressing profile inside ugly, noisy, or foul
          environments so that motion is still seen but not escalated into the
          correct threat category in time.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 6
        mentor_required: true
        notes: >
          A Zarnag corpse-line hand, ruin runner, or bad-camp smuggler can
          teach how to pass one watched line as expected labor or background
          disturbance instead of as new threat.
      material_cost: null
      access_notes: >
        Common among Zarnag who move through bad sites under nervous eyes.
        Outsiders need real practice in profile suppression inside disorder,
        not only clean-room stealth.
      final_validation: one_successful_supervised_4_meter_watched_crossing_without_triggering_clean_hostile_registration
    target: one_watch_line_observer_or_small_observing_cluster
    range: one_declared_crossed_space_up_to_4_meters_long
    area: one_declared_crossing_line
    duration:
      model: until_condition_changes
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the user completes one next Movement through that declared
        crossed space; when the observing
        line localizes the user cleanly through Percepcion, another applicable
        sense, or a Technique that beats the active Oculto value; or when the
        user does something abrupt, clean, loud, or obviously out of pattern
        that breaks the borrowed background read.
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other: []
    saving_roll:
      model: specialization_check
      effect_on_success: >
        On a successful Sigilo Specialization Roll opposed by the relevant
        alertness or registration line, or against a threshold set by
        distance, clutter, smell, light, ambient panic, and how credibly the
        user can be mistaken for part of what was already there, the user
        gains a limited Oculto state against that observer, watch line, or
        small observing cluster, using that successful Sigilo result as the
        active value of Oculto for the declared crossing.
    description: >
      The user does not disappear. They become one more expected ugliness in
      the line: labor, refuse, carrion movement, smoke-shape, or ruin clutter
      that does not yet deserve alarm.
    effect: >
      Choose one declared crossed space of up to 4 meters that is already
      being watched, noticed, or loosely perceived: a corpse cart edge, ruin
      threshold, trench lip, smoke line, pit perimeter, tarp gap, foul alley,
      camp handoff, or another similarly local bad-ground passage.

      Make a Sigilo Specialization Roll opposed by the relevant alertness or
      registration line, or against a threshold set by distance, clutter,
      smell, light, ambient panic, and how credibly the user can be mistaken
      for part of what was already there.

      If the Technique fails, the user becomes the new point of notice too
      cleanly, and the observing line may answer normally.

      If the Technique succeeds, the user gains Oculto against that observer,
      watch line, or small observing cluster only, using this successful
      Sigilo result as the active value of the Oculto state for that line,
      even though the user is already crossing watched space and would not
      normally be able to gain Oculto there through the base Ocultarse action
      alone.

      While that limited Oculto holds:

      - the observing line must treat the user under the normal rules of
        Oculto
      - it cannot choose the user as the target of direct single-creature
        attacks without first localizing them cleanly
      - it may still attack a suspected area, search actively, or react to
        obvious signals if the fiction supports it

      This Technique does not make the user invisible, does not fool every
      observer in the scene, does not create scene-wide concealment, and does
      not survive once the user stops matching the background pattern they
      exploited.
    scaling: >
      Higher Sigilo raises the active Oculto value through the successful
      roll. Higher tiers may improve how much watched ground can be borrowed,
      how many close observers may be folded into the same hidden passage, or
      how hard it is to break the borrowed background read.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. This Technique does not create
      invisibility, broad stealth immunity, or a full disguise. It only buys
      one bounded way to gain Oculto against one relevant observing line, and
      it collapses if the user gives the watchers a clearer story.
    restrictions:
      - requires_background_disturbance_clutter_traffic_smoke_foul_labor_ruin_noise_hanging_material_debris_or_another_believable_ambient_explanation
      - applies_to_one_declared_crossed_space_of_up_to_4_meters_only
      - applies_to_one_observer_watch_line_or_small_observing_cluster_only
      - requires_space_not_totally_empty_clean_and_featureless
      - requires_incomplete_observation_not_clean_hostile_identification
      - grants_no_benefit_once_the_user_clearly_breaks_the_borrowed_pattern
      - grants_only_one_limited_oculto_state_tied_to_one_declared_crossed_space
      - does_not_create_full_disguise_invisibility_or_scene_wide_stealth_immunity
      - does_not_help_if_the_observer_already_has_clean_focused_and_unambiguous_attention_on_the_user_before_the_technique_begins
    tags:
      - utility
      - stealth
      - hidden_state
      - bad_ground
      - profile_suppression
  - name: Ceder Antes del Disparo
    name_en: Give Before the Trigger Bites
    status: authored_example
    purpose: >
      Add a novice Zarnag Trampas Technique that uses trap knowledge to
      minimize one already-triggered trap response without disarming the whole
      system.
    origin:
      main: Trampas
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Zarnag
      seed: Distinguish the Survivable from the Corrupting / Quarantine Is Force
      focus: Trigger-response mitigation / survival under activation
      holder: Zarnag corpse-line guards, quarantine hands, trench workers, and bad-threshold survivors
      transmission: trigger_response_reading_drills_spring_yield_practice_and_bad_threshold_survival_teaching
      availability: Common
      adaptation_notes: >
        The Technique comes from Zarnag who learn that knowing how traps are
        built also teaches how they bite. Outsiders can learn it if they
        practice trigger-response reading, collapse-point recognition, and
        emergency yield instead of pure disarming.
    category: utility
    type: reactive
    trigger: >
      A trap, warning system, or other condition-triggered mechanism has
      already activated against the user or an adjacent ally.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Trampas
      equipment: []
      states:
        - the_user_is_the_target_of_the_activation_or_adjacent_to_the_target
        - the_mechanism_is_still_in_the_part_of_resolution_that_can_be_answered_in_time
        - the_danger_is_one_whose_response_can_still_be_minimized_by_understanding_how_traps_answer
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires repeated practice yielding correctly to springs, hooks,
          drops, snap lines, latches, and bad threshold answers instead of
          trying to beat them by force every time.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 6
        mentor_required: true
        notes: >
          A Zarnag quarantine hand, corpse-line guard, or bad-threshold
          survivor can teach how to recognize which part of a trap response
          matters and how to give it less of the body than it wanted.
      material_cost: null
      access_notes: >
        Common among Zarnag who survive plague routes, corpse lines, warning
        grounds, and bad thresholds where a trap may already be firing before
        anyone can fully solve it.
      final_validation: one_successful_supervised_mitigation_of_a_live_triggered_response
    target: self_or_one_adjacent_creature_caught_in_a_trap_activation
    range: self_or_adjacent
    area: one_triggering_trap_response
    duration:
      model: one_resolution
      value: null
      sustain_rule: null
      end_rule: Ends when the triggering trap resolution finishes.
    cost:
      rhythm_cost: 0
      attrition_cost: 1
      other: []
    saving_roll:
      model: specialization_check
      effect_on_success: >
        On a successful Trampas Specialization Roll against a threshold set by
        access, visibility, trigger complexity, clutter, instability, and
        time pressure, the user minimizes one already-triggered trap response
        before its full consequences finish resolving.
    description: >
      The user does not beat the trap by strength. They know when to flatten,
      turn, release, give, spoil, or yield so the mechanism gets less than it
      wanted from the body.
    effect: >
      When a trap, warning system, or other condition-triggered mechanism
      activates against you or one adjacent ally, immediately make a Trampas
      Specialization Roll before the full response resolves.

      If the Technique fails, the trap resolves normally.

      If the Technique succeeds, choose one relevant roll in that resolution:

      - the triggering Characteristic Roll
      - the triggering Specialization Roll
      - or the triggering Resistance Roll

      That chosen roll gains a bonus equal to the rank bonus of Trampas for
      that one resolution.

      If the trap's outcome does not call for one of those rolls, the
      Narrator may instead let the Technique reduce one immediate trap
      consequence to its next less severe believable outcome:

      - a hard pull becomes a bad stumble
      - a full hook catch becomes a scrape or partial catch
      - a loud warning line reports late or weak
      - a falling response clips instead of fully pinning
      - or another similarly narrower mitigation that fits the mechanism

      This Technique does not untrigger the trap, does not disarm the whole
      system, and does not guarantee safety. It only minimizes one active
      response because the user understands how traps typically answer a body.

      It cannot help after the full consequences have already resolved.
    scaling: >
      Higher Trampas increases the mitigation through rank bonus. Higher tiers
      may improve how broad a response can be minimized, how late in the
      sequence the user may still answer, or how many adjacent allies can be
      coached in time.
    cost_note: >
      Rhythm 0 / Attrition 2 is deliberate. This is a true emergency reaction
      that can interrupt disaster timing without spending Rhythm, but it only
      applies when a trap has already fired and it costs enough Attrition that
      it cannot be treated as free insurance.
    restrictions:
      - only_works_after_the_trap_has_already_activated
      - only_affects_one_triggering_resolution
      - requires_the_mechanism_to_still_be_in_the_part_of_resolution_that_can_be_answered_in_time
      - does_not_disarm_or_destroy_the_whole_system
      - does_not_create_a_new_trap
      - does_not_apply_atrapado_desequilibrado_or_derribado
      - does_not_help_after_the_outcome_is_already_fully_settled
    tags:
      - utility
      - traps
      - reaction
      - trap_response
      - trigger_reading
      - quarantine
