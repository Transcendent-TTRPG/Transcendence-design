cost_model:
  mandatory:
    - rhythm_cost
    - attrition_cost
  optional:
    - durability_trade
    - per_scene_uses
    - per_rest_uses
    - per_day_uses
    - charge_cost
    - drawback
  rhythm_authoring_standard:
    normal_range: "0-9"
    anchor_values: [0, 3, 5, 7, 9]
    intermediate_values_allowed: true
    intermediate_value_examples: [1, 2, 4, 6, 8]
    note: >
      The anchor values define broad timing families, but they are not the
      only legal Technique costs. Intermediate values are valid when a
      Technique clearly lands between two anchors in play feel.
    bands:
      - cost: 0
        label: free
        use_when:
          - passive_or_always_on
          - timing_cost_is_effectively_negligible
          - no_strong_new_permission_is_created
        warnings:
          - rare_for_authored_active_techniques
      - cost: 3
        label: quick_anchor
        use_when:
          - brief_and_sharply_bounded
          - narrow_trigger_or_precise_moment
          - one_main_surface
          - little_or_no_persistence
        common_cases:
          - tight_reactive_answers
          - short_setup_conversions
          - brief_entry_denial
          - small_defensive_spoils
        avoid_when:
          - broad_control
          - significant_lane_or_position_state_change
          - strong_follow_up_leverage
          - persistence
          - multiple_major_surfaces
      - cost: 5
        label: standard_anchor
        use_when:
          - normal_committed_authored_action
          - broader_than_a_quick_answer
          - one_strong_surface_plus_one_meaningful_secondary_surface
        common_cases:
          - authored_offensive_techniques
          - reliable_setup_to_effect_conversion
          - conditional_reposition_or_disruption
          - active_utility_under_pressure
      - cost: 7
        label: heavy_anchor
        use_when:
          - real_bodily_tactical_or_positional_commitment
          - serious_control_denial_or_disruption
          - multiple_coherent_pressure_surfaces
          - major_leverage_if_successful
        common_cases:
          - hard_commitment_attacks
          - strong_protected_interventions
          - significant_lane_or_target_control
          - large_disruption_with_follow_through
      - cost: 9
        label: extreme_anchor
        use_when:
          - rare_and_highly_permissioned
          - encounter_shaping
          - clearly_above_normal_authored_actions
        common_cases:
          - major_scene_turning_expressions
          - rare_upper_tier_techniques
        warnings:
          - should_remain_uncommon
          - usually_requires_high_rank_or_strong_restrictions
  attrition_authoring_standard:
    anchor_values: [0, 1, 2, 3]
    hard_cap: false
    normal_working_band: "0-3"
    values_above_anchor_allowed: true
    note: >
      The base authored scale uses 0 to 3 as anchor values, but authored
      Techniques may exceed 3 when the intended balance relies on severe
      strain and aggressive projected Fatigue acceleration.
    bands:
      - cost: 0
        label: trivial
        use_when:
          - passive
          - no_meaningful_active_strain
          - tightly_bounded_negligible_scene_cost
        warnings:
          - uncommon_for_active_scene_changing_techniques
      - cost: 1
        label: standard_meaningful_demand
        use_when:
          - normal_meaningful_action_under_pressure
          - focus_or_effort_without_severe_strain
        common_cases:
          - many_rhythm_3_techniques
          - many_rhythm_5_techniques
      - cost: 2
        label: high_demand
        use_when:
          - absorbs_serious_pressure
          - heavily_commits_body_or_control
          - difficult_processing_under_immediate_threat
          - meaningfully_bends_scene_rhythm
        common_cases:
          - expensive_reactive_protection
          - high_commitment_interventions
          - demanding_multi_surface_actions
      - cost: 3
        label: extreme_overextension_anchor
        use_when:
          - beyond_normal_safe_operating_margin
          - heroic_intervention_or_limit_effort
          - should_accelerate_fatigue_aggressively
        warnings:
          - rare
          - usually_upper_tier_or_desperate
    above_anchor_rule:
      use_when:
        - clearly_exceeds_ordinary_operating_margin
        - unsafe_to_repeat_immediately
        - projected_fatigue_acceleration_is_a_primary_balance_factor
        - rare_desperate_heroic_or_upper_tier_expression
      warning:
        - burden_of_justification_is_high
        - should_not_be_routine
  separation_rule:
    principle: >
      Rhythm and Attrition are related but separate. High Rhythm does not
      automatically require high Attrition, and low Rhythm does not
      automatically mean low strain.
    valid_patterns:
      - quick_but_demanding
      - slow_but_sustainable
      - rhythm_heavy_due_to_commitment
      - attrition_heavy_due_to_pressure_absorption
  cost_assignment_order:
    - What timing permission does the Technique occupy or create?
    - How much commitment or recovery should that timing imply?
    - How much real strain does the Technique impose under pressure?
    - Do trigger width, restrictions, or counterplay reduce what it should cost?
  escalation_rule:
    raise_cost_when:
      - broad_or_reliable_reactive_access
      - lane_or_position_denial
      - persistent_pressure
      - multiple_major_interaction_surfaces
      - strong_follow_up_conversion
      - major_protection_or_mitigation
      - rhythm_or_attrition_manipulation
    typical_patterns:
      - narrow_one_surface_reactive: "Rhythm 3 / Attrition 1"
      - standard_one_strong_plus_one_secondary: "Rhythm 5 / Attrition 1"
      - serious_denial_or_multi_surface_commitment: "Rhythm 7 / Attrition 2"
      - rare_upper_tier_overextension: "Often includes Rhythm 9, Attrition 3+, or both"
  calibration_rule:
    principle: >
      When cost is uncertain, prefer the more conservative band during first-pass
      authoring, then review against tier, trigger width, repetition risk,
      counterplay, and projected Fatigue timing in the intended scene.

saving_roll_models:
  examples:
    - none
    - dr_negates
    - rr_reduces
    - sr_opposed
    - contextual

learning_models:
  standard_paths:
    - self_study
    - guided_training
  core_rule: >
    Techniques are learned through study and practice, but they do not create
    a separate per-Technique mastery ladder by default. A Technique is either
    learned or not yet learned.
  valid_components:
    - study_hours
    - practice_hours
    - text_or_manual_required
    - mentor_required
    - material_cost
    - access_notes
    - final_validation
  validation_examples:
    - one_successful_supervised_execution
    - one_successful_practice_scene_under_pressure
    - one_final_relevant_roll_after_required_hours
  prohibited_patterns:
    - technique_xp_track
    - technique_rank_tree
    - repeated_per_technique_leveling

origin_models:
  single_competency: true
  dual_competency: true
  competency_plus_equipment: true
  competency_plus_state: true
  resistance_as_single_origin: false
  resistance_requires_hybrid_origin: true
  resistance_note: >
    Resistances never generate pure Techniques on their own. Any
    Resistance-rooted Technique must be hybridized with another competency,
    specialization, equipment competency, or tightly bounded state logic.

world_origin_models:
  primary_fronts:
    - Species
    - Doctrine
    - Region
  secondary_front_allowed: true
  required_fields:
    - primary_front
    - source
    - seed
    - transmission
    - availability
  availability_levels:
    - Common
    - Restricted
    - Secret
    - Sacred
    - Lost
  rule: >
    The origin field defines what competency makes the Technique executable.
    The world_origin block defines why the Technique exists in the world and
    how a character can encounter it.
  species_origin_adaptation_rule: >
    Species-origin Techniques are not automatically species-locked. If a
    Technique was invented from a natural weapon, anatomy, sensory habit, venom,
    shell, horn, tail, or other biological surface, the Technique should define
    what a non-member needs to perform an analogous method, such as a
    manufactured weapon, prepared ammunition, kit-based delivery, tool,
    apparatus, training analogue, or environmental setup. The species origin
    explains why the method exists; requirements explain what the current user
    needs to execute it. Only mark a species-origin Technique as biologically
    exclusive when no credible non-magical substitute exists and that
    exclusivity is intentional.
  species_rank_coverage:
    scope: full_species_origin_pass
    current_rank_band: Novice
    target_total: 20
    core_attack_surfaces: 3
    techniques_per_core_attack_surface: 4
    target_counts:
      attack_weapons: 12
      defense: 2
      resistance_hybrids: 2
      specializations: 4
    section_definitions:
      attack_weapons: >
        Three core attack surfaces, four Techniques each. A core attack
        surface may be a manufactured weapon competency, a natural weapon
        form, a shield used as a combat tool, or a manufactured weapon
        competency that deliberately mirrors a natural weapon form. These
        Techniques do not need to be purely damaging, but their executable root
        is a weapon, natural weapon, or weapon profile.
      defense: >
        Armor or Evasion. These Techniques express how the species avoids,
        absorbs, redirects, or survives pressure according to its actual armor
        and movement identity.
      resistance_hybrids: >
        A Resistance plus another competency, specialization, equipment
        competency, or bounded state. Resistances never stand alone.
      specializations: >
        One specific specialization or a tightly paired specialization
        expression that carries non-weapon identity.
    notes:
      - The quota is an authoring target, not a list of Techniques every member of the species knows.
      - Species with fewer natural weapons should not be padded with fake anatomy.
      - Attack coverage should come from three core attack surfaces connected to natural weapons, culturally valued manufactured weapons, or compensating combat traditions.
      - Define natural weapon access, cultural arsenal, defense identity, resistance pressures, and specialization surfaces before filling the quota.

required_reading:
  before_any_technique:
    - data/system/techniques.yaml
  before_specialization_technique:
    - docs/system/specialization-technique-domains.md
  before_condition_applying_technique:
    - data/system/ailments.yaml
  before_species_technique:
    - docs/canon/species/<species_file>.md

authoring_questions:
  - What competency domain makes this possible?
  - What world origin created this Technique: Species, Doctrine, or Region?
  - What seed, doctrine, or regional pressure explains why this method exists?
  - Why is this not just raw competency use?
  - What direct mechanical change does it create?
  - If this is an information or reading Technique, what actionable truth does it reveal?
  - What non-magical cause inside the fiction makes this believable?
  - How is it actually learned: self-study, guided training, or both?
  - What timing window does it occupy?
  - What does it cost?
  - How can it be resisted, if at all?
  - How does it end?
  - How does it scale?
  - For specialization Techniques only — does this produce something the raw S.R. cannot?

