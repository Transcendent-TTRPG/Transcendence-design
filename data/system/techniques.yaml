competency_domains:
  weapons:
    primary: [attack, setup, pressure]
    secondary: [mobility, disruption, precision]
    rare_or_limited: [recovery, support]
  armors:
    primary: [defense, mitigation, stability]
    secondary: [anti_displacement, survival_window, control]
    rare_or_limited: [attack, mobility]
  shields:
    primary: [defense, interception, control]
    secondary: [disruption, anti_displacement, setup]
    rare_or_limited: [attack, support]
  evasion:
    primary: [mobility, defense, counter_positioning]
    secondary: [setup, disruption, survival_window]
    rare_or_limited: [mitigation, attack]
  specializations:
    primary: [setup, control, recovery, disruption]
    secondary: [attack, defense, mobility, support, utility]
    rare_or_limited: [pressure]
  resistances:
    primary: [defense, recovery, condition_reduction, survival_window]
    secondary: [mitigation, control]
    rare_or_limited: [attack, support]
    role: hybrid_only
    pure_techniques_allowed: false
    note: >
      Resistances are adaptation modifiers, not a standalone Technique school.
      They should alter how another chosen domain behaves under a learned threat.

  information_technique_rule:
  applies_to_domains:
    - Perception
    - Interpretation
    - Identification
    - Tracking
    - Theology
    - Astronomy
    - Cryptology
    - Archaeology
    - Architecture
    - similar_reading_domains
  default_output: actionable_information
  good_outputs:
    - reveal_one_immediate_tactical_truth
    - identify_relevant_absence_or_contradiction
    - expose_next_likely_route_state_risk_or_pressure
    - classify_sign_pattern_creature_state_structure_or_threat_in_bounded_way
    - rule_out_unsafe_conclusion
  should_not_default_to:
    - passive_bonus_to_another_roll
    - generic_modifier_without_information
  bonus_only_allowed_when:
    - explicitly_authored_as_setup_technique
    - clear_target_roll_or_action_family
    - narrow_trigger
    - defined_duration_or_consumption_point
    - reason_direct_information_is_not_better
  rule: >
    If a reading Technique only grants a bonus, it should be rewritten unless
    it is deliberately a bounded setup Technique. The read itself should usually
    change play by producing a concrete actionable truth.

specialization_technique_rule:
  principle: >
    Specialization Techniques should be authored by extracting the trained
    capabilities that the specialization actually develops, then translating
    those capabilities into a bounded thematic mechanical expression.
  required_authoring_order:
    - identify_the_specialization
    - extract_the_concrete_trained_capabilities_it_develops
    - choose_one_capability_or_one_tightly_coherent_pair_as_the_technique_root
    - translate_that_root_into_a_bounded_combat_or_exploration_mechanic
    - validate_the_result_against_existing_system_surfaces_ailments_costs_and_action_vocabulary
  current_species_novice_pass_focus:
    - combat
    - exploration
  avoid_defaulting_to:
    - pure_abstract_social_scene_resolution
  should_not_be:
    - generic_use_of_the_specialization_with_numbers
    - a_named_version_of_the_base_specialization_action
    - locked_to_the_most_literal_environment_of_the_specialization_when_the_trained_method_translates_more_broadly
  examples:
    - Nadar may express propulsion_orientation_breath_timing_yield_and_recovery_through_resistance rather than only water_locked_motion
    - Tolerancia may express ordered_function_under_damage rather than passive_toughness
    - Arquitectura may express structural_intent_or_threshold_logic rather than generic_knowledge_bonus
  validation_question: >
    What concrete trained sub-capacities does this specialization contribute,
    and how does the Technique turn them into a mechanical action the raw
    Specialization Roll does not already cover?
  hard_gate: >
    If the author cannot name the extracted capability before writing the
    effect text, the Technique is not ready.

specialization_capability_catalog:
  purpose: >
    Canonical extraction surface list for Specialization Techniques. Techniques
    should be rooted in one listed capability, or in a clearly adjacent
    capability that is added here first, rather than in the specialization's
    superficial theme.
  interpretation_rule:
    - extracted_capabilities_should_usually_be_transferable_trained_patterns
    - they_should_not_default_to_literal_profession_actions
    - they_may_apply_outside_the_original_trade_scene_or_tool
    - they_remain_bounded_by_the_objects_materials_bodies_or_pressures_that_the_specialization_actually_trains
  transferability_rule: >
    An extracted capability should usually describe a trained way of noticing,
    timing, shaping, reading, controlling, preserving, extracting,
    stabilizing, or interpreting rather than merely naming the profession's
    headline task.
  domain_boundary_rule: >
    Transferable does not mean universal. A capability may travel outside its
    original profession only into situations where the specialization actually
    trained that pattern. For example, a Minería-derived material-reading
    capability may apply to stone, packed earth, masonry, ore, or other
    mineral-bearing structures, but not automatically to anatomy, social tells,
    or aura patterns. A Medicina-derived stabilization capability may apply to
    bodies, wounds, and physical trauma, but not automatically to walls,
    rituals, or mining seams.
  entries:
    - specialization: Saltar
      extracted_capabilities:
        - explosive_release
        - force_to_space_conversion
        - launch_window_commitment
        - clearance_judgment
        - short_burst_body_projection
    - specialization: Trepar
      extracted_capabilities:
        - support_testing
        - progressive_load_transfer
        - body_weight_distribution
        - sustained_traction_sequencing
        - hanging_recovery
    - specialization: Lanzamiento
      extracted_capabilities:
