      access_notes: >
        Common in Zarnag labor where wraps, corpse tags, fouled tools,
        treatment lines, and bad containers must be worked without grabbing the
        whole mess.
      final_validation: one_successful_supervised_hand_correction_before_failure_becomes_irreversible
