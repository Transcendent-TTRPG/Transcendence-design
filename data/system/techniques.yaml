      to all armor Block values; at rank 6 it is +6. The threshold of 3 hits
      is fixed at Novice rank; higher ranks decrease the threshold and increase
      the magnitude. The bonus applies to all equipped armor zones, not only
      the zones that received hits.
    cost_note: >
      Rhythm 3 / Attrition 2. The technique front-loads no defense — the user
      must absorb 3 hits before any benefit. Attrition 2 reflects the active
      cognitive-physical investment of reading and calibrating to the attacker's
      pattern across multiple hits, not just passive endurance.
    restrictions:
      - counter_only_increments_on_hits_that_resolve_through_heavy_armor
      - counter_does_not_increment_on_evaded_hits_or_t_d_successes
      - counter_does_not_increment_on_hits_that_bypass_armor_block
      - block_bonus_applies_to_all_equipped_armor_zones_once_threshold_is_met
      - technique_ends_on_derribado_fewer_than_3_functional_pieces_or_voluntary
    tags:
      - utility
      - active
      - armor
      - accumulation
      - block_improvement
      - adaptation

  - name: El Espacio Se Sabe
    name_en: Space Knows Itself
    status: draft
    purpose: >
      Add a novice Drak'kai-origin active specialization technique rooted in
      Orientación that lets the user reconstruct the relative positions of all
      creatures in the scene when ordinary spatial reference has been lost.
      First Orientación technique across all species. Distinct from sensory
      detection techniques (Percepción: reads present signals) and tracking
      techniques (Rastreo: reads movement history). This technique works from
      accumulated spatial logic only — no signal required, only a prior
      reference baseline.
    origin:
      main: Orientación
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Drakkai
      seed: Accumulated Route / Spatial Logic Over Landmarks
      focus: Spatial Reconstruction / Positional Awareness Under Disorientation
      holder: Drak'kai long-route travelers who have navigated without landmarks
      transmission: long_route_spatial_reasoning_from_movement_not_landmarks
      availability: Restricted
    category: utility
    type: active
    trigger: >
      The user activates on their ATB turn when the scene has lost ordinary
      spatial reference (darkness, heavy smoke, sudden disorientation,
      structural shift, or any equivalent condition making relative positions
      unclear). The user must have established a prior spatial reference
      baseline in this scene before the condition occurred.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      armor_competency: null
      support_specializations:
        - orientacion
      equipment: []
      states:
        - scene_spatial_reference_lost_by_ordinary_means
        - prior_spatial_baseline_established_in_this_scene
      prerequisite_techniques: []
    target: self
    range: sensory_range
    area: self
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: null
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      Space doesn't change when it stops being visible.
    effect: >
      Make a T.E. (Orientación). On failure, no reconstruction is obtained. On
      success, the Narrator confirms the current relative positions of all
      creatures in the scene within the user's sensory range. The
      reconstruction comes from accumulated spatial reasoning, not direct
      perception — it reveals no intentions, hidden equipment, or information
      beyond positional geometry.
    scaling: >
      Narrator sets the difficulty based on the severity of the disorienting
      condition. Precision and detail of the reconstruction scale with roll
      quality; a marginal success gives approximate positions while a strong
      success gives precise relative placement.
    cost_note: >
      Rhythm 3 / Attrition 1. Comparable to Leer el Calor del Paso
      (Rhythm 3 / Attrition 1); broader scope (all creatures vs. one) but no
      Salvación roll and gated by constraining scene conditions. Attrition 1
      reflects the compressed cognitive effort of executing spatial
      reconstruction under combat pressure.
    restrictions:
      - fires_only_when_scene_lacks_ordinary_positional_discernibility
      - requires_prior_spatial_reference_baseline_established_before_condition
      - reconstruction_is_positional_only_not_intentions_equipment_or_hidden_details
      - does_not_bypass_active_concealment_techniques_or_illusion_effects
    tags:
      - utility
      - active
      - specialization
      - information
      - spatial
      - orientacion
      - drakkai

  - name: La Línea Que No Se Rompe
    name_en: The Line That Does Not Break
    status: draft
    purpose: >
      Add a novice Drak'kai-origin reactive specialization technique rooted in
      Enfoque that preserves an active stance or technique through one
      interrupting event. First Enfoque technique across all species. Distinct
      from techniques that prevent interrupting events from resolving — the
      event resolves fully; only the continuity of the held state is preserved.
      Expresses the Drak'kai principle of patient structural hold: what is
      committed to does not end because something tried to end it.
    origin:
      main: Enfoque
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Drakkai
      seed: Accumulated Route / Patient Concentration
      focus: Mental Thread Persistence / Stance Continuity Under Interruption
      holder: Drak'kai who have maintained long-route practices of sustained attention and careful object care
      transmission: long_route_sustained_attention_and_patient_hold_under_pressure
      availability: Restricted
    category: utility
    type: reactive
    trigger: >
      An event activates the end condition of an active stance or technique the
      user is currently maintaining (e.g., a hit that would trigger Derribado,
      a forced position change that would end a positional lock, an effect that
      would remove a required equipment state).
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      armor_competency: null
      support_specializations:
        - enfoque
      equipment: []
      states:
        - currently_maintaining_active_stance_or_technique_with_defined_end_condition
      prerequisite_techniques: []
    target: self
    range: personal
    area: self
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: null
    cost:
      rhythm_cost: 0
      attrition_cost: 2
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      It's not that it didn't arrive. It's that it arrived and wasn't enough.
    effect: >
      When an event activates the end condition of an active stance or technique
      the user is maintaining, they may activate this technique as a response.
      The interrupting event resolves normally — the user receives the hit,
      effect, or condition — but the stance or technique they were maintaining
      does not end. This technique may only be used once per interrupting event.
    scaling: >
      At Novice rank, preserves one held state through one interrupting event.
      Higher ranks expand the threshold of what interrupting events can be
      survived and may allow preservation through multiple simultaneous
      conditions.
    cost_note: >
      Rhythm 0 / Attrition 2. Rhythm 0 because the technique is a purely
      internal cognitive snap with no external manifestation — it does not
      occupy the ATB track. Attrition 2 because this is the maximum cognitive
      effort Enfoque trains for: holding the thread while something actively
      tries to cut it.
    restrictions:
      - interrupting_event_resolves_fully_user_still_receives_hit_effect_or_condition
      - only_preserves_states_with_a_defined_ends_when_x_condition
      - does_not_apply_to_states_voluntarily_dropped_by_the_user
      - one_use_per_interrupting_event_cannot_chain_multiple_activations
    tags:
      - utility
      - reactive
      - specialization
      - concentration
      - persistence
      - enfoque
      - drakkai

  - name: El Marco Antes Del Paso
    name_en: The Framework Before the Step
    status: draft
    purpose: >
      Add a novice Drak'kai-origin active specialization technique rooted in
      Identificación that determines the correct category of an unknown object,
      creature, or phenomenon before the party interacts with it. First
      Identificación technique across all species. Distinct from Identificación's
      base specialization roll (which identifies more accurately with better
      rolls) and from Historia (which applies historical precedent). This
      technique is pre-identification: it determines what framework applies,
      not what the thing specifically is. Grounded in accumulated encounter
      knowledge, not Tauma detection.
    origin:
      main: Identificación
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Drakkai
      seed: Accumulated Route / Object Encounter Knowledge
      focus: Framework Selection / Category Determination Before Interaction
      holder: Drak'kai long-route travelers who have encountered many unknown objects, sites, and phenomena
      transmission: long_route_accumulated_object_and_encounter_handling_experience
      availability: Restricted
    category: utility
    type: active
    trigger: >
      The user activates on their ATB turn or during exploration before a
      character or party interacts with an unknown entity, phenomenon, object,
      site, or situation whose category is ambiguous or unclear.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      armor_competency: null
      support_specializations:
        - identificacion
      equipment: []
      states:
        - must_be_able_to_observe_the_target
        - target_must_be_unknown_or_ambiguous_in_category
      prerequisite_techniques: []
    target: object_creature_or_phenomenon
    range: sensory_range
    area: single_target
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: null
    cost:
      rhythm_cost: 2
      attrition_cost: 1
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The wrong question kills before the thing does.
    effect: >
      Make a T.E. (Identificación). On failure, the framework remains unclear.
      On success, the Narrator confirms which category the target belongs to:
      common object, equipment, vestige, bond, natural phenomenon, taumatic
      phenomenon, mortal creature, anomaly, or primordial. This does not reveal
      which entity was or is present, nor the specific properties of the target
      beyond its category. The determination comes from accumulated pattern
      recognition of physical and behavioral evidence — not from direct Tauma
      perception. A vestige or bond can be identified as such without the
      character being able to see or sense the Tauma that defines it.
    scaling: >
      At Novice rank, the technique determines first-level category only. Higher
      ranks allow finer distinctions within categories (e.g., entity level within
      bonds: Fragment, Entity, Sovereign, or Abyssal) and expand the accuracy
      of behavioral pattern recognition under partial observation.
    cost_note: >
      Rhythm 2 / Attrition 1. Rhythm 2 reflects the focused observation time
      required to read physical and behavioral patterns. Attrition 1 matches
      the domain's low-attrition profile — classification is cognitively
      demanding but brief.
    restrictions:
      - does_not_identify_specific_entity_nature_properties_or_history
      - does_not_require_tauma_perception_works_from_physical_behavioral_patterns
      - target_must_be_observable_cannot_fire_on_fully_concealed_targets
      - novice_rank_determines_first_level_category_only
    tags:
      - utility
      - active
      - specialization
      - information
      - framework_selection
      - identificacion
      - drakkai

  - name: La Grieta Que Ya Apareció Antes
    name_en: The Crack That Already Appeared Before
    status: draft
    purpose: >
      Add a novice Drak'kai-origin active specialization technique rooted in
      Historia that declares a historical failure point for a current situation,
      granting a cumulative scaling bonus across all roll types as Historia rank
      increases. First Historia technique across all species. Distinct from
      Identificación (which determines category, not history), Percepción (which
      reads present signals), and base Historia rolls (which provide narrative
      context only). This technique anchors historical knowledge to concrete
      mechanical output: bonus to T.D., then T.A., T.E., T.R., T.I., and
      finally critical threshold expansion at Virtuoso rank.
    origin:
      main: Historia
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Drakkai
      seed: Accumulated Route / Incident Records and Pattern Recognition
      focus: Historical Failure Point / Precedent-Based Mechanical Leverage
      holder: Drak'kai long-route travelers who carry centuries of specific incident records
      transmission: long_route_accumulated_encounter_failure_pattern_records
      availability: Restricted
    category: utility
    type: active
    trigger: >
      The user activates on their ATB turn or during exploration when facing a
      situation, entity method, social configuration, institutional behavior, or
      structural pattern that has a possible historical analog in the character's
      accumulated experience.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      armor_competency: null
      support_specializations:
        - historia
      equipment: []
      states:
        - situation_method_or_pattern_must_have_historical_analog_in_character_experience
      prerequisite_techniques: []
    target: situation_or_pattern
    range: sensory_range
    area: single_target
    duration:
      model: sustained_while_condition_holds
      value: permanent_until_broken
      sustain_rule: >
        The failure point and all associated bonuses remain active as long as
        the declared pattern or situation persists and applies to the current
        context.
      end_rule: >
        Ends when the failure point is no longer applicable: the situation
        changes, the pattern shifts or is abandoned, or the Narrator declares
        the crack has been exploited or closed. Also ends if the situation is
        revealed to be genuinely unprecedented in the character's experience
        (automatic failure on activation).
    cost:
      rhythm_cost: 2
      attrition_cost: 1
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The crack was already here. You just need to know where.
    effect: >
      Make a T.E. (Historia). On failure, no applicable precedent is located.
      On success, the Narrator declares one specific failure point extracted
      from a historical analog — the place where a situation of this type has
      previously broken down, failed, or revealed its vulnerability. While the
      failure point is active, the user receives a bonus equal to their Historia
      rank to T.D. when the attack or effect they face corresponds to the
      declared pattern. The bonus applies only to the user. If the situation is
      genuinely unprecedented in the character's experience, the technique fails
      automatically.
    scaling: >
      Bonuses are cumulative — each rank adds a new roll type to which the bonus
      applies. All bonuses apply only to the user and only while the failure
      point is active.
      Rank 1 (Novice): +Historia rank to T.D. when the attack or effect
      corresponds to the declared failure point pattern.
      Rank 2 (Apprentice): also +Historia rank to T.A. targeting the failure
      point.
      Rank 3 (Practitioner): also +Historia rank to T.E. related to the failure
      point.
      Rank 4 (Expert): also +Historia rank to T.R. against effects from the
      failure point source.
      Rank 5 (Master): also +1 additional die of the weapon type to T.I. when
      targeting the failure point directly.
      Rank 6 (Virtuoso): also the designated critical die activates Impacto
      Crítico on (maximum value − 1) as well as maximum value, expanding the
      critical threshold by one step.
    cost_note: >
      Rhythm 2 / Attrition 1. Rhythm 2 reflects the focused recall and pattern
      recognition time required. Attrition 1 matches the domain's low-attrition
      profile. The Permanente duration is justified by clear fictional end
      conditions with no tracking burden: the failure point is either active or
      it isn't.
    restrictions:
      - failure_point_declared_by_narrator_not_chosen_by_player
      - auto_fail_if_situation_genuinely_unprecedented_in_character_experience
      - all_bonuses_apply_only_to_user_not_shared_with_allies
      - rank_5_ti_bonus_is_plus_one_die_of_weapon_type_not_plus_rank_flat
      - rank_6_critical_threshold_reduction_is_fixed_minus_1_not_scaled_by_rank
    tags:
      - utility
      - active
      - specialization
      - information
      - precedent
      - scaling
      - historia
      - drakkai

  - name: El Cuello Que Todo Lo Atraviesa
    name_en: The Pass That Everything Crosses
    status: draft
    purpose: >
      Add a novice Drak'kai-origin active specialization technique rooted in
      Geografía that allows the character to substitute T.E. (Geografía) for
      six physical navigation specialization rolls when the task has a spatial
      or terrain component. First Geografía technique across all species.
      Distinct from El Espacio Se Sabe (Orientación — reconstructs who is where
      under confusion) and from base Geografía rolls (which provide narrative
      context only). The substitution uses Intelecto instead of Fuerza/Agilidad/
      Tenacidad, letting characters who have invested in mental specializations
      navigate terrain-based challenges without requiring parallel physical
      investment. Cost (Ritmo 3 / Desgaste 2) reflects the centralization: six
      specializations replaced by one. Reference: Cruzar la Punta (Evasión,
      Ritmo 3 / Desgaste 1) for a single-substitution baseline; Desgaste raised
      to 2 for the breadth of coverage.
    origin:
      main: Geografía
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Drakkai
      seed: Accumulated Route Knowledge / Macro-Spatial Understanding
      focus: Physical Navigation Substitution / Terrain Knowledge as Execution
      holder: Drak'kai long-route travelers whose accumulated terrain knowledge replaces physical execution requirements
      transmission: long_route_accumulated_terrain_and_spatial_knowledge
      availability: Restricted
    category: utility
    type: active
    trigger: >
      The user activates when about to make a T.E. (Saltar), T.E. (Trepar),
      T.E. (Marcha), T.E. (Orientación), T.E. (Acrobacias), or T.E.
      (Lanzamiento) roll in a space they can observe or have previously
      traversed, when the task has a genuine spatial or terrain component.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      armor_competency: null
      support_specializations:
        - geografia
      equipment: []
      states:
        - space_must_be_observable_or_previously_traversed
        - task_must_have_genuine_spatial_or_terrain_component
      prerequisite_techniques: []
    target: self
    range: personal
    area: self
    duration:
      model: instantaneous
      value: instantaneous
      sustain_rule: null
      end_rule: null
    cost:
      rhythm_cost: 3
      attrition_cost: 2
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      You do not need strength when you already know where the weight goes.
    effect: >
      When about to make a T.E. (Saltar), T.E. (Trepar), T.E. (Marcha),
      T.E. (Orientación), T.E. (Acrobacias), or T.E. (Lanzamiento) in a
      space the user can observe or has previously traversed, the user may
      substitute it with T.E. (Geografía) and add a bonus equal to their
      Geografía rank to the roll. The Narrator confirms whether the
      substitution is plausible before the roll is made. If the space is
      completely unknown to the character or the task has no spatial
      component, the substitution does not apply.
    scaling: >
      No progressive scaling table. The technique is complete at rank 1 —
      all six valid substitution targets are available from the start.
      Natural scaling comes from Geografía rank growth: the bonus added to
      the substituted roll equals the current Geografía rank at time of use.
    cost_note: >
      Rhythm 3 / Attrition 2. Rhythm 3 matches Cruzar la Punta (Evasión,
      single-substitution reference at Ritmo 3 / Desgaste 1) and reflects
      the time cost of the physical action being performed. Attrition raised
      to 2 because this technique centralizes six distinct physical
      specialization rolls into one mental one — a significant investment
      consolidation that warrants higher permanent effort cost.
    restrictions:
      - narrator_confirms_plausibility_before_roll
      - substitution_does_not_apply_in_completely_unknown_space
      - substitution_does_not_apply_when_task_has_no_spatial_component
      - bonus_applies_only_to_user_not_shared_with_allies
    tags:
      - utility
      - active
      - specialization
      - substitution
      - navigation
      - geografia
      - drakkai

