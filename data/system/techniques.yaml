      Make an immediate Destreza Specialization Roll against the same
      threshold or opposed result that the failed action just used.

      If the Destreza S.R. succeeds, replace the failed result with this new
      success. The action is treated as if the exact useful point was
      recovered in time by hand correction rather than broad retry.

