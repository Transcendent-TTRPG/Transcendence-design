        study_hours: 10
        practice_hours: 14
        text_or_manual_required: false
        notes: >
          Requires developing the ability to read armor assemblies for
          structural fault lines — where material meets grain, where riveting
          runs thin, where one piece seats against another. Study of object
          construction and material failure accelerates this significantly.
      guided_training:
        allowed: true
        study_hours: 5
        practice_hours: 8
        mentor_required: true
        notes: >
          A Drak'kai with accumulated object-handling experience can teach the
          reading of assembly faults — identifying the place that remembers
