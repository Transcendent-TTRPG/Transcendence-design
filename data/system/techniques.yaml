  - name: Trabar el Gesto
    name_en: Snare the Stroke
    status: authored_example
    purpose: >
      Add a novice Naghii-origin Flexible Weapons Technique using the
      Interruption profile, completing the Flexible Weapons set with a reactive
      action-break expression that applies Impedido through the alteration
      system rather than inventing a custom disruption state.
    origin:
      main: Flexible Weapons
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Threshold Denial
      focus: Enforcement / Execution Interruption
      holder: Naghii temple execution guards
      transmission: temple_guard_execution_break_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive guard practice: every
        committed action has a threshold moment where it is locked in and most
        interruptible. Non-Naghii can learn it with whips, chains, cords, or
        other flexible tools that can credibly reach a weapon arm or weapon
        execution line fast enough to catch the commitment before it resolves.
    category: attack
