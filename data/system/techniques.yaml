      attrition_cost: 1
      other: []
    saving_roll:
      model: specialization_check
      effect_on_success: >
        On a successful Resonancia Specialization Roll against a threshold set
        by signal strength, contamination overlap, sealing, interference, and
        scene pressure, the user isolates one bad seam and one less-wrong
        handling line on the source.
    description: >
      The source is not simply wrong. One part of it is speaking louder than
      the rest.
    effect: >
      Choose one exact disturbed source within sight or plausible resonant
      reach: a corpse, wound, wrapped object, pit edge, threshold, tool,
      bundle, container, altar face, or another similarly exact source
      carrying active unhealthy pressure.

      Make a Resonancia Specialization Roll against a threshold set by signal
      strength, contamination overlap, sealing, interference, and scene
      pressure.

      On success, you isolate one bad seam and one less-wrong handling line
      on that source. While the source remains materially the same, the user
      or one ally directly briefed by the user gains a bonus equal to +1 per
      technique rank on the next qualifying C.R., S.R., or R.R. that deals
      directly with that same source through the declared handling line.

      Qualifying uses include opening, moving, or securing the source without
      touching its active seam, treating or containing the specific pressure
      the read identified, or resisting an emanation, contact pressure, or
      backlash that comes from that exact source.

      The read persists on that source until it is sealed, quieted, emptied,
      treated past the relevant disturbance, or altered so much that the
      original seam no longer describes the danger correctly.

      On failure, the source is too overlapped, too noisy, too sealed, too
      deceptive, or too unstable to separate one active seam from the rest in
      a reliable way.
    scaling: >
