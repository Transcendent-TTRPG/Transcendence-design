      - attack
      - control
      - disruption
      - counter
  - name: Plantar la Guardia
    name_en: Stand Guard
    status: authored_example
    purpose: >
      Add a novice Naghii-origin Spear Technique using the Ward profile,
      completing the Spear set with a zone-control expression that makes the
      user's position a sustained Rhythm tax for any enemy acting within the
      declared area — mechanically distinct from the three Perforation
      techniques by operating before contact rather than at the entry moment.
    origin:
      main: Spear
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Coiled Readiness
      focus: Guard / Ward Formation
      holder: Naghii archive sentries
      transmission: archive_guard_ward_formation_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive guard formation doctrine:
        stillness held at a threshold is stored threat, not inactivity. A
        planted position with a spear declares the surrounding space as
        contested before any entry is attempted. Non-Naghii can learn it with
        any committed reach weapon that can credibly present a sustained
        threat posture across a zone rather than at a single target.
    category: utility
    type: active
    trigger: >
      The user chooses to establish a spear ward zone around their current
      position, declaring the area as contested space and holding the posture
      rather than advancing away from it.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Ward
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_ward_access
      states:
        - user_has_stable_footing_and_can_hold_the_position
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling the discipline of holding a ward position under
          approaching pressure without breaking the posture prematurely to
          strike or retreat.
      guided_training:
        allowed: true
        study_hours: 6
        practice_hours: 6
        mentor_required: true
        notes: >
          A Naghii archive guard or warden instructor can teach the learner
          when to plant and hold rather than advance, and how to read when the
          zone is working versus when it must be abandoned.
      material_cost: null
      access_notes: >
        Restricted to Naghii guard and warden formation training where holding
        a threshold against multiple enemies is a specific tactical discipline.
      final_validation: one_successful_supervised_execution
    target: zone
    range: self
    area: self-zone
    duration:
      model: until_trigger
      value: null
      sustain_rule: >
        The zone remains active as long as the user does not move beyond a
        negligible shift from the declared position and keeps the weapon's ward
        posture relevant. The user may attack, use Techniques, defend, speak,
        or pressure enemies while holding the zone if those actions do not
        abandon the position or turn the ward away from the contested space.
      end_rule: >
        Ends when the user moves more than a negligible distance from the
        declared position, turns the ward away from the contested space, loses
        the ability to present the weapon's threat posture, or is forced off the
        position by a hostile action such as a successful knockdown or
        displacement.
    cost:
      rhythm_cost: 3
      attrition_cost: 2
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The user plants the spear and holds. The point is already where the
      enemy needs to pass. There is no strike yet — only the declared
      condition that acting in this space will cost more than acting outside
      it. Stillness here is not patience. It is stored threat made spatial.
    effect: >
      Establish a ward zone centered on the user extending to weapon reach
      plus 1 meter. While the zone is active, any enemy that performs an
      active action within the zone — including entering the zone through
      movement, attacking from within it, or using a Technique inside it —
      pays an additional Rhythm cost equal to 1 plus the user's Spear
      competency rank bonus on top of that action's normal cost. At Novice
      the additional cost is 2; at Adept 3; at Expert 4; at Master 5; at
      Consummate 6; at Transcendent 7. Allies within or passing through the
      zone do not pay this cost. Enemies may leave the zone freely without
      penalty; the cost applies only to active actions performed within or
      through the zone, not to clean withdrawal.
    scaling: >
      The Rhythm cost increase scales with the rank bonus of the competency used for this Technique: 1 plus the
      rank bonus. Higher tiers may allow the zone to persist through limited
      repositioning or resist displacement attempts more reliably, but Novice
      use requires the user to remain at the declared position to maintain the
      zone.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The zone produces no immediate
      hit — its cost mechanism is the movement restriction: if the user
      moves, the zone collapses and the investment is lost. A higher Rhythm
      cost would push the user too far ahead in the ATB queue, making it
      impossible to hold position while still reacting and acting, defeating
      the technique's identity. R=3 keeps the user in the ATB window where
      holding a zone is actually viable. Cost validated by ATB model
      analysis; pending sim validation.
    restrictions:
      - requires_stable_footing_to_hold_the_ward_position
      - ends_when_user_moves_beyond_negligible_distance_from_declared_position
      - ends_when_user_turns_the_ward_away_from_the_contested_space_or_can_no_longer_present_the_threat_posture
      - ends_when_user_is_forced_off_position_by_knockdown_or_displacement
      - does_not_affect_allies_within_the_zone
      - does_not_prevent_enemies_from_leaving_the_zone_freely
      - rhythm_cost_applies_only_to_active_actions_within_or_through_the_zone
      - cannot_be_maintained_while_suffering_Derribado_or_Desequilibrado
    tags:
      - utility
      - control
      - pressure
      - setup
