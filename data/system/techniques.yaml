          collapse pressure instead of treating composure as a broad passive
          virtue.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          Zarnag plague workers, corpse handlers, and steadiness instructors
          teach how to preserve function for one necessary task without
          overclaiming into bodily endurance or general morale immunity.
      material_cost: null
      access_notes: >
        Common among Zarnag whose labor repeatedly forces them to keep working
        where disgust, smell, taboo, and fear would normally break function.
      final_validation: one_successful_supervised_necessary_task_completed_under_horror_pressure
    target: self_or_one_adjacent_ally
    range: self_or_adjacent
    area: single_creature
    duration:
      model: conditional
      value: one_declared_task_or_short_held_duty
      sustain_rule: null
      end_rule: ends_when_the_task_or_held_duty_resolves_or_at_the_start_of_the_protected_creatures_next_activation
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other:
        - no_attrition_cost_in_normal_exploration_unless_the_scene_is_under_active_pressure
    saving_roll:
      model: opposed_specialization_or_scene_threshold
      skill: Contención
      effect_on_success: >
        On success, the protected creature denies one triggering collapse
        attempt against the declared necessary task.
    description: >
      The hand starts to go, and the practitioner answers before the break
      lands cleanly.
    effect: >
      Choose yourself or one adjacent ally who is about to perform one
      declared necessary task under pressure. The task must be specific and
      practical:
      Interactuar, Usar Especialización, lifting or dragging a body, tying a
      seal, sealing a container, cutting something free, holding a gate, or
      another short duty the fiction clearly makes necessary.

      When horror, disgust, taboo dread, contamination pressure, or a
      comparable inward-collapse source attempts to impose a concrete penalty,
      interruption, or spoil on that task, make a reactive Contención
      Specialization Roll.

      If the source already uses an opposed roll, the Contención S.R. must
      equal or exceed that triggering roll. If the source does not use an
      opposed roll, roll against a threshold set by the scene's psychological
      and sensory pressure.

      On success, that one triggering collapse attempt does not apply to the
      declared task: the penalty, interruption, or inward break it would have
      caused is denied for this one resolution, and the task continues
      normally if it is still physically possible.

      On failure, the triggering pressure resolves normally.

      This Technique does not remove the source, cure panic broadly, or
      protect against bodily pain, command effects, deception, or long-form
      social pressure. It only denies one break attempt on one necessary task.
    scaling: >
      This Technique scales through the user's improving Contención, letting
      them beat stronger triggering pressure and preserve harder necessary
      tasks, not by widening into general immunity or broad team morale.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. This is not broad morale support.
      It is one immediate reactive denial of one collapse attempt against one
      necessary task for self or adjacent ally.
