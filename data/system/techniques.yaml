        Resolve through the hostile movement exchange that the Technique
        catches. If the target answers successfully, the enemy clears the
        flexible contact and their movement resolves normally.
    description: >
      The user releases a held curve of tail, cord, chain, or flexible weapon
      around a target that is trying to leave or improve position, knotting
