  - name: Tocar y Ceder
    name_en: Touch and Yield
    status: authored_example
    purpose: >
      Add a novice Naghii-origin Flexible Weapons Technique using the Skirmish
      profile, completing the flexible-weapon core with a movement-as-technique
      expression where the user enters briefly, strikes, and withdraws to
      preferred distance before the target can convert the contact into a stable
      close exchange.
    origin:
      main: Flexible Weapons
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Preserved Distance
      transmission: archive_warden_skirmish_contact_drills
      availability: Common
      adaptation_notes: >
        The Technique originates in Naghii guard and scout practice: the correct
        distance is a condition of safety and interpretation, and brief contact
        that restores that distance is not hesitation but trained completion.
        Non-Naghii can learn it with whips, chains, cords, hooked flexible tools,
        or other weapons that can credibly enter a target's immediate space and
        withdraw without requiring sustained close contact.
    category: attack
    type: active
    trigger: >
      The user wants to make contact with a target at or within 1 meter outside
      flexible reach and return to a preferred position in a single trained
      sequence — entering, striking, and withdrawing before the target can
      convert the contact into a stable close exchange.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Skirmish
      support_specializations: []
      equipment:
        - flexible_weapon
        - functional_tail_or_tendril
        - other_credible_skirmish_flexible_surface
      states: []
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of brief approach, controlled contact, and
          deliberate withdrawal so that entry and return become a single trained
          motion rather than two separate decisions.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Naghii guard instructor or trained flexible-weapon teacher can
          correct the learner when the withdrawal becomes hesitation or when the
          approach collapses into uncontrolled entry at close range.
      material_cost: null
      access_notes: >
        Common among Naghii archive wardens and ruin scouts who need to make
        contact without committing to a sustained close exchange.
      final_validation: one_successful_supervised_execution
    target: enemy
    range: flexible_reach
    area: single
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 5
      attrition_cost: 1
      other: []
    saving_roll:
      model: contextual
      effect_on_success: >
        Resolve through the hostile exchange created by the approach and
        contact. If the target answers successfully, the attack does not land
        and the return movement does not complete: the user's approach was spent
        without securing the contact or the restoration of distance.
    description: >
      The user enters briefly, places contact, and withdraws to their preferred
      geometry before the target can build a response on it. The withdrawal is
      not retreat — it is the completion of the technique. The distance the
      user returns to is the distance they chose to fight from.
    effect: >
      As part of this action, approach up to 1 meter toward the target — no
      separate movement action required. Then make a Flexible Weapons attack or
      equivalent tail or tendril Technique check against the target. If the
      Technique resolves successfully, immediately reposition up to 1 meter in
      any direction as part of the same action. This repositioning does not grant
      the target a reaction opportunity triggered by the movement. The user
      returns to their preferred distance before the target can convert the brief
      contact into a stable close exchange.
    scaling: >
      Higher Flexible Weapons competency may improve reliability, allow subtler
      timing of the entry window, or improve cost efficiency, but should not
      extend the approach or return distance beyond 1 meter at base or remove
      the contingency that the return requires a successful attack.
    cost_note: >
      Rhythm 5 / Attrition 1 is deliberate. The Technique packages a brief
      approach and a conditional return into a single active attack. It does not
      create persistent control, deny the target future movement, or allow the
      user to attack multiple targets. It is broader than a pure reactive catch
      but does not carry enough positional pressure to require heavier strain.
    restrictions:
      - approach_is_up_to_1m_only_not_a_full_movement_action
      - return_is_contingent_on_a_successful_attack
      - does_not_create_zone_control_or_deny_target_movement
      - does_not_allow_approach_beyond_1m_without_a_separate_movement_action
      - applies_to_one_target_only
      - should_not_function_if_terrain_prevents_credible_approach_and_withdrawal
      - return_movement_does_not_grant_a_reaction_opportunity_on_success
