        - munition_kit_if_non_natural_user
      states:
        - narrowed_access_non_natural_user_needs_munition_kit_to_prepare_readable_physical_mark
        - readable_mark_examples_include_pigment_scent_phosphorescent_residue_tracer_or_equivalent_marking_fluid
        - target_can_be_physically_marked
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires practice placing a mark where it will remain readable during
          movement instead of merely aiming for center mass.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Saa-Naghii scout, archive marksman, or trained projection warden can
          teach the learner to connect target reading, delivery angle, and
          trace persistence.
      material_cost: null
      access_notes: >
        Common among Saa-influenced scouts and projection wardens, but usually
        restricted outside Naghii communities because it teaches archive
        pursuit and marking procedure.
      final_validation: one_successful_supervised_marking_shot
    target: creature
    range: weapon_or_projection_range
    area: single
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the target completes its next movement or concealment attempt,
        spends Interactuar clearing the mark in a physically credible way,
        leaves the user's sensory reach behind a sealed barrier, or the scene
        no longer tracks immediate position.
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: dr_negates
      effect_on_success: >
        If the target's defense prevents contact, the mark does not apply. If
        the delivery method hits but deals no meaningful damage, the mark can
        still apply as long as physical contact or residue is established.
    description: >
      The user does not simply shoot where the target is. They place a visible,
      scented, irritating, or phosphorescent mark prepared through a munition
      kit where the target's next movement will reveal the line it is trying
      to make disappear.
    effect: >
      Make a profile-bearing attack with prepared marking ammunition, a marking
      kit delivery, or equivalent natural fluid-projection Technique check
      against the target. If the Technique resolves
      successfully, the target becomes read-marked until the duration ends.
      While read-marked, ordinary movement, partial cover, darkness, smoke,
      crowding, or a quick attempt to duck out of sight cannot make the target's
      immediate route ambiguous to the user: if the target moves or tries to
      conceal itself, the user knows which route, cover, doorway, or hiding line
      the marked target used, provided the mark remains within sensory reach.
      The Technique does not grant an attack bonus, ignore cover, reveal exact
      statistics, make the target visible through sealed barriers, or share the
      read with allies who cannot perceive the mark.
    scaling: >
      Higher rank in the competency used for this Technique may improve reliability, allow subtler
      marking deliveries, or let later higher-tier versions extend the read to
      allied observers or more difficult movement conditions. Novice use marks
      one creature and preserves one immediate route read only.
    cost_note: >
      Rhythm 5 / Attrition 1 is deliberate. The Technique combines a ranged
      attack with a short-lived tracking consequence, giving it one strong
      surface and one secondary information-control surface. These costs apply
      only during ATB or another active-threat scene; in normal exploration,
      the Technique resolves as the user's ranged marking action without
      Attrition.
    restrictions:
      - requires_a_ranged_delivery_that_can_leave_a_readable_physical_mark
      - non_natural_users_need_prepared_marking_ammunition_or_a_marking_kit_delivery
      - requires_the_target_to_be_physically_markable
      - applies_to_one_creature_only
      - preserves_the_immediate_route_read_only
      - does_not_grant_an_attack_bonus
      - does_not_ignore_cover_or_defense_benefits
      - does_not_reveal_exact_statistics_or_full_intent
      - does_not_reveal_through_sealed_barriers_or_impossible_sensory_blocks
      - does_not_share_the_read_with_allies_who_cannot_perceive_the_mark
    tags:
      - attack
      - precision
      - marking
      - counter_concealment
  - name: Nublar la Señal
    name_en: Blur the Signal
    status: authored_example
    purpose: >
      Add a novice Naghii-origin ranged Technique rooted in Ranged Weapons and
      Venom As Commitment, giving the Saa/fluid-projection side a Corrosion
      expression that pressures the target's next clean read instead of acting
      as generic poison damage.
    origin:
      main: Ranged Weapons
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Venom As Commitment
      focus: Guard / Suppression
      holder: Naghii suppression wardens
      transmission: saa_irritant_projection_and_warden_suppression_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Saa-Naghii venom projection, where contact
        is used to degrade the next decision rather than simply harm the body.
        Outsiders can adapt it with irritant dust, venom capsules, caustic
        darts, or other ranged tools that leave a short-lived sensory residue
        when prepared through a munition kit.
    category: attack
    type: active
    trigger: >
      The user has a ranged line to a creature that relies on a clean sensory
      read to aim, react, pursue, identify, or maintain pressure.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Corrosion
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_corrosion_access
        - munition_kit_if_non_natural_user
      states:
        - narrowed_access_non_natural_user_needs_munition_kit_to_prepare_irritating_venom_caustic_dust_or_sensory_residue
        - target_has_a_relevant_sensory_surface_or_exposed_reading_channel
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires practice placing residue where it disrupts a target's next
          clean read without relying on lasting injury or uncontrolled spread.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Saa-Naghii projection warden, venom handler, or archive guard can
          teach the timing between contact, irritation, and the target's next
          decision.
      material_cost: null
      access_notes: >
        Restricted because it teaches controlled sensory suppression and venom
        handling procedure.
      final_validation: one_successful_supervised_sensory_suppression_shot
    target: creature
    range: weapon_or_projection_range
    area: single
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the target spends Interactuar clearing the residue, resolves
        one affected sight/read-dependent action, loses the residue through
        environmental conditions, or the scene no longer tracks the immediate
        sensory pressure.
    cost:
      rhythm_cost: 4
      attrition_cost: 2
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: dr_negates
      effect_on_success: >
        If the target's defense prevents contact, the residue does not apply.
        Sealed protection, lack of relevant sensory surface, or immunity to the
        chosen irritant may prevent use or require a different delivery.
    description: >
      The user projects venom, dust, caustic residue, or another hostile trace
      across one exact exposed sensory channel, making the next clean read
      through that channel arrive through irritation and false signal.
    effect: >
      Declare one exact exposed sensory channel or read-point the delivery is
      trying to foul: eyes, nostrils, heat pits, whiskers, a tasting fork, an
      exposed arcane read organ, or another similarly small channel the
      fiction supports. Make the attack with -2 because the shot is targeting
      that exact point rather than simply landing on the body. If the attack
      still resolves successfully, the target becomes signal-blurred for that
      declared channel until the duration ends. Before resolving its next
      action or reaction that depends primarily on that same declared channel,
      the target must choose: spend Interactuar clearing the residue, ending
      the effect; or act through it and take a situational
      penalty equal to the rank bonus of the competency used for this
      Technique (+1 at Novice, +2 at Adept, +3 at Expert, +4 at Master, +5 at
      Consummate, +6 at Transcendent) on that one affected roll or opposed
      exchange. The penalty applies only to that single channel-dependent
      action. If the declared channel is not actually one the target is using
      to make that decision, the effect gives no practical burden. The
      Technique does not blind the target completely, does not suppress all
      senses, does not prevent movement, and does not impose a general
      scene-wide penalty.
    scaling: >
      The penalty scales by rank bonus of the competency used for this
      Technique: +1 at Novice, +2 at Adept, +3 at Expert, +4 at Master, +5 at
      Consummate, and +6 at Transcendent. Higher rank may allow subtler
      residues or more difficult delivery angles, but Novice use affects one
      immediate declared-channel-dependent action only.
    cost_note: >
      Rhythm 4 / Attrition 1 is deliberate. The Technique is an attack that
      also creates a bounded sensory-pressure choice, but only for one target,
      one declared channel, and one dependent action. The shot also carries a
      precision tax because it must hit a small exposed read-point rather than
      just the body. These costs apply only during ATB or another active-threat
      scene; in normal exploration, the Technique resolves as the user's ranged
      residue action without Attrition.
    restrictions:
      - requires_a_ranged_delivery_that_can_leave_irritating_or_degrading_residue
      - non_natural_users_need_prepared_residue_ammunition_or_a_residue_kit_delivery
      - requires_a_relevant_exposed_sensory_channel_or_reading_surface
      - applies_to_one_creature_only
      - affects_one_declared_channel_dependent_action_only
      - attack_suffers_minus_2_for_called_channel_placement
      - does_not_blind_the_target_completely
      - does_not_disable_all_sensory_channels
      - does_not_prevent_movement
      - does_not_create_a_general_scene_wide_penalty
      - does_not_stack_with_itself_on_the_same_target
      - sealed_protection_or_irritant_immunity_may_prevent_the_effect
    tags:
      - attack
      - corrosion
      - sensory_pressure
      - disruption
