      focus: Incubation Delay / Foul Exposure
      holder: Zarnag plague-line walkers, corpse-haulers, and trench clearers
      transmission: plague_line_labor_corpse_side_endurance_drills_and_infection_discipline_under_foul_exposure
      availability: Restricted
      adaptation_notes: >
        The Technique comes from Zarnag foul-work discipline: the body is
        trained not to spend its time badly after contamination. Outsiders can
        learn it only through real infection exposure management plus genuine
        Infection Resistance.
    category: utility
    type: passive
    trigger: >
      A mundane Infection settles on the user after a qualifying exposure and
      that Infection has a declared incubation period.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Tolerancia
      equipment: []
      states:
        - infection_resistance_at_novice_or_higher
        - tolerancia_at_novice_or_higher
        - a_mundane_infection_has_already_settled
        - that_infection_has_a_declared_incubation_period
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 10
        text_or_manual_required: false
        notes: >
          Requires repeated foul-work exposure where the learner must control
          exertion, scratching, breathing, and panic after contamination
          instead of spending the body's time badly.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 8
        mentor_required: true
        notes: >
          A plague-line worker, corpse-handler, trench veteran, or field judge
          can teach how to delay symptom onset by denying the Infection the
          body's worst immediate reactions after exposure.
      material_cost: null
      access_notes: >
        Restricted within Zarnag foul-work and quarantine traditions.
        Non-Zarnag access requires both Tolerancia and real Infection
        Resistance developed through actual contamination management, not
        theory alone.
      final_validation: one_successful_supervised_post_exposure_discipline_drill_that_extends_symptom_onset
    target: self
    range: self
    area: self
    duration:
      model: permanent
      value: null
      sustain_rule: while_both_prerequisites_remain_at_novice_or_higher
      end_rule: null
    cost:
      rhythm_cost: 0
      attrition_cost: 0
      other: []
    saving_roll:
      model: none
      effect_on_success: none
    description: >
      The body does not win by staying untouched. It wins by making the rot
      arrive slower. Fever, swelling, black streak, bad breath, and organ-fail
      pressure are still coming, but not on the same clock they would claim
      from cleaner flesh.
    effect: >
      When a mundane Infection with a declared incubation period settles on
      the user after all qualifying Infection Resistance Roll processing,
      extend that Infection's incubation by one additional interval equal to
      its own listed incubation period before symptoms become active. If an
      Infection normally incubates for hours, it takes those hours again
      before symptoms manifest. If it normally incubates for days, it takes
      those days again. If it uses another declared period, repeat that same
      period once before the Infection becomes active.
    scaling: >
      This Technique does not scale through numeric bonus. At Novice it
      extends incubation by one full additional interval of the Infection's
      own listed period. Higher tiers may add further interval delay or
      broader coverage for harsher incubation profiles.
