  - name: Cerrar el Flanco
    name_en: Close the Flank
    status: pilot_example
    purpose: >
      Validate a Sauri-origin Interception Technique that uses tail or
      profile-bearing reach to replace a protected target's Defense Roll with
      the user's reactive Attack Roll, creating a risky offensive protection
      window.
    origin:
      main: Interception
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Sauri
      seed: Tail Keeps The Channel / Procession Of Force
      focus: Escort / Flank Defense
      holder: Sauri flank escorts and canal bank guards
      transmission: flank_guard_tail_drills_temple_corridor_escort_forms_and_canal_bank_body_adjacent_defense
      availability: Restricted
      adaptation_notes: >
        The Technique expresses the Sauri doctrine that the flank beside the
        body is governed terrain. Non-Sauri users can learn it through
        Interception surfaces with enough reach and striking authority to hit
        an attacker before their attack reaches the protected target.
    category: defense
    type: reactive
    trigger: >
      An enemy within the user's tail or Interception-surface reach makes a
      physical attack against the user or against a creature or object within
      that same reach.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Interception
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_interception_access
      states:
        - profile_bearing_surface_has_enough_reach_and_striking_authority_to_hit_the_attacker_before_the_attack_reaches_the_protected_target
        - protected_willing_creature_accepts_replacing_its_td_against_the_triggering_attack
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling attack-line recognition, flank coverage, and timing
          a reactive strike so it reaches the attacker before the hostile attack
          reaches the protected target.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 5
        mentor_required: true
        notes: >
          A Sauri tail instructor, escort trainer, or Interception-surface
          instructor can correct the user's timing so the protection is neither
          late nor a passive shield substitution.
      material_cost: null
      access_notes: >
        Best learned in corridor escort drills, flank defense practice, and
        paired exercises where the protected target deliberately yields their
        Defense Roll to the user's interception.
      final_validation: one_successful_supervised_reactive_attack_that_replaces_a_protected_targets_defense_roll
    target: attacking_enemy
    range: tail_or_interception_surface_reach
    area: one_attacking_enemy_and_one_protected_target
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: null
    cost:
      rhythm_cost: 6
      attrition_cost: 2
      other: []
    saving_roll:
      model: opposed_attack_roll
      effect_on_success: >
        If the user's reactive Attack Roll equals or exceeds the hostile Attack
        Roll, the triggering attack does not hit the protected target and the
        user's counterattack deals normal damage.
    description: >
      The enemy reaches for one body or object beside the user and finds the
      Sauri's tail already crossing that line with enough force to punish the
      attempt before it lands.
    effect: >
      When the trigger occurs, declare whether the Technique is replacing the
      user's own T.D. or the protected target's T.D. against the triggering
      attack. Make a reactive T.A. with the tail or Interception-profile
      surface against the attacking enemy. Compare that T.A. to the triggering
      attacker's T.A. If the user's T.A. equals or exceeds the attacker's T.A.,
      the interception succeeds: the triggering attack does not hit the
      protected target, the user's attack deals normal damage to the attacking
      enemy, and any non-damage rider on the triggering attack fails to affect
      the protected target unless a specific rule says it survives failed
      interception. If the user's T.A. is lower than the attacker's T.A., the
      interception fails. The triggering attack resolves against the protected
      target as if that target's T.D. had failed. The protected target does not
      make a separate T.D. against that attack. If the protected target is a
      willing creature, it must accept the interception before the roll. If it
      refuses, this Technique cannot replace its T.D. Objects, unconscious
      creatures, restrained creatures, carried creatures, or creatures unable
      to defend may be protected if the fiction allows the user to cover the
      line.
    scaling: >
      Higher competency improves the user's reactive T.A. through normal
      competency scaling. Higher-tier versions may broaden valid protected
      targets, improve rider handling, or allow limited protection against more
      complex attack lines, but Novice use remains one attack against one
      protected target.
    cost_note: >
      Rhythm 6 / Attrition 2 is intentional. The Technique is reactive, can
      protect another target, and can deal normal damage if the user's attack
      roll beats the hostile attack. Its main limiter is risk: declaring it
      replaces the protected target's T.D. against the triggering attack, and
      the added Attrition reflects the offensive interception load of doing
      both protection and punishment in the same window. It is stronger than a
      standard-anchor reactive, but narrower than full heavy scene control, so
      it now sits cleanly at the bridge value between 5 and 7.
    restrictions:
      - requires_a_physical_attack_or_movement_linked_strike_from_an_enemy_within_tail_or_interception_surface_reach
      - requires_a_profile_bearing_surface_that_can_credibly_strike_the_attacker_before_the_triggering_attack_reaches_the_protected_target
      - cannot_be_used_against_purely_mental_social_aura_curse_poison_infection_area_teleportation_or_non_contact_effects
      - cannot_be_used_against_an_attack_line_the_user_cannot_perceive_anticipate_or_physically_reach
      - cannot_protect_an_unwilling_creature_that_is_able_to_defend_itself_and_refuses_the_replacement
      - cannot_be_used_if_the_protected_target_already_rolled_td_against_the_triggering_attack
      - does_not_stop_enemy_movement_apply_atrapado_apply_desequilibrado_apply_derribado_disarm_or_rupture_by_itself
      - does_not_automatically_make_the_user_the_target_of_the_triggering_attack
      - affects_one_triggering_attack_only
      - cannot_stack_with_another_copy_of_itself_on_the_same_triggering_attack
    tags:
      - defense
      - interception
      - counterattack
      - protection
