        - active_cycles: 1
          difficulty: Fundamental
        - active_cycles: 2-3
          difficulty: Desafiante
        - active_cycles: 4-5
          difficulty: Rigurosa
        - active_cycles: 6-7
          difficulty: Exigente
        - active_cycles: 8+
