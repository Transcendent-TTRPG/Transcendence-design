pilot_examples:
  - name: Cerrar la Línea
    name_en: Close the Line
    status: pilot_example
    purpose: >
      Validate the current Technique framework with a first authored combat
      Technique that is clearly distinct from a generic base attack.
    origin:
      main: Spear
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Threshold Denial
      focus: Guard / Threshold Control
      holder: Naghii archive guards
      transmission: archive_guard_spear_drills
      availability: Restricted
      adaptation_notes: >
        The Technique expresses the Naghii principle that crossing a protected
        threshold is the vulnerable moment. Non-Naghii can learn it through
        Naghii guard instruction or adapted spear schools that preserve the
        entry-denial logic.
    category: defense
    type: reactive
    trigger: >
      An enemy advances into the user's line or tries to convert forward
      movement into immediate melee contact against the user.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Perforation
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_perforation_access
      states:
        - user_can_sustain_a_committed_piercing_line
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 4
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of line presentation, distance judgment,
          and entry punishment against a moving partner.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A trained lancer or comparable combat instructor can shorten the
          learning curve by correcting timing and point alignment.
      material_cost: null
      access_notes: >
        Best learned through controlled sparring where the learner must read
        committed entry and answer before the opponent stabilizes in close
        range.
      final_validation: one_successful_supervised_execution
    target: enemy
    range: weapon_reach
    area: single
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 7
      attrition_cost: 2
      other: []
    saving_roll:
      model: contextual
      effect_on_success: >
        Resolve through the hostile exchange that the Technique intercepts.
        If the target answers successfully, the entry is not denied.
    description: >
      The user places the point exactly where the opponent must pass, making
      committed entry dangerous before close pressure can settle.
    effect: >
      Make a reactive attack against the triggering enemy. The point meets the
      advance before it settles — the enemy absorbs the thrust at the worst
      moment of their commitment or is forced to abort the entry. If the
      Technique resolves successfully, the advance does not convert into clean
      melee contact: the enemy's forward motion ends at the point rather than
      past it.
    scaling: >
      Higher competency used for this Technique may improve reliability, entry denial clarity, or
      cost efficiency, but should not turn the Technique into broad zone control
      by default.
    cost_note: >
      Rhythm 4 / Attrition 1 is deliberate. The Technique is narrower than a
      standard authored action, but stronger than a pure quick reactive strike
      because it also denies clean entry conversion on success.
    restrictions:
      - requires_a_clear_line_and_enough_space_to_present_the_point
      - cannot_be_used_if_the_enemy_is_already_established_at_very_close_range
      - cannot_be_used_when_the_user_cannot_align_the_weapon_credibly
    tags:
      - attack
      - pressure
      - precision
      - setup
  - name: Cerrar la Compuerta
    name_en: Close the Sluice
    status: pilot_example
    purpose: >
      Validate a Sauri-origin Shield Technique that uses active Line Control to
      make attacking through a protected route less efficient without becoming a
      guaranteed interception.
    origin:
      main: Shield
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Sauri
      seed: Tail Keeps The Channel / Procession Of Force
      focus: Guard / Route Control
      holder: Sauri river wardens and temple gate guards
      transmission: river_warden_shield_drills_and_temple_gate_defense
      availability: Restricted
      adaptation_notes: >
        The Technique expresses the Sauri idea that movement is pressure moving
        through a channel and that a shield can become the gate that closes the
        route. Non-Sauri shield users can learn it through Sauri river-warden
        instruction, temple guard service, or adapted shield schools that
        preserve the lane-closure logic.
    category: defense
    type: active
    trigger: >
      The user sets their shield to govern a readable lane, flank, doorway,
      bridge, corridor, formation gap, or other route before an enemy commits
      through it.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Line Control
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_line_control_access
      states:
        - user_must_remain_stationary_while_the_stance_is_active
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of shield placement, zone reading, and
          holding a stable protected area without overcommitting to a single
          attack line.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A trained shield instructor, river warden, or temple guard can shorten
          the learning curve by correcting stance timing and zone awareness.
      material_cost: null
      access_notes: >
        Best learned in formation drills where holding ground while protecting
        nearby allies is the explicit goal.
      final_validation: one_successful_supervised_execution
    target: self
    range: self
    area: allies_within_weapon_reach_plus_one
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the user takes a movement action. Also ends early if the user
        loses the profile-bearing weapon or becomes unable to maintain the stance.
    cost:
      rhythm_cost: 3
      attrition_cost: 2
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The user sets the shield and holds ground, making the space around nearby
      allies costly to attack through. Enemies can still bypass — but doing so
      through the protected zone is now the harder choice.
    effect: >
      Declare the stance. While active, all attacks targeting allies within
      [weapon reach + 1] of the user suffer a penalty to their Attack Roll
      equal to the user's rank in the competency used for this Technique. This
      makes targeting the user directly the more efficient option. The stance
      ends when the user takes a movement action.
    scaling: >
      Higher competency rank increases the Attack Roll penalty applied to
      attacks against allies in the protected zone. The zone radius does not
      change with rank — it is always weapon reach + 1.
    cost_note: >
      Rhythm 3 / Attrition 1. The Technique is a declared stance with no roll
      requirement and no route selection — it claims a zone around the user and
      taxes attacks against allies within it. The low cost reflects that its
      benefit is conditional: it only matters when enemies choose to attack
      allies through the zone rather than the user.
