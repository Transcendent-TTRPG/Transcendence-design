    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 7
        text_or_manual_required: false
        notes: >
          Requires practicing how to present one line convincingly without
          losing the second one to sloppy overcommitment.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          Zarnag false-hand fighters and low-line cutters teach how to make
          the defense settle on the wrong first answer without turning the
          method into theatrical flourish.
      material_cost: null
      access_notes: >
        Common among Zarnag who fight in ugly close quarters where one wrong
        answered hand can decide the exchange.
      final_validation: one_successful_supervised_false_line_setup_into_follow_attack
    target: creature
    range: close_contact
    area: single
    duration:
      model: conditional
      value: until_follow_up_or_end_of_users_next_activation
      sustain_rule: null
      end_rule: wrong_answered_ends_on_use_or_at_end_of_users_next_activation
    cost:
      rhythm_cost: 5
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
    saving_roll:
      model: defense_roll_negates_contact
      effect_on_success: >
        If the setup attack fails to connect, the hidden-line setup does not
        take hold.
    description: >
      The target answers the hand it sees and is left wrong for the hand it
      did not finish accounting for.
    effect: >
      Make a close Unpredictability attack with claws, dagger, or another
      narrowed-access deceptive close surface.

      If the attack fails to connect, nothing further happens.

      If the attack connects, the target becomes wrong-answered against you
      until your next successful attack against that target or the end of your
      next activation, whichever comes first.

      While wrong-answered is active, the target's next D.R. against your next
      attack treats one declared line-dependent defensive answer as unavailable
      for that one roll: one shield-facing or guard-angle rider, one parry-like
      weapon rider, or one equivalent declared defensive surface that only
      works because the target answered the obvious first line.

      The target still makes its normal D.R. This Technique does not remove
      Defense entirely, bypass armor, or deny all defensive bonuses at once. It
      only makes one wrong prepared answer fail to help on the follow-up.
    scaling: >
      This Technique scales through the user's improving ability to land the
      setup cleanly and force the target into a more reliable wrong answer. It
      does not expand into full defense denial at Novice scale.
    cost_note: >
      Rhythm 5 / Attrition 1 is deliberate. This is a full attack that can
      also seed one short deceptive follow-up window, but only against the
      same target and only for the user's next attack.
