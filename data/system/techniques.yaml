  - name: Plantar la Guardia
    name_en: Stand Guard
    status: authored_example
    purpose: >
      Add a novice Naghii-origin Spear Technique using the Ward profile,
      completing the Spear set with a zone-control expression that makes the
      user's position a sustained Rhythm tax for any enemy acting within the
      declared area — mechanically distinct from the three Perforation
      techniques by operating before contact rather than at the entry moment.
    origin:
      main: Spear
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Coiled Readiness
      transmission: archive_guard_ward_formation_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive guard formation doctrine:
        stillness held at a threshold is stored threat, not inactivity. A
        planted position with a spear declares the surrounding space as
        contested before any entry is attempted. Non-Naghii can learn it with
        any committed reach weapon that can credibly present a sustained
        threat posture across a zone rather than at a single target.
    category: utility
    type: active
    trigger: >
      The user chooses to establish a spear ward zone around their current
      position, declaring the area as contested space and holding the posture
      rather than advancing or attacking.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Ward
      support_specializations: []
      equipment:
        - spear
        - other_committed_reach_weapon_capable_of_sustained_threat_posture
      states:
        - user_has_stable_footing_and_can_hold_the_position
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling the discipline of holding a ward position under
          approaching pressure without breaking the posture prematurely to
          strike or retreat.
      guided_training:
        allowed: true
        study_hours: 6
        practice_hours: 6
        mentor_required: true
        notes: >
          A Naghii archive guard or warden instructor can teach the learner
          when to plant and hold rather than advance, and how to read when the
          zone is working versus when it must be abandoned.
      material_cost: null
      access_notes: >
        Restricted to Naghii guard and warden formation training where holding
        a threshold against multiple enemies is a specific tactical discipline.
      final_validation: one_successful_supervised_execution
    target: zone
    range: self
    area: self-zone
    duration:
      model: until_trigger
      value: null
      sustain_rule: >
        The zone remains active as long as the user does not move beyond a
        negligible shift from the declared position and does not make an attack.
      end_rule: >
        Ends when the user moves more than a negligible distance from the
        declared position, makes an attack, or is forced off the position by
        a hostile action such as a successful knockdown or displacement.
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The user plants the spear and holds. The point is already where the
      enemy needs to pass. There is no strike yet — only the declared
      condition that acting in this space will cost more than acting outside
      it. Stillness here is not patience. It is stored threat made spatial.
    effect: >
      Establish a ward zone centered on the user extending to weapon reach
      plus 1 meter. While the zone is active, any enemy that performs an
      active action within the zone — including entering the zone through
      movement, attacking from within it, or using a Technique inside it —
      pays an additional Rhythm cost equal to 1 plus the user's Spear
      competency rank bonus on top of that action's normal cost. At Novice
      the additional cost is 2; at Adept 3; at Expert 4; at Master 5; at
      Consummate 6; at Transcendent 7. Allies within or passing through the
      zone do not pay this cost. Enemies may leave the zone freely without
      penalty; the cost applies only to active actions performed within or
      through the zone, not to clean withdrawal.
    scaling: >
      The Rhythm cost increase scales with Spear competency rank: 1 plus the
      rank bonus. Higher tiers may allow the zone to persist through limited
      repositioning or resist displacement attempts more reliably, but Novice
      use requires the user to remain at the declared position to maintain the
      zone.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique produces no
      immediate attack or movement — its value is entirely in the Rhythm tax
      it imposes on enemy actions within the zone over time. At Rhythm 3, a
      single enemy paying the Novice-tier cost of 2 on their next action
      approaches break-even; multiple enemies or repeated actions within the
      zone create a meaningful timeline advantage. The posture ends the moment
      the user moves or attacks, which keeps the technique in Ward identity
      and forces a genuine choice between holding the zone and committing to
      a strike.
    restrictions:
      - requires_stable_footing_to_hold_the_ward_position
      - ends_when_user_moves_beyond_negligible_distance_from_declared_position
      - ends_when_user_makes_an_attack
      - ends_when_user_is_forced_off_position_by_knockdown_or_displacement
      - does_not_affect_allies_within_the_zone
      - does_not_prevent_enemies_from_leaving_the_zone_freely
      - rhythm_cost_applies_only_to_active_actions_within_or_through_the_zone
      - cannot_be_maintained_while_suffering_Derribado_or_Desequilibrado
    tags:
      - utility
      - control
      - pressure
      - setup
  - name: Leer el Arco
    name_en: Read the Arc
    status: authored_example
    purpose: >
      Add a novice Naghii-origin specialization Technique rooted in Astronomía,
      completing the specialization set with a support expression that uses
      trajectory projection — the cognitive tool underlying astronomical study
      — to reveal where a moving target is going rather than where it is,
      giving the user's team actionable information before the declared action
      executes.
    origin:
      main: Astronomía
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Projection Of Interpretation
      transmission: outer_archive_trajectory_and_projection_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii astronomical training, where the
        primary skill is not identifying what is visible but projecting where
        it will be. The same cognitive tools — arc reading, vector extension,
        endpoint calculation — transfer to any moving target. Non-Naghii can
        learn analogous methods through ballistic study, hunting projection,
        fluid-movement reading, or other disciplines that teach trajectory
        calculation rather than position observation.
    category: utility
    type: active
    trigger: >
      A creature or object within observable range is in movement, about to
      act, or has a discernible vector that can be projected to a next
      position or endpoint.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - target_has_a_discernible_movement_vector_or_imminent_declared_action
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated practice projecting trajectories from observed
          starting vectors — learning to read where something is going rather
          than where it is, and confirming those projections against what
          actually happens.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 6
        mentor_required: true
        notes: >
          A Naghii archive astronomer or trained projection reader can teach
          the learner to separate genuine movement intent from noise, feint,
          or incomplete vectors.
      material_cost: null
      access_notes: >
        Restricted to outer archive astronomical training where projection and
        trajectory reading are taught as practical tools before deeper
        celestial study is permitted.
      final_validation: one_successful_supervised_trajectory_read
    target: creature
    range: line_of_sight
    area: single
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends when the target completes the revealed action, significantly
        changes their intent before executing it, or the scene no longer
        tracks the projected trajectory.
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: contextual
      effect_on_success: >
        If the target is actively feinting, using a deception technique, or
        otherwise concealing their movement intent, they may oppose with the
        relevant Specialization Roll or Technique. On a successful answer,
        the read is inaccurate or reveals only that the target's visible
        vector is not their real one.
    description: >
      The astronomer does not look at where the object is. They look at the
      arc. Every vector has an endpoint, and the discipline of projecting
      celestial movement — tracing where something must be, not just where
      it appears — applies to anything in motion. The user reads the arc
      and declares where it ends.
    effect: >
      Make an Astronomía Specialization Roll against one target in motion or
      about to act. On success, the Narrator must declare one trajectory truth
      about the target's next action or movement before it executes — such as
      where the target will be at the end of their next movement; the landing
      destination or path of a ranged attack they are about to make; what
      cover, position, or creature the target's current movement vector leads
      them toward; or whether the target's current direction brings them into
      reach of an ally, a hazard, or a dead end. These are examples of the kind
      of truth this Technique produces, not a closed list: the Narrator chooses
      whichever truth is most structurally meaningful and may declare other
      trajectory truths of the same quality and specificity that the vector
      supports. This declared truth is available to the user and any ally within
      clear hearing range before the target's action executes — giving the team
      the window between the user's turn and the target's execution to act on
      the information. The technique does not prevent the target from acting,
      does not grant any roll bonus against the target, and does not reveal more
      than one trajectory truth at Novice. If the target's intent changes
      dramatically before execution due to scene events, the accuracy of the
      read reflects what was true when the projection was made.
    scaling: >
      Higher Astronomía rank may improve reliability, allow subtler or faster
      trajectory reads, or let later higher-tier versions project two targets
      in the same action. Novice use reveals one trajectory truth for one
      target only.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique is a quick read
      under pressure that produces a single concrete trajectory truth. Its
      value is entirely in the information and the window between the user's
      turn and the target's execution — giving the team time to act on what
      is coming rather than react to what has arrived. These costs apply only
      during ATB or active-threat scenes; in exploration, the Technique
      resolves as the user's Astronomía action without Attrition.
    restrictions:
      - requires_an_observable_target_with_a_discernible_vector_or_imminent_action
      - reveals_one_trajectory_truth_only
      - does_not_prevent_the_target_from_acting
      - does_not_grant_roll_bonuses_against_the_target
      - does_not_reveal_statistics_conditions_or_intent_beyond_movement_trajectory
      - accuracy_depends_on_target_not_dramatically_changing_intent_before_execution
      - shared_only_with_allies_within_clear_hearing_range
