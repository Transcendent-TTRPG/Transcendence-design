        discipline, heat tools, scent practice, or other methods that preserve
        the principle that living bodies reveal pressure through layered signs.
    category: utility
    type: active
    trigger: >
      The user can observe or sense a living creature's immediate physical
      signs: heat shift, breath, scent, pressure, vibration, posture, blood,
      tremor, or movement residue.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - living_creature_present_or_immediate_living_trace_available
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated practice reading bodily pressure through multiple
          physical signs and confirming the read against what the creature does
          next.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Naghii ruin-scout, guard, or sensory instructor can teach the
          learner to separate living signal from irrelevant environmental noise.
      material_cost: null
      access_notes: >
        Common among Naghii scouts, archive couriers, and temple guards who must
