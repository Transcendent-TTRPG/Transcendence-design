      - does_not_create_a_false_narrative
      - does_not_remove_wounds_fatigue_fear_ailments_or_other_burdens_from_the_user
      - does_not_negate_a_hostile_action_wholesale_only_applies_read_pressure_and_denies_the_rank_based_number_of_read_dependent_riders
      - only_affects_one_observing_creature_or_one_coherent_observing_group_per_use
      - cannot_erase_non_visible_proof_the_observer_already_has
