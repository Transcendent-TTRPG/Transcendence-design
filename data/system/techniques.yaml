        Restricted to Naghii guard and warden training where intercepting
        hostile weapon use in confined archive spaces is a specific discipline.
      final_validation: one_successful_supervised_execution
    target: enemy
    range: weapon_reach
    area: single
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
