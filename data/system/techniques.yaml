competency_domains:
  weapons:
    primary: [attack, setup, pressure]
    secondary: [mobility, disruption, precision]
    rare_or_limited: [recovery, support]
  armors:
    primary: [defense, mitigation, stability]
    secondary: [anti_displacement, survival_window, control]
    rare_or_limited: [attack, mobility]
  shields:
    primary: [defense, interception, control]
    secondary: [disruption, anti_displacement, setup]
    rare_or_limited: [attack, support]
  evasion:
    primary: [mobility, defense, counter_positioning]
    secondary: [setup, disruption, survival_window]
    rare_or_limited: [mitigation, attack]
  specializations:
    primary: [setup, control, recovery, disruption]
    secondary: [attack, defense, mobility, support, utility]
    rare_or_limited: [pressure]
  resistances:
    primary: [defense, recovery, condition_reduction, survival_window]
    secondary: [mitigation, control]
    rare_or_limited: [attack, support]
    role: hybrid_only
    pure_techniques_allowed: false
    note: >
      Resistances are adaptation modifiers, not a standalone Technique school.
      They should alter how another chosen domain behaves under a learned threat.

information_technique_rule:
  applies_to_domains:
    - Perception
    - Interpretation
    - Identification
    - Tracking
    - Theology
    - Astronomy
    - Cryptology
    - Archaeology
    - Architecture
    - similar_reading_domains
  default_output: actionable_information
  good_outputs:
    - reveal_one_immediate_tactical_truth
    - identify_relevant_absence_or_contradiction
    - expose_next_likely_route_state_risk_or_pressure
    - classify_sign_pattern_creature_state_structure_or_threat_in_bounded_way
    - rule_out_unsafe_conclusion
  should_not_default_to:
    - passive_bonus_to_another_roll
    - generic_modifier_without_information
  bonus_only_allowed_when:
    - explicitly_authored_as_setup_technique
    - clear_target_roll_or_action_family
    - narrow_trigger
    - defined_duration_or_consumption_point
    - reason_direct_information_is_not_better
  rule: >
    If a reading Technique only grants a bonus, it should be rewritten unless
    it is deliberately a bounded setup Technique. The read itself should usually
    change play by producing a concrete actionable truth.

access_model:
  access_is_separate_from_scaling: true
  note: >
    Technique access should usually depend on origin plus minimum competency
    rank and, when needed, profile, specialization, equipment, or state
    conditions. Competency growth improves execution; access controls what kind
    of trained expression is available.
  common_access_factors:
    - origin
    - minimum_rank
    - weapon_profile
    - support_specialization
    - equipment_requirement
    - state_requirement

technique_tiers:
  - tier: 1
    name: novice_access
    minimum_rank: Novice
    identity:
      - one_clear_fantasy
      - one_primary_interaction_surface
      - simple_execution
      - strong_constraints_or_narrow_window
    typical_qualities:
      - active_use
      - short_duration
      - low_systemic_complexity
      - little_or_no_scene_warping_control
  - tier: 2
    name: adept_access
    minimum_rank: Adept
    identity:
      - one_primary_interaction_surface
      - one_meaningful_secondary_surface
      - cleaner_reliability_or_broader_window_than_tier_1
    typical_qualities:
      - stronger_timing_access
      - better_setup_conversion
      - moderate_control_disruption_or_conditional_defense
  - tier: 3
    name: expert_access
    minimum_rank: Expert
    identity:
      - multiple_coherent_system_surfaces
      - stronger_reaction_persistence_or_zone_pressure
      - higher_permission_to_alter_tempo_position_or_behavior
    typical_qualities:
      - serious_scene_leverage
      - better_setup_to_consequence_conversion
      - hybrid_requirements_more_common
  - tier: 4
    name: master_plus_access
    minimum_rank: Master
    identity:
      - rare_high_impact_expression
      - major_scene_or_encounter_influence
      - strong_persistence_layered_timing_or_structural_control
    typical_qualities:
      - should_be_few
      - should_be_costly_or_restricted
      - should_gain_permission_not_just_output

qa_budget:
  purpose: >
    First-pass balance control for Technique authoring. This does not prove
    perfect balance, but it identifies Techniques whose pressure exceeds their
    intended tier.
  major_pressure_sources:
    - strong_reactive_access
    - position_or_lane_control
    - zone_influence
    - persistent_condition_pressure
    - rhythm_manipulation
    - attrition_manipulation
    - threshold_manipulation_on_follow_up
    - reliable_mitigation_or_stability
    - multiple_major_surfaces_without_real_tradeoff
  minor_pressure_sources:
    - narrow_flat_bonus
    - one_bounded_reroll_clause
    - small_setup_clause
    - short_lived_support_rider
    - tightly_restricted_secondary_interaction
  compensation_factors:
    - higher_minimum_rank
    - stronger_equipment_restriction
    - narrow_trigger_window
    - visible_setup_requirement
    - meaningful_counterplay
    - saving_roll_or_mitigation_window
    - higher_rhythm_or_attrition_cost
    - once_per_window_or_once_per_scene_limit
  tier_expectations:
    tier_1:
      expected:
        - one_major_surface
        - at_most_one_minor_secondary_surface
      avoid:
        - strong_reactive_control_plus_persistence
        - multiple_major_surfaces
        - broad_scene_shaping
    tier_2:
      expected:
        - one_major_surface
        - one_secondary_surface
      may_have:
        - moderate_reactive_access
        - moderate_setup_conversion
    tier_3:
      may_have:
        - two_major_surfaces_if_coherent
        - stronger_timing_and_control_permission
        - hybrid_leverage
      must_pay_with:
        - access_difficulty
        - cost
        - restriction_load
    tier_4:
      may_have:
        - large_scene_pressure
        - layered_timing_logic
        - heavy_persistence_or_encounter_leverage
      expected:
        - rare
        - expensive
        - restricted
        - clearly_upper_tier
  review_states:
    - OK
    - Watch
    - Outlier

