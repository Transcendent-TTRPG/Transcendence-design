      end_rule: on_resolution_or_when_the_same_scrutiny_breaks
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other: []
    saving_roll:
      model: specialization_check
      effect_on_success: >
        On a successful Aplomo Specialization Roll opposed by the triggering
        read or pressure action, or against a Narrator-set scrutiny threshold,
        the chosen observer suffers concrete read pressure for that resolution
        and loses one read-dependent rider if the read still succeeds.
    description: >
      The crack exists. The witness does not get to see it open. Pain remains
      inside the jaw, fear remains behind the eyes, fatigue remains in the
      limbs, but the line that others can read stays unbroken long enough for
      the moment to pass without surrendering tactical leverage.
    effect: >
      Make an Aplomo Specialization Roll opposed by the triggering read or
      pressure action, or against a Narrator-set scrutiny threshold when no
      hostile roll exists. On success, choose one observing creature or one
      coherent observing group involved in the trigger. Apply both of the
      following to that resolution: if the triggering read uses a roll, apply
      the rank-based penalty below; if it uses a fixed threshold, apply the
      listed difficulty-tier increase. If the triggering action or Technique
      still succeeds, it loses the listed number of read-dependent riders.
      Rank scaling: ranks 1-2 impose -2 to the read roll or +1 difficulty tier
      and deny 1 read-dependent rider; ranks 3-4 impose -3 to the read roll or
      +1 difficulty tier and deny up to 2 read-dependent riders from the same
      triggering action or Technique; ranks 5-6 impose -4 to the read roll or
      +2 difficulty tiers and deny up to 2 read-dependent riders from the same
      triggering action or Technique. The base action may still continue if it
      does not require the denied leverage to exist. Sellar la Grieta does not
      turn the user invisible, healthy, or fearless. It only makes one visible
      crack harder to use as field evidence right now. On failure, the read or
      pressure proceeds normally.
    scaling: >
      Higher Aplomo competency scales this Technique mechanically, not just by
      permission: better ranks increase the roll penalty or threshold shift on
      the hostile read and increase how many read-dependent riders can be
      denied. Higher tiers may additionally broaden target scope or continued
      exchange coverage, but the base rank scaling is already numerically
      explicit in the effect text.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique is a narrow reactive
      answer, but it does more than merely stay calm: it makes the hostile read
      harder right now and can cancel one dependent rider if the read still
      lands. The cost reflects real visible strain under scrutiny without
      turning the Technique into a full social shield.
