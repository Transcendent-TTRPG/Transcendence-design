        exercises, and equipment that can safely restrain without damaging the
        target by default.
      final_validation: one_successful_supervised_interruption_that_applies_atrapado_without_dealing_damage
    target: moving_enemy
    range: tail_flexible_hook_or_shield_catch_reach
    area: single_enemy_using_the_covered_passage
    duration:
      model: until_condition_removed
      value: atrapado_removed
      sustain_rule: null
      end_rule: >
        Atrapado ends when the target breaks free, is released, or the
        restraining source no longer holds them. The Technique also ends if the
        user loses the required contact line, releases the source, or the
        restraining surface can no longer reach the target.
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other: []
    saving_roll:
      model: alteration_resistance
      effect_on_success: >
        Atrapado is not applied. The target may complete the movement if it
        still has a legal route, but does not gain a clean flank, rear-position,
        or passage advantage from the triggering movement against the user
        unless another rule explicitly grants it.
    description: >
      The enemy thinks the side is open. The user's tail or restraining surface
      closes across the passage and returns the body to the channel. This is a
      heavy catch at the moment movement becomes exposed, not a strike for
      damage.
    effect: >
      When the trigger occurs, make a reactive Interruption check using the
      relevant competency or natural-weapon competency. If the check fails, the
      enemy completes the movement or movement-linked action normally. If the
      check succeeds, the target immediately makes an Alteration Resistance
      Roll against Atrapado. Use the default Ailment severity bands by rank:
      ranks 1-2 are Minor, ranks 3-4 are Moderate, and ranks 5-6 are Severe.
      On a failed R.R., the target gains Atrapado at that severity, and the
      movement or movement-linked action that triggered the Technique stops at
      the point where the restraint catches them. Atrapado then follows its
      normal recovery rules, but if the restraining source no longer
      physically holds, the condition ends.
    scaling: >
      Higher competency increases Atrapado severity in two-rank bands. Higher
      tiers may improve trigger breadth, contact reliability, recovery denial,
      or multi-target handling, but this novice form affects one target only.
    cost_note: >
      Rhythm 4 / Attrition 1 is intentional. The Technique is reactive and can
      stop movement, but it requires a real movement trigger, a credible
      restraining surface, and an Alteration Resistance Roll. It costs less
      than a committed disabling attack because it does not deal damage by
      itself and only fires when the enemy exposes their route.
    restrictions:
      - requires_a_real_movement_flank_escape_circling_passage_or_movement_linked_action_to_interrupt
      - requires_a_credible_restraining_or_redirecting_surface
      - ordinary_swords_maces_daggers_simple_spears_axes_armor_and_bites_do_not_qualify_without_hook_catch_or_bind_permission
      - thrown_weapons_qualify_only_when_the_thrown_object_can_restrain_catch_or_bind_movement
      - thrown_knives_darts_stones_and_simple_projectiles_do_not_qualify
      - shield_use_requires_explicit_hook_pin_catch_or_trap_permission
      - a_plain_blocking_shield_does_not_qualify_by_itself
      - cannot_be_used_if_the_tail_weapon_shield_hook_or_restraining_surface_is_already_occupied_restrained_pinned_or_unable_to_reach_the_target
      - does_not_affect_teleportation_incorporeal_movement_flight_above_the_surface_or_movement_that_never_crosses_the_covered_passage
      - affects_one_target_only
      - does_not_deal_damage_apply_derribado_disarm_or_force_displacement_by_itself
      - cannot_create_atrapado_without_a_physical_or_structural_source_that_continues_to_restrain_the_target
      - does_not_stack_multiple_copies_of_atrapado
    tags:
      - defense
      - control
      - interruption
      - movement_denial
      - restraint
  - name: Clavar el Paso
