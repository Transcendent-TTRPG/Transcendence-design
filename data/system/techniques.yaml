        about to move.
      final_validation: one_successful_practice_scene_under_pressure
    target: creature
    range: sensory_reach
    area: single_creature_or_trace
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: opposed_specialization
      competency: Sigilo
      trigger: target_is_actively_suppressing_physical_signal
      effect_on_success: >
        If the target makes a successful Sigilo specialization check, the read
        does not confirm. The user's Rhythm and Attrition are still spent.
    description: >
      The user reads heat, breath, scent, vibration, posture, and pressure as a
      single living signal, extracting one immediate truth about what the
      creature is doing or about to do.
    effect: >
      Make a Perception-based Technique check against one living creature or one
      immediate living trace within sensory reach. On success, the Narrator
      provides one immediate truth about what the creature is doing or about to
      do — such as whether the target is moving toward, away from, or around a
      protected point; whether the target is wounded, exhausted, poisoned, or
      physically impaired; whether the target is preparing immediate movement,
      attack, withdrawal, or concealment; or which of several fresh exits or
      hiding places the living signal most likely continued through. These are
      examples of the kind of truth this Technique produces, not a closed list:
      the Narrator chooses whichever truth is most immediately relevant and may
      provide other truths of the same quality and immediacy that the signs
      support. The read is concrete and immediate, but not exhaustive: it does
      not identify exact statistics, reveal full intention, diagnose precise
      conditions, or track a target beyond the signs currently present.
    scaling: >
      Higher Perception rank may improve reliability, allow fainter signs to
      qualify, or let the user choose from subtler read options at higher tiers,
      but Novice use should reveal only one immediate truth and should never
      become automatic target detection, full condition diagnosis, or long-range
      tracking without evidence.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique takes a quick but
      focused read under pressure and produces information immediately. These
      costs apply only during ATB or another active-threat scene; in normal
      exploration, where Rhythm and Attrition are not active costs, the
      Technique resolves as the user's Perception action. It does not add a
      bonus to another roll by itself, and it does not sustain a tracking state.
    restrictions:
      - requires_a_living_creature_or_immediate_living_trace_within_sensory_reach
      - cannot_be_used_without_physical_signs_to_read
      - reveals_one_immediate_truth_only
      - does_not_reveal_exact_statistics_full_intent_or_precise_condition_names
      - does_not_create_a_bonus_to_another_roll_by_itself
      - does_not_create_persistent_tracking_or_detection
      - does_not_bypass_active_masking_without_contextual_opposition
    tags:
      - utility
      - counter_read
      - survival_window
  - name: Pesar el Umbral
    name_en: Weigh the Threshold
    status: authored_example
    purpose: >
