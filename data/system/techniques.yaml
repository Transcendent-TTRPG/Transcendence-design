      source: Zarnag
      seed: The Scavenger Follows The Weak Line
      focus: False Hand / Hidden Follow Line
      holder: Zarnag false-hand fighters, low-line cutters, and side-switch close workers
      transmission: false_hand_drills_low_line_feints_and_side_switch_close_work
      availability: Common
      adaptation_notes: >
        The Technique comes from Zarnag who learn to show one threat so the
        enemy answers it while the real follow line stays hidden. Non-Zarnag
        can adapt it through claws, daggers, hooked hand tools, or other
        deceptive close surfaces that can credibly support a second angle.
    category: attack
    type: active
    trigger: >
      The user can present one obvious close line strongly enough that the
      target answers it, while still holding a second plausible line of
      contact in reserve.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Unpredictability
      support_specializations: []
      equipment:
        - any_weapon_natural_attack_or_item_with_unpredictability_access
