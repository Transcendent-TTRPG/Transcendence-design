  use_rule: >
    The catalog is a constraint, not a free-bonus generator: pick the
    specialization, pick the extracted capability, build the Technique from
    that capability, and preserve the capability's trained domain boundary. If
    a proposed Technique cannot point to a listed capability, or to a clearly
    adjacent capability that should be added here first, the Technique should
    not be authored yet.

condition_application_rule:
  principle: >
    When a Technique affects a creature with an ongoing harmful state, always
    validate existing Ailments and named system states first.
  always_check:
    - data/system/ailments.yaml
    - docs/system/ailments.md
    - Transcendence-publications/canon/glossary.md
  use_existing_when_possible:
    - ailments
    - wound_states
    - fatigue
    - cover_visibility_concealment_states
    - other_named_mechanics
  if_missing_state:
    - define_the_missing_state_in_the_relevant_system_layer_first
    - prefer_a_neutral_system_name_not_a_species_flavored_name
    - register_it_in_yaml_docs_and_glossary_before_treating_it_as_a_technique_effect
  prohibition: >
    Do not leave creature-affecting effects as vague pressure, impairment, or
    narrative penalty when an existing named mechanic should carry the load.

system_validation_rule:
  principle: >
    Techniques must interact with existing system mechanics rather than
    collapsing into generic move_attack_dodge_intercept language.
  always_check:
    - Transcendence-publications/canon/glossary.md
    - docs/system/mechanics-overview.md
    - docs/system/technique-interaction-framework.md
  authoring_test:
    - Which named system surfaces does this Technique touch?
    - Which existing roll action state cost or condition vocabulary does it use?
    - If it sounds like a generic action, what specific system layer makes it distinct here?

access_model:
  access_is_separate_from_scaling: true
  note: >
    Technique access should usually depend on origin plus minimum competency
    rank and, when needed, profile, specialization, equipment, or state
    conditions. Competency growth improves execution; access controls what kind
    of trained expression is available.
  common_access_factors:
    - origin
    - minimum_rank
    - weapon_profile
    - support_specialization
    - equipment_requirement
    - state_requirement

technique_tiers:
  - tier: 1
    name: novice_access
    minimum_rank: Novice
    identity:
      - one_clear_fantasy
      - one_primary_interaction_surface
      - simple_execution
      - strong_constraints_or_narrow_window
    typical_qualities:
      - active_use
      - short_duration
      - low_systemic_complexity
      - little_or_no_scene_warping_control
  - tier: 2
    name: adept_access
    minimum_rank: Adept
    identity:
      - one_primary_interaction_surface
      - one_meaningful_secondary_surface
      - cleaner_reliability_or_broader_window_than_tier_1
    typical_qualities:
      - stronger_timing_access
      - better_setup_conversion
      - moderate_control_disruption_or_conditional_defense
  - tier: 3
    name: expert_access
    minimum_rank: Expert
    identity:
      - multiple_coherent_system_surfaces
      - stronger_reaction_persistence_or_zone_pressure
      - higher_permission_to_alter_tempo_position_or_behavior
    typical_qualities:
      - serious_scene_leverage
      - better_setup_to_consequence_conversion
      - hybrid_requirements_more_common
  - tier: 4
    name: master_plus_access
    minimum_rank: Master
    identity:
      - rare_high_impact_expression
      - major_scene_or_encounter_influence
      - strong_persistence_layered_timing_or_structural_control
    typical_qualities:
      - should_be_few
      - should_be_costly_or_restricted
      - should_gain_permission_not_just_output

qa_budget:
  purpose: >
    First-pass balance control for Technique authoring. This does not prove
    perfect balance, but it identifies Techniques whose pressure exceeds their
    intended tier.
  major_pressure_sources:
    - strong_reactive_access
    - position_or_lane_control
    - zone_influence
    - persistent_condition_pressure
    - rhythm_manipulation
    - attrition_manipulation
    - threshold_manipulation_on_follow_up
    - reliable_mitigation_or_stability
    - multiple_major_surfaces_without_real_tradeoff
  minor_pressure_sources:
    - narrow_flat_bonus
    - one_bounded_reroll_clause
    - small_setup_clause
    - short_lived_support_rider
    - tightly_restricted_secondary_interaction
  compensation_factors:
    - higher_minimum_rank
    - stronger_equipment_restriction
    - narrow_trigger_window
    - visible_setup_requirement
    - meaningful_counterplay
    - saving_roll_or_mitigation_window
    - higher_rhythm_or_attrition_cost
    - once_per_window_or_once_per_scene_limit
  tier_expectations:
    tier_1:
      expected:
        - one_major_surface
        - at_most_one_minor_secondary_surface
      avoid:
        - strong_reactive_control_plus_persistence
        - multiple_major_surfaces
        - broad_scene_shaping
    tier_2:
      expected:
        - one_major_surface
        - one_secondary_surface
      may_have:
        - moderate_reactive_access
        - moderate_setup_conversion
    tier_3:
      may_have:
        - two_major_surfaces_if_coherent
        - stronger_timing_and_control_permission
        - hybrid_leverage
      must_pay_with:
        - access_difficulty
        - cost
        - restriction_load
    tier_4:
      may_have:
        - large_scene_pressure
        - layered_timing_logic
        - heavy_persistence_or_encounter_leverage
      expected:
        - rare
        - expensive
        - restricted
        - clearly_upper_tier
  review_states:
    - OK
    - Watch
    - Outlier

