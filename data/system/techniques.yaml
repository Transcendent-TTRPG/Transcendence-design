      support_specializations:
        - Tolerancia
      equipment: []
      states:
        - user_is_conscious
        - protected_function_is_still_physically_possible
        - burden_is_bodily_or_physiological_not_social_mental_or_purely_supernatural
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 6
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires repeated drills under controlled strain: carrying weight
          through pain, holding posture after cuts or bruising, maintaining
          grip while exhausted, or preserving one necessary function while the
          rest of the body degrades.
      guided_training:
        allowed: true
        study_hours: 3
        practice_hours: 5
        mentor_required: true
        notes: >
          A Sauri ordeal master, field medic, poison warden, or endurance
          instructor can correct when the learner disperses effort across the
          whole body instead of preserving the one function that matters now.
      material_cost: null
      access_notes: >
        Restricted within Sauri ordeal, funerary, and preservation-guard
        traditions. Non-Sauri access requires training that explicitly teaches
        function triage under bodily pressure rather than simple pain
        tolerance.
      final_validation: one_successful_preserved_action_under_active_bodily_penalty
    target: self
    range: self
    area: self
    duration:
      model: until_trigger
      value: one_protected_resolution
      sustain_rule: null
      end_rule: when_the_protected_action_duty_or_exploration_beat_resolves
    cost:
      rhythm_cost: 0
      attrition_cost: 1
      other:
        - activation_is_part_of_the_protected_action_and_does_not_advance_the_atb_marker
        - additional_attrition_may_be_paid_before_resolution_on_a_strict_1_to_1_mitigation_basis
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The body wants to spill the action. The practitioner closes around it.
      Breath, weight, pain, pulse, and posture are put back into order long
      enough for one necessary thing to happen: the hand does not open, the
      body does not drop, the step completes, the witness is carried out, the
      strike is not lost to pain.
    effect: >
      Choose one existing bodily penalty source that is currently affecting the
      declared action, held duty, or short exploration beat. If the burden
      already has a named system definition, use that definition as the
      authority for what is being preserved: an Ailment uses its existing
      severity, wound pressure uses its already established execution burden,
      and Fatigue uses the concrete penalty currently defined in the scene.
      Guardar el Pulso does not invent a new burden and does not replace the
      source's normal application, duration, recovery, or removal rules. For
      this one resolution, pay the base Attrition 1. The user may then pay
      additional Attrition before resolution, up to a maximum additional
      amount equal to their Tolerancia competency rank. Each additional
      1 Attrition increases the preserved mitigation by 1 on a strict 1:1
      basis. Then choose one: reduce one stepped bodily penalty source by 1
      plus extra Attrition paid steps for this action or duty, to a minimum of
      none; if the source does not use severity steps, ignore up to 1 plus
      extra Attrition paid points of one concrete penalty from that source for
      this resolution; prevent one already declared physical action from being
      interrupted by that bodily burden, as long as the action remains
      physically possible; or maintain one held duty until the user's next
      activation or until the immediate exploration beat resolves, such as
      carrying a body, holding a gate, keeping a grip, remaining standing,
      staying braced, or continuing a short forced movement. After the
      preserved function resolves, all wounds, Fatigue, Ailments, penalties,
      and consequences continue normally.
    scaling: >
      Higher Tolerancia competency scales this Technique in two ways: it raises
      the maximum additional Attrition that may be paid on the 1:1 mitigation
      exchange, and it should usually expand permission rather than only raw
      quantity. Higher tiers may let the user preserve more demanding held
      duties, protect an adjacent ally's carried burden, or preserve a
      function through harsher interruption clauses.
    cost_note: >
      Rhythm 0 / Attrition 1 plus optional extra Attrition is deliberate. The
      Technique should not compete with the action it is preserving. The user
      is not spending time to answer an external threat; they are spending body
      to keep the action from spilling. The real price is extra strain, not
      ATB delay. Any additional mitigation is bought directly with more
      Attrition on a strict 1:1 basis, but only up to an additional amount
      equal to the user's Tolerancia competency rank.
    restrictions:
      - applies_only_to_bodily_or_physiological_pressure
      - examples_include_pain_wound_pressure_fatigue_poison_infection_lacerado_physical_ailments_or_similar_body_degradation
      - cannot_be_used_against_fear_command_social_pressure_deception_curse_logic_mental_control_loss_of_will_confusion_or_purely_emotional_collapse
      - if_the_burden_is_an_ailment_that_ailment_must_already_exist_in_the_system_or_be_defined_before_this_technique_can_reference_it
      - only_affects_one_penalty_source_per_use
      - additional_attrition_paid_for_mitigation_cannot_exceed_the_users_tolerancia_competency_rank
      - extra_attrition_paid_only_increases_mitigation_on_the_chosen_source_and_does_not_extend_duration_or_protect_multiple_functions
      - cannot_heal_stabilize_treat_cure_remove_wound_slots_reduce_fatigue_or_clear_an_ailment
      - cannot_allow_an_action_that_is_physically_impossible
      - cannot_override_atrapado_full_paralysis_total_immobilization_unconsciousness_or_another_state_that_removes_the_relevant_bodily_function_entirely
      - cannot_prevent_death_unconsciousness_or_collapse_if_another_rule_already_places_the_user_beyond_action
      - preserves_one_function_only
      - cannot_be_stacked_with_itself_on_the_same_action_or_burden
