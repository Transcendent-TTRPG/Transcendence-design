      and all allies within clear hearing range receive this information before
      the cycle fires. The user also gains a bonus equal to their Astronomía
      rank on all saving rolls produced by the measured cycle's effects during
      those N activations. On failure, no information is revealed and no bonus
      is granted. The information does not alter the cycle's activation and does
      not prevent its effect from occurring.
    scaling: >
      The number of steps ahead revealed equals the user's current Astronomía
      rank. At rank 1 (Novice), the Narrator declares the Rhythm cost of the
      next activation only. At rank 2, two activations ahead; at rank 3, three;
      and so on for the same targeted cycle.
    cost_note: >
      Rhythm 3 / Attrition 1 matches all Novice Naghii specialization
      information Techniques. The output is immediate and combat-decisive: the
      group knows exactly when the identified cycle will next fire, which
      changes every subsequent decision in that ATB window. These costs apply
      only during ATB or active-threat scenes.
    restrictions:
      - requires_at_least_one_ciclo_autonomo_visible_in_the_ATB
      - targets_one_ciclo_autonomo_only
      - difficulty_set_by_total_active_ciclos_autonomos_at_moment_of_roll
      - steps_revealed_equals_current_Astronomia_rank
      - does_not_alter_the_cycles_activation_or_delay_it
      - does_not_prevent_the_cycles_effect_from_occurring
      - does_not_grant_attack_or_defense_roll_bonuses
    tags:
      - utility
      - setup
      - pattern_exploitation
  - name: Leer el Propósito
    name_en: Read the Purpose
    status: authored_example
    purpose: >
      Add a novice Naghii-origin specialization Technique rooted in Architecture,
      applying the cognitive tool of structural grammar reading to living creatures:
      the user identifies one specific Punto Vital on a target creature by
      recognizing where its critical biological load concentrates — the same
      access-hierarchy and intended-use inference used on built space, applied to
      a living system. On success, the Narrator declares the location of one
      Punto Vital; the user gains a bonus to T.A and T.E against it. The technique
      does not reveal what the vital point controls, which cycles it governs, or
      which techniques it enables.
    origin:
      main: Architecture
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Structural Grammar Is Universal
      focus: Scholarly / Vital Structure Reading
      holder: Naghii outer archive structural readers
      transmission: outer_archive_vital_structure_reading_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii outer archive training, where the
        primary cognitive tool is reading any organized system for its
        structural logic — access hierarchy, load distribution, vital mass
        concentration. The same discipline applied to identifying which vault
        threshold bears the structural weight of an archive complex applies to
        identifying where a living creature concentrates its critical biology.
        Architectural reasoning is not limited to built space.
    category: utility
    type: active
    trigger: >
      A creature is present and visible in the scene with at least one Punto
      Vital not yet identified by the user.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - creature_visible_with_at_least_one_unidentified_punto_vital
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated practice translating architectural structural
          analysis — access hierarchy, load distribution, vital mass reading —
          from built space to living systems. The cognitive tool is the same;
          the medium changes.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 6
        mentor_required: true
        notes: >
          A Naghii outer archive structural reader or any architectural
          instructor who teaches design-intent reading can guide the learner
          to apply structural grammar to biological organization.
      material_cost: null
      access_notes: >
        Restricted to outer archive architectural training where structural
        grammar reading is taught as a discipline before deeper study is
        permitted.
      final_validation: one_successful_supervised_punto_vital_identification_in_ATB
    target: creature
    range: visual_range
    area: one_punto_vital
    duration:
      model: indefinite
      value: null
      sustain_rule: null
      end_rule: on_identified_punto_vital_destruction_or_relocation
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: difficulty_by_creature_category
      scale:
        - category: Común
          difficulty: Desafiante
        - category: Campeona
          difficulty: Rigurosa
        - category: Elite
          difficulty: Exigente
      note: >
        The difficulty is set by the creature's category. A common creature's
        structural organization is more legible than a champion's, and a
        champion's more legible than an elite's. Vital point count is
        approximately equal across all creature categories and is not the
        determining factor. On failure, no Punto Vital is identified.
    bonus:
      target: user_only
      trigger: T.A_and_T.E_against_identified_punto_vital
      value: +1_per_Architecture_rank
      window: indefinite_until_punto_vital_destroyed_or_relocated
      roll_types: T.A_and_T.E_only
      note: >
        The user gains a bonus equal to their current Architecture rank on all
        T.A and T.E rolls targeting the identified Punto Vital. The bonus
        applies to the user only — not shared with allies — and persists until
        the Punto Vital is destroyed or the creature relocates its vital points
        (a rare creature ability).
    description: >
      The architecture of a living body is no less readable than a vault. The
      user applies the same structural grammar — access hierarchy, load
      distribution, vital mass concentration — to the creature's organization,
      identifying where the critical biology is held. The location, not the
      function.
    effect: >
      Make an Architecture Specialization Roll targeting one visible creature.
      The difficulty is set by the creature's category: Común = Desafiante,
      Campeona = Rigurosa, Elite = Exigente. On success, the Narrator declares
      the location of one specific Punto Vital on the creature. The user gains
      a bonus equal to their current Architecture rank on all T.A and T.E rolls
      targeting that Punto Vital. On failure, no Punto Vital is identified and
      no bonus is granted. The technique does not reveal what the vital point
      controls, which cycles it governs, or which techniques it enables. The
      bonus applies to the user only and persists until the identified Punto
      Vital is destroyed or the creature relocates its vital points.
    scaling: >
      The bonus to T.A and T.E scales with the user's current Architecture
      rank: +1 at rank 1, +2 at rank 2, and so on. A single use always
      identifies one Punto Vital. Higher rank improves targeting precision,
      not breadth of information.
    cost_note: >
      Rhythm 3 / Attrition 1 matches all Novice Naghii specialization
      information Techniques. The output is immediate and persistent: one
      Narrator-declared vital location plus a targeting bonus that holds until
      the vital point is destroyed. These costs apply only during ATB or
      active-threat scenes; in normal exploration the Technique resolves as
      the user's Architecture action without Attrition.
    restrictions:
      - requires_creature_visible_with_at_least_one_unidentified_punto_vital
      - targets_one_creature_only
      - identifies_one_punto_vital_only
      - difficulty_set_by_creature_category_not_vital_point_count
      - does_not_reveal_what_the_vital_point_controls
      - does_not_reveal_linked_cycles_or_techniques
      - bonus_applies_to_user_only_not_shared_with_allies
      - bonus_applies_to_T.A_and_T.E_only
      - bonus_persists_until_punto_vital_destroyed_or_relocated
    tags:
      - utility
      - setup
      - targeting
      - structural_analysis
  - name: Cruzar la Punta
    name_en: Cross the Point
    status: authored_example
    purpose: >
      Add a novice Naghii defense Technique that expresses the species' trained
      threshold-crossing discipline — entering a committed attack rather than
      retreating from it, closing past the attacker's planned range and denying
      them the position they committed to. Distinct from Vaciar el Blanco (which
      moves away) and the weapon-attack set (which punish enemy entry instead
      of practicing it).
    origin:
      main: Evasion
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: Doctrine
      source: Naghii
      seed: Ritualized Access
      focus: Guard / Threshold Crossing
      holder: Naghii threshold-crossing guards
      transmission: archive_guard_threshold_crossing_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive-guard training where
        controlled threshold crossing — passing through a guarded line without
        hesitation at the exact right moment — is taught as a deliberate,
        disciplined act. The combat application transfers to any committed
        attack: the user crosses into it rather than away from it. Non-Naghii
        can learn analogous methods through any tradition that trains decisive
        closing into committed attacks.
    category: utility
    type: reactive
    trigger: >
      An enemy commits a single-target physical attack or physical Technique
      against the user with a discernible forward vector.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - user_must_have_evasion_defensive_competency
        - user_is_not_fully_restrained_or_immobilized
        - user_has_enough_space_to_close_toward_the_attacker
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of commitment reads — learning to identify
          the exact moment a forward attack is irreversible, then closing into
          it rather than retreating. The instinct to yield must be replaced
          with a trained decision to enter.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 8
        mentor_required: true
        notes: >
          A Naghii guard instructor can help the learner overcome the instinct
          to retreat and build the timing needed to close cleanly into the
          committed path without colliding with the weapon.
      material_cost: null
      access_notes: >
        Restricted to archive guard threshold-crossing training where the
        discipline of passing through dangerous lines is taught as a formal
        subject before full combat application.
      final_validation: one_successful_supervised_execution
    target: self
    range: self
    area: self
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other: []
    saving_roll:
      model: defense_roll_contextual
      effect_on_success: >
        The triggering attack must first be successfully defended with D.R.
        If the attacker anticipated the close — using a Technique that covers
        inside range, or a read that tracks the approach — they may contest
        the inside reposition with the relevant Technique or roll. On success,
        the closing movement does not deny the attack's angle beyond the
        successful defense itself.
    description: >
      The attacker commits forward. The expected answer is to yield. The
      Naghii enters instead — flowing into the committed path at the exact
      moment it cannot redirect. Inside now, the attacker's position is no
      longer what they planned.
    effect: >
      Make your D.R. against the triggering attack using Evasion.

      If that D.R. fails, the Technique fails and the attack resolves
      normally.

      If that D.R. succeeds, close up to 2 meters toward the attacker as the
      strike arrives — entering rather than yielding. The attack has already
      failed to land, but the user's new position is now inside the attacker's
      committed range and angle. The attacker is denied their preferred
      striking geometry and must re-establish it on later actions. Closing
      does not disarm or neutralize the attacker — a skilled opponent will
      adjust grip, use the butt end of a reach weapon, or reorient their
      body. The user does not attack as part of this Technique.
    scaling: >
      Higher Evasion competency improves the D.R. that gates the Technique and
      therefore the reliability of the inside close. Higher-tier versions may
      allow longer closes, harsher angle denial, or immediate counter
      opportunities.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique is a narrow reactive
      close — its value is denying the attacker their planned range and raising
      their threshold, not damage or conditions. Attrition reflects the genuine
      body effort of closing into a committed attack rather than away from it.
    restrictions:
      - functions_only_against_committed_single_target_physical_attacks_with_forward_vector
      - does_not_function_against_area_effects_or_attacks_that_track_user_movement
      - does_not_function_when_user_is_fully_restrained_or_immobilized
      - does_not_grant_an_attack_or_apply_a_condition
      - attacker_retains_all_other_action_options_from_the_new_close_range_position
      - closing_into_an_anticipated_attack_can_be_countered
    tags:
      - defense
      - mobility
      - counter_positioning
      - survival_window
  - name: Vaciar el Blanco
    name_en: Empty the Target
    status: authored_example
    purpose: >
      Add the second novice Naghii defense Technique, using Evasion to express
      the Naghii doctrine that absence is itself a form of control — not a
      reactive dodge of a specific strike but a proactive displacement that
      removes the body from readable position and opens a brief defensive window
      where the new position is not yet settled in the attacker's tracking.
    origin:
      main: Evasion
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: Doctrine
      source: Naghii
      seed: Absence As Evidence
      focus: Exploration / Countertracking
      holder: Naghii outer archive countertrackers
      transmission: outer_archive_countertracking_and_displacement_doctrine
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archival doctrine: the principle
        that what is not present cannot be struck, and that deliberate
        displacement is a form of denial, not retreat. Non-Naghii can learn
        the movement discipline through any tradition that teaches
        countertracking, position-reading, and deliberate self-removal from
        acquired target locks.
    category: defense
    type: reactive
    trigger: >
      An enemy commits a single-target physical attack or physical Technique
      against the user.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - user_must_have_evasion_defensive_competency
        - user_is_not_fully_restrained_or_immobilized
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling deliberate displacement against partners actively
          tracking — learning to move cleanly without providing a legible new
          target position during the transition.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 8
        mentor_required: true
        notes: >
          A Naghii doctrine instructor can help the learner understand when
          displacement reads as denial versus retreat — the tactical distinction
          is not obvious without careful instruction.
      material_cost: null
      access_notes: >
        Restricted to outer archive countertracking doctrine where displacement
        theory is taught as a formal subject before full tactical practice.
      final_validation: one_successful_practice_scene_under_pressure
    target: self
    range: self
    area: self
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        Ends the first time the user makes a T.A., T.C., T.R., or T.E. against
        the triggering enemy after this Technique resolves.
    cost:
      rhythm_cost: 3
      attrition_cost: 2
      other: []
    saving_roll:
      model: defense_roll
      effect_on_success: >
        The triggering attack must first be successfully defended with D.R.
    description: >
      The body leaves the readable position before the attacker settles their
      read. No block. No contest. The target has moved — and the attacker's
      acquired lock is momentarily void. That moment is the window to answer.
    effect: >
      Make your D.R. against the triggering attack using Evasion.

      If that D.R. fails, the Technique fails and the attack resolves
      normally.

      If that D.R. succeeds, the next time the user makes a T.A., T.C., T.R.,
      or T.E. against the triggering enemy after this Technique resolves, the
      user gains a bonus to that roll equal to their Evasion competency rank:
      +1 at Novice, +2 at Adept, +3 at Expert, +4 at Master, +5 at
      Consummate, +6 at Transcendent. Once that roll resolves, the window
      closes regardless of outcome. The bonus applies against the triggering
      enemy only.
    scaling: >
      The offensive/resistance bonus scales directly with Evasion rank, and
      higher Evasion also improves the D.R. that gates the Technique in the
      first place. Deeper investment produces a more reliable reposition and a
      stronger unsettled-tracking window.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique is a quick bounded
      repositioning — shorter range than a full movement action — with a
      single defensive window that closes when the user must answer hostile
      pressure with a D.R., C.R., or R.R. Attrition reflects that deliberate
      full-body displacement under pressure is a real physical effort, not a
      passive stance shift.
    restrictions:
      - user_must_have_enough_space_to_move_2_meters_in_the_chosen_direction
      - does_not_function_when_user_is_fully_restrained_or_immobilized
      - bonus_applies_to_the_first_dr_cr_or_rr_made_in_response_to_a_hostile_action_then_closes
      - does_not_grant_an_attack_or_produce_damage
    tags:
      - defense
      - counter_positioning
      - reposition
      - offensive_window
  - name: Templar el Veneno
    name_en: Temper the Venom
    status: authored_example
    purpose: >
      Add a novice Kha-Naghii resistance hybrid Technique rooted in Tolerancia
      and Poison Resistance, expressing the species' biological venom conditioning
      as a passive floor modifier that automatically reduces the settled severity
      of any Veneno family ailment by one step — distinct from the standard
      Alteration R.R. because it fires after the roll resolves and requires no
      action, decision, or ATB cost.
    origin:
      main: Tolerancia
      secondary:
        - Poison_Resistance
    world_origin:
      primary_front: Species
      secondary_front: Doctrine
      source: Naghii
      seed: Venom As Commitment
      focus: Venom / Conditioning
      holder: Naghii Kha venom cadres
      transmission: kha_venom_conditioning_and_endurance_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Kha-Naghii biological conditioning: the
        body has carried its own venom since before conscious memory, and
        formal training teaches the practitioner to metabolize external venom
        through the same disciplined endurance used in initiation and field
        exposure. Outsiders can learn an analogue if they have earned Poison
        Resistance through documented systematic conditioning — long-term
        antidote work, initiated venom-handling traditions, or significant
        recorded field exposure — combined with Tolerancia training at Novice
        or higher. The biology does not need to be Kha-Naghii; what matters
        is that both the resistance and the endurance discipline are real and
        earned, not improvised.
    category: utility
    type: passive
    trigger: null
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Tolerancia
      equipment: []
      states:
        - poison_resistance_at_novice_rank_or_higher
        - tolerancia_specialization_at_novice_rank_or_higher
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: false
        notes: >
          Cannot be self-studied: the metabolic conditioning requires guided
          exposure under controlled and progressively increased venom contact.
          Solo exposure without instruction produces unpredictable tolerance,
          not the systematic Technique.
      guided_training:
        allowed: true
        study_hours: 0
        practice_hours: 40
        mentor_required: true
        notes: >
          Requires a Kha-Naghii conditioning instructor or an equivalent venom
          handler with formal training to administer progressively increasing
          venom exposures while the learner trains Tolerancia discipline in
          parallel. The practice hours are distributed across many sessions
          over time — this is not a single training block.
      material_cost: null
      access_notes: >
        Restricted to Kha-Naghii initiation tracks and formally supervised
        venom conditioning programs. Not available through archive libraries
        or standard martial teaching.
      final_validation: documented_stable_poison_tolerance_at_novice_rank_with_tolerancia_at_novice_rank
    target: self
    range: self
    area: self
    duration:
      model: permanent
      value: null
      sustain_rule: null
      end_rule: >
        Always active while the character retains both Poison Resistance at
        Novice or higher and Tolerancia at Novice or higher. If either drops
        below Novice through injury, extended isolation, or narrative loss,
        the passive no longer applies until both are restored.
    cost:
      rhythm_cost: 0
      attrition_cost: 0
      other:
        - no_atb_cost_the_body_responds_without_a_declared_action
        - access_cost_paid_through_conditioning_and_learning_requirements
    saving_roll:
      model: tolerancia_vs_venom_severity
      note: >
        The user makes a T.E. (Tolerancia) roll when a Veneno family ailment
        settles. Difficulty is set by the venom's severity. On success, reduce
        settled severity by one step. On failure, severity settles normally.
        No declared action and no Rhythm or Attrition cost.
    description: >
      The body does not fight what it already carries. A Kha-Naghii who has
      trained under their own venom — and trained the discipline to hold
      adverse physical states without losing function — reaches a point where
      external venom finds familiar terms. The metabolic adjustment is not a
      decision. It is the body's response to a known adversary.
    effect: >
      When a Veneno family ailment settles on the user, make a T.E. (Tolerancia)
      roll. The difficulty is set by the severity of the venom. On success,
      reduce the final settled severity by one step: Severe becomes Moderate,
      Moderate becomes Minor, Minor does not settle. On failure, the severity
      settles normally. The roll requires no declared action and no Rhythm or
      Attrition cost. Applies to Veneno family ailments only.
      unless the Narrator determines that the biological familiarity
      credibly extends to the specific source.
    scaling: >
      Higher Tolerancia rank may allow the passive to reduce severity by one
      additional step at higher tiers, or extend its coverage to adjacent
      Veneno-adjacent states at the Narrator's discretion. Novice use reduces
      by one step only.
    cost_note: >
      Rhythm 0 / Attrition 0 is deliberate and correct for a passive Technique.
      The cost of this Technique was paid during conditioning and learning, not
      in the ATB. This should not be mistaken for a "free active benefit" —
      it is a permanent passive floor that the character earned through a
      restricted, mentor-gated acquisition process that cannot be shortcut.
    restrictions:
      - applies_to_veneno_family_ailments_only
      - requires_poison_resistance_at_novice_rank_or_higher
      - requires_tolerancia_at_novice_rank_or_higher
      - does_not_negate_veneno_ailments_completely_by_itself
      - does_not_apply_to_alteration_affliction_or_other_family_effects_from_venom_sources
      - does_not_stack_with_other_automatic_severity_reduction_passives_of_the_same_type
      - outsiders_require_documented_systematic_conditioning_not_improvised_exposure
    tags:
      - utility
      - mitigation
      - condition_reduction
      - stability
  - name: Sostener el Canal
    name_en: Hold the Channel
    status: authored_example
    purpose: >
      Add a novice Naghii resistance hybrid Technique rooted in Meditación and
      Contención, expressing the igi-an practitioner's learned capacity to manage
      the open Abzu channel through disciplined recovery — not closing it but
      holding it stable, so that meditation directed at an active Abzu-origin or
      mental Affliction produces a better outcome than raw Meditación alone.
    origin:
      main: Meditación
      secondary:
        - Contención
        - Mental_Resistance_Abzu
    world_origin:
      primary_front: Species
      secondary_front: Doctrine
      source: Naghii
      seed: Holding Dangerous Knowledge
      focus: Custodial / Containment
      holder: Naghii igi-an containment wardens
      transmission: igi_an_channel_management_and_containment_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in the deepest layer of Naghii igi-an training,
        where the practitioner learns that the Abzu channel cannot and should not
        be closed — closing it destroys the capacity for celestial reading. What
        can be learned is management: holding the threshold, acknowledging what
        enters without being absorbed by it, and finding the return path through
        Contención discipline. Outsiders can learn an analogue if they have
        documented susceptibility to mental or Abzu-origin influence through
        practice or exposure, meaningful Affliction Resistance, and both
        Meditación and Contención at Novice rank or higher.
    category: utility
    type: passive
    trigger: >
      The user performs a meditation action specifically directed at reducing
      the intensity of an active Abzu-origin or mental Affliction.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Meditación
        - Contención
      equipment: []
      states:
        - meditacion_at_novice_rank_or_higher
        - contencion_at_novice_rank_or_higher
        - affliction_resistance_at_novice_rank_or_higher
        - active_abzu_origin_or_mental_affliction_present
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 12
        practice_hours: 0
        text_or_manual_required: true
        notes: >
          Requires access to igi-an practice records and significant personal
          experience with Abzu-origin influence — cannot be theorized from
          the outside. The learner must already have sustained mental or
          Abzu-origin states and recovered from them enough times to
          recognize the channel's behavior from the inside.
      guided_training:
        allowed: true
        study_hours: 6
        practice_hours: 0
        mentor_required: true
        notes: >
          A senior Naghii igi-an practitioner or inner-archive priest can
          teach the learner to distinguish between absorption and holding —
          the critical distinction that makes this Technique possible rather
          than simply deepening the Affliction.
      material_cost: null
      access_notes: >
        Restricted to inner archive priestly training where igi-an channel
        management is a formal subject. Diaspora Naghii who developed the
        susceptibility without the doctrine may need to find a practitioner
        willing to teach it outside formal initiation.
      final_validation: one_successful_supervised_affliction_recovery_session
    target: self
    range: self
    area: self
    duration:
      model: permanent
      value: null
      sustain_rule: null
      end_rule: >
        Always active while the character retains Meditación, Contención, and
        Affliction Resistance each at Novice or higher.
    cost:
      rhythm_cost: 0
      attrition_cost: 0
      other:
        - no_additional_cost_beyond_the_meditation_action_itself
        - the_meditation_action_has_its_own_time_and_focus_cost
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The igi-an practice was never about closing the channel. Closing it would
      mean losing the capacity to read the sky, sense the Abzu's movements, hear
      what the records mean in the present. What the deepest practitioners learn
      is not closure — it is management. The channel is held at the threshold.
      What enters can be acknowledged without being absorbed. And when it has
      absorbed too much, Contención gives it a route out — not through force,
      but through the practiced discipline of knowing where the boundary is and
      returning to it.
    effect: >
      When the user meditates specifically to reduce the intensity of an active
      Abzu-origin or mental Affliction, add a bonus to the Meditación roll equal
      to the user's Contención competency rank bonus: +1 at Novice, +2 at
      Adept, +3 at Expert, +4 at Master, +5 at Consummate, +6 at Transcendent.
      This bonus applies only when the meditation is directed at an Abzu-origin
      or mental Affliction — general meditation or meditation aimed at other
      purposes does not benefit. The technique does not change what the
      meditation action costs in time or focus; it improves the quality of the
      recovery that action produces.
    scaling: >
      The bonus scales directly with Contención rank — deeper investment in the
      discipline of holding the channel produces a stronger recovery capacity.
      Higher tiers may broaden the Affliction types that qualify or reduce the
      minimum meditation time required, but Novice use applies only to
      Abzu-origin or mental Afflictions and only during a dedicated meditation
      action.
    cost_note: >
      No additional cost beyond the meditation action itself. Like Templar el
      Veneno, the cost of this Technique was paid in training: it is
      mentor-gated at its deepest layer, requires documented susceptibility and
      recovery experience, and demands concurrent development of both Meditación
      and Contención. The meditation session that activates the bonus has its
      own cost in time and focus — this Technique does not add to it.
    restrictions:
      - applies_only_to_meditation_directed_at_abzu_origin_or_mental_afflictions
      - requires_meditacion_contencion_and_affliction_resistance_each_at_novice_or_higher
      - does_not_apply_to_physical_alteration_or_veneno_family_afflictions
      - does_not_change_what_the_meditation_action_costs
      - does_not_reduce_affliction_intensity_outside_a_dedicated_meditation_action
      - general_meditation_does_not_receive_the_bonus
    tags:
      - utility
      - recovery
      - condition_reduction
      - stability
  - name: Fijar el Umbral
    name_en: Fix the Threshold
    status: authored_example
    purpose: >
      Add a novice Naghii Agarre specialization Technique that expresses the
      species' contact dominance discipline — catching an enemy exit at close
      range before the movement resolves, applying Atrapado through the
      alteration system rather than merely producing narrative control. Distinct
      from Trabar el Gesto (which stops an attack on the enemy's turn) and from
      raw Agarre use (which produces narrative hold without a defined mechanical
      condition). The defining property is that the hold fires even against
      movement that explicitly does not provoke reactions.
    origin:
      main: Agarre
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Archive Arrest
      focus: Guard / Access Point Holding
      holder: Naghii access-point temple guards
      transmission: temple_guard_hold_and_access_point_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive guard training where
        controlling the exit of a target at a threshold — a doorway, a
        corridor crossing, a ritual boundary — is a formal discipline. The
        guard holds the point of consequence rather than pursuing; the hold
        is applied at the moment of attempted departure before the exit is
        complete. Non-Naghii can learn analogous methods through any tradition
        that specifically drills hold application at close-range exit moments
        rather than mid-engagement restraint.
    category: utility
    type: reactive
    trigger: >
      An enemy at close range attempts to move away, disengage, withdraw, or
      pass through the user's position — fires even when the movement explicitly
      declares it does not provoke reactions.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Agarre
      equipment: []
      states:
        - user_is_at_close_range_with_the_target
        - user_has_a_free_gripping_limb_tail_or_coiled_body_segment
        - user_is_not_fully_restrained_or_immobilized
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling the recognition of exit-moment timing — learning
          to distinguish the instant before a target's weight shifts toward
          departure from the moment after the movement is already in progress.
          The hold must be placed before the exit resolves, not as a pursuit
          after.
      guided_training:
        allowed: true
        study_hours: 6
        practice_hours: 6
        mentor_required: true
        notes: >
          A Naghii archive guard instructor can calibrate the learner's
          sense of exit-moment timing so the grip reaches the target's body
          before the departure window closes, even on movement that does not
          create an obvious reaction opening.
      material_cost: null
      access_notes: >
        Restricted to archive guard threshold-control training where holding
        exits rather than chasing them is taught as a formal discipline.
      final_validation: one_successful_supervised_execution
    target: enemy
    range: close
    area: single
    duration:
      model: condition_duration
      value: null
      sustain_rule: null
      end_rule: >
        Atrapado then follows its normal recovery rules. If the holding body
        contact is broken or the grip is released, the condition ends.
    cost:
      rhythm_cost: 5
      attrition_cost: 1
      other: []
    saving_roll:
      model: rr_reduces
      effect_on_success: >
        If the target succeeds on its Alteration Resistance Roll, Atrapado is
        not applied and the movement proceeds normally.
    description: >
      The target shifts weight to leave. The Naghii has already decided they
      are not going. The grip closes at the point of departure — before the
      exit is complete, before the safe window opens — and holds. The motion
      stops where the hold lands.
    effect: >
      Make an Agarre check against the triggering enemy. On success, the
      target must make an Alteration Resistance Roll against Atrapado. Use the
      default Ailment severity bands by rank: ranks 1-2 are Minor, ranks 3-4
      are Moderate, and ranks 5-6 are Severe. On a failed R.R., the target
      gains Atrapado at that severity. On a successful R.R., the movement
      proceeds normally and Atrapado is not applied. This Technique may be
      declared against movement that explicitly states it does not provoke
      reactions — the grip is placed at the departure threshold before the
      safe-exit window would open.
    scaling: >
      Higher Agarre competency increases Atrapado severity in two-rank bands.
      Higher tiers may improve reliability, allow the hold to be applied from a
      slightly greater reach, reduce Attrition cost under sustained engagement
      pressure, or broaden the trigger to include non-movement exits.
    cost_note: >
      Rhythm 5 / Attrition 1 is deliberate. The condition remains narrower
      than Trabar el Gesto, but the Technique's defining permission is that it
      fires even against movement that would normally deny reactions. That
      override is large enough to place it at the standard anchor despite the
      recoverable outcome.
    restrictions:
      - user_must_be_at_close_range_when_trigger_occurs
      - user_must_have_a_free_gripping_limb_tail_or_coiled_body_segment
      - applies_to_one_target_only
      - does_not_deal_damage
      - does_not_prevent_the_target_from_using_non_movement_actions_while_atrapado
      - does_not_function_when_user_is_fully_restrained_or_immobilized
      - does_not_function_against_targets_with_no_grippable_anatomy
    tags:
      - utility
      - control
      - hold
      - pressure
  - name: Sentar el Tercer Punto
    name_en: Set the Third Point
    status: authored_example
    purpose: >
      Add a novice Naghii Equilibrio specialization Technique that expresses the
      species' tail-assisted balance discipline on unstable terrain — placing a
      third contact point to move cleanly through collapsed ruins, angled steps,
      or damaged surfaces that would penalize or stop anyone relying on two
      points alone. Distinct from Acrobacias expressions (dynamic traversal and
      repositioning under threat) and from raw Equilibrio use (narrative
      stability without a defined mechanical benefit). The defining property is
      that the technique converts 2 spaces of difficult terrain into free
      movement, gated by an Equilibrio check.
    origin:
      main: Equilibrio
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Ziggurat Body Logic
      focus: Exploration / Surveying
      holder: Naghii archive surveyors
      transmission: archive_survey_and_ruin_reading_field_training
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive survey training where
        reading and moving through partially collapsed ziggurats, flooded
        antechambers, and rubble-covered record vaults is a routine field
        requirement. The Naghii practitioner learns to use the tail as a
        third contact point — extending it to a low wall, a broken block,
        or a door frame while the upper body and legs cross the unstable
        surface. Non-Naghii can learn an equivalent through any tradition
        that trains third-contact navigation on bad terrain: using a weapon
        or staff as a low brace, a deliberate hand placement on a surface
        while moving, or an equivalent trained reflex that achieves the same
        weight redistribution across three points.
    category: utility
    type: reactive
    trigger: >
      The user attempts to move through terrain that would impose a speed
      penalty, difficulty increase, or mandatory Balance check due to
      unstable, angled, collapsed, or damaged footing.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Equilibrio
      equipment: []
      states:
        - user_can_reach_at_least_one_stable_anchor_point_within_the_movement_path
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 12
        text_or_manual_required: false
        notes: >
          Possible but slow. The instinct under sudden footing loss is to
          retract or plant both feet rather than extend a third contact point
          outward. Self-study on graduated terrain can build the reflex, but
          most learners underestimate how far in advance the anchor must be
          identified — it cannot be found after the slip has begun.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 10
        mentor_required: true
        notes: >
          A trainer who can interrupt the retraction instinct on real terrain
          significantly accelerates progress. For Naghii, this is typically
          an archive field trainer on graduated ruin terrain. For non-Naghii,
          any balance instructor with a third-contact method can teach the
          underlying reflex through a different anatomical or equipment
          expression.
      material_cost: null
      access_notes: >
        Standard in Naghii archive survey training wherever ruin fieldwork
        is expected. Non-Naghii can access equivalent instruction through any
        martial or survival tradition that explicitly trains third-contact
        balance navigation on bad terrain.
      final_validation: clean_passage_through_certified_unstable_terrain_course
    target: self
    range: self
    area: self
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other: []
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      The floor shifts. Everyone else slows or stops to reassess. The
      practitioner finds the third point — tail against a broken block,
      weapon butt on the lower step, a hand to the wall — and moves through
      the broken surface as if it were level. The instability never reaches
      the upper body. Two steps cross terrain that should have cost three.
    effect: >
      Make an Equilibrio check. On success, identify and use a stable anchor
      point along the movement path — extending the tail, bracing a weapon,
      placing a hand, or using whatever contact surface is available — and
      move up to 2 spaces through the triggering terrain as if on stable
      ground. Terrain speed penalties, difficulty increases, and mandatory
      Balance checks do not apply to those 2 spaces. On failure, terrain
      effects apply normally.
    scaling: >
      Higher Equilibrio competency may improve reliability on more extreme
      terrain or reduce Attrition under sustained unstable engagement. Higher
      tiers may increase the number of free spaces, extend the technique to
      cover non-movement actions performed on difficult terrain, or allow
      the benefit to apply to an adjacent ally in the same movement path.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique grants 2 spaces of
      free terrain movement — enough to cross meaningful obstacles and engage
      or reposition from terrain that would penalize other combatants. The
      Equilibrio check is its own gate (a failed check provides no benefit),
      and the effect is purely positional with no condition output. One extra
      rhythm over a simple one-action negation reflects that movement through
      terrain applies over 2 spaces rather than a single action moment.
    restrictions:
      - requires_at_least_one_reachable_stable_anchor_point_along_the_movement_path
      - grants_free_movement_for_2_spaces_only
      - does_not_negate_terrain_effects_beyond_the_2_free_spaces
      - does_not_function_against_non_terrain_instability_at_novice_tier
      - failed_equilibrio_check_provides_no_benefit
    tags:
      - defense
      - stability
      - mobility
      - terrain
  - name: Marcar la Grieta
    name_en: Mark the Crack
    status: authored_example
    purpose: >
      Add a novice Naghii Arqueología specialization Technique with a combat
      surface and an exploration surface — reading material wear, construction
      joints, and damage patterns on armor or structures to identify the point
      of maximum vulnerability. In combat: setup that reduces the difficulty of
      the user's next attack on the identified zone. In exploration: locates the
      most structurally weak point of an examined element. Distinct from raw
      Arqueología use (which produces narrative context without a defined
      mechanical benefit) and from Leer el Propósito (which reads built-space
      intention and circulation, not construction faults or material failure
      points).
    origin:
      main: Arqueología
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: The Archive Must Continue
      focus: Scholarly / Remnant Cataloguing
      holder: Naghii igi-an remnant cataloguers
      transmission: igi_an_ruin_field_reading_and_firstborn_remnant_cataloguing
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii ruin field training where reading
        structural failure patterns is a survival discipline: a practitioner
        who cannot identify which stone will give way or which vault section
        is about to collapse cannot safely work in active ruins. The combat
        application transfers the same discipline to fabricated armor and
        equipment — worn armor carries the same evidence of stress, repair,
        and previous impact as any other artifact. Non-Naghii can learn an
        equivalent through any tradition that trains systematic material
        failure reading: structural engineering fieldwork, armorers who
        learn to find construction faults, or siege engineers who read
        wall weakness before placement.
    category: utility
    type: active
    trigger: >
      The user observes an enemy at close range with the intent to read
      construction faults, wear patterns, or damage history on their armor or
      equipment — or exposed joints, previous injury patterns, or anatomical
      gaps on an unarmored or naturally protected target.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Arqueología
      equipment: []
      states:
        - close_range_with_line_of_sight_to_the_target
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 10
        text_or_manual_required: false
        notes: >
          Requires deliberate practice reading wear patterns and joint failures
          under time pressure. The skill is identifying which crack or wear mark
          represents a structural fault versus surface damage — an error of
          judgment sends an attack into well-reinforced material.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 8
        mentor_required: true
        notes: >
          A Naghii ruin field instructor, an experienced armorer, or a
          structural damage reader corrects the learner's judgment on which
          patterns indicate genuine fault lines versus surface deterioration.
          The distinction is not obvious from appearance alone.
      material_cost: null
      access_notes: >
        Standard in Naghii ruin field training. Non-Naghii can access
        equivalent instruction through any field discipline that teaches
        systematic reading of material failure indicators.
      final_validation: correct_identification_of_fault_line_in_novel_material_sample
    target: enemy
    range: close
    area: single
    duration:
      model: until_trigger
      value: null
      sustain_rule: null
      end_rule: >
        In combat: the identified fault mark expires when the user makes their
        next attack against the target's identified zone, or at the end of the
        scene. In exploration: the information is retained until circumstances
        change.
    cost:
      rhythm_cost: 4
      attrition_cost: 2
      other:
        - rhythm_and_attrition_apply_only_during_atb_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: none
      effect_on_success: null
    description: >
      Everything has a point where it gives. Armor: the dent never fully
      hammered out, the joint re-riveted too tight, the section where two
      plates meet at an angle the maker compromised on. Unarmored: the joint
      that absorbed a previous blow and never fully recovered, the gap between
      scale plates at maximum extension, the ridge of scar tissue that sits
      over bone rather than muscle. The practitioner reads which one of those
      is in range. Not where to hit. Where the material has already decided
      it will give.
    effect: >
      Make an Arqueología check. Difficulty is set by the Narrator based on the
      target's creature category or armor grade: Common/Grade 1 = Challenging;
      Champion/Grade 2 = Rigorous; Elite/Grade 3 = Exacting.
      On success, identify one zone of the target where material structure
      creates a fault — for armored targets: a construction gap, wear point, or
      repair compromise in fabricated protection; for unarmored or naturally
      protected targets: an exposed joint, a previous injury site, or an
      anatomical gap where protection is thinnest.
      The user's next attack against the identified zone adds [Arqueología
      rank]d2 to the Impact roll. These bonus dice are not the designated
      critical die and do not affect critical probability. The mark expires
      when the attack is made or at the end of the scene.
      On a failed check: no fault is identified.
    scaling: >
      Higher Arqueología competency may improve reliability against well-
      maintained or recently repaired armor, reduce difficulty on complex
      construction, or allow the technique to be used at short range rather
      than close range. Higher tiers may allow identifying multiple fault zones
      or extend the mark's duration beyond one attack.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The technique produces one die
      advancement on one follow-up attack — meaningful but bounded, and it
      costs the user an action plus the check before the benefit applies. The
      cost matches the established Naghii setup technique anchor and reflects
      that the combat benefit requires a setup action rather than producing
      immediate effect.
    restrictions:
      - requires_close_range_with_line_of_sight_to_the_target
      - mark_applies_to_one_zone_of_one_target_only
      - mark_expires_on_use_or_end_of_scene
      - does_not_function_against_targets_with_no_readable_material_structure_such_as_purely_fluid_or_incorporeal_forms
      - failed_check_yields_no_benefit
    tags:
      - utility
      - pattern_exploitation
      - setup
      - die_advancement
      - counter_read
  - name: Tomar la Corriente
    name_en: Take the Current
    status: authored_example
    purpose: >
      Add a novice Sauri Nadar specialization Technique that translates
      swimming discipline into a combat and exploration response against
      current-like physical displacement. The Technique is not water-locked and
      has no anatomical requirement: it uses Nadar's trained components —
      breath timing, yielding, propulsion, orientation, and recovery through
      resistance — to reduce forced movement, turn part of that movement into
      controlled repositioning, or avoid a secondary consequence caused by
      loss of orientation.
    origin:
      main: Nadar
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Sauri
      seed: Tail Keeps The Channel / Vessel Under Pressure
      focus: Traversal / Flood Recovery
      holder: Sauri river-crossing wardens and cistern recoverers
      transmission: riverbank_crossing_drills_flooded_corridor_training_and_temple_cistern_recovery_forms
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Sauri river and cistern training, where
        resisting a current directly is treated as a mistake. Outsiders can
        learn an equivalent through any tradition that trains body recovery
        against a resisting medium: flood rescue, naval boarding drills,
        quarry-slope recovery, crowd-pressure control, or other disciplines
        where the practitioner must yield without losing orientation.
    category: utility
    type: reactive
    trigger: >
      A physical force, moving surface, crowd, unstable terrain, current-like
      pressure, collision, shove, pull, slide, collapse, or other moving
      environment would displace the user, carry them, spin them off line, or
      make them lose functional orientation.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations:
        - Nadar
      equipment: []
      states:
        - user_has_enough_freedom_of_movement_to_yield_turn_brace_breathe_or_redirect_the_body
        - no_specific_anatomy_required
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 6
        practice_hours: 10
        text_or_manual_required: false
        notes: >
          Requires repeated drills in controlled displacement: moving water,
          mud, loose slope, impact carry, crowd pressure, or another physical
          force that can carry the learner off line. The learner must practice
          choosing the exit line instead of opposing the whole force.
      guided_training:
        allowed: true
        study_hours: 3
        practice_hours: 6
        mentor_required: true
        notes: >
          A Sauri river instructor, flood rescuer, naval trainer, or other
          movement specialist can correct when the learner resists too early,
          turns against the pressure, or loses breath timing during recovery.
      material_cost: null
      access_notes: >
        Restricted within Sauri riverbank, temple-cistern, and flooded corridor
        schools. Non-Sauri access requires training that treats displacement as
        a current-like force rather than a wall to overpower.
      final_validation: controlled_recovery_from_unexpected_current_like_displacement
    target: self
    range: self
    area: self
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: specialization_check
      effect_on_success: >
        On a successful Nadar Specialization Roll against the triggering force
        or environmental threshold, the user chooses one listed recovery
        option.
    description: >
      The user does not fight the current head-on. They enter it correctly.
      The same discipline used to stay alive in water — breath timing, yield,
      propulsion, orientation, and recovery through resistance — applies to
      any force that tries to carry the body somewhere it did not choose to go.
    effect: >
      Make a Nadar Specialization Roll against the triggering force,
      environmental threshold, or opposed movement effect. On success, choose
      one: reduce the forced movement affecting the user by 1 meter plus the
      user's Nadar rank bonus; convert up to 1 meter plus the user's Nadar rank
      bonus of the forced movement into controlled repositioning along a legal
      path touched by the triggering force; or avoid one secondary consequence
      caused only by losing orientation during that movement, such as falling
      prone, striking a minor obstacle, losing held direction, or being turned
      away from the intended exit line. The Technique does not erase the source
      of danger. If the force is too large to fully escape, the user still
      moves, but does so through a controlled line chosen from the available
      path rather than being carried blindly. In exploration, the same effect
      can define how the user exits a current-like hazard: where they surface,
      what edge they reach, which side of a collapsing passage they roll
      toward, or which safe point they catch after being carried by pressure.
    scaling: >
      Higher Nadar competency may increase the recovered distance, improve
      reliability against larger environmental forces, or allow the user to
      carry a light object through the same recovery line. Higher tiers may
      extend the protection to an adjacent ally, allow partial recovery while
      restrained, or convert a stronger forced movement into a chosen legal
      endpoint.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate. The Technique does not negate the
      triggering force outright, does not damage the source, and does not
      protect another creature. Its value is recovery and route choice. In
      exploration, it is simply the user's specialized response to a current-
      like hazard and should not add Attrition unless the scene is already
      tracking active pressure.
    restrictions:
      - requires_a_physical_force_or_environment_that_can_be_treated_as_a_current
      - examples_include_water_mud_crowd_pressure_sliding_ground_collapsing_debris_moving_platform_strong_wind_against_footing_impact_carry_shove_pull_or_drag
      - cannot_be_used_against_teleportation_fear_movement_command_effects_mental_control_social_pressure_poison_curse_infection_or_purely_internal_paralysis
      - cannot_be_used_while_fully_immobilized_bound_unconscious_or_unable_to_move_the_body_enough_to_yield_or_redirect
      - does_not_protect_another_creature
      - does_not_stop_the_source_damage_the_source_apply_a_condition_or_create_a_counterattack
      - cannot_move_the_user_through_sealed_barriers_occupied_spaces_impossible_angles_or_routes_the_triggering_force_could_not_plausibly_carry_the_body_through
      - cannot_override_an_effect_that_explicitly_states_its_displacement_cannot_be_reduced_or_redirected_unless_a_later_upgrade_says_otherwise
    tags:
      - movement
      - recovery
      - anti_displacement
      - exploration
      - defense
  - name: Guardar el Pulso
    name_en: Keep the Pulse
    status: authored_example
    purpose: >
      Add a novice Sauri Tolerancia specialization Technique that preserves one
      necessary bodily function under an already active physiological burden.
      The Technique does not remove the burden and does not spend ATB time to
      answer it. Instead, it converts extra bodily strain into a one-resolution
      mitigation window, letting the user keep one action, held duty, or rescue
      beat from spilling under pain, wound pressure, poison burden, fatigue, or
      another named bodily penalty source.
    origin:
      main: Tolerancia
      secondary: []
    world_origin:
      primary_front: Species
