      rhythm_cost: 6
      attrition_cost: 2
      other: []
    saving_roll:
      model: rr_reduces
      effect_on_success: >
        If the attacker succeeds on its Alteration Resistance Roll, Impedido is
        not applied.
    description: >
      The attacker commits their stroke. Instead of defending, the Naghii sends
      the flexible weapon into the commitment arc — catching the arm, the grip,
      or the execution line at the exact threshold moment. The counter-strike
      lands during the enemy's own action. The attacker absorbs damage and risks
      losing control of their weapon arm.
    effect: >
      Substitute your normal T.D. with a T.A. against the triggering attacker.
      If your T.A. exceeds the attacker's T.A., you take no damage from the
      triggering attack and resolve T.I. normally against the attacker. The
      attacker then immediately makes an Alteration Resistance Roll against
      Impedido. Use the default Ailment severity bands by rank: ranks 1-2 are
      Minor, ranks 3-4 are Moderate, and ranks 5-6 are Severe. On a failed
      R.R., the attacker becomes Impedido at that severity. On a successful
      R.R., Impedido is not applied. If your T.A. does not exceed the
      attacker's T.A., the counter fails and the attack resolves normally.
    scaling: >
      Higher competency used for this Technique increases Impedido severity in
      two-rank bands. Higher tiers may improve reliability, extend the trigger
      to non-weapon committed actions, or reduce the cost premium over a
      standard reactive defense.
    cost_note: >
      Rhythm 5 / Attrition 1 is deliberate. The Technique is a reactive attack
      that simultaneously defends and deals damage, with a condition surface on
      top. The trigger is narrow (user must be the declared target), the
      attacker has an R.R. window against Impedido, and the counter can still
      fail if T.A. does not exceed the attacker's roll. These constraints
      prevent the cost from rising above the standard anchor despite the dual
      output.
