  - name: Leer la Línea Ausente
    name_en: Read the Absent Line
    status: authored_example
    purpose: >
      Add a novice Naghii-origin knowledge Technique rooted in Interpretation
      and Absence As Evidence, giving the species a rank 1 way to extract a
      concrete negative truth from incomplete evidence without simply granting a
      bonus or full answer.
    origin:
      main: Interpretation
      secondary: []
    world_origin:
      primary_front: Species
      secondary_front: null
      source: Naghii
      seed: Absence As Evidence
      focus: Scholarly / Gap Reading
      holder: Naghii outer archive readers
      transmission: outer_archive_gap_reading_drills
      availability: Restricted
      adaptation_notes: >
        The Technique originates in Naghii archive practice, where damaged
        records, missing marks, broken sequences, and incomplete ruins are
        treated as evidence rather than ignored. Outsiders can learn it through
        archive study if they preserve the discipline of reading absence without
        inventing certainty.
    category: utility
    type: active
    trigger: >
      The user is examining an incomplete pattern, record, route, ritual,
      scene, testimony, formation, or sequence where something appears missing,
      interrupted, removed, or too clean.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: null
      support_specializations: []
      equipment: []
      states:
        - incomplete_or_suspicious_pattern_present
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 4
        text_or_manual_required: false
        notes: >
          Requires repeated study of incomplete records, broken procedures, and
          staged scenes where the learner must identify what kind of absence
          matters without filling it with a false answer.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A Naghii archivist, ruin-reader, or priestly instructor can correct
          the learner when they mistake speculation for evidence.
      material_cost: null
      access_notes: >
        Usually taught to outer archive initiates before they are trusted with
        deeper translations or ruin reports.
      final_validation: one_successful_supervised_interpretation
    target: site
    range: observed_evidence
    area: single_pattern_or_scene
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 3
      attrition_cost: 1
      other:
        - rhythm_and_attrition_apply_only_during_ATB_or_active_threat
        - no_attrition_cost_in_normal_exploration_without_active_threat
    saving_roll:
      model: contextual
      effect_on_success: >
        If another creature deliberately falsified, staged, or concealed the
        absence, resolve against that opposing method. On a successful answer,
        the user identifies that the evidence is unreliable but does not get a
        clean absence category.
    description: >
      The user studies what is not there: a missing mark, a broken step, a
      silence in testimony, a route with no return trace, a ritual sequence with
      one gesture absent.
    effect: >
      Make an Interpretation-based Technique check against one incomplete or
      suspicious pattern. On success, the Narrator reveals one absence category
      relevant to the current pattern — such as a missing actor, missing route,
      missing object or tool, missing step in a sequence, missing warning or
      sign, or missing consequence that should have followed. These are examples
      of the kind of absence this Technique surfaces, not a closed list: the
      Narrator chooses whichever absence is most structurally significant and
      may identify other absence types of the same quality that the evidence
      supports. The read tells the user what kind of absence matters and what
      immediate conclusion is unsafe. It does not reveal the full missing
      content, name the responsible party, reconstruct the entire event, or
      prove intent by itself.
    scaling: >
      Higher Interpretation rank may improve reliability, allow subtler or more
      damaged patterns to qualify, or let later higher-tier versions ask for
      richer absence categories. Novice use reveals one absence category only.
    cost_note: >
      Rhythm 3 / Attrition 1 is deliberate under pressure. The Technique
      produces information immediately: it tells the user what kind of absence
      matters and what conclusion is unsafe. These costs apply only during ATB
      or another active-threat scene; in normal exploration, the Technique
      resolves as the user's Interpretation action.
    restrictions:
      - requires_an_incomplete_or_suspicious_pattern_to_read
      - reveals_one_absence_category_only
      - does_not_reveal_the_full_missing_content
      - does_not_identify_the_responsible_party_by_itself
      - does_not_reconstruct_the_entire_event
      - does_not_create_a_bonus_to_another_roll_by_itself
      - does_not_bypass_deliberate_staging_without_contextual_opposition
    tags:
      - utility
      - counter_read
      - pattern_exploitation
  - name: Marcar la Lectura
    name_en: Mark the Reading
    status: authored_example
    purpose: >
      Add a novice Naghii-origin ranged Technique rooted in Ranged Weapons and
      Projection Of Interpretation, giving the Saa/projection side of the
      species a rank 1 attack expression that marks a target's immediate line
      instead of functioning as a flat damage shot.
    origin:
