      counterweighted surface, keeping their body from being removed from the
      place it chose to hold.
    effect: >
      When the trigger occurs, reduce the forced movement distance by 1 meter
      plus the rank bonus of the competency used for this Technique. If this
      reduction brings the forced movement to 0, the user remains in their
      current space and keeps any held-point, guard, stance, route, or
      body-position effect that would have ended only because they were
