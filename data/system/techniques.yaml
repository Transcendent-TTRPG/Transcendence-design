      - requires_tolerancia_at_novice_or_higher
      - requires_infection_resistance_at_novice_or_higher
      - applies_only_after_a_mundane_infection_has_already_settled
      - applies_only_to_infections_that_have_a_declared_incubation_period
      - does_not_help_against_poison_curse_affliction_alteration_fear_command_pressure_or_purely_taumatic_corruption
      - does_not_remove_or_reduce_an_infection_after_it_has_already_settled
      - does_not_prevent_later_propagation_once_the_infection_becomes_active
      - affects_the_user_only
