pilot_examples:
  - name: Cerrar la Línea
    name_en: Close the Line
    status: pilot_example
    purpose: >
      Validate the current Technique framework with a first authored combat
      Technique that is clearly distinct from a generic base attack.
    origin:
      main: Spear
      secondary: []
    category: attack
    type: reactive
    trigger: >
      An enemy advances into the user's line or tries to convert forward
      movement into immediate melee contact against the user.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Perforation
      support_specializations: []
      equipment:
        - spear
        - other_committed_piercing_reach_weapon
      states: []
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 8
        practice_hours: 4
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of line presentation, distance judgment,
          and entry punishment against a moving partner.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 4
        mentor_required: true
        notes: >
          A trained lancer or comparable combat instructor can shorten the
          learning curve by correcting timing and point alignment.
      material_cost: null
      access_notes: >
        Best learned through controlled sparring where the learner must read
        committed entry and answer before the opponent stabilizes in close
        range.
      final_validation: one_successful_supervised_execution
    target: enemy
    range: weapon_reach
    area: single
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 4
      attrition_cost: 1
      other: []
    saving_roll:
      model: contextual
      effect_on_success: >
        Resolve through the hostile exchange that the Technique intercepts.
        If the target answers successfully, the entry is not denied.
    description: >
      The user places the point exactly where the opponent must pass, making
      committed entry dangerous before close pressure can settle.
    effect: >
      Make a reactive attack against the triggering enemy. If the Technique
      resolves successfully, that enemy does not complete a clean melee entry
      against the user through the same forward commitment.
    scaling: >
      Higher Spear competency may improve reliability, entry denial clarity, or
      cost efficiency, but should not turn the Technique into broad zone control
      by default.
    cost_note: >
      Rhythm 4 / Attrition 1 is deliberate. The Technique is narrower than a
      standard authored action, but stronger than a pure quick reactive strike
      because it also denies clean entry conversion on success.
    restrictions:
      - requires_a_clear_line_and_enough_space_to_present_the_point
      - cannot_be_used_if_the_enemy_is_already_established_at_very_close_range
      - cannot_be_used_when_the_user_cannot_align_the_weapon_credibly
    tags:
      - attack
      - pressure
      - precision
      - setup
  - name: Clavar el Paso
    name_en: Pin the Step
    status: pilot_example
    purpose: >
      Provide a novice Perforation pilot that justifies Attrition 2 through
      visible bodily overcommitment and harsher pressure handling, not through
      higher timing alone.
    origin:
      main: Spear
      secondary: []
    category: attack
    type: active
    trigger: >
      An enemy is already pressing the line or is about to force a committed
      close entry that the user wants to stop through sheer forward authority.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Perforation
      support_specializations: []
      equipment:
        - spear
        - other_committed_piercing_reach_weapon
      states: []
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 8
        text_or_manual_required: false
        notes: >
          Requires drilling committed step-stopping thrusts, body alignment
          under pressure, and safe recovery from overextension.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 8
        mentor_required: true
        notes: >
          A trained lancer helps prevent the learner from turning the Technique
          into a wasteful lunge that collapses after the first answer.
      material_cost: null
      access_notes: >
        Best learned under sparring pressure where the learner must stop real
        forward commitment without drifting into generic stabbing exchanges.
      final_validation: one_successful_practice_scene_under_pressure
    target: enemy
    range: weapon_reach
    area: single
    duration:
      model: instant
      value: null
      sustain_rule: null
      end_rule: on_resolution
    cost:
      rhythm_cost: 5
      attrition_cost: 2
      other: []
    saving_roll:
      model: contextual
      effect_on_success: >
        Resolve through the hostile exchange created by the committed thrust.
        If the target answers successfully, the enemy's step is not pinned and
        the user's heavy commitment was spent without securing the denial.
    description: >
      The user drives the spear with enough commitment that the enemy's next
      step becomes unsafe to complete cleanly.
    effect: >
      Make an active attack against the target. If the Technique resolves
      successfully, the target's current forward step or immediate close-entry
      attempt does not settle into a stable offensive position against the user.
    scaling: >
      Higher Spear competency may improve stability after the thrust, denial
      clarity, or recovery economy, but should not remove the Technique's
      committed identity or turn it into broad control.
    cost_note: >
      Rhythm 5 / Attrition 2 is deliberate. The timing remains in the standard
      active band, but the strain rises because the Technique buys denial
      through harsher bodily expenditure and lower repetition safety.
    restrictions:
      - requires_enough_space_and_posture_to_drive_the_spear_with_committed_alignment
      - should_not_function_as_broad_zone_control_or_a_free_answer_to_multiple_enemies
      - should_leave_the_user_meaningfully_committed_if_the_exchange_goes_poorly
    tags:
      - attack
      - pressure
      - precision
      - disruption
  - name: Recuperar la Distancia
    name_en: Recover the Distance
    status: pilot_example
    purpose: >
      Provide a second Perforation pilot to compare against Cerrar la Línea and
      validate the difference between a narrow reactive denial and a broader
      active line-recovery Technique.
    origin:
      main: Spear
      secondary: []
    category: attack
    type: active
    trigger: >
      The user's line is being contested, compressed, or threatened by an enemy
      preparing to enter or remain in close pressure.
    requirements:
      level: null
      rank: Novice
      technique_tier: 1
      weapon_profile: Perforation
      support_specializations: []
      equipment:
        - spear
        - other_committed_piercing_reach_weapon
      states: []
      prerequisite_techniques: []
    learning:
      self_study:
        allowed: true
        study_hours: 10
        practice_hours: 6
        text_or_manual_required: false
        notes: >
          Requires repeated drilling of distance recovery, committed line
          reassertion, and body-forward point control against pressure.
      guided_training:
        allowed: true
        study_hours: 4
        practice_hours: 6
        mentor_required: true
        notes: >
          A trained lancer can help the learner distinguish clean distance
          recovery from wasteful overcommitment.
      material_cost: null
      access_notes: >
        Best learned in sparring where the enemy repeatedly contests spear space
        and the learner must reclaim line without collapsing into generic close
        striking.
      final_validation: one_successful_practice_scene_under_pressure
    target: enemy
    range: weapon_reach
    area: single
    duration:
