taxonomy:
  canonical_term:
    es: Tecnicas
    en: Techniques
  definition: >
    A competency-rooted, explicitly costed, mechanically-defined application
    that produces a narrative and mechanical consequence in the same use.
  spectacle_rule:
    intent: >
      Techniques should feel spectacular, thematic, and memorable rather than
      flat or purely procedural.
    allowed:
      - exaggerated
      - dramatic
      - cinematic
      - heightened_but_grounded
    required_grounding:
      - trained_timing
      - body_control
      - leverage
      - force_transfer
      - pressure_management
      - positioning
      - equipment_interaction
      - practiced_perception
      - conditioned_survival_response
      - social_projection
      - environmental_exploitation
    prohibited_as_source:
      - magical_manifestation
      - occult_projection
      - energy_from_nothing
      - unexplained_supernatural_causation
    authoring_test:
      - Is it exciting enough to feel worth learning?
      - Is its identity primarily thematic, not just numerical?
      - Can its effect be traced to a trained non-magical cause?
      - Would it still make sense if all magic were removed from the scene?
  raw_use_vs_technique:
    raw_competency_use: narrative_effect_only
    technique_use: narrative_plus_mechanical_effect
  base_action_rule:
    role_of_base_actions: common_floor
    base_actions_should_be:
      - broadly_accessible
      - low_identity
      - low_differentiation
      - structurally_reliable
      - useful_for_onboarding_before_authored_techniques_take_over
    base_actions_remain_valid_when:
      - no_relevant_trigger_is_available
      - the_user_wants_to_conserve_resources
      - the_scene_does_not_justify_a_specialized_execution
      - the_character_has_not_learned_a_better_expressive_option_for_that_moment
    core_principle: >
      Base actions are fallback options, not the primary reward structure of
      play. The main source of tactical identity should come from Techniques.
    technique_authoring_test:
      - Does this create a more specific and thematic solution than a generic base action?
      - Does this express personal build decisions rather than flat universal access?
      - Is this more than a renamed base action with minor numerical tuning?
  combat_profile_layer:
    used_for:
      - weapon_rooted_techniques
      - shield_rooted_combat_techniques
      - ranged_attack_profiles
      - flexible_attack_profiles
      - natural_attack_forms
    note: >
      Combat Techniques should usually pass through shared Weapon Technique
      Profiles instead of creating a separate Technique tree for every
      individual weapon item or a disconnected natural-weapon subsystem.

