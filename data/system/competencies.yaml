# Competencies — authority definition
# Rank structure revised after playtesting: 3 levels/rank → 2 levels/rank, 4 ranks → 6 ranks
# Reason: 20 sessions of real play showed no character ever left Novice under the old structure.
# Fix: major affinity reduction + halved levels per rank + extended ceiling (Consummate, Transcendent)
# See: docs/adr/system-specialization-rank-restructure.md

ranks:
  - id: untrained
    rank_number: 0
    level_range: [0, 0]
    display_es: No entrenado
    display_en: Untrained
    synapsis: false

  - id: novice
    rank_number: 1
    level_range: [1, 2]
    threshold_level: 1
    display_es: Novato
    display_en: Novice
    synapsis: true

  - id: adept
    rank_number: 2
    level_range: [3, 4]
    threshold_level: 3
    display_es: Adepto
    display_en: Adept
    synapsis: true

  - id: expert
    rank_number: 3
    level_range: [5, 6]
    threshold_level: 5
    display_es: Experto
    display_en: Expert
    synapsis: true

  - id: master
    rank_number: 4
    level_range: [7, 8]
    threshold_level: 7
    display_es: Maestro
    display_en: Master
    synapsis: true

  - id: consummate
    rank_number: 5
    level_range: [9, 10]
    threshold_level: 9
    display_es: Consumado
    display_en: Consummate
    synapsis: true

  - id: transcendent
    rank_number: 6
    level_range: [11, null]
    threshold_level: 11
    display_es: Trascendente
    display_en: Transcendent
    synapsis: true

levels_per_rank: 2

synapsis:
  trigger: entering_new_rank   # +1 to associated characteristic on reaching threshold_level
  effect: "+1 to the characteristic associated with the specialization"
  note: >
    Synapsis rewards breadth as much as depth. Reaching Rank 1 in six different specializations
    gives +6 across characteristics. Reaching Rank 6 in one specialization gives +6 in one
    characteristic but at high Technique opportunity cost.

progression:
  major_affinity_cost: 5    # progress points per level (with major affinity)
  default_cost: 10           # progress points per level (without major affinity)
  method: learning_advantage  # use the lower die result; generates progress, not execution
  note: >
    Major affinity is determined by background. Any character can make a specialization roll
    in any domain — even untrained. Untrained formula: 1d10 + characteristic only.
    Progress is accumulated through any successful learning-advantage roll in that domain,
    provided the Narrator validates the narrative fit of the specialization used.
  min_test_difficulty_by_rank:
    untrained: any
    novice: any
    adept: fundamental
    expert: challenging
    master: rigorous
    consummate: demanding   # base 14 + NR — see data/system/difficulty-thresholds.yaml
    transcendent: extreme   # base 17 + NR — see data/system/difficulty-thresholds.yaml

types:
  - id: weapons
    name_es: Armas
    name_en: Weapons
    description: Mastery with a specific weapon type
    bonuses:
      per_level: "+1 to A.R."
      per_rank: "+1 to A.R., +1 die to I.R."
    progression_trigger: >
      Successful A.R. with Learning Advantage, when the attack hits and deals damage
      with the weapon or object used in a relevant encounter.

  - id: armors
    name_es: Armaduras
    name_en: Armors
    description: Efficient use of armor by type
    split_by_type:
      - light_armor
      - medium_armor
      - heavy_armor
    bonuses:
      per_level: "+1 to zone block when that armor type is present in the resolved hit zone"
      note: "no passive per-rank block bonus; block already stacks with category, material, and grade"
    progression_trigger: >
      Failed D.R. with Learning Advantage, when the hit resolves through an armored zone
      and that armor actually reduces impact.

  - id: shields
    name_es: Escudos
    name_en: Shields
    description: Technical mastery of shield use
    bonuses:
      per_rank: "access to additional shield maneuvers (type-dependent)"
      master: "reduce movement penalty imposed by the equipped shield by grade (minimum 0)"
    progression_trigger: successfully_use_shield_techniques_or_dedicated_shield_maneuvers

  - id: evasion
    name_es: Evasión
    name_en: Evasion
    description: Anticipating and avoiding attacks
    bonuses:
      per_level: "+1 to D.R."
      per_rank: "+1 to D.R."
    progression_trigger: successful_D.R._with_learning_advantage

  - id: specialization
    name_es: Especialización
    name_en: Specialization
    description: Trainable technical, practical, or methodological domain
    bonuses:
      per_level: "+1 to S.R."
      per_rank: "+1 to S.R."
      rank_entry: "+1 to associated characteristic via Synapsis"
    progression_trigger: >
      Successful specialization roll with learning advantage; Narrator validates narrative
      fit of the domain used.
    untrained_formula: "1d10 + associated characteristic (no level or rank bonus)"

  - id: resistances
    name_es: Resistencias
    name_en: Resistances
    description: Withstanding specific harmful conditions and effects; not damage reduction
    subtypes:
      - id: poison
        bonus: "+1 to R.R. against poisons"
      - id: infection
        bonus: "+1 to R.R. against infections"
      - id: affliction
        bonus: "+1 to R.R. against afflictions; +1 to Affliction R.R. per rank during meditation"
      - id: alteration
        bonus: "+1 to R.R. against alterations"
      - id: curses
        bonus: "+1 to detect or resist curses"
    progression_trigger: >
      Failed R.R. with Learning Advantage, when the corresponding effect is actually
      suffered and survived as meaningful exposure.
    damage_note: >
      Resistances do not reduce Impact or elemental damage. Damage is resolved through
      Impact versus Block and the wound/HP rules. Elemental identity is handled by traits
      such as minor/major resistance or vulnerability on creatures, materials, objects,
      or specific effects.

elemental_damage_traits:
  scope: creatures_materials_objects_and_specific_effects
  rule: >
    These traits modify damage of a declared elemental origin after normal impact
    resolution identifies the relevant damage amount. They are not player resistance
    competencies and do not progress through Learning Advantage.
  levels:
    minor_resistance:
      name_es: Resistencia menor
      damage_multiplier: 0.5
    major_resistance:
      name_es: Resistencia mayor
      damage_multiplier: 0
    minor_vulnerability:
      name_es: Vulnerabilidad menor
      damage_multiplier: 1.5
    major_vulnerability:
      name_es: Vulnerabilidad mayor
      damage_multiplier: 2

progression_map:
  attack_roll:
    success_with_learning_advantage: weapon_or_object_competency_used
  defense_roll:
    success_with_learning_advantage: evasion
    failure_with_learning_advantage: armor_type_of_resolved_armored_zone_if_armor_absorbs_impact
  specialization_roll:
    success_with_learning_advantage: specialization_used
  resistance_roll:
    failure_with_learning_advantage: matching_resistance_if_effect_is_suffered
  shield_technique:
    success_with_learning_advantage: shield_competency
