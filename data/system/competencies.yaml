ranks:
  - id: untrained
    level_range: [0, 0]
    display: Untrained
  - id: novice
    level_range: [1, 3]
    display: Novice
  - id: adept
    level_range: [4, 6]
    display: Adept
  - id: expert
    level_range: [7, 9]
    display: Expert
  - id: master
    level_range: [10, null]
    display: Master

levels_per_rank: 3

progression:
  major_affinity_cost: 5   # progress points
  default_cost: 10          # progress points
  method: learning_advantage_on_AR_DR_SR
  min_test_difficulty_by_rank:
    novice: any
    adept: fundamental
    expert: challenging
    master: rigorous

types:
  - id: weapons
    name: Weapons
    description: Mastery with a specific weapon type
    bonuses:
      per_level: "+1 to A.R."
      per_rank: "+1 to A.R., +1 die to I.R."
    progression_trigger: hit_and_deal_damage_with_weapon_in_relevant_encounter

  - id: armors
    name: Armors
    description: Efficient use of armor
    bonuses:
      per_level: "block +1"
      expert: "movement speed penalty reduced by one category"
      master: "movement speed penalty reduced by one additional category"
    progression_trigger: receive_hit_where_armor_reduces_damage

  - id: shields
    name: Shields
    description: Technical mastery of shield use
    bonuses:
      per_rank: "access to additional shield maneuvers (type-dependent)"
    progression_trigger: successfully_use_martial_shield_maneuvers

  - id: evasion
    name: Evasion
    description: Anticipating and avoiding attacks
    bonuses:
      per_level: "+1 to D.R."
    progression_trigger: successfully_avoid_relevant_attacks

  - id: specialization
    name: Specialization
    description: Technical mastery in a specific skill
    bonuses:
      per_level: "+1 to S.R."
      per_rank: "+1 to S.R."
    progression_trigger: overcome_tests_appropriate_to_current_rank

  - id: resistances
    name: Resistances
    description: Withstanding specific types of danger
    subtypes:
      - id: elemental
        bonus: "+1 to R.R. against elemental effects"
      - id: poison
        bonus: "+1 to R.R. against poisons"
      - id: infection
        bonus: "+1 to R.R. against infections"
      - id: affliction
        bonus: "+1 to R.R. against afflictions; +1 to Affliction R.R. per rank during meditation"
      - id: alteration
        bonus: "+1 to R.R. against alterations"
      - id: curses
        bonus: "+1 to detect or resist curses"
