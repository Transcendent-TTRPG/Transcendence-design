# Condiciones del Entorno — autoridad de diseño
#
# Referencia cruzada:
#   - data/system/difficulty-thresholds.yaml  → fórmula de umbral (Base + NR)
#   - data/system/attrition-fatigue.yaml      → modelo Entorpecer/Limitar/Acelerar
#   - data/system/specializations-catalog.yaml → Aclimatación, Tolerancia
#
# Las condiciones del entorno contribuyen al NR que el Narrador asigna en las pruebas
# de umbral fijo. La severidad de la condición determina el nivel de dificultad base;
# el NR del entorno ajusta el umbral dentro de ese nivel según la intensidad específica.
# "Entorno" no significa solo clima o terreno: incluye cualquier presión externa al actor
# que domine la escena, incluida presencia hostil o influencia extranatural.

meta:
  version: "1.0"
  status: draft
  last_updated: "2026-04-20"

# ──────────────────────────────────────────────────────
# TIPOS DE CONDICIÓN
# ──────────────────────────────────────────────────────

tipos:
  - id: natural
    nombre_es: Natural
    nombre_en: Natural
    descripcion: >
      Condiciones climáticas, de terreno, atmosféricas o de presencia hostil material
      que se ajustan a las leyes del mundo. Pueden ser extremas pero no violan la lógica
      física del entorno.

  - id: extranatural
    nombre_es: Extranatural
    nombre_en: Extranatural
    descripcion: >
      Fenómenos del mundo perceptible que involucran la energía del Limbo. El Tauma no
      genera fenómenos de la nada: transforma, modifica, amplifica lo que ya existe en
      el mundo material. Lo que las distingue de las condiciones naturales no es la
      intensidad ni los elementos involucrados, sino el origen: cualquier reacción que
      no corresponda a la lógica natural del mundo y que provenga de la dimensión
      imperceptible filtrándose en la perceptible.
    origen: >
      El Limbo — dimensión paralela impercibible para las criaturas normales, origen del
      Tauma. Los marcadores observables (estados contradictorios simultáneos, Luz+Oscuridad
      con efectos físicos propios) son señales de presencia del Limbo, no su definición.
      No toda condición extranatural produce contradicciones visibles; puede manifestarse
      como amplificación o transformación de algo que ya existe en el mundo natural.
    marcador_primario: luz y oscuridad activas simultáneamente en el mismo espacio
    marcadores_secundarios:
      - estados físicamente contradictorios en el mismo punto (fuego+hielo, calor+nieve)
      - nota: fuego+agua produciendo vapor es natural; fuego+hielo simultáneo es extranatural
      - tres o más elementos en conflicto activo en el mismo punto
      - fenómenos sin causa visible o con causalidad invertida
      - reglas físicas del entorno inestables o contradictorias

fuentes_de_presion:
  - id: ambiental
    nombre_es: Ambiental
    nombre_en: Ambient
    descripcion: >
      Terreno, clima, oscuridad, exposición, temperatura, agua, humo, altura, ruido
      u otros factores físicos del lugar.
  - id: hostil
    nombre_es: Hostil
    nombre_en: Hostile
    descripcion: >
      Una presencia que domina la escena aunque no exista todavía una regla puntual
      resolviéndola: un depredador superior, una criatura mortal abrumadora, una entidad
      anómala, una presencia primordial o una persecución activa.
  - id: extranatural
    nombre_es: Extranatural
    nombre_en: Extranatural
    descripcion: >
      Alteración del mundo perceptible causada por filtración del Limbo o por Tauma
      actuando sobre algo ya existente.

# Nota de alcance:
# La taxonomía elemental, las deidades asociadas y otras capas de worldbuilding no forman
# parte de esta autoridad mecánica. Si se necesitan para setting o lore, deben vivir en
# documentación de canon o worldbuilding, no en la definición sistémica de condiciones.

# ──────────────────────────────────────────────────────
# SEVERIDADES — relación con niveles de dificultad
# ──────────────────────────────────────────────────────
# NR sugerido: valor de NR del entorno que el Narrador puede asignar al umbral.
# El umbral final = Base del nivel de dificultad + NR del entorno.
# NR 1 = condición en su mínima expresión para ese nivel (NR 0 no es válido — todas las competencias iniciales son 1).
# NR alto = condición especialmente intensa o con influencia extranatural.

severidades:
  - id: leve
    nivel_dificultad: fundamentos
    base: 5
    nr_sugerido: "1"
    tipo: natural
    descripcion: >
      Condiciones estándar con pocos factores disruptivos. Manejables con atención básica.
      No requieren adaptación especializada, pero sí presencia de ánimo.
    ejemplos_naturales:
      - lluvia ligera con viento suave
      - terreno irregular pero familiar
      - visibilidad reducida (niebla leve)
      - temperatura incómoda pero soportable
      - ruido ambiental moderado (río cercano, viento entre árboles)
    efecto_sobre_personajes: ninguno  # el umbral (5+NR) expresa la dificultad directamente

  - id: moderada
    nivel_dificultad: desafiante
    base: 8
    nr_sugerido: "1–2"
    tipo: natural
    descripcion: >
      Retos menores pero reales. Requieren adaptación activa y afectan la concentración,
      la coordinación o la comunicación.
    ejemplos_naturales:
      - tormenta moderada con visibilidad reducida
      - terreno muy irregular o pantanoso
      - calor o frío intensos (no extremos)
      - ruido que dificulta la comunicación verbal
      - oscuridad parcial (antorchas insuficientes, luna tapada)
    efecto_sobre_personajes: narrador puede limitar  # si el contexto lo justifica

  - id: severa
    nivel_dificultad: rigurosa
    base: 11
    nr_sugerido: "2–3"
    tipo: natural_o_extranatural
    descripcion: >
      Factores ambientales significativos. Las acciones requieren mayor esfuerzo.
      Algunas opciones tácticas se limitan activamente.
    ejemplos_naturales:
      - tormenta fuerte con viento que impide proyectiles y dificulta el movimiento
      - terreno muy accidentado con riesgo de caída
      - temperatura extrema sostenida (gran frío o calor)
      - oscuridad casi total con visibilidad mínima
      - combate en agua o superficie inestable
    efecto_sobre_personajes: narrador puede limitar

  - id: desastrosa
    nivel_dificultad: exigente
    base: 14
    nr_sugerido: "3–4"
    tipo: natural_o_extranatural
    descripcion: >
      Condiciones casi inhabilitantes. Pueden ser fenómenos naturales en su punto más extremo
      o la primera manifestación de influencia extranatural. A este nivel, la distinción
      entre natural y extranatural comienza a ser relevante mecánicamente.
    ejemplos_naturales:
      - terremoto activo con derrumbes
      - huracán de máxima intensidad
      - incendio forestal activo con dirección imprevisible
      - tormenta marina con olas que superan estructuras
    ejemplos_extranaturales:
      - lluvia que cae en dirección contraria al viento o hacia arriba
      - terreno que cambia de forma activamente
      - oscuridad con fuente de luz visible pero sin efecto iluminador
      - temperatura que varía varios grados en segundos sin causa
    efecto_sobre_personajes: narrador puede limitar y/o acelerar

  - id: extrema
    nivel_dificultad: extrema
    base: 17
    nr_sugerido: "4–5"
    tipo: natural_o_extranatural
    descripcion: >
      Límite de lo supervivible o ejecutable. Los fenómenos extranaturales son comunes
      en este rango. Tres o más elementos en conflicto activo, o fenómenos que el entorno
      no puede sostener bajo lógica natural.
    ejemplos_naturales:
      - tormenta marina con abordaje simultáneo y estructuras colapsando
      - terremoto combinado con erupción volcánica próxima
    ejemplos_extranaturales:
      - múltiples fenómenos amplificados y transformados simultáneamente sin lógica causal entre ellos
      - luz y oscuridad simultáneas con efectos físicos propios
      - entorno en colapso dimensional activo (el Limbo filtrándose directamente al plano físico)
      - reglas físicas del entorno inestables: gravedad irregular, tiempo perceptivamente alterado
    efecto_sobre_personajes: narrador puede acelerar  # probable en este rango; puede generar Desgaste pasivo

# ──────────────────────────────────────────────────────
# MODELO DE EFECTO
# ──────────────────────────────────────────────────────

modelo_de_efecto:
  referencia: data/system/attrition-fatigue.yaml (conditions_and_environment)
  principio: >
    El NR del entorno expresa la dificultad de las tiradas — es la única regla mecánica
    fija. Limitar y Acelerar son herramientas narrativas del Narrador: puede aplicarlas
    cuando tenga sentido en la escena, no hay un trigger automático. No todos los
    escenarios con una severidad dada requieren ambas.
  herramientas_del_narrador:
    - id: limitar
      nombre_en: restrict
      descripcion: >
        El Narrador puede eliminar opciones de acción cuando la condición lo justifica
        narrativamente. No las hace más difíciles — las elimina directamente.
    - id: acelerar
      nombre_en: accelerate
      descripcion: >
        El Narrador puede cobrar +1 Desgaste a cualquier acción no gratuita cuando
        la condición justifica un drenaje activo. Se aplica mientras dure esa presión.
  nota: >
    La severidad orienta al Narrador — una condición Extrema hace más probable que use
    ambas herramientas; una condición Leve hace improbable que use alguna. La decisión
    es siempre narrativa y contextual.

# ──────────────────────────────────────────────────────
# ASIGNACIÓN DE NR POR EL NARRADOR
# ──────────────────────────────────────────────────────

nr_del_entorno:
  principio: >
    El Narrador asigna el NR del entorno según la intensidad específica de la condición
    dentro de su nivel de severidad. No es un valor fijo — refleja cuánto presiona
    ese entorno particular comparado con la condición "estándar" de su nivel.
  guia:
    - nr: 1
      descripcion: Condición en su expresión mínima para ese nivel de severidad
    - nr: 2
      descripcion: Condición notable dentro de su nivel; algunos factores compuestos
    - nr: 3
      descripcion: Condición intensa; múltiples factores simultáneos o duración prolongada
    - nr: 4
      descripcion: Condición en su pico o con primer marcador extranatural confirmado
    - nr: 5
      descripcion: Influencia extranatural clara; reservado para nivel Extrema
  multiples_fuentes:
    regla: >
      La fuente dominante determina el nivel de severidad. Las fuentes secundarias
      pueden añadir NR, con un tope de +2. No se acumulan más de dos fuentes.
    ejemplo: >
      Tormenta Desastrosa (14+NR) + presencia hostil secundaria → 14+2 = 16. No 14+4.
  regla_especifica:
    principio: >
      Si otro sistema tiene un DC o mecánica definida para la acción, ese sistema
      toma precedencia. Las condiciones del entorno son el recurso del Narrador
      para situaciones sin regla propia — el fallback, no la regla primaria.

# ──────────────────────────────────────────────────────
# PREGUNTAS DE DISEÑO ABIERTAS
# ──────────────────────────────────────────────────────

open_questions:
  - id: D-08
    pregunta: >
      ¿Aclimatación y otras especializaciones naturales aplican igual a condiciones
      extranaturales? Una tormenta elemental no es solo "frío extremo" — puede
      requerir capacidades distintas (Instinto, Resonancia, Taumaturgia).
    contexto: >
      No puede cerrarse sin diseñar el sistema de manifestaciones del Limbo. Provisoriamente:
      Aclimatación aplica a condiciones Desastrosas con componente extranatural,
      pero no garantiza reducción completa en condiciones Extremas de origen taumático.
    destino: sistema de manifestaciones del Limbo — cuando se diseñe
