taxonomy:
  canonical_term: "Natural Attack Form"
  purpose: "Inverse mapping layer for natural combat that links bodily attack logic to compatible Weapon Technique Profiles."
  reading_rule:
    - "A natural attack form does not create a separate Technique school by itself."
    - "Each form maps to four existing Weapon Technique Profiles whenever possible."
    - "Those four profiles may come from different manufactured weapon families, because anatomy inherits combat logic by contact, not by item category."
    - "If a form cannot map cleanly, that may justify a new profile, a species-specific exception, or a restriction note, but not a separate subsystem by default."
  required_fields:
    - name
    - contact_logic
    - combat_role
    - damage_identity
    - compatible_profiles
    - restricted_profiles
    - identity_notes
  optional_fields:
    - species
    - species_profile_expressions
    - species_notes
    - delivery_notes
    - environmental_dependence
    - profile_specific_caveats
  template:
    name: "Canonical natural form name"
    name_es: "Canonical Spanish form name"
    species: []
    contact_logic: "What kind of bodily contact the form creates"
    combat_role: "Main offensive or defensive role"
    damage_identity: "What kind of harm or pressure it tends to produce"
    compatible_profiles: []
    restricted_profiles: []
    identity_notes: "Why those mappings make sense"

forms:
  - id: bite
    name: "Bite"
    name_es: "Mordisco"
    species:
      - "Naghii"
      - "Sauri"
      - "Zarnag"
      - "Drak'kai"
      - "Formix"
      - "Panin"
      - "Luphran"
      - "Ursari"
      - "Arakhel"
      - "Vesper"
      - "Manto"
      - "Telpi"
      - "Myo"
    contact_logic: "Close puncture, clamp, tearing bite, or bite-driven hold"
    combat_role: "Committed close threat"
    damage_identity: "Puncture, tear, pressure, invasive contact"
    compatible_profiles:
      - "Perforation"
      - "Charge"
      - "Rend"
      - "Shadow Pressure"
    restricted_profiles:
      - "Bastion"
      - "Ricochet"
      - "Precision"
    identity_notes: "Bite supports deep entry, brutal close pressure, and predatory commitment. It maps well to piercing or tearing profiles, but usually not to stationary defense or ranged geometry."
    species_profile_expressions:
      - species: "Naghii"
        expression_id: "naghii_fang_bite"
        availability: "Kha-Naghii only"
        contact_logic: "Retractable fang entry with venom delivery through precise close contact"
        compatible_profiles:
          - "Perforation"
          - "Corrosion"
          - "Shadow Pressure"
          - "Precision"
        restricted_profiles:
          - "Bastion"
          - "Impact"
          - "Unstoppable"
        identity_notes: >
          Naghii bite Techniques should emphasize fang insertion, controlled
          venom delivery, exact contact, and punishment of hesitation. They
          should not become raw mauling or heavy jaw-crush identity.
        stat_block:
          assignment: Primary
          attack_characteristic: Agility
          impact_characteristic: Tenacity
          reach: "1 m"
          damage_die: d8
          durability_formula: "4 per competency rank"
          potency_formula: "5 per competency rank"
          additional_effect:
            trigger: "A.R. exceeds D.R. by 3 or more"
            target_roll: "R.R. (Venom)"
            effect: "Reduces target Tenacity"
            severity_by_rank:
              - ranks: "1-2"
                severity: Minor
                tenacity_reduction: 1d2
              - ranks: "3-4"
                severity: Moderate
                tenacity_reduction: 1d4
              - ranks: "5-6"
                severity: Severe
                tenacity_reduction: 1d6
        variant:
          group: naghii_biological_variant
          variant_id: kha
          rule: "Naghii players choose Kha or Saa at campaign start. Cannot have both Mordisco and Aliento Astral on the same character."
      - species: "Sauri"
        expression_id: "sauri_jaw_closure"
        availability: "All Sauri"
        contact_logic: "Heavy jaw closure, clamp, crush, drag, and sustained pressure"
        compatible_profiles:
          - "Impact"
          - "Bastion"
          - "Rend"
          - "Unstoppable"
        restricted_profiles:
          - "Precision"
          - "Ricochet"
          - "Shadow Pressure"
        identity_notes: >
          Sauri bite Techniques should emphasize closure, crushing pressure,
          sustained hold, and structural break. They are closer to heavy impact
          and containment than to small-fang precision.
      - species: "Drak'kai"
        expression_id: "drakkai_crushing_bite"
        availability: "All Drak'kai"
        contact_logic: "Heavy jaw closure, crushing sustained pressure, hold through mass and structure, and body-weight commitment once contact is made"
        compatible_profiles:
          - "Impact"
          - "Unstoppable"
          - "Interception"
          - "Torsion"
        restricted_profiles:
          - "Shadow Pressure"
          - "Precision"
          - "Flow"
        identity_notes: >
          Drak'kai bite Techniques should emphasize committed closure, sustained
          crushing pressure, and the hold that continues beyond initial contact.
          The bite is not a harassment tool or a repeated strike — it is a
          terminal decision. Techniques should distinguish this from Sauri jaw
          logic (territorial dominance and structural break) by emphasizing
          patience-then-commitment and the hold that follows rather than
          overwhelming mass per se.
      - species: "Zarnag"
        expression_id: "zarnag_carrion_bite"
        availability: "All Zarnag"
        contact_logic: "Infectious breach, foul-contact pressure, tearing lock, and committed body-following maul"
        compatible_profiles:
          - "Corrosion"
          - "Shadow Pressure"
          - "Rend"
          - "Charge"
        restricted_profiles:
          - "Bastion"
          - "Ricochet"
          - "Precision"
        identity_notes: >
          Zarnag bite Techniques should emphasize contamination risk, panic at
          close range, tearing commitment, and the sense that once contact is
          secured the body follows brutally. They should not become clean fang
          precision or stationary heavy-jaw fortification.

  - id: tail
    name: "Tail"
    name_es: "Cola"
    species:
      - "Naghii"
      - "Sauri"
    contact_logic: "Sweep, push, spoil, off-line collision, or flexible redirection depending on anatomy"
    combat_role: "Space denial, interruption, repositioning"
    damage_identity: "Displacement, disruption, side-angle impact"
    compatible_profiles:
      - "Interception"
      - "Line Control"
      - "Torsion"
      - "Interruption"
    restricted_profiles:
      - "Precision"
      - "Ricochet"
      - "Bastion"
    identity_notes: "Tail forms are excellent at changing lanes and angles. Some tails can also slam, but most are better at control and spoil than at precise or ballistic delivery."
    species_profile_expressions:
      - species: "Naghii"
        expression_id: "naghii_prehensile_tail"
        availability: "All Naghii"
        contact_logic: "Prehensile restraint, off-line contact, wrap, balance, and flexible redirection"
        compatible_profiles:
          - "Interception"
          - "Line Control"
          - "Torsion"
          - "Interruption"
        restricted_profiles:
          - "Impact"
          - "Unstoppable"
          - "Bastion"
        identity_notes: >
          Naghii tail Techniques should emphasize restraint, curved contact,
          angle theft, and crossing disruption rather than raw mass.
        stat_block:
          assignment: Primary
          attack_characteristic: Agility
          impact_characteristic: Tenacity
          reach: "1-2 m"
          damage_die: d8
          durability_formula: "5 per competency rank"
          potency_formula: "7 per competency rank"
          restriction: "Cannot use a two-handed weapon during the same activation when the tail is used as a primary weapon."
          additional_effect:
            trigger: "A.R. exceeds D.R. by 3 or more"
            options:
              - Knockdown
              - Off-Balance
            target_roll: "R.R. (Conditions)"
            severity_by_rank:
              - ranks: "1-2"
                severity: Minor
              - ranks: "3-4"
                severity: Moderate
              - ranks: "5-6"
                severity: Severe
      - species: "Sauri"
        expression_id: "sauri_heavy_tail"
        availability: "All Sauri"
        contact_logic: "Heavy lateral sweep, off-line collision, balance disruption, and lane denial"
        compatible_profiles:
          - "Impact"
          - "Line Control"
          - "Interception"
          - "Interruption"
        restricted_profiles:
          - "Precision"
          - "Ricochet"
          - "Shadow Pressure"
        identity_notes: >
          Sauri tail Techniques should emphasize heavy side pressure, sweeping
          disruption, and preventing clean passage around the body. They are
          less flexible than Naghii tail methods but carry more mass.

  - id: claw
    name: "Claw"
    name_es: "Garra"
    species:
      - "Drak'kai"
      - "Zarnag"
      - "Rokhart"
      - "Chelicer"
      - "Luphran"
      - "Ursari"
      - "Vesper"
      - "Lupinni"
      - "Erin"
      - "Talpi"
      - "Myo"
    contact_logic: "Rake, hook, slash, tear, or fast contact from short reach"
    combat_role: "Aggressive close pressure"
    damage_identity: "Cut, tear, opportunistic opening"
    compatible_profiles:
      - "Flow"
      - "Shadow Pressure"
      - "Rend"
      - "Skirmish"
    restricted_profiles:
      - "Bastion"
      - "Precision"
      - "Ricochet"
    identity_notes: "Claws sit naturally between light predation and tearing offense. They map strongly to mobile and invasive profiles."
    species_profile_expressions:
      - species: "Drak'kai"
        expression_id: "drakkai_grip_claws"
        availability: "All Drak'kai"
        contact_logic: "Functional grip, space control, and supplementary close pressure — handling and holding rather than raking or tearing"
        compatible_profiles:
          - "Line Control"
          - "Interception"
          - "Torsion"
          - "Interruption"
        restricted_profiles:
          - "Rend"
          - "Shadow Pressure"
          - "Charge"
        identity_notes: >
          Drak'kai claw Techniques should emphasize grip, control, and
          supplementary close pressure. They are not aggressive raking tools —
          they manage space, hold opponents in difficult positions, and support
          the bite or weapon strikes rather than dealing primary damage. Their
          most natural role is as an auxiliar surface that creates persistent
          positional problems rather than raw harm.
      - species: "Zarnag"
        expression_id: "zarnag_scavenger_claws"
        availability: "All Zarnag"
        contact_logic: "Fast raking harassment, opportunistic hooking, short-reach chaining, and messy close-contact tearing"
        compatible_profiles:
          - "Skirmish"
          - "Shadow Pressure"
          - "Rend"
          - "Unpredictability"
        restricted_profiles:
          - "Bastion"
          - "Precision"
          - "Ricochet"
        identity_notes: >
          Zarnag claw Techniques should emphasize close harassment, panic
          pressure, opportunistic tearing, and chained short-reach contact once
          an exchange loses cleanliness. They should not feel like elegant
          blade flow or careful point-exact weapon play.

  - id: shell
    name: "Shell"
    name_es: "Caparazon"
    species:
      - "Drak'kai"
    contact_logic: "Brace, cover, absorb, slam, or hold through mass and structure"
    combat_role: "Anchor, protect, absorb, occasional impact"
    damage_identity: "Protected endurance, blunt contact, defended collision"
    compatible_profiles:
      - "Bastion"
      - "Interception"
      - "Impact"
      - "Line Control"
    restricted_profiles:
      - "Shadow Pressure"
      - "Precision"
      - "Torsion"
    identity_notes: "Shells are structural. They naturally support holding, covering, and body-first impact, not deceptive or highly flexible play."

  - id: beak
    name: "Beak"
    name_es: "Pico"
    species:
      - "Rokhart"
    contact_logic: "Puncture, snap, peck, or hooked edge contact depending on form"
    combat_role: "Precise strike or tearing pick"
    damage_identity: "Puncture, cut, invasive point pressure"
    compatible_profiles:
      - "Perforation"
      - "Deflection"
      - "Rend"
      - "Precision"
    restricted_profiles:
      - "Bastion"
      - "Torsion"
      - "Volley"
    identity_notes: "Beaks can behave like points or sharp edges. They fit accuracy and tearing better than anchoring or flexible redirection."

  - id: trunk
    name: "Trunk"
    name_es: "Trompa"
    species:
      - "Loxod"
    contact_logic: "Grab, push, sweep, wrap, and short-range structural manipulation"
    combat_role: "Control, interruption, positional dominance"
    damage_identity: "Displacement, crush, redirection"
    compatible_profiles:
      - "Line Control"
      - "Torsion"
      - "Interruption"
      - "Bastion"
    restricted_profiles:
      - "Precision"
      - "Ricochet"
      - "Shadow Pressure"
    identity_notes: "Trunks excel at spatial authority and manipulative contact. They are poor fits for stealthy or ballistic profiles."

  - id: tusk
    name: "Tusk"
    name_es: "Colmillos"
    species:
      - "Loxod"
    contact_logic: "Committed forward puncture with body follow-through"
    combat_role: "Breakthrough, brutal entry"
    damage_identity: "Puncture, wedge force, structural opening"
    compatible_profiles:
      - "Perforation"
      - "Charge"
      - "Sunder"
      - "Unstoppable"
    restricted_profiles:
      - "Torsion"
      - "Ricochet"
      - "Bastion"
    identity_notes: "Tusks are excellent at forcing entry and breaking resistant lines, but they do not support flexible or ranged logic well."

  - id: horn
    name: "Horn"
    name_es: "Cuerno"
    species:
      - "Ceratox"
    contact_logic: "Forward-drive wedge, puncture, or heavy committed impact"
    combat_role: "Breakthrough, collision, structural breach"
    damage_identity: "Puncture, impact, breaking force"
    compatible_profiles:
      - "Perforation"
      - "Charge"
      - "Sunder"
      - "Impact"
    restricted_profiles:
      - "Shadow Pressure"
      - "Ricochet"
      - "Torsion"
    identity_notes: "Horns naturally bridge piercing and crashing entries. They are one of the clearest natural matches for committed assault profiles."

  - id: stinger
    name: "Stinger"
    name_es: "Aguijon"
    species:
      - "Formix"
      - "Chelicer"
    contact_logic: "Fast puncture delivery of invasive or degrading contact"
    combat_role: "Inject, weaken, punish brief openings"
    damage_identity: "Puncture, toxin, persistence"
    compatible_profiles:
      - "Perforation"
      - "Corrosion"
      - "Shadow Pressure"
      - "Precision"
    restricted_profiles:
      - "Bastion"
      - "Impact"
      - "Line Control"
    identity_notes: "Stingers are ideal for puncture plus hostile residue. They are usually too small or specialized for anchoring or blunt-force roles."

  - id: spines
    name: "Spines"
    name_es: "Puas"
    species:
      - "Erin"
    contact_logic: "Projected shard, repeated spine release, or embedded puncture"
    combat_role: "Ranged harassment or pressure"
    damage_identity: "Puncture, persistence, repeated ranged threat"
    compatible_profiles:
      - "Precision"
      - "Volley"
      - "Ricochet"
      - "Corrosion"
    restricted_profiles:
      - "Bastion"
      - "Torsion"
      - "Charge"
    identity_notes: "Quills and spines sit naturally in the ranged family. If they carry toxin or residue, Corrosion also fits well."

  - id: tongue
    name: "Tongue"
    name_es: "Lengua"
    species:
      - "Bufoni"
    contact_logic: "Lash, wrap, snap, redirect, fake line, or off-axis contact"
    combat_role: "Disruption, unusual angle entry, control"
    damage_identity: "Flexible contact, interference, angle theft"
    compatible_profiles:
      - "Torsion"
      - "Interruption"
      - "Unpredictability"
      - "Skirmish"
    restricted_profiles:
      - "Bastion"
      - "Perforation"
      - "Sunder"
    identity_notes: "Tongues and tendrils are ideal for weird contact geometry and timing spoils, but generally poor for rigid force-through profiles."

  - id: fluid_projection
    name: "Fluid Projection"
    name_es: "Fluidos Proyectados"
    species:
      - "Naghii"
      - "Formix"
      - "Chelicer"
    contact_logic: "Projected spit, acid, toxin, or pressurized biological discharge"
    combat_role: "Ranged weakening, harassment, residue delivery"
    damage_identity: "Precision hit, persistent degradation, repeated pressure"
    compatible_profiles:
      - "Precision"
      - "Volley"
      - "Ricochet"
      - "Corrosion"
    restricted_profiles:
      - "Bastion"
      - "Charge"
      - "Flow"
    identity_notes: "Fluid projection covers both clean targeted shots and degrading residues. Its profile spread depends on whether the biology emphasizes aim, cadence, rebound logic, or hostile substance."
    species_profile_expressions:
      - species: "Naghii"
        expression_id: "naghii_aliento_astral"
        name_es: "Aliento Astral"
        availability: "Saa-Naghii only"
        contact_logic: "Short-range phosphorescent venom projection; precise biological discharge with toxic persistence"
        compatible_profiles:
          - "Precision"
          - "Volley"
          - "Ricochet"
          - "Corrosion"
        restricted_profiles:
          - "Bastion"
          - "Charge"
          - "Flow"
        identity_notes: >
          Saa-Naghii projection Techniques should emphasize targeted venom
          delivery, persistent degradation, and controlled-range harassment.
          The projection is biological precision, not brute discharge.
        stat_block:
          assignment: Primary
          attack_characteristic: Agility
          impact_characteristic: Tenacity
          reach: "10 m"
          damage_die: d6
          durability_formula: "5 per competency rank"
          potency_formula: "7 per competency rank"
          additional_effect:
            trigger: "Target fails R.R. by 3 or more"
            effect: "Recurring damage at the start of each activation"
            severity_by_rank:
              - ranks: "1-2"
                recurring_damage: 1d4
              - ranks: "3-4"
                recurring_damage: 1d6
              - ranks: "5-6"
                recurring_damage: 1d8
        variant:
          group: naghii_biological_variant
          variant_id: saa
          rule: "Naghii players choose Kha or Saa at campaign start. Cannot have both Mordisco and Aliento Astral on the same character."

  - id: pincers
    name: "Pincers"
    name_es: "Tenazas"
    species:
      - "Manto"
    contact_logic: "Seize, clamp, crush, pin, or punish escape through rigid opposing force"
    combat_role: "Capture, hold, positional punishment"
    damage_identity: "Crush, retention, trap pressure"
    compatible_profiles:
      - "Interruption"
      - "Line Control"
      - "Impact"
      - "Sunder"
    restricted_profiles:
      - "Ricochet"
      - "Precision"
      - "Skirmish"
    identity_notes: "Pincers and crushing mandibles excel at committing to a target and denying clean escape. They are strong fits for stop-and-hold combat, not for light mobility or ballistic logic."
