      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: reactiva
    tipo_en_exploración: automática
    notas_diseño: >
      Especialización de inicio universal. Todo personaje comienza con Vigor en Nivel 1 / Novato.
      En combate se activa como reactiva cuando se acumula carga física sostenida.
      En exploración funciona de forma automática como condición de fondo durante esfuerzo prolongado.
    técnicas_habilitadas: []

