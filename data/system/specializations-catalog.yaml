    tipo_en_exploración: activa
    ejemplos_de_uso:
      - identificar si una vena de roca contiene mineral útil antes de excavar
      - evaluar si un túnel tiene riesgo real de colapso antes de avanzar por él
      - extraer una muestra de material con las herramientas disponibles sin derrumbar la cavidad
