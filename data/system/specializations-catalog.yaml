# Catálogo de especializaciones — Transcendence
# Nivel: diseño. No es contenido de corebook todavía.
# Fuente de autoridad del marco: data/system/specializations.yaml
#
# Campos por entrada:
#   nombre               — nombre canónico en español
#   nombre_en            — nombre canónico en inglés
#   categoría            — física | mental | social | artes-y-oficios | conocimiento
#   característica_asociada — característica vinculada para la T.E.
#   descripción_breve    — definición corta y funcional
#   descripción_completa — explicación amplia en tono de diseño; qué entrena, cómo se expresa y por qué existe
#   fantasía_de_uso      — qué fantasía práctica o narrativa habilita para el jugador
#   dominio_central      — descripción concisa de lo que entrena este dominio
#   cubre                — qué abarca (límite superior)
#   no_cubre             — qué queda fuera (límite inferior y lateral)
#   taxonomía.familia    — familia funcional amplia dentro de su atributo
#   taxonomía.subfamilia — agrupación más específica dentro de la familia
#   taxonomía.etiquetas  — etiquetas útiles para indexado, búsquedas o futura maquetación
#   taxonomía.modo_primario — expresión dominante: acción | reacción | interpretación | soporte | producción | presencia
#   taxonomía.objeto_de_interacción — qué suele afectar: cuerpo | entorno | objeto | criatura | grupo | conocimiento | self
#   relación_con_otros_dominios — dominios cercanos con los que suele confundirse o complementarse
#   criterio_de_uso      — cuándo el Narrador debería pedir esta especialización y no otra
#   contextos.combate    — aparece relevantemente en combate ATB
#   contextos.exploración — aparece relevantemente en exploración
#   contextos.narrativo  — aparece relevantemente en capa narrativa / social / tiempo libre
#   tipo_en_combate      — activa | reactiva | activa+reactiva | pasiva | no_aplica
#   tipo_en_exploración  — activa | reactiva | automática | no_aplica
#   ejemplos_de_uso      — lista breve de situaciones típicas donde esta especialización entra en juego
#   técnicas_habilitadas — lista de Técnicas conocidas que requieren esta especialización (vacía hasta redacción de Ch07)
#
# Nota sobre combates en movimiento (D-07):
#   Marcha aparece en combate como reactiva secundaria solo en escenarios de combat-in-movement.
#   La mecánica de combate en movimiento aún no existe — ver docs/pending.md D-07.

meta:
  version: "1.0"
  status: draft
  authority: data/system/specializations.yaml
  last_updated: "2026-04-20"
  total: 54
  intent: >
    This catalog is the authority layer for individual specializations. It should carry
    enough narrative, taxonomic, and scope information to support later corebook prose,
    character-creation references, and future technique prerequisites without redefining
    the specialization in multiple places.
  threshold_principle: >
    For any specialization test that is not opposed by another creature or rule-defined defense,
    the base threshold comes from the current environmental or scene condition. Distance, size,
    surface quality, instability, or other local factors adjust that base threshold instead of
    replacing it.
  local_modifier_scale: >
    Local penalties should usually remain within a short fixed range. -1 is a minor hindrance,
    -2 is a clear hindrance, and -3 is a severe local hindrance. Since each difficulty tier rises
    by 3 points, a -3 modifier is already equivalent to shifting one full tier. If local conditions
    would exceed that, the scene condition should usually rise or the action should become restricted
    instead of stacking open-ended penalties.
  artistic_domains_note: >
    Artistic performance disciplines are not currently fixed as Presence specializations. When they
    are formalized, they should live as future artistic domains within the broader Arts and Crafts
    space rather than as a default branch of social projection.

especializaciones:

  # ─────────────────────────────────────────────
  # FUERZA
  # Identidad: potencia bruta, salida explosiva, palanca física, fuerza corporal aplicada con intención.
  # ─────────────────────────────────────────────

  - nombre: Saltar
    nombre_en: Jumping
    categoría: física
    característica_asociada: Fuerza
    descripción_breve: proyectar el cuerpo con fuerza en espacio vertical u horizontal
    descripción_completa: >
      Saltar representa la capacidad de convertir fuerza corporal en desplazamiento explosivo.
      No es solo brincar: es medir impulso, apoyo, transferencia de masa y salida corporal
      para cruzar vacíos, ganar altura o irrumpir en una nueva posición. Existe como
      especialización porque permite distinguir a quien solo posee fuerza bruta de quien sabe
      convertirla en movimiento útil, repetible y técnicamente afinado.
    fantasía_de_uso: >
      Permite jugar personajes que irrumpen, salvan distancias imposibles, alcanzan posiciones
      ventajosas o usan el cuerpo como vector de entrada agresiva y decisiva.
    dominio_central: usar la fuerza para proyectar el cuerpo en espacio vertical u horizontal
    cubre: saltos, despegue explosivo, cruce forzado, movimiento basado en salto
    no_cubre: control aéreo, aterrizaje elegante, redirección corporal evasiva
    taxonomía:
      familia: locomoción física
      subfamilia: proyección corporal
      etiquetas: [movimiento, fuerza, cruce, impulso, verticalidad]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se solapa con Acrobacias cuando la atención se desplaza del impulso a la reorientación
      corporal, y con Trepar cuando el problema ya no es despegar sino ascender o sostenerse.
    criterio_de_uso: >
      Debe pedirse cuando el problema central es generar impulso y cubrir una distancia o altura
      mediante salida explosiva del cuerpo, no cuando el reto principal sea equilibrio, aterrizaje
      fino o control continuo del movimiento.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Saltar
      oposición: umbral por distancia o altura, no tirada enfrentada
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - apoyo corporal suficiente para impulsar el salto
        - espacio físico suficiente para ejecutar la salida cuando el entorno lo permita
      umbral_base:
        horizontal: 2 por metro
        vertical: 2 por cada medio metro
      penalizadores_comunes:
        - situación: armadura pesada
          modificador: "- (grado de la pieza + 1)"
        - situación: armadura intermedia
          modificador: "- (grado de la pieza)"
        - situación: terreno liso
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      modificadores_del_entorno: >
        La condición del entorno o de la escena establece el umbral base. El terreno, el clima,
        la superficie de impulso o la situación inmediata lo modifican o añaden penalizadores
        adicionales según el criterio del Narrador.
      reintento: >
        No existe reintento automático inmediato. Solo puede repetirse si la ficción genera una nueva
        oportunidad real de impulso y el fallo anterior no ha cerrado esa posibilidad.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - cruzar un hueco entre tejados antes de que colapse el apoyo
      - alcanzar una cornisa alta sin equipo especializado
      - irrumpir sobre un enemigo desde un desnivel cercano
    técnicas_habilitadas: []

  - nombre: Trepar
    nombre_en: Climbing
    categoría: física
    característica_asociada: Fuerza
    descripción_breve: ascender o descender superficies mediante colocación corporal basada en fuerza
    descripción_completa: >
      Trepar representa el uso técnico de la fuerza para sostener el cuerpo contra una superficie,
      redistribuir peso, buscar apoyo y ganar o perder altura con control. No es solo "ser fuerte":
      es saber cómo usar esa fuerza en agarres, palancas, apoyo de piernas y tracción continua.
      Existe para distinguir a quien puede cargar peso o golpear con potencia de quien puede convertir
      esa potencia en ascenso, sujeción y desplazamiento vertical sostenido.
    fantasía_de_uso: >
      Permite personajes que escalan muros, se aferran a bordes imposibles, ascienden bajo presión
      y usan la verticalidad como vía de infiltración, escape o reposicionamiento.
    dominio_central: ascender o descender superficies mediante colocación corporal basada en fuerza
    cubre: escalar, colgarse, izarse hacia arriba, descender bajo control
    no_cubre: equilibrio en superficies inestables, reposicionamiento acrobático, saltar
    taxonomía:
      familia: locomoción física
      subfamilia: ascenso y sujeción vertical
      etiquetas: [movimiento, escalada, tracción, verticalidad, apoyo]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se acerca a Saltar cuando el problema es alcanzar una superficie elevada, pero Trepar empieza
      cuando la cuestión ya no es despegar sino sostenerse y progresar contra la superficie. También
      se distingue de Equilibrio, que resuelve estabilidad, no ascenso.
    criterio_de_uso: >
      Debe pedirse cuando la dificultad principal sea progresar verticalmente, sostenerse en un apoyo
      difícil o controlar un descenso mediante fuerza corporal. No corresponde cuando el reto es
      desplazarse con fineza, redirigir el cuerpo en el aire o mantener postura sobre una base inestable.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Trepar
      oposición: umbral por superficie, apoyo y tramo de ascenso o descenso
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - una superficie o estructura con puntos de apoyo utilizables
        - contacto físico suficiente para iniciar el ascenso, descenso o suspensión
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La calidad de los apoyos,
        la inclinación, la altura del tramo y la estabilidad de la superficie ajustan ese valor.
      penalizadores_comunes:
        - situación: armadura pesada
          modificador: "- (grado de la pieza + 1)"
        - situación: armadura intermedia
          modificador: "- (grado de la pieza)"
        - situación: superficie húmeda
          modificador: "-1"
        - situación: superficie frágil o quebradiza
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Solo puede repetirse si el personaje conserva apoyo suficiente y el fallo anterior no provocó
        caída, pérdida del punto de agarre o cierre de la ruta.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - subir por una muralla erosionada antes de que llegue la patrulla
      - colgarse de un borde roto mientras cae escombro alrededor
      - descender una fachada con control sin equipo especializado
    técnicas_habilitadas: []

  - nombre: Lanzamiento
    nombre_en: Throwing
    categoría: física
    característica_asociada: Fuerza
    descripción_breve: proyectar objetos con fuerza, ángulo y transferencia corporal entrenados
    descripción_completa: >
      Lanzamiento representa el dominio técnico de arrojar algo con intención: no solo imprimir
      fuerza, sino alinear cuerpo, trayectoria, momento de suelta y propósito del impacto. Su ámbito
      incluye armas arrojadizas y objetos usados como proyección deliberada, siempre que el acto central
      sea lanzar con técnica corporal. Existe para separar la simple fuerza bruta de la capacidad de
      convertirla en una proyección útil, repetible y tácticamente significativa.
    fantasía_de_uso: >
      Permite personajes que abren distancia con precisión física, hostigan desde ángulos difíciles,
      improvisan proyectiles o convierten cualquier objeto adecuado en una amenaza real.
    dominio_central: lanzar con fuerza, ángulo y proyección entrenados
    cubre: objetos lanzados, armas arrojadizas, proyección a distancia mediante técnica
    no_cubre: sistemas de armas a distancia con mecánica propia, empuje bruto, concursos de agarre
    taxonomía:
      familia: proyección física
      subfamilia: lanzamiento corporal
      etiquetas: [proyección, distancia, fuerza, arma-arrojadiza, impacto]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se diferencia de competencias de arma porque Lanzamiento describe el dominio corporal de arrojar,
      no la maestría con cada familia de arma concreta. También se separa de Agarre: uno controla el
      objeto en contacto, el otro lo convierte en trayectoria.
    criterio_de_uso: >
      Debe pedirse cuando la acción central sea lanzar algo con técnica corporal para alcanzar un objetivo,
      abrir distancia o aplicar una proyección significativa. No corresponde a arcos, cerbatanas u otras
      armas con subsistema propio de disparo.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Lanzamiento
      oposición: >
        contra Defensa cuando se lanza contra una criatura en combate; contra umbral cuando el objetivo
        es un punto, un mecanismo o una distancia del entorno
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - un objeto arrojable o un arma arrojadiza adecuada
        - línea de lanzamiento suficiente para completar la trayectoria
      criterio_de_umbral: >
        Cuando no existe defensa activa, la condición del entorno o de la escena establece el umbral
        base. La distancia, el tamaño del objetivo y la estabilidad del punto de impacto lo ajustan.
      penalizadores_comunes:
        - situación: objeto improvisado pero arrojable
          modificador: "-1"
        - situación: objeto mal balanceado
          modificador: "-2"
        - situación: trayectoria parcialmente obstruida
          modificador: "-2"
        - situación: viento cruzado fuerte
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede repetirse si el personaje dispone de otro lanzamiento real y la ficción conserva línea,
        tiempo y recurso para hacerlo.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - arrojar un arma corta para detener una retirada breve
      - lanzar una cuerda con peso hacia un punto de anclaje accesible
      - proyectar una herramienta improvisada contra un mecanismo expuesto
    técnicas_habilitadas: []

  - nombre: Nadar
    nombre_en: Swimming
    categoría: física
    característica_asociada: Fuerza
    descripción_breve: mover el cuerpo en el agua mediante propulsión y control entrenados
    descripción_completa: >
      Nadar representa dominio corporal dentro de un medio que resiste cada movimiento,
      altera la respiración, castiga la orientación y multiplica el costo del esfuerzo.
      La especialización no cubre toda la supervivencia marítima, sino la capacidad concreta
      de desplazarse, sostenerse y maniobrar en agua abierta o sumergida con técnica real.
      Existe para separar a quien solo intenta sobrevivir en el agua de quien sabe operar en ella.
    fantasía_de_uso: >
      Permite personajes capaces de cruzar canales, infiltrarse por rutas acuáticas, combatir
      en bordes inundados o mantenerse funcionales donde otros pierden control y ritmo.
    dominio_central: mover el cuerpo a través del agua mediante propulsión y control entrenados
    cubre: nadar, mantenerse a flote, cruzar masas de agua, movimiento corporal subacuático
    no_cubre: control de respiración como sistema abstracto separado, adaptación climática, supervivencia marítima en sentido amplio
    taxonomía:
      familia: locomoción física
      subfamilia: desplazamiento acuático
      etiquetas: [agua, movimiento, propulsión, flotación, subacuático]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se complementa con Marcha cuando la travesía acuática pasa a ser desplazamiento sostenido,
      y con Aclimatación cuando el problema no es moverse en agua sino soportar el entorno
      hostil que la rodea.
    criterio_de_uso: >
      Debe pedirse cuando la dificultad principal sea desplazarse, mantenerse o maniobrar en agua.
      Si el reto central es soportar frío extremo, corriente hostil como presión ambiental o
      travesía sostenida de larga duración, puede requerir apoyo de otras especializaciones.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Nadar
      oposición: umbral por masa de agua, corriente, distancia y presión ambiental
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - contacto real con una masa de agua que exija propulsión corporal
        - capacidad de movimiento suficiente para ejecutar brazada, impulso o flotación
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La corriente, la visibilidad,
        la temperatura, la distancia a cubrir, la carga del personaje y la hostilidad del agua lo ajustan.
      penalizadores_comunes:
        - situación: armadura pesada
          modificador: "- (grado de la pieza + 2)"
        - situación: armadura intermedia
          modificador: "- (grado de la pieza + 1)"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Mientras el personaje siga a flote o conserve margen real para maniobrar, puede intentar nuevas
        tiradas; cada intento adicional sigue sometido a la presión del entorno y a sus consecuencias.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - cruzar un canal oscuro sin perder ritmo ni orientación
      - mantenerse a flote con equipo encima hasta alcanzar una salida
      - maniobrar bajo el agua para evitar una amenaza inmediata
    técnicas_habilitadas: []

  - nombre: Agarre
    nombre_en: Gripping
    categoría: física
    característica_asociada: Fuerza
    descripción_breve: sujetar, retener y aplicar fuerza por contacto con control entrenado
    descripción_completa: >
      Agarre representa el dominio de la fuerza cuando esta se expresa a través del contacto directo:
      sostener, inmovilizar, retener, torcer o impedir que algo se libere. No es una categoría universal
      de lucha, sino el control técnico de manos, brazos y cuerpo sobre un blanco, objeto o punto de apoyo.
      Existe para distinguir entre golpear con potencia y dominar físicamente algo que ya ha entrado en tu alcance.
    fantasía_de_uso: >
      Permite personajes que sujetan enemigos, controlan armas ajenas, estabilizan cargas peligrosas
      o impiden que una presa, objeto o adversario se les escape.
    dominio_central: agarre entrenado, sujeción, retención y aplicación de fuerza por contacto
    cubre: sostener, restringir, torcer, controlar mediante agarre, estabilizar peso a través de manos y cuerpo
    no_cubre: lucha libre como categoría universal de combate, concursos de fuerza bruta sin manejo técnico
    taxonomía:
      familia: control físico
      subfamilia: sujeción y retención
      etiquetas: [contacto, control, sujeción, restricción, retención]
      modo_primario: reacción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se relaciona con Trepar cuando el agarre se usa para sostenerse en superficie y con Lanzamiento
      cuando el control del objeto termina en una proyección. Se distingue de la fuerza bruta pura porque
      aquí importa retener, fijar y dominar por contacto.
    criterio_de_uso: >
      Debe pedirse cuando la acción central sea mantener contacto efectivo para inmovilizar, sostener,
      impedir una fuga o controlar algo mediante presión física directa. No corresponde a simples pruebas
      abstractas de "quién es más fuerte" sin manejo técnico del contacto.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Agarre
      oposición: >
        prueba enfrentada cuando otra criatura resiste activamente; umbral cuando el objetivo es sostener,
        estabilizar o retener algo sin oposición viva directa
      tipo_de_accion:
        combate: activa o reactiva
        exploración: activa
      requisitos:
        - contacto físico directo con el blanco, objeto o punto de apoyo
        - una posición corporal que permita aplicar fuerza de retención
      criterio_de_umbral: >
        Cuando no hay resistencia activa, la condición del entorno o de la escena establece el umbral
        base. El peso, la inestabilidad, la superficie de contacto y la presión que intenta romper la
        sujeción lo ajustan.
      penalizadores_comunes:
        - situación: superficie resbaladiza o blanco cubierto de fluido
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
        - situación: agarre comprometido o posición inestable
          modificador: "-2"
      reintento: >
        Un fallo no concede un nuevo intento automático en el mismo instante. Solo puede repetirse si el
        personaje conserva alcance, contacto o una nueva ventana real para fijar la sujeción.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa+reactiva
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - inmovilizar el brazo de un agresor antes de que complete su acción
      - sostener a un aliado que resbala desde un borde estrecho
      - mantener cerrada una puerta o mecanismo mientras otro personaje actúa
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # AGILIDAD
  # Identidad: fineza corporal, coordinación, ejecución limpia, movimiento controlado, equilibrio responsivo.
  # ─────────────────────────────────────────────

  - nombre: Acrobacias
    nombre_en: Acrobatics
    categoría: física
    característica_asociada: Agilidad
    descripción_breve: maniobrar el cuerpo con coordinación precisa a través de movimientos dinámicos complejos
    descripción_completa: >
      Acrobacias representa el control del cuerpo como instrumento de movimiento complejo: rodar,
      redirigir, invertir impulso y navegar espacios difíciles con coordinación entrenada y continuidad
      de movimiento. No es fuerza explosiva ni equilibrio estático — es la capacidad de transformar
      el propio cuerpo en un sistema fluido de respuesta y adaptación dinámica. Existe para distinguir
      al personaje que puede ejecutar movimientos técnicamente difíciles de aquel que simplemente
      posee fuerza o velocidad sin refinamiento.
    fantasía_de_uso: >
      Permite personajes que evaden ataques con movimiento elegante, atraviesan espacios hostiles o
      complejos sin perder ritmo, y transforman cada obstáculo físico en una oportunidad de
      reposicionamiento.
    dominio_central: movimiento corporal complejo mediante coordinación entrenada
    cubre: volteretas, rollos, movimiento evasivo, redirección corporal dinámica, control del cuerpo en movimiento
    no_cubre: equilibrio estático, ocultación silenciosa, técnica ecuestre, impulso de salida explosivo
    taxonomía:
      familia: locomoción física
      subfamilia: coordinación y redirección corporal
      etiquetas: [movimiento, coordinación, evasión, redirección, control-dinámico]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se acerca a Saltar cuando el problema es cubrir distancia mediante impulso, pero Acrobacias
      empieza donde Saltar termina — en el control aéreo, la redirección y la recuperación.
      Se distingue de Equilibrio en que Acrobacias es movimiento activo complejo, no estabilidad
      sostenida sobre una base difícil.
    criterio_de_uso: >
      Debe pedirse cuando el reto requiera coordinar el cuerpo en movimientos dinámicos complejos:
      evasión, rollos, redirección, paso por espacios con obstáculos múltiples. No corresponde cuando
      el problema central sea cubrir distancia por impulso (Saltar) o mantenerse estable sin moverse
      (Equilibrio).
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Acrobacias
      oposición: >
        prueba enfrentada cuando se usa para responder activamente a una presión física directa;
        umbral cuando el reto proviene del entorno o de un recorrido complejo
      tipo_de_accion:
        combate: activa o reactiva
        exploración: activa
      requisitos:
        - espacio corporal suficiente para ejecutar la maniobra
        - movilidad funcional para rodar, redirigir o amortiguar el movimiento
      criterio_de_umbral: >
        Cuando no hay oposición activa, la condición del entorno o de la escena establece el umbral
        base. La complejidad de la maniobra, la estrechez del espacio y la continuidad del movimiento
        lo ajustan.
      penalizadores_comunes:
        - situación: armadura pesada
          modificador: "- (grado de la pieza + 2)"
        - situación: armadura intermedia
          modificador: "- (grado de la pieza + 1)"
        - situación: espacio estrecho o maniobra interrumpida
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Solo puede repetirse si el personaje conserva espacio, impulso o una nueva ventana real para
        ejecutar la maniobra.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa+reactiva
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - rodar para absorber una caída desde una cornisa sin perder el ritmo de movimiento
      - pasar a través de una sala con obstáculos mecánicos en movimiento sin detenerse
      - esquivar un ataque con redirección corporal y recuperar posición en el mismo movimiento
    técnicas_habilitadas: []

  - nombre: Destreza
    nombre_en: Dexterity
    categoría: física
    característica_asociada: Agilidad
    descripción_breve: ejecutar manipulaciones técnicas finas con control preciso de manos y cuerpo
    descripción_completa: >
      Destreza representa el control refinado de manos, dedos y cuerpo en tareas que requieren exactitud
      delicada — no fuerza, no velocidad amplia, sino la capacidad de ejecutar manipulaciones técnicas
      sin error en situaciones que no permiten descuido. El médico suturando, el ladrón forzando una
      cerradura, el espadachín colocando la punta exactamente donde debe ir: todos confían en destreza
      entrenada. Existe para distinguir la capacidad de actuar con finura técnica de la capacidad de
      moverse con coordinación amplia de cuerpo entero.
    fantasía_de_uso: >
      Permite personajes que abren cerraduras imposibles, realizan cirugías de campo, manipulan
      mecanismos ocultos o ejecutan cualquier tarea que requiera manos educadas en lugar de fuerza
      o agilidad corporal amplia.
    dominio_central: precisión motora fina y control corporal delicado
    cubre: manipulaciones precisas pequeñas, uso técnico de las manos, ejecución delicada bajo presión
    no_cubre: acrobacias de cuerpo entero, sigilo como ocultación, movimiento atlético amplio, hurto como acto de sustracción
    taxonomía:
      familia: control físico
      subfamilia: precisión motora fina
      etiquetas: [manos, precisión, manipulación, técnica-fina, control]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se confunde con Hurto cuando la acción involucra sustraer algo: Destreza es la ejecución técnica
      manual, Hurto es la intención y oportunidad de obtener algo sin ser detectado. Se distingue de
      Acrobacias en que Destreza es control fino de manos, no coordinación del cuerpo en movimiento.
    criterio_de_uso: >
      Debe pedirse cuando el reto sea ejecutar una acción que requiera precisión manual fina: manipular
      un objeto difícil, operar un mecanismo delicado, colocar algo exactamente donde debe ir bajo
      presión. No corresponde cuando el reto sea velocidad de movimiento corporal amplio, sigilo o
      sustracción.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Destreza
      oposición: >
        umbral en la mayoría de usos; prueba enfrentada solo cuando otra criatura responde
        activamente a la misma manipulación en el mismo instante
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - acceso manual suficiente al objeto, mecanismo o zona de trabajo
        - tiempo funcional mínimo para completar la manipulación
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. El tamaño de la pieza,
        la delicadeza de la operación, la calidad de las herramientas y la presión temporal lo ajustan.
      penalizadores_comunes:
        - situación: herramientas improvisadas
          modificador: "-1"
        - situación: trabajo en oscuridad parcial o visibilidad reducida
          modificador: "-2"
        - situación: posición incómoda o acceso restringido
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede intentarse de nuevo si el fallo no rompe el mecanismo, no consume el recurso crítico y
        la ficción deja una nueva oportunidad real para manipular.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - forzar una cerradura de alta calidad sin herramienta especializada
      - estabilizar una herida en campo con equipo improvisado bajo presión
      - manipular un mecanismo expuesto desde una posición difícil sin activar sus contrapesos
    técnicas_habilitadas: []

  - nombre: Equilibrio
    nombre_en: Balance
    categoría: física
    característica_asociada: Agilidad
    descripción_breve: mantener la estabilidad corporal cuando el entorno o una fuerza externa desafía la postura
    descripción_completa: >
      Equilibrio representa la capacidad de sostenerse y mantenerse funcional cuando el suelo, la
      superficie o las fuerzas externas trabajan contra la postura del personaje. No es un reflejo
      pasivo — es un sistema activo de ajuste corporal constante que permite operar con normalidad
      donde otros pierden el pie. Existe para distinguir al personaje que puede actuar en condiciones
      desequilibrantes de quien solo funciona en terreno sólido y predecible.
    fantasía_de_uso: >
      Permite personajes que actúan con normalidad sobre superficies inestables, resisten empujes y
      desequilibrios, y mantienen capacidad táctica donde el entorno penaliza el movimiento o la
      postura.
    dominio_central: mantener la estabilidad corporal y la postura controlada
    cubre: superficies inestables, apoyos estrechos, resistir pérdida de equilibrio, postura controlada bajo desequilibrio
    no_cubre: estabilidad emocional o mental, silencio de movimiento, control montado, coordinación en movimiento complejo
    taxonomía:
      familia: locomoción física
      subfamilia: estabilidad y postura
      etiquetas: [estabilidad, postura, reacción, superficies-inestables, resistencia]
      modo_primario: reacción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se acerca a Acrobacias cuando el personaje se mueve activamente en condiciones difíciles, pero
      Equilibrio resuelve la estabilidad sostenida — no el movimiento complejo ni la redirección corporal.
      Se distingue de Tolerancia, que es resistencia al colapso fisiológico interno, no a la pérdida de
      postura por condición externa.
    criterio_de_uso: >
      Debe pedirse cuando el problema central sea no perder el pie o la postura ante una condición
      externa: superficie inestable, sacudida, desequilibrio forzado. No corresponde cuando el reto
      sea moverse con coordinación compleja, soportar daño físico o resistir presión mental.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Equilibrio
      oposición: >
        prueba enfrentada cuando otra criatura intenta desequilibrar directamente; umbral cuando la
        amenaza proviene del entorno o de una fuerza impersonal
      tipo_de_accion:
        combate: reactiva
        exploración: reactiva
      requisitos:
        - una base de apoyo o contacto desde la que pueda sostenerse la postura
        - capacidad de reacción corporal suficiente para corregir la pérdida de estabilidad
      criterio_de_umbral: >
        Cuando no hay oposición activa, la condición del entorno o de la escena establece el umbral
        base. La estrechez del apoyo, la violencia de la sacudida y la inestabilidad de la superficie
        lo ajustan.
      penalizadores_comunes:
        - situación: superficie húmeda o móvil
          modificador: "-1"
        - situación: apoyo estrecho o deformado
          modificador: "-2"
        - situación: armadura pesada
          modificador: "- (grado de la pieza + 1)"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Se repite solo si aparece una nueva pérdida de estabilidad. Un mismo evento de desequilibrio
        no concede intentos adicionales ilimitados.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: reactiva
    tipo_en_exploración: reactiva
    ejemplos_de_uso:
      - mantenerse operativo en cubierta de un barco durante una tormenta
      - resistir un empuje intencional sin perder posición de combate
      - cruzar una viga estrecha sobre vacío sin reducir el ritmo de avance
    técnicas_habilitadas: []

  - nombre: Equitación
    nombre_en: Riding
    categoría: física
    característica_asociada: Agilidad
    descripción_breve: controlar y actuar desde una montura con coordinación técnica bajo presión
    descripción_completa: >
      Equitación representa el dominio práctico de operar desde un ser vivo en movimiento: leer su
      respuesta, ajustar el cuerpo para mantenerse estable, dirigir sin perder el control y actuar con
      eficacia desde una posición que cambia constantemente. No es simplemente saber montar — es la
      capacidad de que la montura y el jinete funcionen como un solo sistema bajo presión. Existe para
      distinguir al personaje que puede usar una montura tácticamente de quien solo puede desplazarse
      en ella en condiciones ideales.
    fantasía_de_uso: >
      Permite personajes que combaten desde el lomo, realizan maniobras de caballería, persiguen o
      huyen con ventaja real, y usan la montura como extensión táctica del personaje.
    dominio_central: controlar y actuar desde una montura mediante coordinación corporal entrenada
    cubre: movimiento montado, estabilidad montada, maniobra montada, posicionamiento de combate montado
    no_cubre: vínculo con animales como tal, manejo amplio de animales, entrenamiento de la montura, liderazgo sobre compañeros
    taxonomía:
      familia: locomoción física
      subfamilia: control montado
      etiquetas: [montura, caballería, control, coordinación-montada, combate-montado]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se separa de Domesticación — Domesticación cubre el vínculo con animales mediante aura y manejo
      instintivo, Equitación cubre el control técnico en movimiento activo. Se distingue de Equilibrio
      en que la estabilidad sobre la montura tiene su propio sistema de coordinación dinámica que
      Equilibrio no modela.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea el control técnico de la montura en movimiento: maniobrar,
      mantener el control bajo presión, actuar tácticamente desde la silla. No corresponde cuando el
      problema sea el vínculo con el animal, su entrenamiento en sentido amplio, o simplemente
      trasladarse en condiciones ideales.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Equitación
      oposición: >
        umbral cuando el reto proviene del terreno, la velocidad o la maniobra; prueba enfrentada solo
        si otra criatura intenta desestabilizar directamente la montura o al jinete
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - una montura disponible y funcional
        - control básico de silla, rienda o punto de sujeción equivalente
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La velocidad, la brusquedad
        del giro, el terreno y la presión recibida por la montura lo ajustan.
      penalizadores_comunes:
        - situación: montura agitada o herida
          modificador: "-2"
        - situación: terreno irregular o resbaladizo
          modificador: "-2"
        - situación: maniobra cerrada a alta velocidad
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede repetirse mientras la montura conserve control funcional y la maniobra no haya derivado
        ya en caída, desbocamiento o pérdida de posición.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - mantener el control de la montura durante un combate en campo abierto
      - girar en seco para cortar el paso a un objetivo que huye
      - mantenerse en silla durante una embestida sin perder el arma ni el ángulo de ataque
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # TENACIDAD
  # Identidad: resistencia corporal, funcionamiento sostenido, persistencia bajo estrés, supervivencia del esfuerzo interno o externo.
  # ─────────────────────────────────────────────

  - nombre: Marcha
    nombre_en: March
    categoría: física
    característica_asociada: Tenacidad
    descripción_breve: mantener locomoción sostenida y ritmo de desplazamiento durante períodos extensos
    descripción_completa: >
      Marcha representa la capacidad de cubrir distancia durante períodos prolongados sin colapsar
      el ritmo ni agotar el cuerpo antes de llegar. No es velocidad explosiva ni esfuerzo bruto —
      es eficiencia de paso, control del gasto energético y persistencia del movimiento cuando el
      terreno, el tiempo o la distancia trabajan en contra. Existe para distinguir al personaje que
      puede llegar a destino en condición funcional del que llega exhausto o no llega.
    fantasía_de_uso: >
      Permite personajes que cubren grandes distancias sin penalización, mantienen el ritmo del grupo,
      llegan preparados donde otros llegan agotados, y sostienen movimiento en condiciones que degradan
      a quienes no han entrenado el paso.
    dominio_central: locomoción sostenida en el tiempo
    cubre: ritmo de viaje, movimiento prolongado, transportarse a lo largo de la distancia, mantener el paso
    no_cubre: explosiones de esfuerzo bruto, adaptación climática, soportar dolor severo o shock fisiológico
    taxonomía:
      familia: resistencia física
      subfamilia: locomoción sostenida
      etiquetas: [desplazamiento, resistencia, ritmo, distancia, travesía]
      modo_primario: automático
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se complementa con Aclimatación cuando el entorno hostil agrava el coste del viaje, y con
      Orientación cuando el problema no es el paso sino la dirección. Marcha cubre el acto de
      desplazarse; las demás cubren las condiciones que lo complican o el deterioro que el trayecto produce.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea mantener o completar un desplazamiento prolongado sin
      degradar la condición funcional del personaje. No corresponde a velocidad explosiva, esfuerzo
      bruto de corta duración o adaptación ambiental.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Marcha
      oposición: >
        normalmente contra umbral por distancia, ritmo exigido y presión de escena; solo pasa a
        prueba enfrentada si otra criatura fuerza directamente el colapso del desplazamiento
      tipo_de_accion:
        combate: reactiva
        exploración: automática
      requisitos:
        - que exista desplazamiento sostenido real, no solo una maniobra breve
        - que el personaje mantenga capacidad funcional de avance a lo largo del tramo
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La longitud del tramo,
        la irregularidad del terreno, la carga del equipo y el ritmo exigido lo ajustan.
      penalizadores_comunes:
        - situación: carga pesada sostenida
          modificador: "-2"
        - situación: terreno roto, blando o inestable
          modificador: "-2"
        - situación: paso forzado sin pausa suficiente
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Marcha se vuelve a evaluar por nuevos tramos, cambios de ritmo o prolongación del esfuerzo.
        Un fallo no reinicia el viaje: arrastra degradación funcional mientras la travesía continúe.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: reactiva
    tipo_en_exploración: automática
    notas_diseño: >
      Puede elegirse como especialización inicial universal de Tenacidad.
      En combate aparece solo como reactiva secundaria en escenarios de combate en movimiento (persecuciones,
      desplazamiento sostenido durante combate). La mecánica de combate en movimiento aún no existe — ver D-07.
    ejemplos_de_uso:
      - completar una jornada de viaje accidentado sin penalización de fatiga al llegar
      - mantener el ritmo de un grupo en movimiento forzado durante la noche
      - cubrir distancia a paso sostenido bajo carga sin perder condición de combate al final
    técnicas_habilitadas: []

  - nombre: Aclimatación
    nombre_en: Acclimatization
    categoría: física
    característica_asociada: Tenacidad
    descripción_breve: adaptar el cuerpo para funcionar en entornos extremos o condiciones ambientales hostiles
    descripción_completa: >
      Aclimatación representa la capacidad del cuerpo de ajustarse y funcionar con normalidad en
      condiciones que degradan a quien no está preparado: frío extremo, calor agobiante, altitud,
      humedad severa, atmósferas hostiles. No es supervivencia táctica ni resistencia al dolor —
      es la preparación fisiológica que permite que el entorno no imponga penalizaciones mientras
      otros las acumulan. Existe para distinguir al personaje que puede operar en cualquier condición
      climática del que necesita condiciones ideales para rendir.
    fantasía_de_uso: >
      Permite personajes que funcionan en montañas nevadas, desiertos hostiles o atmósferas tóxicas
      sin la degradación constante que esos entornos imponen a quienes no los han entrenado.
    dominio_central: adaptar el cuerpo a entornos hostiles o extremos
    cubre: funcionar en frío, calor, altitud, humedad, atmósfera severa, adaptación ambiental sostenida
    no_cubre: ritmo de viaje en sí, esfuerzo bruto, resistencia al dolor no relacionada con el entorno
    taxonomía:
      familia: resistencia física
      subfamilia: adaptación ambiental
      etiquetas: [entorno, adaptación, clima, resistencia-ambiental, condición]
      modo_primario: automático
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Complementa a Tolerancia en escenarios extremos: Aclimatación cubre la condición ambiental
      (no debilitarse por el entorno), Tolerancia cubre la respuesta fisiológica al daño ya recibido.
      Se distingue de Supervivencia, que es el juicio práctico de cómo actuar en campo hostil,
      no la resistencia del cuerpo al entorno.
    criterio_de_uso: >
      Debe pedirse cuando el entorno imponga condiciones que degraden físicamente al personaje:
      temperatura extrema, altitud, humedad severa, atmósfera hostil. No corresponde a supervivencia
      táctica, rastreo, resistencia al dolor o adaptación emocional.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Aclimatación
      oposición: umbral por condición ambiental hostil, no tirada enfrentada
      tipo_de_accion:
        combate: reactiva
        exploración: automática
      requisitos:
        - exposición real a una condición ambiental hostil o extrema
        - tiempo o contacto suficiente para que el entorno empiece a degradar al personaje
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Temperatura, altitud,
        humedad, atmósfera agresiva y duración de la exposición ajustan ese valor.
      penalizadores_comunes:
        - situación: exposición súbita sin adaptación previa
          modificador: "-2"
        - situación: ropa, refugio o protección ambiental comprometidos
          modificador: "-2"
        - situación: transición brusca entre condiciones opuestas
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede volver a evaluarse mientras la exposición continúe o cambie de intensidad. Un fallo no
        borra el proceso de adaptación: deja consecuencias activas mientras el entorno siga presionando.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: reactiva
    tipo_en_exploración: automática
    notas_diseño: >
      Puede elegirse como especialización inicial universal de Tenacidad.
      Complementa a Tolerancia en escenarios extremos: Aclimatación cubre la condición ambiental
      (no debilitarse por el entorno), Tolerancia cubre la respuesta fisiológica al daño recibido.
    ejemplos_de_uso:
      - operar con eficacia en alta montaña sin penalización por altitud
      - mantener funcionalidad en un desierto durante la jornada de mayor calor
      - atravesar una zona de atmósfera sulfurosa sin acumular daño ambiental progresivo
    técnicas_habilitadas: []

  - nombre: Tolerancia
    nombre_en: Tolerance
    categoría: física
    característica_asociada: Tenacidad
    descripción_breve: soportar el dolor, el estrés fisiológico y el castigo corporal acumulado sin colapsar la función
    descripción_completa: >
      Tolerancia representa la capacidad de seguir funcionando cuando el cuerpo ya está dañado,
      intoxicado, presionado o afligido. No es indiferencia al dolor — es la disciplina corporal
      de mantenerse operativo a pesar de él. Cubre el rango de aflicciones físicas que van más allá
      del esfuerzo: heridas activas, venenos, estados degradantes, castigo acumulado de múltiples
      fuentes. Existe para distinguir al personaje que puede seguir actuando bajo presión fisiológica
      real del que colapsa en cuanto el cuerpo empieza a fallar.
    fantasía_de_uso: >
      Permite personajes que siguen en pie cuando deberían estar fuera de combate, resisten efectos
      degradantes y actúan con eficacia en condiciones que ya habrían inutilizado a la mayoría.
    dominio_central: soportar el dolor, el estrés interno, el castigo fisiológico y la agravación corporal acumulada
    cubre: soportar dolor, resistir el colapso, mantenerse funcional con aflicciones físicas, soportar múltiples cargas corporales
    no_cubre: colapso emocional, control del pánico, calma bajo presión social
    taxonomía:
      familia: resistencia física
      subfamilia: resistencia al castigo fisiológico
      etiquetas: [dolor, resistencia, aflicción, castigo, funcionalidad-bajo-daño]
      modo_primario: reacción
      objeto_de_interacción: self
    relación_con_otros_dominios: >
      Se distingue de Aclimatación — Aclimatación resiste las condiciones del entorno, Tolerancia
      resiste el daño ya recibido o los estados fisiológicos activos. Se relaciona con Contención
      cuando el sufrimiento amenaza colapsar también la función mental, pero Tolerancia evita ante
      todo el colapso funcional del cuerpo: seguir actuando pese a dolor, aflicción o degradación
      fisiológica ya presentes.
    criterio_de_uso: >
      Debe pedirse cuando el personaje deba mantenerse funcional pese a aflicciones físicas activas:
      dolor, heridas abiertas, venenos, estados degradantes acumulados. Si la pregunta principal es
      si el cuerpo sigue funcionando, corresponde Tolerancia. No corresponde a condición ambiental,
      colapso emocional o resistencia de desplazamiento sostenido.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Tolerancia
      oposición: >
        normalmente contra umbral por dolor, aflicción y castigo fisiológico acumulado; puede
        interactuar con tiradas hostiles o efectos ya activos cuando la fuente del deterioro tenga
        una oposición definida por otra regla
      tipo_de_accion:
        combate: reactiva
        exploración: reactiva
      requisitos:
        - que exista sufrimiento corporal, aflicción o degradación fisiológica activa
        - que el personaje siga intentando actuar o mantenerse funcional bajo esa presión
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base cuando no hay oposición
        activa definida. El número de aflicciones, la intensidad del dolor y la duración del castigo
        corporal ajustan ese valor.
      penalizadores_comunes:
        - situación: herida abierta, sangrado o dolor agudo
          modificador: "-2"
        - situación: cada aflicción física activa adicional más allá de la primera
          modificador: "-1"
        - situación: falta de tratamiento o alivio inmediato
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Se vuelve a evaluar cuando aparece una nueva oleada de dolor, una nueva aflicción o una acción
        crítica bajo castigo corporal. El fallo previo sigue pesando mientras el cuerpo permanezca degradado.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: reactiva
    tipo_en_exploración: reactiva
    notas_diseño: >
      Puede elegirse como especialización inicial universal de Tenacidad.
    ejemplos_de_uso:
      - seguir actuando en combate con una herida que ya debería haber sacado al personaje
      - resistir el efecto paralizante de una toxina lo suficiente para completar una acción crítica
      - mantenerse en pie y funcional con múltiples aflicciones acumuladas al final de una escena larga
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # ASTUCIA
  # Identidad: oportunismo, inteligencia adaptativa, inferencia rápida, explotación situacional, resolución de problemas indirecta.
  # ─────────────────────────────────────────────

  - nombre: Orientación
    nombre_en: Navigation
    categoría: mental
    característica_asociada: Astucia
    descripción_breve: determinar posición, dirección y ruta en el espacio mediante lectura del entorno
    descripción_completa: >
      Orientación representa la capacidad de entender dónde se está y cómo llegar a donde se necesita
      ir, leyendo el entorno — terreno, astros, marcas conocidas, patrones espaciales — para construir
      una imagen funcional del espacio. No es memoria de mapas académicos ni rastreo de pisadas: es
      el juicio de campo que permite moverse sin perderse. Existe para distinguir al personaje que
      puede navegar por entornos desconocidos del que necesita un guía o un mapa previo.
    fantasía_de_uso: >
      Permite personajes que no se pierden, encuentran rutas alternas cuando la principal está
      bloqueada, y convierten la lectura del terreno en una ventaja táctica y de exploración.
    dominio_central: entender la dirección, posición y estructura de rutas
    cubre: navegación, elección de rutas, evitar perderse, dirección espacial
    no_cubre: seguir rastros de otro, logística de supervivencia, interpretación ambiental profunda
    taxonomía:
      familia: cognición adaptativa
      subfamilia: navegación y lectura espacial
      etiquetas: [navegación, dirección, espacio, terreno, ruta]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Rastreo — Rastreo reconstruye el historial de movimiento de otro, Orientación
      resuelve la propia posición y dirección de avance. Se complementa con Geografía cuando el
      conocimiento formal de regiones apoya la lectura de campo.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea saber dónde se está o encontrar el camino correcto.
      No corresponde cuando el problema sea seguir a alguien específico, sobrevivir en campo o leer
      el significado de marcas simbólicas.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Orientación
      oposición: umbral por complejidad espacial, referencia disponible y presión de escena
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un entorno cuya posición, dirección o ruta no sea evidente por sí sola
        - referentes, lectura del terreno o margen suficiente para construir una orientación funcional
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La visibilidad, la
        repetición del terreno, la ausencia de referentes y la urgencia del desplazamiento lo ajustan.
      penalizadores_comunes:
        - situación: niebla, oscuridad o visibilidad rota
          modificador: "-2"
        - situación: entorno laberíntico, uniforme o sin referentes
          modificador: "-2"
        - situación: presión de tiempo o persecución
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando cambie la información disponible, el terreno o el punto de referencia.
        Un fallo puede dejar desorientación residual y no se rehace limpiamente sin nueva lectura de campo.
    contextos:
      combate: false
      exploración: true
      narrativo: false
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - encontrar la salida de un bosque sin referentes conocidos después de una persecución
      - determinar la dirección correcta de avance en una región sin mapas disponibles
      - reconocer cuándo el grupo está dando vueltas sin saberlo
    técnicas_habilitadas: []

  - nombre: Rastreo
    nombre_en: Tracking
    categoría: mental
    característica_asociada: Astucia
    descripción_breve: seguir huellas, señales y marcas de paso para reconstruir un historial de movimiento
    descripción_completa: >
      Rastreo representa la capacidad de leer el mundo como un registro de lo que pasó: pisadas,
      ramas rotas, perturbaciones del suelo, señales de presencia reciente. No es orientación de
      ruta ni intuición de peligro — es la reconstrucción deductiva de un historial de movimiento
      a través de las marcas que deja en el entorno. Existe para distinguir al personaje que puede
      seguir a alguien o algo del que solo puede moverse en el espacio sin leerlo.
    fantasía_de_uso: >
      Permite personajes que localizan presas, siguen fugitivos, reconstruyen lo que ocurrió en un
      lugar y convierten el terreno en una fuente de información táctica y narrativa.
    dominio_central: seguir huellas, señales y pasos a través del mundo
    cubre: pisadas, sendas, señales de perturbación, historial de movimiento
    no_cubre: orientación de ruta general, supervivencia amplia de campo, pura intuición
    taxonomía:
      familia: cognición adaptativa
      subfamilia: lectura de huellas e historial
      etiquetas: [rastreo, huellas, señales, seguimiento, historial]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Orientación — Orientación resuelve la propia posición y dirección, Rastreo
      reconstruye el historial de movimiento de otro. Se complementa con Percepción cuando las
      marcas son sutiles y difíciles de notar, y con Supervivencia cuando el seguimiento ocurre en
      entornos que demandan juicio práctico adicional.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea seguir a alguien o algo mediante las marcas que dejó.
      No corresponde cuando el problema sea encontrar el propio camino, detectar peligro próximo sin
      historial visible o leer el entorno en sentido amplio.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Rastreo
      oposición: umbral por claridad de huellas, interrupción del rastro y presión de escena
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un historial de paso realmente inscrito en el entorno
        - tiempo o continuidad suficiente para leer señales en vez de actuar a ciegas
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La frescura de las huellas,
        el tipo de suelo, el clima y cualquier intento de ocultación ajustan ese valor.
      penalizadores_comunes:
        - situación: terreno duro, seco o poco receptivo a marcas
          modificador: "-1"
        - situación: lluvia, tránsito o alteración que degrada el rastro
          modificador: "-2"
        - situación: borrado deliberado o rastro fragmentado
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando aparezcan nuevas huellas, cambie el terreno o el rastro reaparezca.
        Un fallo puede significar pérdida temporal o definitiva de la pista actual.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - seguir el rastro de una criatura herida a través de terreno húmedo
      - determinar cuántas personas pasaron por un punto y hacia dónde fueron
      - reconocer que alguien borró deliberadamente sus huellas y estimar cómo lo hizo
    técnicas_habilitadas: []

  - nombre: Intuición
    nombre_en: Intuition
    categoría: mental
    característica_asociada: Astucia
    descripción_breve: inferir motivos ocultos, peligro o estructura no visible antes de que se manifiesten
    descripción_completa: >
      Intuición representa la capacidad de llegar a conclusiones útiles sin evidencia explícita:
      leer entre líneas, sentir que algo está mal antes de poder explicar por qué, detectar la
      disonancia que precede al peligro o al engaño. No es percepción sensorial formal ni empatía
      emocional — es la inferencia adaptativa que opera cuando la información directa no está
      disponible. Existe para distinguir al personaje que puede actuar sobre sospechas fundadas
      del que solo reacciona cuando el problema ya es obvio.
    fantasía_de_uso: >
      Permite personajes que detectan trampas sociales antes de caer en ellas, sienten el momento
      en que algo cambia en una situación, y actúan sobre lecturas rápidas que resultan ser
      correctas.
    dominio_central: sentido inferencial rápido sobre motivos ocultos, peligro o estructura no vista
    cubre: lectura visceral, sospecha indirecta, detectar cuando algo está mal
    no_cubre: percepción formal de objetos o detalles, interpretación académica, empatía emocional
    taxonomía:
      familia: cognición adaptativa
      subfamilia: inferencia y lectura indirecta
      etiquetas: [inferencia, sospecha, lectura-rápida, peligro, motivos]
      modo_primario: reacción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Percepción — Percepción nota lo que está ahí, Intuición infiere lo que no
      se ve directamente. Se separa de Instinto, que es respuesta primaria ligada a la esencia
      innata, no a la inteligencia adaptativa entrenada. Se relaciona con Engaño cuando la Intuición
      detecta que alguien está construyendo una narrativa falsa.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite inferir algo que no puede observar directamente:
      motivos ocultos, peligro que aún no se manifestó, estructura no visible de una situación.
      No corresponde a detectar objetos visibles, leer emociones explícitas o rastrear huellas.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Intuición
      oposición: >
        normalmente contra umbral por opacidad, ambigüedad y presión de escena; puede rozar una
        prueba enfrentada cuando otra criatura oculta activamente intención o peligro
      tipo_de_accion:
        combate: reactiva
        exploración: reactiva
      requisitos:
        - una situación con sentido oculto, riesgo latente o motivo no visible directamente
        - información parcial suficiente para que la inferencia tenga base, aunque no sea explícita
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La ambigüedad, la complejidad
        de la situación y la habilidad ajena para ocultar intención ajustan ese valor.
      penalizadores_comunes:
        - situación: señales contradictorias o demasiadas variables simultáneas
          modificador: "-1"
        - situación: engaño deliberado o preparación cuidadosa del ocultamiento
          modificador: "-2"
        - situación: presión urgente que corta tiempo de lectura
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Intuición se reevalúa cuando aparecen nuevos indicios o cambia la situación. Repetirla sin
        nueva información rara vez aporta una lectura mejor del mismo momento.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: reactiva
    tipo_en_exploración: reactiva
    ejemplos_de_uso:
      - sentir que una negociación amistosa es en realidad una distracción
      - detectar que alguien en el grupo miente antes de que haya prueba visible
      - reconocer el momento exacto en que una emboscada está a punto de activarse
    técnicas_habilitadas: []

  - nombre: Engaño
    nombre_en: Deception
    categoría: social
    característica_asociada: Astucia
    descripción_breve: crear creencias falsas en otros mediante mentiras, omisión o encuadre deliberado
    descripción_completa: >
      Engaño representa el dominio de hacer que otros crean algo que no es verdad: inventar, omitir,
      reencuadrar, farolar. No es actuación pública ni mezclarse socialmente — es la construcción
      deliberada de una narrativa falsa creíble, adaptada al blanco y al momento. Existe para
      distinguir al personaje que puede manipular activamente la percepción de otros del que solo
      puede actuar de forma honesta o callarse.
    fantasía_de_uso: >
      Permite personajes que salen de situaciones imposibles con mentiras bien colocadas, manipulan
      a antagonistas para revelar información, y crean falsas certezas que luego explotan
      tácticamente.
    dominio_central: engañar a otros mediante mentiras, omisión, encuadre o manipulación de apariencias
    cubre: mentir, farolear, desviar la atención, implicación falsa
    no_cubre: mezclarse socialmente sin mentir, actuación pública como expresión, presión coercitiva directa
    taxonomía:
      familia: cognición adaptativa
      subfamilia: manipulación de percepción
      etiquetas: [mentira, engaño, manipulación, encuadre, farol]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Imitación — Imitación reproduce comportamiento de forma convincente, Engaño
      construye una narrativa falsa. Se separa de Sigilo en que Engaño no reduce registro ni atención:
      altera creencias. Se relaciona con Intuición cuando el blanco puede detectar el engaño.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente hacer creer algo falso a otro mediante afirmaciones,
      omisiones o encuadre deliberado. No corresponde a actuar un papel completo con cuerpo y voz,
      mezclarse sin llamar la atención o coaccionar mediante miedo.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Engaño
      oposición: normalmente como prueba enfrentada contra la lectura, sospecha o criterio del blanco
      tipo_de_accion:
        combate: activa
        exploración: no_aplica
      requisitos:
        - un blanco capaz de procesar la información falsa o el encuadre manipulado
        - una narrativa, omisión o mentira que pueda sostenerse mínimamente en la escena
      criterio_de_umbral: >
        Cuando no haya oposición activa definida, la condición de la escena establece el umbral base.
        La plausibilidad, la presión del momento y la predisposición del blanco ajustan ese valor.
      penalizadores_comunes:
        - situación: mentira compleja o difícil de sostener
          modificador: "-1"
        - situación: blanco ya desconfiado o alerta
          modificador: "-2"
        - situación: contradicción visible con hechos presentes
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el marco, la historia o el blanco. Un fallo ante la misma persona
        suele dejar sospecha que vuelve más difícil insistir con la misma mentira.
    contextos:
      combate: true
      exploración: false
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - convencer a un guardia de que tiene autorización para pasar con una historia inventada
      - hacer creer a un interrogador que se está siendo cooperativo mientras se oculta información clave
      - farolar en un intercambio sobre los propios recursos o planes
    técnicas_habilitadas: []

  - nombre: Improvisación
    nombre_en: Improvisation
    categoría: mental
    característica_asociada: Astucia
    descripción_breve: resolver problemas inmediatos mediante invención adaptativa con los medios disponibles
    descripción_completa: >
      Improvisación representa la capacidad de producir una solución funcional cuando no hay una
      preparada: usar lo que hay, adaptar lo que no encaja, inventar un método que no existe en
      ningún manual. No es planificación ni conocimiento formal — es la inteligencia de situación
      que convierte restricción en oportunidad. Existe para distinguir al personaje que puede actuar
      bajo condiciones que ningún entrenamiento previo anticipó del que colapsa cuando el plan falla.
    fantasía_de_uso: >
      Permite personajes que encuentran salidas donde no las hay, convierten cualquier objeto en
      una herramienta, y actúan con eficacia en el caos donde otros necesitan un plan.
    dominio_central: resolver problemas inmediatos mediante invención adaptativa
    cubre: soluciones rápidas, método improvisado, uso oportunista de medios disponibles
    no_cubre: razonamiento académico profundo, maestría artesanal, procedimiento planificado estable
    taxonomía:
      familia: cognición adaptativa
      subfamilia: resolución adaptativa de problemas
      etiquetas: [improvisación, adaptación, oportunismo, inventiva, solución-rápida]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se relaciona con Destreza cuando la solución improvisada requiere también precisión manual, y
      con Ingeniería cuando la solución demanda lógica estructural además de inventiva. Se distingue
      de ambas en que Improvisación es la capacidad de actuar sin los recursos o el tiempo ideales,
      no la maestría técnica en condiciones controladas.
    criterio_de_uso: >
      Debe pedirse cuando el problema requiera una solución que no existe en los recursos o protocolos
      disponibles: uso no convencional de objetos, método inventado sobre la marcha, solución bajo
      tiempo o escasez. No corresponde a maestría técnica formal ni a planificación táctica
      estructurada.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Improvisación
      oposición: umbral por escasez, presión y complejidad del problema
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - un problema sin procedimiento preparado o sin herramienta ideal disponible
        - materiales, entorno o recursos mínimos que puedan reconvertirse en solución funcional
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La urgencia, la pobreza de
        recursos, la fragilidad de la solución y la complejidad del problema lo ajustan.
      penalizadores_comunes:
        - situación: recursos claramente inadecuados o escasos
          modificador: "-2"
        - situación: tiempo mínimo o presión inmediata
          modificador: "-2"
        - situación: solución que requiere además precisión técnica fina
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambian los recursos, aparece una idea nueva o la situación abre otra salida.
        Un fallo puede consumir materiales o cerrar la ventana que permitía improvisar.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - usar equipo de exploración para montar una trampa de emergencia en segundos
      - improvisar una solución de sellado para una filtración que amenaza inundar el espacio
      - adaptar un objeto cotidiano como arma o herramienta de forma funcional bajo presión
    técnicas_habilitadas: []

  - nombre: Hurto
    nombre_en: Theft
    categoría: social
    característica_asociada: Astucia
    descripción_breve: adquirir objetos o recursos mediante sustracción sigilosa u oportunismo situacional
    descripción_completa: >
      Hurto representa la capacidad de obtener algo que pertenece a otro sin que lo note o sin
      enfrentamiento directo: carterismo, toma inadvertida, aprovechamiento de distracción, adquisición
      oportunista. No es destreza manual en general ni sigilo de movimiento amplio — es la combinación
      específica de oportunismo, lectura del momento y ejecución mínima suficiente para sustraer sin
      ser detectado. Existe para distinguir al personaje que puede adquirir por sustracción del que
      solo puede pedir, comprar o tomar por fuerza.
    fantasía_de_uso: >
      Permite personajes que consiguen objetos sin negociar ni combatir, vacían bolsillos en plena
      conversación, y convierten la distracción ajena en un recurso propio.
    dominio_central: adquirir objetos o recursos mediante sigilo, desvío de atención o sustracción oportunista
    cubre: carterismo, hurto leve, toma inadvertida, adquisición oportunista
    no_cubre: técnica manual fina en general, movimiento sigiloso amplio, apropiación forzada
    taxonomía:
      familia: cognición adaptativa
      subfamilia: adquisición oportunista
      etiquetas: [hurto, carterismo, sustracción, oportunismo, sigilo-de-objeto]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se apoya en Destreza cuando la sustracción requiere precisión manual fina, y puede apoyarse en
      Sigilo cuando además es necesario evitar registro activo. Hurto es la decisión y el oportunismo;
      las demás especializaciones solo cubren partes del proceso.
    criterio_de_uso: >
      Debe pedirse cuando el objetivo central sea obtener un objeto o recurso de otro sin
      confrontación directa. No corresponde a precisión manual general, movimiento silencioso en
      sentido amplio o engaño social sin sustracción física.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Hurto
      oposición: >
        normalmente como prueba enfrentada contra atención, registro o resguardo del poseedor;
        puede resolverse contra umbral cuando la oportunidad depende más del entorno que de una vigilancia activa
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - un objeto o recurso accesible sin confrontación directa
        - una oportunidad real de sustracción mediante distracción, cercanía o descuido
      criterio_de_umbral: >
        Cuando no haya oposición activa definida, la condición del entorno o de la escena establece
        el umbral base. La cercanía, la exposición del objeto, el flujo de atención y la facilidad
        de escape ajustan ese valor.
      penalizadores_comunes:
        - situación: objeto bien sujeto, guardado o vigilado
          modificador: "-2"
        - situación: poco espacio para ocultar el gesto o retirarse
          modificador: "-1"
        - situación: necesidad de precisión manual particularmente fina
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia la atención del entorno o surge una nueva oportunidad. Un fallo
        ante el mismo blanco suele elevar alerta y hacer mucho más difícil repetir el intento.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - extraer un documento del bolsillo de alguien durante un apretón de manos
      - tomar una llave de un gancho en la pared mientras se distrae al guardia con una pregunta
      - sustraer un objeto de una mesa en una sala ocupada aprovechando un momento de atención desviada
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # SABIDURÍA
  # Identidad: comprensión atenta de lo real, juicio práctico, conciencia de campo, lectura aplicada de la vida y el entorno.
  # ─────────────────────────────────────────────

  - nombre: Percepción
    nombre_en: Perception
    categoría: mental
    característica_asociada: Sabiduría
    descripción_breve: notar activamente detalles significativos del entorno mediante atención dirigida
    descripción_completa: >
      Percepción representa la capacidad de atender al entorno y extraer de él información útil:
      ver lo que está ahí, escuchar lo que ocurre, detectar inputs sensoriales que otros ignoran.
      No es inferencia ni intuición — es la atención activa que precede al juicio. Existe para
      distinguir al personaje que capta el mundo con precisión del que se mueve en él sin registrarlo.
    fantasía_de_uso: >
      Permite personajes que detectan emboscadas antes de que ocurran, encuentran detalles que otros
      pasan por alto, y operan con ventaja informativa en cualquier situación donde lo visible importa.
    dominio_central: notar activamente detalles significativos
    cubre: observar, detectar, reconocer inputs sensoriales relevantes
    no_cubre: interpretación del significado, rastreo de huellas, inferencia sin evidencia directa
    taxonomía:
      familia: comprensión práctica
      subfamilia: atención sensorial activa
      etiquetas: [observación, detección, sentidos, atención, alerta]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Intuición — Percepción nota lo que está físicamente presente, Intuición infiere
      lo que no se ve. Se complementa con Rastreo cuando los detalles percibidos son huellas y señales
      de paso, y con Interpretación cuando lo detectado necesita ser entendido en profundidad.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea detectar algo presente en el entorno: una figura oculta,
      un sonido anómalo, un detalle visual relevante. No corresponde cuando el problema sea inferir
      motivos, reconstruir historiales o analizar significados.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Percepción
      oposición: normalmente umbral; puede rozar oposición si algo se oculta activamente en ese instante
      tipo_de_accion:
        combate: activa o reactiva
        exploración: activa
      requisitos:
        - el detalle o señal debe existir realmente en la escena
        - debe haber línea sensorial o exposición suficiente para poder detectarlo
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Iluminación, distancia,
        ruido, cobertura y sutileza del detalle ajustan ese valor.
      penalizadores_comunes:
        - situación: iluminación pobre, niebla o cobertura parcial
          modificador: "-2"
        - situación: ruido, interferencia o sobrecarga sensorial
          modificador: "-1"
        - situación: detalle mínimo, lejano o breve
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el ángulo, la exposición o el momento. Repetirla sin nueva
        información rara vez mejora la misma lectura estática.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa+reactiva
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - notar el brillo de un arma oculta bajo una capa en una sala concurrida
      - detectar el sonido de pasos en la oscuridad antes de que lleguen
      - observar que una puerta tiene una bisagra diferente a las demás en un pasillo largo
    técnicas_habilitadas: []

  - nombre: Supervivencia
    nombre_en: Survival
    categoría: mental
    característica_asociada: Sabiduría
    descripción_breve: tomar decisiones prácticas para mantenerse vivo y funcional en entornos hostiles o inciertos
    descripción_completa: >
      Supervivencia representa el juicio de campo necesario para operar cuando las estructuras de
      apoyo han desaparecido: dónde refugiarse, qué es seguro beber, cómo responder al peligro
      inmediato del entorno, cómo mantener a otras personas con vida en campo abierto. No es
      resistencia corporal ni conocimiento académico — es la sabiduría práctica acumulada de quien
      ha aprendido a leer el entorno como si su vida dependiera de ello, porque dependía. Existe para
      distinguir al personaje que puede funcionar autónomamente en el campo del que necesita
      infraestructura para sobrevivir.
    fantasía_de_uso: >
      Permite personajes que improvisan refugio, encuentran agua y comida donde otros no ven nada,
      toman decisiones correctas bajo presión ambiental, y mantienen al grupo vivo en condiciones
      que deberían ser letales.
    dominio_central: vivir y tomar decisiones de forma práctica en entornos hostiles o inciertos
    cubre: elección de refugio, juicio sobre comida y agua, respuesta a peligros, mantener personas con vida en el campo
    no_cubre: rastreo preciso, navegación como habilidad separada, medicina como ciencia de tratamiento
    taxonomía:
      familia: comprensión práctica
      subfamilia: juicio de campo y autonomía en entorno hostil
      etiquetas: [supervivencia, campo, juicio, refugio, autonomía]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se complementa con Aclimatación cuando el cuerpo debe resistir las condiciones del entorno, y
      con Orientación cuando el problema es también saber hacia dónde moverse. Se distingue de
      Medicina, que es tratamiento del daño ya recibido, y de Rastreo, que es seguir un historial
      de movimiento ajeno.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite tomar decisiones prácticas para mantenerse funcional
      en el campo: buscar agua, construir refugio, responder a condiciones hostiles. No corresponde
      a resistencia corporal, navegación de rutas o tratamiento de heridas.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Supervivencia
      oposición: umbral, no tirada enfrentada
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un entorno hostil o incierto con decisiones prácticas reales
        - margen de acción suficiente para aplicar esas decisiones
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Escasez, hostilidad,
        incertidumbre, tiempo y recursos disponibles ajustan ese valor.
      penalizadores_comunes:
        - situación: entorno desconocido o especialmente hostil
          modificador: "-2"
        - situación: recursos escasos o dañados
          modificador: "-1"
        - situación: presión de tiempo o amenaza inmediata
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando cambie el entorno, aparezcan recursos nuevos o se pruebe otra
        respuesta. Un fallo puede consumir tiempo o empeorar la posición.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - encontrar fuente de agua potable en un terreno desconocido sin equipo de análisis
      - construir un refugio suficiente para pasar la noche con materiales disponibles
      - decidir qué bayas son seguras en un bosque desconocido a partir del conocimiento acumulado
    técnicas_habilitadas: []

  - nombre: Medicina
    nombre_en: Medicine
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: tratar el daño corporal y las aflicciones físicas mediante práctica curativa entrenada
    descripción_completa: >
      Medicina representa el conocimiento práctico de cómo funciona el cuerpo cuando está dañado y
      cómo intervenir para revertir ese daño: estabilizar hemorragias, tratar infecciones, reducir
      luxaciones, diagnosticar en condiciones de campo. No es recolección de ingredientes ni
      tolerancia al dolor — es la práctica aplicada de restaurar la funcionalidad corporal. Existe
      para distinguir al personaje que puede intervenir en el daño físico del que solo puede
      observarlo.
    fantasía_de_uso: >
      Permite personajes que mantienen al grupo en condición operativa, salvan vidas que de otro
      modo se perderían, y convierten el conocimiento del cuerpo humano en una herramienta táctica
      y narrativa.
    dominio_central: tratar el daño corporal mediante práctica curativa entrenada
    cubre: estabilización, cuidado, tratamiento, diagnóstico en sentido curativo
    no_cubre: recolección de hierbas en sí, preparación alquímica, pura tolerancia o resistencia
    taxonomía:
      familia: comprensión práctica
      subfamilia: tratamiento y restauración corporal
      etiquetas: [curación, tratamiento, diagnóstico, heridas, campo-médico]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se complementa con Herboristería como fuente de ingredientes naturales, y con Alquimia cuando
      los compuestos usados son más elaborados. Se distingue de Tolerancia, que es soportar el daño
      sin intervención, y de Supervivencia, que es el juicio general de campo.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente tratar, estabilizar o curar el daño físico de otro
      o de sí mismo. No corresponde a identificar plantas medicinales, preparar compuestos, o resistir
      el daño sin intervención.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Medicina
      oposición: umbral; puede quedar bajo presión de escena si se aplica en combate o bajo amenaza
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - un blanco herido, enfermo o físicamente comprometido
        - acceso suficiente al cuerpo y margen práctico de intervención
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Gravedad del daño, tiempo
        disponible, herramientas y estabilidad del paciente ajustan ese valor.
      penalizadores_comunes:
        - situación: herramientas pobres o campo improvisado
          modificador: "-1"
        - situación: hemorragia, inestabilidad o trauma severo
          modificador: "-2"
        - situación: presión activa, movimiento o peligro cercano
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el estado del paciente, llegan mejores recursos o se abre otra
        ventana de tratamiento. Un fallo puede cerrar parte de ese margen.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - estabilizar una hemorragia severa con el equipo disponible antes de que el personaje colapse
      - diagnosticar si una enfermedad tiene origen tóxico o infeccioso a partir de los síntomas
      - reducir una luxación de campo para restaurar la movilidad de un aliado
    técnicas_habilitadas: []

  - nombre: Herboristería
    nombre_en: Herbalism
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: identificar, recolectar y usar plantas con propiedades medicinales o materiales
    descripción_completa: >
      Herboristería representa el conocimiento práctico del mundo vegetal como recurso: saber qué
      planta es cuál, dónde crece, qué parte usar, cómo prepararla básicamente y para qué sirve.
      No es medicina clínica ni alquimia elaborada — es el dominio de campo de quien lee la flora
      como un inventario de herramientas potenciales. Existe para distinguir al personaje que puede
      aprovechar lo que el entorno ofrece del que solo ve plantas donde hay recursos.
    fantasía_de_uso: >
      Permite personajes que abastecen tratamientos médicos, preparan tónicos, identifican venenos
      en el campo, y tienen siempre a mano recursos naturales que otros no pueden ver.
    dominio_central: identificar, recolectar y usar plantas de forma práctica medicinal o material
    cubre: hierbas, raíces, propiedades de plantas, preparación básica de plantas
    no_cubre: medicina completa, alquimia completa, supervivencia silvestre amplia
    taxonomía:
      familia: comprensión práctica
      subfamilia: conocimiento de flora y uso práctico
      etiquetas: [plantas, hierbas, recolección, identificación, recursos-naturales]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se complementa con Medicina como proveedor de ingredientes curativos, y con Alquimia cuando
      las plantas se transforman en compuestos más complejos. Se distingue de Supervivencia en que
      Herboristería es dominio específico de flora, no juicio general de campo.
    criterio_de_uso: >
      Debe pedirse cuando el reto sea identificar, recolectar o aplicar una planta con propósito
      específico. No corresponde al tratamiento clínico del daño corporal, a la preparación alquímica
      compleja, o a la lectura general del entorno silvestre.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Herboristería
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - acceso a flora relevante o a una muestra utilizable
        - tiempo mínimo para reconocer, recolectar o preparar su uso básico
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Rareza de la especie,
        estacionalidad, visibilidad, estado de conservación y riesgo de confusión ajustan ese valor.
      penalizadores_comunes:
        - situación: flora rara, degradada o fuera de estación
          modificador: "-1"
        - situación: entorno denso, tóxico o difícil de leer
          modificador: "-2"
        - situación: riesgo alto de confundir especies cercanas
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el entorno, aparece otra muestra o se obtiene mejor acceso a la
        especie. Un fallo puede arruinar el material o llevar a falsa identificación.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - identificar en campo qué planta podría servir para tratar una infección leve
      - recolectar el componente correcto de una especie sin dañar las partes inútiles
      - reconocer que el té servido contiene una hierba con efecto sedante
    técnicas_habilitadas: []

  - nombre: Alquimia
    nombre_en: Alchemy
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: preparar compuestos funcionales mediante transformación aprendida de ingredientes
    descripción_completa: >
      Alquimia representa el dominio de combinar, destilar, concentrar y transformar ingredientes en
      compuestos que producen efectos definidos: pociones, toxinas, reactivos, extractos potenciados.
      No es solo mezclar ingredientes — es entender qué reacciones ocurren, en qué proporciones, bajo
      qué condiciones, y qué produce el resultado correcto versus uno inútil o peligroso. Existe para
      distinguir al personaje que puede fabricar recursos funcionales del que solo puede aplicar lo
      que encuentra tal como está.
    fantasía_de_uso: >
      Permite personajes que preparan sus propios recursos, producen efectos que el equipo convencional
      no puede lograr, y convierten ingredientes comunes en herramientas tácticas con efectos
      específicos.
    dominio_central: preparar compuestos mediante transformación aprendida de ingredientes
    cubre: pociones, toxinas, extractos, mezclas reactivas
    no_cubre: recolección de hierbas por sí sola, tratamiento curativo por sí solo, dispositivos de ingeniería
    taxonomía:
      familia: comprensión práctica
      subfamilia: preparación y transformación de compuestos
      etiquetas: [alquimia, pociones, toxinas, compuestos, transformación]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se apoya en Herboristería como fuente de ingredientes naturales. Se distingue de Medicina en
      que Alquimia produce el compuesto, no lo aplica clínicamente. Se separa de Ingeniería en que
      el dominio es la transformación de ingredientes, no la lógica de estructuras o mecanismos.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente preparar un compuesto con efectos específicos a partir
      de ingredientes. No corresponde a identificar plantas, tratar heridas directamente o fabricar
      dispositivos mecánicos.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Alquimia
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - ingredientes adecuados
        - equipo o condiciones mínimas para mezclar, destilar o preparar el compuesto
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Complejidad de la mezcla,
        pureza de los ingredientes, precisión requerida y estabilidad del entorno ajustan ese valor.
      penalizadores_comunes:
        - situación: ingredientes incompletos, impuros o degradados
          modificador: "-2"
        - situación: equipo improvisado o inestable
          modificador: "-1"
        - situación: compuesto delicado, reactivo o exigente
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambian los ingredientes, el método o las condiciones. Un fallo puede
        consumir material o volver inservible el lote.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - preparar un antídoto para una toxina conocida con los ingredientes disponibles
      - fabricar un compuesto reactivo para uso en campo a partir de ingredientes recolectados
      - destilar un extracto concentrado que amplifica el efecto de un ingrediente base
    técnicas_habilitadas: []

  - nombre: Trampas
    nombre_en: Traps
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: construir, identificar, preparar e interactuar con sistemas de activación por condición
    descripción_completa: >
      Trampas representa el dominio de la lógica de trampas en todas sus dimensiones: construir un
      mecanismo que se active bajo condición, identificar uno que alguien más colocó, preparar el
      entorno como campo de respuesta diferida. No es destreza manual general ni ingeniería
      estructural — es el entendimiento específico de cómo funciona un sistema diseñado para
      activarse sin presencia activa del operador. Existe para distinguir al personaje que puede
      convertir el espacio en un aliado silencioso del que solo puede actuar en tiempo real.
    fantasía_de_uso: >
      Permite personajes que preparan el terreno antes de que llegue el problema, detectan peligros
      ocultos antes de activarlos, y convierten el entorno en una extensión táctica de su voluntad.
    dominio_central: construir, identificar, preparar e interactuar con sistemas de trampas
    cubre: lógica de trampas, colocación, mantenimiento, interacción con trampas
    no_cubre: destreza manual general, ingeniería más amplia, uso simple de objetos
    taxonomía:
      familia: comprensión práctica
      subfamilia: sistemas de activación diferida
      etiquetas: [trampas, mecanismos, preparación, detección, lógica-de-trampa]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se relaciona con Ingeniería cuando el mecanismo es estructuralmente complejo, y con Destreza
      cuando la instalación requiere precisión manual fina. Se distingue de ambas en que Trampas
      es el dominio específico de sistemas de activación por condición, no de estructuras ni de
      precisión manual general.
    criterio_de_uso: >
      Debe pedirse cuando el personaje interactúe con una trampa: construyéndola, identificándola,
      desactivándola o usándola tácticamente. No corresponde a manipulación manual general ni a
      diseño de estructuras permanentes.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Trampas
      oposición: umbral; puede implicar oposición indirecta si alguien la diseñó u ocultó con intención real
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - acceso suficiente a la trampa o al espacio donde será preparada
        - material, herramientas o condiciones mínimas para intervenirla
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Complejidad del disparador,
        ocultación, fragilidad del sistema y presión del momento ajustan ese valor.
      penalizadores_comunes:
        - situación: mecanismo complejo o poco visible
          modificador: "-2"
        - situación: presión de tiempo o riesgo de activación inmediata
          modificador: "-2"
        - situación: herramientas pobres o acceso restringido
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el acceso, se entiende mejor el sistema o se reemplaza el enfoque.
        Un fallo puede activar la trampa o degradar la posibilidad de intervenirla.
    contextos:
      combate: true
      exploración: true
      narrativo: false
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - preparar un sistema de alerta en la entrada de un campamento antes de dormir
      - detectar e identificar el tipo de trampa antes de pisarla en un pasillo desconocido
      - desactivar un mecanismo sin activarlo usando las herramientas disponibles
    técnicas_habilitadas: []

  - nombre: Minería
    nombre_en: Mining
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: identificar y extraer material de la tierra mediante juicio práctico entrenado
    descripción_completa: >
      Minería representa el conocimiento práctico del mundo subterráneo como recurso y como entorno:
      leer vetas, entender la lógica de la roca, saber dónde excavar y dónde no, extraer material
      útil sin colapsar lo que rodea. No es geología académica ni herrería — es el dominio de quien
      trabaja la tierra con propósito práctico y sabe leerla antes de golpearla. Existe para distinguir
      al personaje que puede aprovechar lo que está debajo del suelo del que solo ve piedra donde hay
      recurso o estructura.
    fantasía_de_uso: >
      Permite personajes que identifican vetas útiles, navegan entornos subterráneos con autoridad,
      entienden la estabilidad de espacios excavados, y extraen materiales que otros no podrían
      aprovechar.
    dominio_central: extraer y entender material de la tierra en términos prácticos
    cubre: vetas, lógica de excavación, juicio práctico de extracción
    no_cubre: geología como conocimiento amplio, herrería, arquitectura
    taxonomía:
      familia: comprensión práctica
      subfamilia: extracción y lectura del subsuelo
      etiquetas: [minería, vetas, extracción, subterráneo, roca]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se complementa con Herrería cuando el material extraído se transforma en piezas funcionales,
      y con Ingeniería cuando el trabajo implica estructuras subterráneas. Se distingue de ambas en
      que Minería es el dominio de extraer y leer la tierra, no de transformar lo extraído ni de
      diseñar estructuras.
    criterio_de_uso: >
      Debe pedirse cuando el reto sea encontrar, evaluar o extraer material del subsuelo, o cuando
      el personaje deba leer la estabilidad de un entorno excavado. No corresponde a geología
      académica, trabajo con metal transformado o diseño de estructuras.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Minería
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - acceso a veta, roca o entorno subterráneo relevante
        - herramientas o método mínimo de extracción o evaluación
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Dureza del terreno,
        estabilidad de la cavidad, calidad de las herramientas y riesgo de colapso ajustan ese valor.
      penalizadores_comunes:
        - situación: roca inestable, veta pobre o cavidad comprometida
          modificador: "-2"
        - situación: herramientas insuficientes
          modificador: "-1"
        - situación: riesgo alto de derrumbe o contaminación del material
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el punto de trabajo o se obtiene mejor acceso. Un fallo puede
        colapsar parte del entorno o arruinar la extracción inmediata.
