      modo_primario: acción
      objeto_de_interacción: conocimiento
    relación_con_otros_dominios: >
      Se distingue de Lingüística — Lingüística trabaja con lenguaje real aunque desconocido,
      Criptología trabaja con sistemas diseñados intencionalmente para ocultar. Se complementa con
      Interpretación cuando el mensaje descifrado necesita también ser entendido en profundidad.
    criterio_de_uso: >
      Debe pedirse cuando el reto sea descifrar un mensaje codificado, identificar un sistema de
      cifrado o analizar una comunicación intencionalmente oculta. No corresponde a idiomas
      extranjeros no cifrados ni a análisis de significado de texto ya descubierto.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Criptología
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un mensaje, patrón o sistema intencionalmente oculto
        - material suficiente para detectar regularidad, clave o estructura
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Robustez del cifrado,
        longitud de la muestra, redundancia disponible y presión de tiempo ajustan ese valor.
      penalizadores_comunes:
        - situación: muestra breve o altamente fragmentaria
          modificador: "-1"
        - situación: cifrado complejo, multicapa o poco redundante
          modificador: "-2"
        - situación: necesidad de apertura rápida bajo presión
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si aparece más texto, una pista de clave o un patrón adicional. Sin
        nueva muestra, insistir sobre el mismo bloqueo rara vez cambia el resultado.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - descifrar una nota interceptada escrita en código de sustitución simple
      - identificar qué sistema de cifrado usa un documento antes de intentar abrirlo
      - reconocer que un texto aparentemente ordinario contiene un mensaje oculto en su estructura
    técnicas_habilitadas: []

  - nombre: Arqueología
    nombre_en: Archaeology
    categoría: conocimiento
    característica_asociada: Intelecto
    descripción_breve: leer e interpretar vestigios físicos del pasado, ruinas y cultura material antigua
    descripción_completa: >
      Arqueología representa el dominio de los restos materiales como fuente de información: qué
      dice una ruina sobre quién la construyó, qué implica un objeto sobre la cultura que lo usó,
      qué revela un yacimiento sobre lo que ocurrió allí. No es historia de texto ni minería de
      extracción — es la lectura del pasado a través de lo que dejó en el mundo físico. Existe para
      distinguir al personaje que puede leer el pasado en el espacio del que solo puede ver piedras
      y objetos sin contexto.
    fantasía_de_uso: >
      Permite personajes que convierten ruinas en fuentes de información, entienden el pasado de un
      lugar sin necesitar registros escritos, e identifican el origen y significado de artefactos que
      otros no pueden leer.
    dominio_central: comprensión formal de ruinas, pasado material, culturas perdidas y vestigios físicos
    cubre: interpretación de excavación, restos antiguos, vestigios culturales
    no_cubre: historia pura como texto, arquitectura como estructura sola, geología o minería
    taxonomía:
      familia: conocimiento organizado
      subfamilia: lectura del pasado material
      etiquetas: [arqueología, ruinas, vestigios, cultura-material, pasado-físico]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Historia — Historia lee el pasado en textos y documentos, Arqueología lo lee
      en vestigios físicos. Se complementa con Identificación cuando los objetos encontrados deben
      ser clasificados, y con Interpretación cuando los vestigios necesitan análisis estructural
      más profundo.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite extraer información de ruinas, objetos antiguos o
      cultura material sin recurrir a documentos escritos. No corresponde a geología, minería
      funcional o historia documental.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Arqueología
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - vestigios físicos, ruinas o cultura material susceptibles de lectura contextual
        - tiempo o acceso suficiente para observar disposición, capas o manufactura
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Estado de conservación,
        mezcla estratigráfica, rareza cultural y acceso al sitio ajustan ese valor.
      penalizadores_comunes:
        - situación: ruina muy degradada o perturbada
          modificador: "-1"
        - situación: contexto estratigráfico confuso o saqueado
          modificador: "-2"
        - situación: acceso parcial al sitio o a la pieza
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse con nuevas capas, objetos o mejor acceso al sitio. Sin ampliar la muestra,
        repetir la misma lectura rara vez produce más.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - determinar a qué período y cultura pertenece una ruina a partir de su estilo constructivo
      - identificar el propósito original de un objeto encontrado en una excavación
      - leer una secuencia de capas en un yacimiento para entender qué ocurrió en qué orden
    técnicas_habilitadas: []

  - nombre: Arquitectura
    nombre_en: Architecture
    categoría: conocimiento
    característica_asociada: Intelecto
    descripción_breve: comprender formalmente la lógica de espacios construidos, estructuras y entornos edificados
    descripción_completa: >
      Arquitectura representa el conocimiento formal de cómo se construyen los espacios habitados:
      qué decisiones estructurales los definen, qué patrones los identifican, qué lógica de
      disposición siguen. No es ingeniería de mecanismos ni arqueología de ruinas — es el dominio
      de quien puede leer un edificio como si fuera un texto. Existe para distinguir al personaje
      que puede entender la intención detrás de un espacio construido del que solo puede moverse
      en él.
    fantasía_de_uso: >
      Permite personajes que leen edificios para entender su lógica, identifican espacios ocultos
      por la disposición que no cuadra, anticipan qué hay detrás de una pared por cómo está
      construida, y navegan espacios complejos con ventaja.
    dominio_central: comprensión formal de espacios construidos, forma estructural y entornos edificados
    cubre: edificios, lógica de disposición, patrones de construcción, lectura estructural
    no_cubre: mecanismos de ingeniería en general, herrería, geografía
    taxonomía:
      familia: conocimiento organizado
      subfamilia: lógica constructiva y diseño de espacios
      etiquetas: [arquitectura, construcción, espacios, estructuras, diseño-espacial]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Ingeniería — Arquitectura lee y diseña el espacio habitado como tal, Ingeniería
      trabaja con mecanismos y sistemas funcionales dentro o fuera de ese espacio. Se complementa
      con Arqueología cuando el edificio a leer es también un vestigio del pasado.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite entender la lógica de un espacio construido:
      disposición, intención estructural, patrones de diseño. No corresponde a mecanismos dentro
      del edificio, al pasado cultural que lo produjo o a la geología del terreno donde está.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Arquitectura
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un espacio construido o plano cuya lógica de disposición pueda leerse
        - acceso suficiente a la forma, proporciones o continuidad del lugar
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Complejidad del edificio,
        alteraciones posteriores, visibilidad de la planta y rareza del estilo ajustan ese valor.
      penalizadores_comunes:
        - situación: edificio alterado, incompleto o parcialmente colapsado
          modificador: "-1"
        - situación: acceso muy parcial a la estructura o planta
          modificador: "-2"
        - situación: escuela constructiva rara o fuertemente híbrida
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si se exploran más áreas, aparece un plano o mejora la visibilidad del conjunto.
        Sin nueva información espacial, insistir suele añadir poco.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - identificar que una sala tiene dimensiones externas e internas que no coinciden, sugiriendo un espacio oculto
      - determinar a qué escuela constructiva pertenece un edificio desconocido
      - anticipar la disposición probable de niveles no explorados a partir de la planta visible
    técnicas_habilitadas: []

  - nombre: Belicología
    nombre_en: Belicology
    categoría: conocimiento
    característica_asociada: Intelecto
    descripción_breve: comprender formalmente la guerra, sistemas de conflicto, doctrina militar y organización del combate
    descripción_completa: >
      Belicología representa el conocimiento organizado de la guerra como disciplina: cómo se
      estructuran los ejércitos, qué doctrinas guían las decisiones militares, qué patrones siguen
      los conflictos, cómo se organiza el combate a escala. No es el uso bruto de armas ni la
      improvisación táctica — es el conocimiento formal que permite leer un conflicto como si fuera
      un texto y entender sus implicaciones antes de que se desarrollen. Existe para distinguir al
      personaje que puede pensar la guerra del que solo puede participar en ella.
    fantasía_de_uso: >
      Permite personajes que entienden conflictos desde una perspectiva estratégica, anticipan
      movimientos de fuerzas organizadas, leen el terreno militar, y tienen autoridad doctrinal
      en situaciones de guerra.
    dominio_central: comprensión formal de la guerra, sistemas de conflicto, doctrina militar y organización del combate
    cubre: estructura de batalla, lógica militar, patrones de guerra, método de conflicto
    no_cubre: liderazgo como comando social en tiempo real, uso bruto de armas, improvisación táctica directa
    taxonomía:
      familia: conocimiento organizado
      subfamilia: doctrina militar y sistemas de conflicto
      etiquetas: [belicología, guerra, doctrina-militar, conflicto, estrategia]
      modo_primario: acción
      objeto_de_interacción: conocimiento
    relación_con_otros_dominios: >
      Se distingue de Liderazgo — Liderazgo es el ejercicio del mando en tiempo real, Belicología es
      el conocimiento formal de cómo funciona la guerra como sistema. Se complementa con Historia
      cuando los conflictos pasados son relevantes para entender el presente, y con Geografía cuando
      el espacio define la estrategia.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite aplicar conocimiento formal sobre la guerra para
      analizar, anticipar o entender una situación militar. No corresponde a comando táctico en
      tiempo real, uso de armas o improvisación bajo fuego.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Belicología
      oposición: umbral
      tipo_de_accion:
        combate: activa
        exploración: no_aplica
      requisitos:
        - una situación militar, doctrina o despliegue susceptible de análisis formal
        - suficiente información para comparar la escena con patrones de conflicto conocidos
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Escala del conflicto,
        claridad del despliegue, rareza doctrinal y presión del momento ajustan ese valor.
      penalizadores_comunes:
        - situación: información fragmentaria sobre fuerzas o posiciones
          modificador: "-1"
        - situación: doctrina rara, engañosa o no convencional
          modificador: "-2"
        - situación: situación demasiado volátil para lectura completa
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si el despliegue se aclara, aparecen nuevas fuerzas o cambia la situación.
        Sin nueva información táctica, repetir el mismo análisis rara vez mejora.
    contextos:
      combate: true
      exploración: false
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - identificar la doctrina que está siguiendo una fuerza enemiga a partir de su disposición
      - anticipar dónde colocará el enemigo su reserva basándose en patrones doctrinales conocidos
      - entender las implicaciones estratégicas de perder un punto clave sin necesidad de combatirlo
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # COMPOSTURA
  # Identidad: regulación interna, claridad mantenida, control bajo presión, firmeza deliberada.
  # ─────────────────────────────────────────────

  - nombre: Enfoque
    nombre_en: Focus
    categoría: mental
    característica_asociada: Compostura
    descripción_breve: sostener la atención deliberadamente en un objetivo o tarea elegido bajo condiciones que la dispersan
    descripción_completa: >
      Enfoque representa la capacidad de mantener la mente fija en lo que importa cuando el entorno,
      la presión o la distracción trabajan para dispersarla. No es contención emocional ni regulación
      interna profunda — es el acto sostenido de volver la atención al blanco elegido, una y otra vez,
      hasta que la tarea se completa. Existe para distinguir al personaje que puede actuar con
      precisión y continuidad mental bajo presión del que pierde el hilo cuando el entorno se complica.
    fantasía_de_uso: >
      Permite personajes que completan acciones técnicas bajo fuego, mantienen el hilo de un plan
      cuando el caos los rodea, y ejecutan con claridad donde otros se dispersan.
    dominio_central: sostener la atención en un objetivo o tarea elegido
    cubre: concentración, fijación, estrechamiento mental deliberado
    no_cubre: contención emocional de emergencia, aquietamiento meditativo, proyección exterior de calma
    taxonomía:
      familia: regulación interna
      subfamilia: atención sostenida y fijación deliberada
      etiquetas: [concentración, fijación, atención, claridad, precisión-mental]
      modo_primario: acción
      objeto_de_interacción: self
    relación_con_otros_dominios: >
      Se distingue de Contención — Contención evita que el colapso emocional se derrame, Enfoque
      es la activación activa y sostenida de la atención hacia un blanco. Se distingue de Meditación
      en que Enfoque es dirección y fijación, no aquietamiento y restauración. Se complementa con
      Destreza cuando la tarea técnica también requiere precisión manual fina.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite mantener la concentración en una tarea específica
      bajo condiciones que normalmente dispersarían la atención: ruido, amenaza activa, distracción
      deliberada. No corresponde a resistencia emocional de emergencia, regulación interna o calma
      bajo presión social.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Enfoque
      oposición: >
        normalmente contra umbral por distracción, presión y carga cognitiva; puede pasar a prueba
        enfrentada si otra criatura intenta romper activamente la concentración del personaje
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - una tarea, objetivo o hilo mental concreto que deba sostenerse
        - presión, distracción o amenaza suficiente para que mantener la atención sea un problema real
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. El ruido, la urgencia,
        la complejidad de la tarea y la interferencia activa ajustan ese valor.
      penalizadores_comunes:
        - situación: ruido, estímulo o interrupción persistente
          modificador: "-1"
        - situación: amenaza inmediata o daño en curso
          modificador: "-2"
        - situación: tarea larga o cognitivamente densa
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede volver a evaluarse mientras la tarea siga abierta y la concentración aún tenga un objetivo
        funcional. Un fallo deja arrastre: la atención ya rota o degradada no vuelve limpia por repetir la tirada.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - completar una manipulación técnica delicada mientras se recibe daño o presión activa
      - mantener el hilo de un plan complejo cuando el entorno se vuelve caótico
      - no perder la concentración en un interrogatorio cuando el interlocutor intenta desviar la conversación
    técnicas_habilitadas: []

  - nombre: Contención
    nombre_en: Containment
    categoría: mental
    característica_asociada: Compostura
    descripción_breve: evitar que el colapso emocional o mental interrumpa la capacidad de actuar
    descripción_completa: >
      Contención representa la capacidad de no quebrarse cuando la presión interna alcanza un punto
      crítico: no entrar en pánico, no perder el control, no dejar que el miedo, la angustia o la
      sobrecarga interrumpan la capacidad de actuar. No es supresión permanente ni regulación
      meditativa — es la presa que aguanta justo lo suficiente para que el personaje siga funcionando.
      Existe para distinguir al personaje que puede operar bajo presión psicológica real del que
      colapsa cuando la situación supera su umbral.
    fantasía_de_uso: >
      Permite personajes que no se paralizan ante el horror, mantienen la función cuando la situación
      debería abrumarlos, y resisten la presión psicológica que doblaría a otros.
    dominio_central: evitar que el colapso emocional, mental o volicional se derrame hacia afuera
    cubre: no entrar en pánico, no quebrarse, no perder el control interno
    no_cubre: tolerancia al dolor corporal, concentración en tarea activa, proyectar calma socialmente
    taxonomía:
      familia: regulación interna
      subfamilia: resistencia al colapso emocional y mental
      etiquetas: [contención, pánico, control-emocional, resistencia-mental, colapso]
      modo_primario: reacción
      objeto_de_interacción: self
    relación_con_otros_dominios: >
      Se distingue de Tolerancia — Tolerancia soporta el castigo fisiológico, Contención soporta
      el colapso mental o emocional. Si la pregunta principal es si la mente se rompe, cede al
      pánico o pierde capacidad de actuar, corresponde Contención. Se distingue de Aplomo en que
      Contención es el trabajo interno de no quebrarse, Aplomo es la proyección exterior de que no
      se ha quebrado. Se relaciona con Meditación cuando la práctica habitual de regulación mejora
      la capacidad de resistir en momentos críticos.
    criterio_de_uso: >
      Debe pedirse cuando el personaje deba resistir un colapso emocional o mental inminente: pánico,
      parálisis por horror, sobrecarga volicional. Si la pregunta principal es si el personaje
      logra no quebrarse por dentro, corresponde Contención. No corresponde a dolor físico,
      proyección social de calma o concentración en tarea activa.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Contención
      oposición: >
        normalmente contra umbral por shock, horror o presión emocional; puede interactuar con una
        oposición ya definida cuando la fuente de colapso proviene de un efecto mental hostil concreto
      tipo_de_accion:
        combate: reactiva
        exploración: reactiva
      requisitos:
        - una amenaza real de pánico, quiebre emocional o pérdida de control interno
        - que el personaje siga intentando conservar la función bajo esa presión
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base cuando no hay otra oposición
        definida. La intensidad del shock, la cercanía del horror y la acumulación de presión mental lo ajustan.
      penalizadores_comunes:
        - situación: exposición súbita a horror o shock extremo
          modificador: "-2"
        - situación: presión emocional acumulada sin alivio
          modificador: "-1"
        - situación: aislamiento, impotencia o sensación de encierro
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Se vuelve a evaluar cuando surge una nueva oleada de pánico, horror o presión volitiva. El fallo
        previo sigue pesando mientras el personaje continúe al borde del quiebre interno.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: reactiva
    tipo_en_exploración: reactiva
    ejemplos_de_uso:
      - no entrar en pánico ante una manifestación taumática de alta intensidad
      - resistir la parálisis que produce un horror sobrenatural y seguir actuando
      - mantenerse funcional cuando la situación ya desbordó todo plan previo
    técnicas_habilitadas: []

  - nombre: Meditación
    nombre_en: Meditation
    categoría: mental
    característica_asociada: Compostura
    descripción_breve: regular el estado interno mediante centrado deliberado y aquietamiento practicado
    descripción_completa: >
      Meditación representa la práctica de volver al centro: calmar el ruido interno, restaurar la
      claridad, reconectar con la propia base de funcionamiento después de que la presión la ha
      erosionado. No es fijación atencional ni proyección de calma exterior — es el acto de cultivar
      activamente un estado de quietud que permite que todo lo demás funcione mejor. Existe para
      distinguir al personaje que puede restaurar su estado interno del que solo puede resistir
      hasta que colapsa.
    fantasía_de_uso: >
      Permite personajes que se recuperan de la presión acumulada, restituyen su claridad antes de
      una acción crítica, y tienen acceso a un recurso interno que otros personajes no pueden generar.
    dominio_central: regulación interna practicada mediante centrado deliberado y aquietamiento mental
    cubre: centrado, regulación, respiración controlada y asentamiento, firmeza interior cultivada
    no_cubre: fijación atencional en tarea activa, aplomo exterior, resistencia al dolor
    taxonomía:
      familia: regulación interna
      subfamilia: restauración y centrado deliberado
      etiquetas: [meditación, centrado, restauración, quietud, regulación-interna]
      modo_primario: acción
      objeto_de_interacción: self
    relación_con_otros_dominios: >
      Se distingue de Enfoque en que Meditación es aquietamiento y restauración, no activación
      dirigida hacia un blanco. Se distingue de Contención en que Meditación es práctica cultivada
      en el largo plazo, no resistencia de emergencia. Se complementa con Contención cuando la
      práctica meditativa habitual fortalece la capacidad de resistir en momentos críticos.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente restaurar su estado interno mediante práctica
      deliberada: recuperar claridad, reducir carga acumulada, prepararse para algo exigente.
      No corresponde a resistencia de emergencia, concentración en tarea activa o proyección de
      calma exterior ante otros.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Meditación
      oposición: umbral por carga interna, interrupción y presión de escena
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - una pausa, espacio o ventana funcional mínima para realizar la práctica
        - disposición deliberada a centrar, aquietar o restaurar el estado interno
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. El ruido, la inseguridad
        del lugar, la urgencia externa y la magnitud de la carga interna ajustan ese valor.
      penalizadores_comunes:
        - situación: lugar inseguro, expuesto o inestable
          modificador: "-2"
        - situación: interrupción frecuente o presión de tiempo
          modificador: "-2"
        - situación: carga psicológica acumulada severa
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede repetirse si el personaje recupera una nueva ventana real de calma o práctica. Un intento
        fallido no produce restauración plena y no se rehace en el mismo instante sin cambiar la situación.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - recuperar claridad funcional después de una escena de alta presión antes de la siguiente
      - preparar el estado interno antes de una acción que requiere precisión mental extrema
      - reducir la carga acumulada de presión psicológica durante un descanso
    técnicas_habilitadas: []

  - nombre: Aplomo
    nombre_en: Poise
    categoría: social
    característica_asociada: Compostura
    descripción_breve: mantener la compostura exterior y el porte visible bajo presión o ante observadores
    descripción_completa: >
      Aplomo representa la capacidad de proyectar control y firmeza cuando el entorno o la situación
      presionan para que se note lo contrario: no mostrar miedo, no revelar dolor, no dejar que la
      tensión interna se filtre hacia afuera en formas que otros puedan leer. No es la supresión
      interna del estado en sí — es el dominio de la presentación exterior bajo presión. Existe para
      distinguir al personaje que puede mantener una fachada funcional cuando la situación lo exige
      del que se transparenta involuntariamente.
    fantasía_de_uso: >
      Permite personajes que negocian desde una posición aparente de fortaleza cuando en realidad
      están al límite, mantienen autoridad cuando deberían mostrar miedo, y controlan lo que otros
      leen de ellos en los momentos más difíciles.
    dominio_central: mantener la firmeza exterior, el porte y el control visible bajo tensión
    cubre: no mostrar miedo, no revelar dolor, preservar la compostura bajo presión
    no_cubre: engaño verbal activo, supresión emocional interna como tal, regulación meditativa interna
    taxonomía:
      familia: regulación interna
      subfamilia: proyección exterior de control
      etiquetas: [aplomo, porte, compostura, fachada, control-visible]
      modo_primario: reacción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Contención — Contención es el trabajo interno de no quebrarse, Aplomo es la
      proyección exterior de que no se ha quebrado. Se separa de Engaño en que Aplomo no construye
      una narrativa falsa, solo controla lo que el cuerpo y la presencia revelan involuntariamente.
      Se relaciona con Negociación e Intimidación cuando la compostura visible amplifica la posición
      del personaje.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite controlar lo que proyecta exteriormente bajo presión:
      no mostrar miedo, no revelar dolor, no dejar que la tensión interna sea legible por otros.
      No corresponde a supresión emocional interna, engaño verbal activo o regulación meditativa.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Aplomo
      oposición: >
        normalmente contra umbral por presión visible o escrutinio; puede pasar a prueba enfrentada si
        otra criatura intenta leer, quebrar o exponer deliberadamente la compostura del personaje
      tipo_de_accion:
        combate: reactiva
        exploración: no_aplica
      requisitos:
        - presencia de observadores, lectura social o presión que vuelva visible la tensión interna
        - que el personaje siga intentando preservar una fachada funcional
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La intensidad del escrutinio,
        la gravedad de la presión y la importancia social del momento ajustan ese valor.
      penalizadores_comunes:
        - situación: dolor o miedo evidentes en el cuerpo
          modificador: "-2"
        - situación: escrutinio cercano o audiencia hostil
          modificador: "-2"
        - situación: sorpresa, noticia devastadora o pérdida repentina de posición
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando la presión visible cambie o la escena exija sostener la fachada de nuevo.
        Un fallo deja filtraciones visibles que no desaparecen por repetir la tirada de inmediato.
    contextos:
      combate: true
      exploración: false
      narrativo: true
    tipo_en_combate: reactiva
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - negociar sin revelar que el personaje está en desventaja real
      - no mostrar señal visible de miedo ante una amenaza diseñada para intimidar
      - mantener el porte y la autoridad ante un grupo después de recibir una noticia devastadora
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # AURA
  # Identidad: proyección innata, resonancia instintiva, presencia involuntaria de esencia, conexión sentida.
  # ─────────────────────────────────────────────

  - nombre: Instinto
    nombre_en: Instinct
    categoría: mental
    característica_asociada: Aura
    descripción_breve: respuesta primaria profunda ligada a la naturaleza innata, anterior a la inferencia o el análisis
    descripción_completa: >
      Instinto representa la capa más primaria de la percepción y la respuesta: el conocimiento que
      llega antes de que haya tiempo de pensar, la atracción o repulsión que no necesita justificación,
      la respuesta que surge de lo más profundo de la naturaleza del personaje. No es razonamiento
      estructurado ni percepción sensorial formal — es la señal que emite la esencia del personaje
      cuando algo en el entorno la interpela directamente. Existe para distinguir al personaje cuya
      naturaleza innata le da acceso a lecturas que el análisis no alcanza del que solo puede actuar
      sobre lo que puede explicar.
    fantasía_de_uso: >
      Permite personajes que sienten el peligro antes de que sea visible, responden a lo sobrenatural
      desde un lugar de reconocimiento primario, y confían en una guía interna que la razón no puede
      producir.
    dominio_central: respuesta instintiva profunda ligada a la naturaleza innata más que a la inferencia aprendida
    cubre: conocimiento primario, atracción natural, respuesta no racional inmediata
    no_cubre: razonamiento estructurado, percepción sensorial formal, empatía social o análisis
    taxonomía:
      familia: resonancia y esencia
      subfamilia: respuesta primaria e innata
      etiquetas: [instinto, naturaleza-innata, respuesta-primaria, esencia, no-racional]
      modo_primario: reacción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Intuición — Intuición es inferencia adaptativa entrenada, Instinto es respuesta
      primaria ligada a la esencia innata sin proceso analítico. Se distingue de Percepción en que
      Instinto no detecta objetos presentes, sino que responde a algo más profundo que lo sensorial.
      Se relaciona con Resonancia cuando la respuesta instintiva implica también sintonía con fuerzas
      o seres específicos.
    criterio_de_uso: >
      Debe pedirse cuando el personaje deba responder desde su naturaleza más profunda a algo que
      no puede procesarse racionalmente: presencia de lo sobrenatural, peligro sin forma visible,
      atracción o repulsión primaria sin evidencia directa. No corresponde a inferencia analítica,
      percepción sensorial directa o conocimiento aprendido.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Instinto
      oposición: >
        normalmente contra umbral por presión extraña, amenaza latente o presencia no procesable;
        no suele ser tirada enfrentada directa
      tipo_de_accion:
        combate: reactiva
        exploración: reactiva
      requisitos:
        - que exista algo capaz de interpelar la naturaleza profunda del personaje
        - que la situación demande respuesta previa al análisis o a la percepción formal
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La extrañeza de la presencia,
        la cercanía del peligro y la intensidad de la interpelación esencial ajustan ese valor.
      penalizadores_comunes:
        - situación: saturación sensorial o ruido de señales contradictorias
          modificador: "-1"
        - situación: interferencia exotérica o extranatural intensa
          modificador: "-2"
        - situación: agotamiento o desconexión del propio centro
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Instinto se reevalúa cuando cambia la presencia, surge una nueva amenaza o el personaje entra
        en otro estado de exposición. No se fuerza como serie de intentos limpios sobre la misma señal.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: reactiva
    tipo_en_exploración: reactiva
    ejemplos_de_uso:
      - sentir que algo en una sala no es lo que parece antes de que haya evidencia observable
      - responder físicamente a una presencia taumática antes de identificarla conscientemente
      - reconocer instintivamente que una criatura es hostil a pesar de no haber dado señales visibles
    técnicas_habilitadas: []

  - nombre: Resonancia
    nombre_en: Resonance
    categoría: mental
    característica_asociada: Aura
    descripción_breve: detectar o entrar en armonía significativa con seres, fuerzas o lugares mediante el aura
    descripción_completa: >
      Resonancia representa la capacidad del aura del personaje de entrar en contacto activo con
      algo externo: detectar una afinidad, sentir la presencia de una fuerza, entrar en sintonía
      con un ser o lugar. No es conocimiento formal del tauma ni vínculo sostenido — es el acto de
      que la esencia del personaje alcance algo fuera de sí y reciba respuesta. Existe para distinguir
      al personaje cuyo aura puede interactuar con lo que lo rodea del que solo puede observarlo
      desde fuera.
    fantasía_de_uso: >
      Permite personajes que detectan presencias que otros no sienten, entran en sintonía con fuerzas
      o lugares que tienen carga esencial, y usan el aura como instrumento activo de percepción y
      contacto.
    dominio_central: detectar o entrar en armonía significativa con seres, fuerzas, lugares o estados
    cubre: detección de afinidad, respuesta simpática, sintonía energética o esencial
    no_cubre: teoría formal del tauma, doctrina teológica, actuación de presencia social
    taxonomía:
      familia: resonancia y esencia
      subfamilia: sintonía y contacto de aura
      etiquetas: [resonancia, aura, sintonía, detección-esencial, afinidad]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Taumaturgia — Taumaturgia comprende el tauma por estudio formal, Resonancia
      lo detecta y contacta por aura innata. Se distingue de Instinto en que Resonancia es activa
      y dirigida, Instinto es respuesta involuntaria de la naturaleza. Se relaciona con Vínculo
      cuando la resonancia con un ser específico se sostiene en el tiempo y se profundiza.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente detectar o entrar en contacto con algo mediante su
      aura: una presencia, una fuerza, un lugar con carga esencial. No corresponde a análisis formal
      del tauma, percepción sensorial directa o vínculo sostenido con un ser específico.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Resonancia
      oposición: >
        normalmente contra umbral por distancia, interferencia y densidad esencial; puede pasar a
        prueba enfrentada si otra fuerza o entidad resiste activamente el contacto
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - una presencia, fuerza, lugar o estado con el que el aura pueda intentar sintonizar
        - apertura o intención deliberada de entrar en contacto mediante el aura
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La distancia, el ruido
        esencial, la intensidad de la señal y la afinidad o disonancia ajustan ese valor.
      penalizadores_comunes:
        - situación: interferencia de múltiples presencias simultáneas
          modificador: "-2"
        - situación: señal débil, distante o parcialmente velada
          modificador: "-1"
        - situación: lugar saturado por fuerzas incompatibles
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando cambie la señal, la distancia o la disposición del personaje. Un
        fallo no implica que la presencia no exista, solo que el contacto no se logró en ese estado.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - detectar la presencia de una manifestación taumática en un lugar antes de que sea visible
      - entrar en sintonía con un lugar para sentir si tiene carga esencial activa
      - reconocer si un ser tiene una naturaleza afín a la propia antes de interactuar con él
    técnicas_habilitadas: []

  - nombre: Vínculo
    nombre_en: Bond
    categoría: social
    característica_asociada: Aura
    descripción_breve: sostener un lazo de esencia y conexión profunda con un ser específico
    descripción_completa: >
      Vínculo representa la capacidad de mantener una conexión real y sostenida con otro ser a nivel
      de esencia: no es amistad social ni contrato — es la resonancia duradera que permite al personaje
      y al ser vinculado comunicarse en un nivel que las palabras no alcanzan, anticiparse mutuamente,
      y operar con una cohesión que trasciende la coordinación ordinaria. Existe para distinguir al
      personaje que puede formar lazos esenciales genuinos del que solo puede relacionarse en el nivel
      social convencional.
    fantasía_de_uso: >
      Permite personajes que tienen conexiones que van más allá de lo verbal, operan con cohesión
      extraordinaria con sus aliados más cercanos, y acceden a un tipo de relación que tiene peso
      mecánico y narrativo real.
    dominio_central: sostener un lazo significativo de esencia, confianza instintiva o conexión profunda
    cubre: relación vinculada, conexión esencial duradera, afinidad no verbal
    no_cubre: liderazgo de grupo, negociación, proyección social general
    taxonomía:
      familia: resonancia y esencia
      subfamilia: conexión esencial sostenida
      etiquetas: [vínculo, conexión, esencia, lazo, afinidad-sostenida]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Resonancia — Resonancia es contacto puntual de aura, Vínculo es la conexión
      sostenida que persiste en el tiempo. Se separa de Domesticación en que Vínculo puede darse
      con cualquier ser y es esencial, mientras Domesticación es el manejo práctico de seres
      instintivos. Se separa de Liderazgo en que Vínculo no es estructura de mando sino lazo esencial.
    criterio_de_uso: >
      Debe pedirse cuando el personaje actúe dentro de o en función de una conexión esencial sostenida
      con un ser específico: coordinación sin señales verbales, percepción del estado del ser vinculado,
      profundización del lazo. No corresponde a liderazgo social, manejo de animales o resonancia
      puntual.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Vínculo
      oposición: >
        normalmente contra umbral por distancia, estrés del lazo o interferencia; rara vez es
        enfrentada salvo cuando algo intenta cortar, enturbiar o falsear la conexión de forma activa
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un ser específico con el que exista o pueda profundizarse una conexión esencial sostenida
        - tiempo, experiencia compartida o intensidad suficiente para que el lazo sea relevante
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La distancia, la tensión del
        momento, el estado del ser vinculado y la estabilidad de la conexión ajustan ese valor.
      penalizadores_comunes:
        - situación: distancia extrema o barrera entre ambos
          modificador: "-1"
        - situación: trauma, conflicto o fractura reciente del lazo
          modificador: "-2"
        - situación: interferencia esencial o presencia rival
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando el estado del vínculo cambie o la ficción abra una nueva ventana de
        conexión. Un fallo no rompe automáticamente el lazo, pero sí indica que no pudo operar entonces.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - coordinar con un aliado vinculado sin señales verbales en un momento que lo exige
      - percibir el estado del ser vinculado a distancia cuando hay peligro o cambio
      - profundizar el vínculo con un ser después de una experiencia compartida de alta intensidad
    técnicas_habilitadas: []

  - nombre: Domesticación
    nombre_en: Taming
    categoría: social
    característica_asociada: Aura
    descripción_breve: relacionarse con bestias o criaturas instintivas mediante manejo enraizado en aura y respuesta
    descripción_completa: >
      Domesticación representa el dominio práctico de relacionarse con seres que no operan por
      razonamiento ni lenguaje: calmarlos, guiarlos, vincularlos en términos prácticos, manejarlos
      en situaciones de tensión. No es técnica ecuestre ni liderazgo de grupo — es la capacidad
      específica de entrar en el sistema de respuesta de una criatura instintiva y producir en ella
      confianza, calma o dirección. Existe para distinguir al personaje que puede relacionarse
      funcionalmente con seres no racionales del que los asusta o no puede controlar.
    fantasía_de_uso: >
      Permite personajes que calman criaturas hostiles, entrenan compañeros animales, operan con
      bestias de carga o combate, y tienen acceso a aliados no humanos que otros no pueden manejar.
    dominio_central: relacionarse con bestias o criaturas guiadas por instinto mediante manejo entrenado enraizado en aura y respuesta
    cubre: domar, calmar, vincular en términos prácticos, manejar seres vivos instintivos
    no_cubre: técnica ecuestre en movimiento activo, liderazgo de grupo humano, persuasión social amplia
    taxonomía:
      familia: resonancia y esencia
      subfamilia: manejo práctico de seres instintivos
      etiquetas: [domesticación, bestias, criaturas, doma, manejo-instintivo]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Equitación — Equitación es control técnico de la montura en movimiento activo,
      Domesticación es el manejo del ser instintivo como tal, antes y más allá de montarlo. Se
      distingue de Vínculo en que Domesticación es el dominio práctico del manejo, mientras Vínculo
      es la conexión esencial sostenida. Se complementa con Resonancia cuando el acercamiento a la
      criatura requiere también sintonía de aura.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente calmar, guiar, entrenar o manejar una criatura
      instintiva. No corresponde a control técnico de montura en movimiento, liderazgo de grupo
      humano o vínculo esencial sostenido.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Domesticación
      oposición: >
        normalmente contra umbral por estado, agresividad y respuesta de la criatura; puede pasar
        a prueba enfrentada cuando el animal o ser resiste activamente el manejo en ese instante
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - una criatura instintiva con la que el personaje pueda interactuar de forma real
        - posibilidad mínima de contacto, presencia o manejo para influir en su respuesta
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. El miedo, la agitación,
        el dolor de la criatura y la presión del momento ajustan ese valor.
      penalizadores_comunes:
        - situación: criatura herida, aterrada o ya desbordada
          modificador: "-2"
        - situación: entorno ruidoso, hostil o lleno de estímulos
          modificador: "-1"
        - situación: falta de familiaridad previa con la criatura
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si la criatura no ha roto el contacto ni escalado a un punto sin retorno.
        Un fallo puede empeorar su estado y cerrar nuevas oportunidades inmediatas.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - calmar una bestia agitada antes de que ataque al grupo
      - establecer suficiente confianza con un animal salvaje para que acepte ser guiado
      - manejar una criatura de carga bajo condiciones de tensión sin que se desboque
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # PRESENCIA
  # Identidad: proyección exterior, influencia, comando de atención, uno mismo actuado o impuesto.
  # ─────────────────────────────────────────────

  - nombre: Liderazgo
    nombre_en: Leadership
    categoría: social
    característica_asociada: Presencia
    descripción_breve: dirigir a otros mediante autoridad, estructura y fuerza de mando
    descripción_completa: >
      Liderazgo representa la capacidad de hacer que otros sigan una dirección bajo la propia
      autoridad: reunir fuerzas, dar órdenes que se cumplen, mantener cohesión en un grupo bajo
      presión. No es empatía ni manipulación — es la proyección de autoridad que convierte a un
      individuo en el eje alrededor del cual otros actúan. Existe para distinguir al personaje que
      puede coordinar y dirigir a otros con efectividad del que solo puede actuar por su cuenta.
    fantasía_de_uso: >
      Permite personajes que convierten un grupo de individuos en una fuerza coordinada, mantienen
      la moral y la dirección bajo presión, y ejercen autoridad que otros reconocen y siguen.
    dominio_central: dirigir a otros mediante autoridad, estructura y fuerza de mando
    cubre: guía, mando, reunir fuerzas, dirigir acción coordinada
    no_cubre: coerción por miedo, vínculo esencial entre individuos, acuerdo negociado bilateral
    taxonomía:
      familia: proyección social
      subfamilia: mando y coordinación
      etiquetas: [liderazgo, mando, autoridad, coordinación, grupo]
      modo_primario: acción
      objeto_de_interacción: grupo
    relación_con_otros_dominios: >
      Se distingue de Intimidación en que Liderazgo produce seguimiento voluntario, no sumisión por
      miedo. Se separa de Belicología en que Liderazgo es el ejercicio del mando en tiempo real, no
      el conocimiento formal de la guerra como sistema. También puede incorporar el discurso como
      instrumento, pero su núcleo sigue siendo la autoridad que organiza y dirige a otros.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente dirigir, coordinar o mantener cohesionado a un grupo
      mediante autoridad. No corresponde a coerción por miedo, vínculo esencial entre individuos o
      acuerdo negociado bilateral.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Liderazgo
      oposición: >
        normalmente contra umbral por caos, duda o dispersión del grupo; puede pasar a prueba
        enfrentada si otra voluntad compite activamente por el mando en ese instante
      tipo_de_accion:
        combate: activa
        exploración: no_aplica
      requisitos:
        - un grupo, formación o conjunto de aliados sobre el que pueda ejercerse autoridad real
        - intención clara de coordinar, ordenar o mantener cohesión bajo presión
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La urgencia, la fragmentación
        del grupo, el miedo colectivo y la claridad de la cadena de mando ajustan ese valor.
      penalizadores_comunes:
        - situación: grupo desorganizado, dividido o sin confianza previa
          modificador: "-2"
        - situación: presión inmediata, pánico o ruido táctico extremo
          modificador: "-2"
        - situación: autoridad ambigua o disputada
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse cuando la situación del grupo cambie o surja una nueva ventana de mando.
        Un fallo puede dejar fractura o duda que no desaparece por repetir la orden sin más.
    contextos:
      combate: true
      exploración: false
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - mantener la cohesión del grupo cuando una situación de combate se descontrola
      - dar órdenes claras a aliados en un momento de presión sin que sean cuestionadas
      - reunir a personas con intereses distintos bajo una dirección común ante una amenaza
    técnicas_habilitadas: []

  - nombre: Negociación
    nombre_en: Negotiation
    categoría: social
    característica_asociada: Presencia
    descripción_breve: dar forma a acuerdos mediante intercambio, apalancamiento y balance social controlado
    descripción_completa: >
      Negociación representa el dominio del intercambio como herramienta: saber qué quiere el otro,
      qué se tiene para ofrecer, cómo estructurar la conversación para que el resultado sea favorable,
      y cómo sostener la posición sin romper el proceso. No es intimidación ni engaño — es la
      capacidad de producir acuerdos que ambas partes acepten, con la mayor ventaja posible para
      quien negocia. Existe para distinguir al personaje que puede cerrar tratos del que solo puede
      pedir o tomar.
    fantasía_de_uso: >
      Permite personajes que consiguen lo que necesitan sin combate, transforman conflictos
      potenciales en acuerdos, y convierten el intercambio social en una herramienta de avance.
    dominio_central: dar forma a acuerdos mediante intercambio, apalancamiento y balance social controlado
    cubre: regateo, compromiso, acuerdo, intercambio persuasivo
    no_cubre: coerción por miedo, narrativa falsa, influencia mediante discurso masivo
    taxonomía:
      familia: proyección social
      subfamilia: intercambio y acuerdo
      etiquetas: [negociación, acuerdo, intercambio, apalancamiento, balance-social]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Intimidación en que Negociación produce acuerdo, no sumisión por miedo. Se
      distingue de Engaño en que Negociación opera en el espacio del intercambio real, no de la
      narrativa falsa. Se complementa con Aplomo cuando la posición negociadora requiere no revelar
      debilidad.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente producir un acuerdo mediante intercambio estructurado.
      No corresponde a coerción directa, manipulación de percepción o influencia mediante discurso
      masivo unilateral.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Negociación
      oposición: >
        normalmente como prueba enfrentada contra la resistencia, posición o voluntad de la contraparte;
        puede resolverse contra umbral si la otra parte no negocia activamente pero el marco del acuerdo sí
      tipo_de_accion:
        combate: no_aplica
        exploración: no_aplica
      requisitos:
        - una contraparte dispuesta al menos mínimamente a entrar en intercambio
        - algo que ofrecer, exigir o estructurar como parte del acuerdo
      criterio_de_umbral: >
        Cuando no haya oposición activa definida, la condición de la escena establece el umbral base.
        La asimetría de poder, la urgencia, lo que cada parte arriesga y la calidad del apalancamiento lo ajustan.
      penalizadores_comunes:
        - situación: posición negociadora débil o revelada
          modificador: "-2"
        - situación: tiempo límite o presión externa severa
          modificador: "-1"
        - situación: contraparte hostil, humillada o ya desconfiada
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambian los términos, el contexto o el apalancamiento real. Un fallo puede
        endurecer a la contraparte y cerrar intentos idénticos inmediatos.
    contextos:
      combate: false
      exploración: false
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - conseguir información de un informante reticente a cambio de algo que el personaje puede ofrecer
      - cerrar un trato con una facción en términos favorables cuando ambas partes tienen algo que perder
      - transformar una confrontación potencial en un intercambio que beneficia al personaje
    técnicas_habilitadas: []

  - nombre: Intimidación
    nombre_en: Intimidation
    categoría: social
    característica_asociada: Presencia
    descripción_breve: imponer presión mediante amenaza, fuerza de presencia o proyección de miedo
    descripción_completa: >
      Intimidación representa el uso de la presencia como herramienta coercitiva: hacer que otro
      actúe por miedo, no por convencimiento. No es autoridad de mando ni persuasión racional — es
      la proyección de que la consecuencia de no ceder será peor que ceder. Existe para distinguir
      al personaje que puede doblar la voluntad de otros mediante la amenaza del que solo puede
      pedirles o convencerles.
    fantasía_de_uso: >
      Permite personajes que obtienen respuestas sin negociar, abren puertas que el dinero o la
      razón no abrirían, y usan la presencia como arma social directa.
    dominio_central: imponer presión mediante amenaza, fuerza de presencia o miedo
    cubre: presión coercitiva, proyección de miedo, dominación mediante presencia
    no_cubre: mando de autoridad voluntario, manipulación mediante narrativa falsa, reducción de relevancia social
    taxonomía:
      familia: proyección social
      subfamilia: coerción y presión de presencia
      etiquetas: [intimidación, amenaza, coerción, miedo, dominación]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de Liderazgo — Liderazgo produce seguimiento voluntario, Intimidación produce
      sumisión por miedo. Se distingue de Engaño en que Intimidación opera mediante presión directa,
      no narrativa falsa. Se relaciona con Aplomo cuando mantener la propia postura visible amplifica
      la presión que se ejerce.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente producir una acción en otro mediante presión, amenaza
      o proyección de miedo. No corresponde a persuasión racional, acuerdo negociado o mando de
      autoridad voluntaria.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Intimidación
      oposición: normalmente como prueba enfrentada contra la voluntad, resistencia o temple de la otra parte
      tipo_de_accion:
        combate: activa
        exploración: no_aplica
      requisitos:
        - una criatura capaz de percibir amenaza, fuerza de presencia o consecuencia
        - una posición, gesto o circunstancia que vuelva creíble la presión ejercida
      criterio_de_umbral: >
        Cuando no haya oposición activa clara, la condición de la escena establece el umbral base.
        La vulnerabilidad del objetivo, la inmediatez de la amenaza y la superioridad aparente ajustan ese valor.
      penalizadores_comunes:
        - situación: amenaza poco creíble o posición débil
          modificador: "-2"
        - situación: objetivo desesperado, fanático o sin nada que perder
          modificador: "-2"
        - situación: presión diluida por terceros o por contexto protector
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia la relación de poder o la credibilidad de la amenaza. Un fallo puede
        inmunizar momentáneamente al objetivo frente a la misma presión inmediata.
    contextos:
      combate: true
      exploración: false
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - hacer que un guardia deje pasar sin credenciales solo con la presencia y la amenaza implícita
      - extraer información de alguien reticente mediante la proyección de consecuencias reales
      - doblar la voluntad de un oponente en una confrontación directa antes de que llegue al combate
    técnicas_habilitadas: []

  - nombre: Imitación
    nombre_en: Imitation
    categoría: social
    característica_asociada: Presencia
    descripción_breve: reproducir comportamiento, voz, maneras o patrones sociales de otro con convicción suficiente
    descripción_completa: >
      Imitación representa la capacidad de observar a alguien y reproducir lo suficiente de su patrón
      para que otros lo crean: su forma de hablar, sus gestos, sus modales, su postura. No es
      actuación artística ni engaño verbal — es la reproducción conductual que permite al personaje
      pasar por otro o por un tipo social que no es el suyo. Existe para distinguir al personaje que
      puede adoptar la identidad de otro en términos de comportamiento del que siempre es reconocible
      como sí mismo.
    fantasía_de_uso: >
      Permite personajes que se hacen pasar por otros, adoptan identidades sociales que les dan
      acceso a espacios o información vedados, y usan la reproducción de comportamiento como
      herramienta de infiltración.
    dominio_central: reproducir comportamiento, voz, maneras o patrones sociales
    cubre: mímica, copia de modales, reproducción conductual para adoptar identidad
    no_cubre: expresión artística propia para audiencia, silencio de movimiento físico, narrativa verbal falsa sin cambio conductual
    taxonomía:
      familia: proyección social
      subfamilia: reproducción conductual y adopción de identidad
      etiquetas: [imitación, mímica, identidad, reproducción-conductual, infiltración]
      modo_primario: acción
      objeto_de_interacción: criatura
    relación_con_otros_dominios: >
      Se distingue de las futuras disciplinas artísticas performativas: Imitación no existe para
      expresar un rol ante una audiencia, sino para reproducir un patrón específico y pasar por otro.
      Se distingue de Engaño en que Imitación opera mediante comportamiento corporal y vocal, no
      mediante narrativa verbal. Se complementa con Sigilo cuando además de imitar es necesario no
      quedar fijado por la atención ajena.
    criterio_de_uso: >
      Debe pedirse cuando el personaje intente reproducir el comportamiento de alguien específico o
      de un tipo social para pasar por él. No corresponde a expresión artística propia, mentira verbal
      sin cambio conductual o reducción de relevancia social sin adopción de identidad.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Imitación
      oposición: >
        normalmente contra umbral por familiaridad, cercanía y escrutinio; puede pasar a prueba
        enfrentada si alguien conoce bien al modelo imitado y contrasta activamente el comportamiento
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - un patrón conductual, voz o identidad que pueda observarse y reproducirse
        - suficiente acceso al contexto social para que la imitación tenga oportunidad de sostenerse
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. La familiaridad del público
        con el modelo, la duración de la exposición y la exigencia del papel ajustan ese valor.
      penalizadores_comunes:
        - situación: conocimiento incompleto del modelo o del entorno social
          modificador: "-2"
        - situación: escrutinio cercano o conversación prolongada
          modificador: "-1"
        - situación: rasgo físico o vocal difícil de reproducir
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el público, el contexto o el grado de exposición. Un fallo ante
        el mismo observador suele dejar sospecha y dificulta repetir la misma identidad de inmediato.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - imitar los modales y el habla de un noble para moverse sin cuestionamientos en su entorno
      - reproducir la voz y el patrón de alguien específico para engañar a quien solo escucha
      - adoptar el comportamiento de un tipo social reconocible para cruzar un control sin ser interrogado
    técnicas_habilitadas: []

  - nombre: Sigilo
    nombre_en: Stealth
    categoría: social
    característica_asociada: Presencia
    descripción_breve: reducir activamente el registro que otros hacen del personaje en el espacio
    descripción_completa: >
      Sigilo representa la capacidad de controlar cuánto registra el entorno social y perceptivo al
      personaje: no solo moverse sin ruido, sino modular presencia, ritmo, visibilidad y foco ajeno
      para que otros no lleguen a fijarlo como un elemento relevante de la escena. No es simple
      agilidad corporal ni una mentira activa — es el arte de pasar por debajo del umbral de atención.
      Existe para distinguir al personaje que puede operar sin ser realmente registrado del que,
      aunque se mueva bien, sigue llamando la atención del espacio que atraviesa.
    fantasía_de_uso: >
      Permite personajes que se infiltran, observan sin ser fijados, atraviesan espacios vigilados
      reduciendo su huella perceptiva y convierten la baja detectabilidad en una herramienta táctica real.
    dominio_central: reducir el registro perceptivo y atencional del personaje en una escena
    cubre: pasar desapercibido, minimizar presencia visible o audible, operar por debajo del foco ajeno
    no_cubre: mentira verbal activa, reproducción de identidad específica, simple precisión corporal sin gestión de presencia
    taxonomía:
      familia: proyección social
      subfamilia: supresión de registro y atención
      etiquetas: [sigilo, infiltración, presencia-baja, foco, detección]
      modo_primario: acción
      objeto_de_interacción: entorno
    relación_con_otros_dominios: >
      Se distingue de Imitación porque Sigilo no busca pasar por otro, sino por nadie relevante.
      Se distingue de Engaño porque no fabrica una narrativa verbal falsa. Puede apoyarse en control
      corporal o cobertura física, pero su núcleo está en no entrar en el foco perceptivo ajeno.
    criterio_de_uso: >
      Debe pedirse cuando el reto central sea no quedar registrado por observadores, vigilancia o
      atención activa dentro de una escena. No corresponde a mentir, actuar un personaje específico
      ni realizar una simple maniobra física delicada sin componente de detección.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Sigilo
      oposición: >
        prueba enfrentada cuando una criatura observa, escucha o busca activamente; umbral cuando la
        dificultad proviene solo del espacio, la luz, el flujo social o la cobertura disponible
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - cobertura, sombra, tránsito, ruido o ritmo suficiente para reducir registro
        - una ruta o posición desde la que la presencia pueda minimizarse de forma creíble
      criterio_de_umbral: >
        Cuando no hay búsqueda activa, la condición del entorno o de la escena establece el umbral
        base. La iluminación, la cobertura, el ruido de fondo, el flujo de personas y la exposición
        del personaje lo ajustan.
      penalizadores_comunes:
        - situación: iluminación abierta o contraluz
          modificador: "-2"
        - situación: cobertura escasa
          modificador: "-1"
        - situación: superficie ruidosa o tránsito que no permite ritmo propio
          modificador: "-2"
        - situación: atención enfocada o vigilancia preparada
          modificador: "-2"
      reintento: >
        Un fallo no se repite automáticamente contra el mismo observador y en la misma posición. Solo
        puede reintentarse si cambia la cobertura, la atención ajena, el flujo del lugar o la ruta.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - cruzar un corredor vigilado sin quedar fijado por la mirada de los guardias
      - permanecer en una sala ocupada sin convertirse en el foco de atención de nadie
      - acercarse lo suficiente a un blanco sin que los observadores registren el avance como amenaza
    técnicas_habilitadas: []
