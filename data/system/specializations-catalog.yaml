  - nombre: Herrería
    nombre_en: Smithing
    categoría: artes-y-oficios
    característica_asociada: Sabiduría
    descripción_breve: dar forma al metal mediante trabajo de forja para producir o reparar objetos funcionales
    descripción_completa: >
      Herrería representa el dominio del metal como material de trabajo: conocer sus propiedades bajo
      calor, saber cuándo está listo para ser moldeado, cómo formarlo para que sea funcional y duradero,
      cómo repararlo cuando falla. No es joyería delicada ni ingeniería de mecanismos — es el trabajo
      práctico con metal en temperatura, golpe y forma. Existe para distinguir al personaje que puede
      producir y mantener objetos metálicos del que depende de lo que otros fabricaron.
    fantasía_de_uso: >
      Permite personajes que reparan equipo en campo, producen herramientas y armas cuando se
      necesitan, y mantienen al grupo equipado con objetos funcionales donde otros solo pueden comprar.
    dominio_central: dar forma y trabajar el metal para función práctica
    cubre: forjado, reparación de objetos metálicos, trabajo práctico de metales
    no_cubre: trabajo de joyería en detalle, teoría de arquitectura, lógica de ingeniería general
    taxonomía:
      familia: comprensión práctica
      subfamilia: trabajo de forja y metal
      etiquetas: [herrería, forja, metal, fabricación, reparación]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se complementa con Minería como fuente de material y con Ingeniería cuando el objeto metálico
      forma parte de un mecanismo más complejo. Se distingue de Joyería en que Herrería trabaja con
      escala y función estructural, no con detalle decorativo delicado.
    criterio_de_uso: >
      Debe pedirse cuando el personaje fabrique, repare o evalúe la calidad de un objeto metálico
      estructural o funcional. No corresponde a trabajo de gemas, diseño de mecanismos complejos o
      trabajo textil.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Herrería
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: no_aplica
      requisitos:
        - metal trabajable y condiciones mínimas de forja o reparación
        - tiempo suficiente para intervención real
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Calidad del metal, acceso
        a calor, herramientas, tiempo y precisión funcional ajustan ese valor.
      penalizadores_comunes:
        - situación: metal dañado, impuro o difícil de trabajar
          modificador: "-1"
        - situación: forja o herramientas incompletas
          modificador: "-2"
        - situación: reparación crítica con margen mínimo de error
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si cambia el material, la herramienta o el margen de trabajo. Un fallo
        puede deformar la pieza o volverla insegura.
    contextos:
      combate: false
      exploración: false
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: no_aplica
    ejemplos_de_uso:
      - reparar una pieza de armadura dañada en un campamento con herramientas de campo
      - fabricar un herraje de emergencia para reemplazar uno roto en equipo crítico
      - evaluar si un arma tiene una falla estructural que la hace peligrosa antes de usarla
    técnicas_habilitadas: []

  - nombre: Sastrería
    nombre_en: Tailoring
    categoría: artes-y-oficios
