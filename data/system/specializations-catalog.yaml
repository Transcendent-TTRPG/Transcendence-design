  - nombre: Ingeniería
    nombre_en: Engineering
    categoría: conocimiento
    característica_asociada: Sabiduría
    descripción_breve: diseñar y entender la lógica estructural de mecanismos, dispositivos y construcciones complejas
    descripción_completa: >
      Ingeniería representa la capacidad de entender cómo funcionan los sistemas físicos complejos:
      qué los hace funcionar, qué los hace fallar, cómo construirlos, cómo modificarlos, cómo
      interpretarlos cuando alguien más los diseñó. No es improvisación de campo ni trabajo manual
      específico — es la lógica estructural que permite producir, evaluar y modificar dispositivos
      y construcciones con intención técnica. Existe para distinguir al personaje que entiende cómo
      funciona un sistema del que solo puede operar los que ya funcionan.
    fantasía_de_uso: >
      Permite personajes que construyen dispositivos complejos, entienden cómo desactivar o modificar
      mecanismos existentes, diseñan soluciones estructurales, y tienen autoridad técnica sobre los
      sistemas físicos que encuentran.
    dominio_central: diseño estructurado y lógica práctica de mecanismos, estructuras o dispositivos funcionales complejos
    cubre: mecanismos, planificación técnica, lógica de diseño estructural
    no_cubre: especialización en trampas en particular, herrería, arquitectura como análisis cultural o constructivo
    taxonomía:
      familia: comprensión práctica
      subfamilia: lógica estructural y diseño de sistemas
      etiquetas: [ingeniería, mecanismos, diseño, estructuras, sistemas-físicos]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se relaciona con Trampas cuando el mecanismo es un sistema de activación, y con Herrería cuando
      la construcción requiere trabajo de metal. Se distingue de Improvisación en que Ingeniería opera
      con lógica estructural formal, no con inventiva de campo sin recursos ideales.
    criterio_de_uso: >
      Debe pedirse cuando el reto sea entender, construir o modificar un sistema físico complejo:
      mecanismo, estructura, dispositivo funcional de múltiples partes. No corresponde a trabajo
      manual específico de un material, instalación de trampas simples o improvisación de campo.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Ingeniería
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - una estructura, mecanismo o dispositivo que pueda leerse o intervenirse como sistema
        - acceso suficiente para inspección, ajuste o diseño
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Complejidad del sistema,
        acceso a sus partes, calidad de herramientas y presión del momento ajustan ese valor.
      penalizadores_comunes:
        - situación: sistema complejo, extraño o parcialmente oculto
          modificador: "-2"
        - situación: herramientas pobres o acceso restringido
          modificador: "-1"
        - situación: riesgo alto de fallo en cascada o daño estructural
          modificador: "-2"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si aparece mejor acceso, nueva información o un enfoque distinto. Un fallo
        puede comprometer el sistema o cerrar el margen de intervención segura.
    contextos:
      combate: false
      exploración: true
      narrativo: true
    tipo_en_combate: no_aplica
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - diseñar un sistema de contrapesos para abrir una compuerta sin mecanismo de accionamiento externo
      - evaluar por qué un mecanismo falla y qué parte necesita ser reemplazada o ajustada
      - entender el diseño de una estructura desconocida lo suficiente para predecir dónde cede
    técnicas_habilitadas: []

  # ─────────────────────────────────────────────
  # INTELECTO
  # Identidad: comprensión formal, sistemas aprendidos, interpretación estructurada, memoria y conocimiento organizado.
  # ─────────────────────────────────────────────

  - nombre: Identificación
    nombre_en: Identification
    categoría: mental
    característica_asociada: Intelecto
    descripción_breve: reconocer qué es algo mediante análisis informado y conocimiento organizado
    descripción_completa: >
      Identificación representa la capacidad de mirar un objeto, criatura o fenómeno y saber qué
      es a partir de conocimiento acumulado: clasificar, nombrar, encuadrar dentro de una categoría
      conocida. No es intuición ni inferencia de motivos — es el reconocimiento preciso que permite
      que el personaje actúe con información correcta sobre lo que tiene delante. Existe para distinguir
      al personaje que puede nombrar y clasificar lo que encuentra del que solo puede observarlo sin
      contexto.
    fantasía_de_uso: >
      Permite personajes que saben qué criatura están enfrentando antes de que ataque, qué objeto
      tienen en las manos antes de usarlo mal, y qué fenómeno están observando antes de actuar sin
      información.
    dominio_central: reconocer qué es algo mediante análisis informado
    cubre: reconocimiento de objetos, reconocimiento de tipo de criatura, identificar clases conocidas de cosas
    no_cubre: significado más profundo de lo identificado, interpretación simbólica, inferencia sin evidencia directa
    taxonomía:
      familia: conocimiento organizado
      subfamilia: clasificación y reconocimiento
      etiquetas: [reconocimiento, clasificación, análisis, identificación, catalogación]
      modo_primario: acción
      objeto_de_interacción: objeto
    relación_con_otros_dominios: >
      Se distingue de Interpretación — Identificación dice qué es algo, Interpretación extrae qué
      significa o implica. Se complementa con Percepción cuando lo detectado también necesita ser
      reconocido, y con Historia o Taumaturgia cuando el conocimiento de dominio específico es
      necesario para clasificar correctamente.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite saber qué es lo que tiene delante: tipo de objeto,
      especie de criatura, categoría de fenómeno. No corresponde cuando el reto sea entender
      implicaciones, inferir sin evidencia física o analizar significados.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Identificación
      oposición: umbral
      tipo_de_accion:
        combate: activa
        exploración: activa
      requisitos:
        - un objeto, criatura o fenómeno que pueda clasificarse o reconocerse
        - información observable suficiente para compararlo con conocimiento previo
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Rareza, estado de conservación,
        distorsión de la muestra y especialización del dominio ajustan ese valor.
      penalizadores_comunes:
        - situación: muestra incompleta, dañada o alterada
          modificador: "-1"
        - situación: especie, fenómeno u objeto raro o muy específico
          modificador: "-2"
        - situación: observación apresurada o con acceso limitado
          modificador: "-1"
        - situación: fatiga
          modificador: "-1 por nivel de Fatiga"
      reintento: >
        Puede reevaluarse si aparece mejor muestra, nueva información o más tiempo de examen.
        Repetirla sobre la misma evidencia sin cambios rara vez mejora el resultado.
    contextos:
      combate: true
      exploración: true
      narrativo: true
    tipo_en_combate: activa
    tipo_en_exploración: activa
    ejemplos_de_uso:
      - reconocer la especie de una criatura antes de que el encuentro escale
      - identificar si un objeto tiene origen taumático o es puramente mecánico
      - determinar de qué material está hecho un artefacto desconocido por sus propiedades observables
    técnicas_habilitadas: []

  - nombre: Interpretación
    nombre_en: Interpretation
    categoría: mental
    característica_asociada: Intelecto
    descripción_breve: extraer significado de señales, patrones y estructuras mediante análisis organizado
    descripción_completa: >
      Interpretación representa la capacidad de ir más allá de lo que está ahí y extraer lo que
      significa: leer implicaciones, conectar patrones, entender la estructura subyacente de algo
      que en superficie parece incompleto o ambiguo. No es intuición visceral ni observación directa
      — es el trabajo analítico de quien puede ver más en los datos de lo que otros perciben. Existe
      para distinguir al personaje que puede convertir información en conocimiento útil del que solo
      puede acumularla sin entenderla.
    fantasía_de_uso: >
      Permite personajes que entienden lo que otros solo ven, conectan información dispersa y producen
      conclusiones que permiten actuar con ventaja informativa real.
    dominio_central: extraer significado de señales, contexto, patrones o estructuras
    cubre: entender la significancia, leer implicaciones, conectar sentido
    no_cubre: detección sensorial directa, inferencia visceral sin análisis, decodificación de lenguaje por sí sola
    taxonomía:
      familia: conocimiento organizado
      subfamilia: análisis de significado y estructura
      etiquetas: [interpretación, análisis, patrones, significado, estructura]
      modo_primario: acción
      objeto_de_interacción: conocimiento
    relación_con_otros_dominios: >
      Se distingue de Percepción — Percepción nota lo presente, Interpretación extrae su significado.
      Se distingue de Intuición en que Interpretación opera con análisis estructurado, no con
      inferencia rápida sin evidencia. Se complementa con todos los dominios de conocimiento cuando
      lo aprendido debe aplicarse a una situación específica.
    criterio_de_uso: >
      Debe pedirse cuando el personaje necesite entender qué significa o implica algo que ya observó
      o tiene delante: un texto, una situación, una secuencia de eventos. No corresponde cuando el
      reto sea detectar, identificar o inferir sin datos.
    procedimiento_base:
      tipo_de_prueba: tirada de especialización de Interpretación
      oposición: umbral
      tipo_de_accion:
        combate: no_aplica
        exploración: activa
      requisitos:
        - información, patrón o estructura ya detectados
        - base suficiente para extraer sentido en lugar de especular en vacío
      criterio_de_umbral: >
        La condición del entorno o de la escena establece el umbral base. Ambigüedad del patrón,
        cantidad de variables y profundidad del contexto ajustan ese valor.
      penalizadores_comunes:
        - situación: información fragmentaria o contradictoria
          modificador: "-1"
        - situación: patrón complejo o deliberadamente ambiguo
          modificador: "-2"
        - situación: presión de tiempo que corta el análisis
          modificador: "-1"
        - situación: fatiga
