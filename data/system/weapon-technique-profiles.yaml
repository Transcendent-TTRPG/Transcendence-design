taxonomy:
  canonical_term:
    es: Perfiles de Tecnica de Arma
    en: Weapon Technique Profiles
  definition: >
    A thematic and functional combat layer between weapon competency and
    concrete Techniques. Profiles group Techniques by combat fantasy, effect
    family, timing identity, and compatibility with weapon families or natural
    attack forms.

design_intent:
  main_uses:
    - avoid_per_item_technique_trees
    - support_natural_weapons_inside_the_same_technique_ecosystem
    - create_combat_identity_without_reintroducing_old_action_point_combo_logic
  not_for:
    - single_item_variants
    - isolated_species_only_schools_by_default
    - global_combo_rules

connection_rules:
  sits_between:
    - weapon_competency
    - technique_authoring
    - natural_attack_forms
  depends_on:
    - techniques_taxonomy
    - competency_domains
    - atb_timing_model
  note: >
    Profiles shape timing identity and Technique clustering, but they do not
    grant automatic repeated-use bonuses or generic combo exceptions.
  access_balance_rule: >
    Manufactured weapon competencies use a uniform core access model: each
    weapon competency grants access to four core Weapon Technique Profiles.
    Specific weapon items may modify range, damage, requirements, or narrow
    Technique permissions, but they do not create extra profile access by
    default. Natural attack forms later inherit from the same shared profiles
    through anatomy, not through a separate natural-only profile list.

atb_rule:
  old_combo_descriptor_model_carried_over: false
  profiles_are_not_global_combo_engines: true
  explicit_chain_logic_must_live_in_technique: true

required_fields:
  - name
  - family
  - fantasy_core
  - compatible_origins
  - natural_weapon_compatibility
  - primary_tags
  - secondary_tags
  - rare_or_limited_tags
  - typical_types
  - usual_cost_profile
  - timing_identity
  - identity_notes
  - should_not_do

authoring_questions:
  - Does this belong to an existing combat profile?
  - If not, is the gap really a new profile and not just a new Technique?
  - Could a natural attack form use this same profile?
  - Does the profile shape ATB timing without creating a global combo rule?

template:
  name: ""
  family: ""
  fantasy_core: ""
  compatible_origins:
    weapon_competencies: []
    weapon_families: []
    natural_attack_forms: []
    secondary_requirements: []
  natural_weapon_compatibility:
    allowed: false
    notes: ""
  primary_tags: []
  secondary_tags: []
  rare_or_limited_tags: []
  typical_types: []
  usual_cost_profile:
    rhythm_tendency: ""
    attrition_tendency: ""
    notes: ""
  timing_identity: ""
  identity_notes: ""
  should_not_do: []

weapon_competency_profile_access:
  access_count_per_weapon_competency: 4
  note: >
    This is the canonical manufactured-weapon access map for Technique
    authoring. The older combo-descriptor model is not carried forward; only
    the profile names and combat concepts survive as identity anchors. Old
    names that implied magic or planar behavior are treated as retired labels,
    not as Technique permissions.
  competencies:
    Spear:
      profiles:
        - Perforation
        - Ward
        - Charge
        - Skirmish
      old_concept_anchors:
        - Perforador
        - Defensivo
        - Carga
        - Agil
    Axes:
      profiles:
        - Rend
        - Sunder
        - Unstoppable
        - Line Control
      old_concept_anchors:
        - Desgarrador
        - Demoledor
        - Impulso
        - Barredor
    Maces:
      profiles:
        - Impact
        - Sunder
        - Unstoppable
        - Bastion
      old_concept_anchors:
        - Aplastante
        - Imparable
        - Golpe Sordo
        - Fortificado
    Long Blades:
      profiles:
        - Flow
        - Rend
        - Lethality
        - Deflection
      old_concept_anchors:
        - Fluyente
        - Cortante
        - Letal
        - Deflectante
    Short Blades:
      profiles:
        - Shadow Pressure
        - Corrosion
        - Lethality
        - Skirmish
      old_concept_anchors:
        - Sombrio
        - Erosivo
        - Implacable
        - Veloz
    Daggers:
      profiles:
        - Unpredictability
        - Shadow Pressure
        - Lethality
        - Deflection
      old_concept_anchors:
        - Enganoso
        - Brumoso
        - Penetrante
        - Disruptivo
    Thrown Weapons:
      profiles:
        - Precision
        - Ricochet
        - Volley
        - Interruption
      old_concept_anchors:
        - Preciso
        - Ricochete
        - Propulsion
        - Intercepcion
    Ranged Weapons:
      profiles:
        - Precision
        - Ricochet
        - Volley
        - Corrosion
      old_concept_anchors:
        - Aguijon
        - Ricochete
        - Rafaga
        - Desgaste
    Flexible Weapons:
      profiles:
        - Torsion
        - Unpredictability
        - Skirmish
        - Interruption
      old_concept_anchors:
        - Torsion
        - Impredecible
        - Fluctuante
        - Persistente
    Shield:
      profiles:
        - Interception
        - Interruption
        - Line Control
        - Bastion
      old_concept_anchors:
        - Interceptacion
        - Interrupcion
        - Control de Campo
        - Bastion

profiles:
  - name: Perforation
    name_es: Perforación
    family: Spear / thrusting reach / piercing natural impact
    fantasy_core: >
      Driving force through a narrow line to break distance, threaten entry,
      and punish exposed forward commitment.
    compatible_origins:
      weapon_competencies:
        - Spear
      weapon_families:
        - thrusting_polearms
        - long_thrusting_weapons
        - dedicated_piercing_reach_weapons
      natural_attack_forms:
        - horn
        - tusk
        - fang
        - beak
        - stinger
      secondary_requirements:
        - may_pair_with_evasion
        - may_pair_with_shield
        - may_pair_with_tracking
        - may_pair_with_tolerance
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when they create a committed
        piercing line rather than broad tearing, blunt crashing, or flexible
        constriction.
    primary_tags:
      - attack
      - pressure
      - precision
    secondary_tags:
      - setup
      - mobility
      - disruption
    rare_or_limited_tags:
      - control
      - defense
      - recovery
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: low_to_medium
      attrition_tendency: low_to_medium
      notes: >
        Low Attrition when used as disciplined threat projection; medium when
        built around repeated committed drives or harsh body-weight transfer.
    timing_identity: >
      Best in entry denial, lane control, decisive extension, and punish
      windows created by enemy advance, overreach, or exposed line.
    identity_notes: >
      Perforation Techniques should feel linear, committed, and exact. They
      are about reach discipline, point-first pressure, body alignment, and
      decisive forward authority. The user wins by claiming the line before the
      opponent can safely cross it.
    should_not_do:
      - wide_sweeping_multi_target_control
      - heavy_blunt_impact_identity
      - concealment_or_shadow_play
      - abstract_condition_removal
      - purely_defensive_bastion_play
  - name: Interception
    name_es: Intercepción
    family: Shield interception / line denial / protective redirection
    fantasy_core: >
      Stepping into the hostile line at the last moment to catch, divert,
      absorb, or spoil what was meant for someone else or for a more vulnerable
      opening.
    compatible_origins:
      weapon_competencies:
        - Shield
      weapon_families:
        - shields
        - guard_tools
        - dedicated_protective_off_hand_structures
      natural_attack_forms:
        - tail
        - shell
        - heavy_forelimb
        - plated_crest
      secondary_requirements:
        - may_pair_with_armor
        - may_pair_with_evasion
        - may_pair_with_leadership
        - may_pair_with_tolerance
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when anatomy can meaningfully
        cover, catch, block, or spoil a hostile line. It should not be used by
        natural attacks whose identity is only tearing, piercing, or pure
        offense.
    primary_tags:
      - defense
      - interception
      - control
    secondary_tags:
      - setup
      - disruption
      - anti_displacement
    rare_or_limited_tags:
      - attack
      - mobility
      - recovery
    typical_types:
      - reactive
      - active
      - passive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: low_to_medium
      notes: >
        Low-to-medium Attrition when used as disciplined coverage; medium when
        repeatedly absorbing force or protecting others under heavy pressure.
    timing_identity: >
      Lives in reaction windows, ally coverage, lane denial, body-first
      protection, and spoil timing against incoming strikes, charges, or hostile
      entry attempts.
    identity_notes: >
      Interception Techniques should feel protective without becoming static.
      They are about reading the line early enough to occupy it, turning
      defense into spatial control, and making hostile momentum hit the wrong
      surface, angle, or timing. The user alters what reaches the target rather
      than merely enduring it.
    should_not_do:
      - stealth_or_concealment_identity
      - pure_ranged_pressure
      - long_form_recovery_as_primary_role
      - wide_offensive_sweeping_damage
      - abstract_nonspatial_condition_cleansing
  - name: Flow
    name_es: Fluidez
    family: Long-blade flow / continuous edge control / elegant offensive transition
    fantasy_core: >
      Maintaining dangerous continuity through stance, edge, and movement so
      that one action naturally opens the next without losing authority over
      spacing.
    compatible_origins:
      weapon_competencies:
        - Long Blades
      weapon_families:
        - swords
        - sabres
        - curved_long_blades
        - balanced_cutting_weapons
      natural_attack_forms:
        - claw
        - forelimb_blade
        - elongated_edge_like_appendage
      secondary_requirements:
        - may_pair_with_evasion
        - may_pair_with_balance
        - may_pair_with_focus
        - may_pair_with_leadership
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when they sustain controlled
        cutting continuity or edge-like directional pressure. It should not be
        used by forms whose identity is only blunt crashing, constriction, or
        committed piercing.
    primary_tags:
      - attack
      - mobility
      - setup
    secondary_tags:
      - pressure
      - defense
      - disruption
    rare_or_limited_tags:
      - recovery
      - interception
      - control
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: low_to_medium
      notes: >
        Low-to-medium Attrition when movement stays clean; medium when the user
        keeps chaining transitions under hard pressure or extended commitment.
    timing_identity: >
      Lives in tempo carry, repositioning between exchanges, angle-taking,
      continuation after contact, and techniques that turn a successful
      movement or cut into the next advantageous state.
    identity_notes: >
      Flow Techniques should feel graceful without becoming decorative. They
      are about continuity, edge authority, and the ability to keep a blade
      alive through transitions so that the opponent keeps answering the
      previous threat while the next one is already forming. The user should
      feel mobile, composed, and dangerous in motion.
    should_not_do:
      - static_bastion_identity
      - heavy_impact_breaking_play
      - concealment_or_assassination_identity
      - pure_ranged_projection
      - abstract_condition_removal
  - name: Shadow Pressure
    name_es: Acecho
    family: Short-blade shadow pressure / opportunistic close-range exploitation
    fantasy_core: >
      Staying close, hard to read, and immediately dangerous by turning
      concealment, distraction, angle, or hesitation into fast pressure before
      the opponent can reset.
    compatible_origins:
      weapon_competencies:
        - Short Blades
        - Daggers
      weapon_families:
        - knives
        - daggers
        - short_stabbing_blades
        - concealment_ready_close_weapons
      natural_attack_forms:
        - fang
        - claw
        - small_stinger
        - hooked_beak
      secondary_requirements:
        - may_pair_with_stealth
        - may_pair_with_deception
        - may_pair_with_imitation
        - may_pair_with_intuition
        - may_pair_with_evasion
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when they create opportunistic
        close pressure through speed, angle, concealment, or sudden insertion.
        It should not be used by natural forms whose identity is broad tearing,
        heavy impact, or open frontal domination.
    primary_tags:
      - attack
      - stealth
      - pressure
    secondary_tags:
      - mobility
      - setup
      - disruption
    rare_or_limited_tags:
      - defense
      - control
      - recovery
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: low_to_medium
      attrition_tendency: low_to_medium
      notes: >
        Low Attrition for short opportunistic bursts; medium Attrition when
        repeatedly forcing entry, concealment transitions, or unstable close
        pressure under heavy awareness.
    timing_identity: >
      Lives in surprise windows, blind-side entry, post-distraction pressure,
      punishment of hesitation, and rapid close exchanges where the user
      strikes before the enemy reorients.
    identity_notes: >
      Shadow Pressure Techniques should feel predatory, intimate, and
      immediate. They are about owning the moment when the opponent loses clean
      read, not about long duels of visible dominance. The user should feel
      like a threat that appears from the wrong angle, exploits a tiny lapse,
      and keeps the pressure too close to comfortably answer.
    should_not_do:
      - open_line_reach_dueling
      - static_guardian_play
      - heavy_blast_or_impact_identity
      - broad_multi_target_sweeps
      - abstract_noncontact_support
  - name: Line Control
    name_es: Control de Línea
    family: Line control / spatial denial / forced repositioning
    fantasy_core: >
      Deciding where bodies can safely stand, pass, or commit by shaping
      lanes, edges, and collision points through pressure applied to space
      rather than to damage alone.
    compatible_origins:
      weapon_competencies:
        - Shield
        - Axes
      weapon_families:
        - shields
        - broad_control_surfaces
        - push_oriented_defensive_tools
      natural_attack_forms:
        - tail
        - heavy_forelimb
        - shell
        - trunk
      secondary_requirements:
        - may_pair_with_armor
        - may_pair_with_strength
        - may_pair_with_balance
        - may_pair_with_interception
        - may_pair_with_engineering
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when anatomy can push, redirect,
        block passage, sweep space, or create enforced movement without relying
        on pure damage as the main identity.
    primary_tags:
      - control
      - anti_displacement
      - disruption
    secondary_tags:
      - defense
      - setup
      - pressure
    rare_or_limited_tags:
      - attack
      - recovery
      - stealth
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: medium
      notes: >
        Medium Attrition when repeatedly contesting space, shifting bodies, or
        holding denial under pressure.
    timing_identity: >
      Lives in choke points, ally protection geometry, hostile path denial,
      trap shaping, push timing, and moments where one forced step or blocked
      lane changes the whole exchange.
    identity_notes: >
      Line Control Techniques should feel territorial and positional. They are
      about making the battlefield narrower, worse, or more dangerous for the
      opponent and safer or more useful for allies. The user should feel like
      someone who governs movement and commitment, not like someone who merely
      tanks hits.
    should_not_do:
      - pure_stationary_bastion_identity
      - concealment_or_assassination_play
      - long_range_projectile_pressure
      - abstract_condition_cleansing
      - high_precision_dueling_as_primary_identity
  - name: Ricochet
    name_es: Rebote
    family: Thrown ricochet / angled projection / rebound pressure
    fantasy_core: >
      Using angle, impact surface, and projectile behavior to create pressure
      that does not follow the most obvious direct line.
    compatible_origins:
      weapon_competencies:
        - Thrown Weapons
        - Ranged Weapons
      weapon_families:
        - throwing_blades
        - throwing_spikes
        - rebound_capable_projectiles
        - hard_small_missiles
      natural_attack_forms:
        - projected_quill
        - shard_burst
        - hardened_fluid_shot
      secondary_requirements:
        - may_pair_with_precision
        - may_pair_with_focus
        - may_pair_with_engineering
        - may_pair_with_perception
        - may_pair_with_intuition
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when the projectile or expelled
        attack can realistically skip, rebound, fragment in a controlled line,
        or continue through shaped impact logic. It should not be used by
        natural attacks whose identity is only spray, mist, or pure
        magical-seeming spread.
    primary_tags:
      - attack
      - setup
      - disruption
    secondary_tags:
      - pressure
      - precision
      - control
    rare_or_limited_tags:
      - defense
      - recovery
      - stealth
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: low_to_medium
      notes: >
        Low-to-medium Attrition when geometry is favorable; medium when
        repeated angle calculation, environmental exploitation, or chained
        projection is forced under pressure.
    timing_identity: >
      Lives in indirect lines, cover-denial, rebound setups, multi-angle
      threat, and moments where the environment itself becomes part of the
      hostile trajectory.
    identity_notes: >
      Ricochet Techniques should feel clever, sharp, and materially grounded.
      They are about weaponizing surfaces, rebounds, skips, and continuation
      paths so that the enemy is threatened from a line they did not fully own
      or expect. The user should feel like someone who sees the battlefield as
      geometry, not just as straight-line range.
    should_not_do:
      - pure_volume_fire_identity
      - magical_homing_behavior
      - concealment_or_melee_assassination_identity
      - massive_area_blast_as_primary_mode
      - abstract_condition_removal
  - name: Precision
    name_es: Precisión
    family: Precision shot / selective impact / exact ranged pressure
    fantasy_core: >
      Placing force exactly where it matters by reading distance, movement,
      exposure, and target structure better than the opponent can deny it.
    compatible_origins:
      weapon_competencies:
        - Ranged Weapons
        - Thrown Weapons
      weapon_families:
        - bows
        - crossbows
        - firearms_if_later_present
        - precise_thrown_weapons
        - direct_line_projectile_systems
      natural_attack_forms:
        - spine_shot
        - needle_spit
        - focused_fluid_jet
      secondary_requirements:
        - may_pair_with_focus
        - may_pair_with_perception
        - may_pair_with_identification
        - may_pair_with_intuition
        - may_pair_with_tracking
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when they produce a direct,
        aimable, repeatable projectile or projected strike. It should not be
        used by diffuse sprays, broad clouds, or uncontrolled scatter attacks.
    primary_tags:
      - attack
      - precision
      - pressure
    secondary_tags:
      - setup
      - disruption
      - control
    rare_or_limited_tags:
      - mobility
      - defense
      - recovery
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: low_to_medium
      notes: >
        Low Attrition for disciplined single-shot execution; low-to-medium
        Attrition when repeated under movement, range distortion, or hard
        target-read pressure.
    timing_identity: >
      Lives in exposed moments, weak-point lines, punish shots after movement
      errors, and any exchange where one exact impact can alter the next state
      more than raw volume would.
    identity_notes: >
      Precision Techniques should feel calm, exact, and surgically decisive.
      They are about certainty of placement, not volume of fire. The user
      should feel like someone who understands distance, angle, and target
      vulnerability well enough to make one shot matter more than several
      careless ones.
    should_not_do:
      - chaotic_multi_angle_rebound_identity
      - broad_suppression_fire_as_primary_mode
      - concealment_melee_entry_play
      - wide_area_blast_logic
      - abstract_condition_removal
  - name: Charge
    name_es: Embestida
    family: Charge / committed entry / momentum impact
    fantasy_core: >
      Converting movement, mass, and forward commitment into a decisive
      collision that breaks position, forces reaction, or overwhelms the line
      before the enemy can stabilize.
    compatible_origins:
      weapon_competencies:
        - Spear
      weapon_families:
        - spears
        - lances
        - heavy_impact_weapons
        - mounted_charge_weapons
        - committed_rush_tools
      natural_attack_forms:
        - horn
        - tusk
        - headbutt_crest
        - trampling_forebody
      secondary_requirements:
        - may_pair_with_balance
        - may_pair_with_tolerance
        - may_pair_with_armor
        - may_pair_with_mount_handling
        - may_pair_with_line_control
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when anatomy can deliver
        meaningful forward-drive impact through mass, speed, leverage, or
        body-first commitment. It should not be used by light opportunistic
        attacks whose identity is only angle theft or concealment.
    primary_tags:
      - attack
      - pressure
      - anti_displacement
    secondary_tags:
      - disruption
      - mobility
      - control
    rare_or_limited_tags:
      - defense
      - recovery
      - stealth
    typical_types:
      - active
      - reactive
    usual_cost_profile:
      rhythm_tendency: medium_to_high
      attrition_tendency: medium_to_high
      notes: >
        Medium Attrition by default, and potentially high Attrition when
        repeated under terrain resistance, body contact, or failed breakthrough
        conditions.
    timing_identity: >
      Lives in engagement openings, rush windows, committed approach, mounted
      entry, and moments where breaking the opponent's line or posture matters
      more than clean sustained exchange.
    identity_notes: >
      Charge Techniques should feel forceful, committed, and difficult to
      ignore. They are about arriving with enough momentum that the opponent
      must yield space, absorb impact, or be structurally disrupted. The user
      should feel like a dangerous advancing mass, not a delicate duelist
      extending a line.
    should_not_do:
      - static_defensive_guardian_play
      - concealment_or_shadow_identity
      - fine_precision_targeting_as_primary_mode
      - indirect_ranged_geometry
      - abstract_condition_removal
  - name: Bastion
    name_es: Bastión
    family: Bastion / anchored defense / protected endurance
    fantasy_core: >
      Becoming the point that does not easily yield, using structure, stance,
      shield mass, and disciplined endurance to hold a line that others would
      lose.
    compatible_origins:
      weapon_competencies:
        - Shield
        - Maces
        - Armor
      weapon_families:
        - tower_shields
        - heavy_shields
        - defensive_guard_assemblies
        - fixed_protection_structures
      natural_attack_forms:
        - shell
        - plated_crest
        - heavy_forelimb
        - braced_body_frame
      secondary_requirements:
        - may_pair_with_tolerance
        - may_pair_with_armor
        - may_pair_with_containment
        - may_pair_with_interception
        - may_pair_with_leadership
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when anatomy can genuinely brace,
        cover, endure, and protect through mass or structure. It should not be
        used by purely agile or opportunistic forms with no credible holding
        surface.
    primary_tags:
      - defense
      - stability
      - mitigation
    secondary_tags:
      - control
      - support
      - survival_window
    rare_or_limited_tags:
      - attack
      - mobility
      - stealth
    typical_types:
      - active
      - reactive
      - passive
    usual_cost_profile:
      rhythm_tendency: medium
      attrition_tendency: low_to_medium
      notes: >
        Low-to-medium Attrition for disciplined holding; medium Attrition when
        repeatedly absorbing force, guarding others, or maintaining posture
        under concentrated pressure.
    timing_identity: >
      Lives in hold-the-line moments, ally shelter, attritional exchanges,
      last-stand windows, and phases where surviving the next impact matters
      more than taking the next step.
    identity_notes: >
      Bastion Techniques should feel weighty, disciplined, and reassuring to
      allies. They are about becoming a defended point in the field, not just
      blocking one strike. The user should feel like someone who can anchor
      pressure, hold formation, and keep collapse from spreading.
    should_not_do:
      - fast_skirmish_mobility_identity
      - concealment_or_assassination_play
      - precise_dueling_as_primary_mode
      - indirect_ranged_geometry
      - abstract_condition_cleansing
  - name: Torsion
    name_es: Torsión
    family: Torsion / flexible reach / angular redirection
    fantasy_core: >
      Using bend, wrap, whip, or redirection of trajectory to threaten from
      difficult angles and reshape how force travels through contact.
    compatible_origins:
      weapon_competencies:
        - Flexible Weapons
