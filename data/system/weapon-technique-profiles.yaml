        - may_pair_with_balance
    natural_weapon_compatibility:
      allowed: true
      notes: >
        Natural forms can access this profile when anatomy can keep driving
        through contact, resistance, or stagger without losing offensive
        structure. It should not be used by light opportunistic forms whose
        identity depends on quick withdrawal or deceptive spacing.
    primary_tags:
      - attack
      - pressure
      - stability
    secondary_tags:
      - anti_displacement
      - disruption
      - mitigation
    rare_or_limited_tags:
