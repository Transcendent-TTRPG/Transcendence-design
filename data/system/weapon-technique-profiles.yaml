        Low-to-medium Attrition when used as selective finish pressure; medium
        Attrition when repeatedly forced through guarded or collapsing
        openings.
    timing_identity: >
      Lives in exposed vitals, finishing windows, punishment of decisive
      mistakes, and exchanges where one exact close-range resolution matters
      more than prolonged pressure.
    identity_notes: >
      Lethality Techniques should feel final, surgical, and dangerous in a
      way distinct from ranged Precision. They are about ending the fight
      because the right opening was exploited at the right depth and angle.
      The user should feel like someone who recognizes when one exact
      committed strike can decide everything.
    should_not_do:
