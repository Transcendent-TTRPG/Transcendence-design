catalog_use_rule:
  - use_when_object_is_mundane
  - use_when_object_is_bought_carried_stored_consumed_or_replaced_as_part_of_ordinary_play
  - use_when_table_does_not_need_full_subsystem_or_bespoke_authored_item_entry
  - use_when_market_question_is_more_about_access_price_or_load_than_unique_powers
  - move_to_more_specific_system_layer_if_object_becomes_culturally_unique_faction_locked_materially_exceptional_or_mechanically_deep

relationships:
  faction_reputation_and_commerce:
    determines_how_easy_objects_are_to_source_at_what_price_and_through_whose_channels
