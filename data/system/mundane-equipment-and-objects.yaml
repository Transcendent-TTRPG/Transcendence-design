authority: docs/system/mundane-equipment-and-objects.md

purpose:
  - provide_broad_catalog_for_ordinary_non_magical_carried_goods
  - answer_mundane_inventory_questions_without_needing_full_authored_subsystems
  - separate_daily_equipment_from_deeper_combat_and_material_layers

non_goals:
  - define_full_weapon_families_with_profile_logic
  - define_armor_slot_and_block_logic
  - define_vestigios_or_vinculos
  - replace_materials_and_fabrication_for_complex_commissioned_goods

category_model:
