rhythm_scale:
  description: >
    The base anchor bands of the ATB combat timeline.
    Base costs are assigned by action family, not by specific weapon or specialization.
    These anchor bands define the common timing language for base actions, but
    authored Techniques may use intermediate values between anchors when finer
    timing calibration is needed.
  bands:
    - cost: 0
      label: free
      description: No meaningful time cost — does not advance the ATB marker
    - cost: 3
      label: quick
      description: Light, immediate action with minimal commitment
    - cost: 5
      label: standard
      description: Normal committed action within standard combat pace
    - cost: 7
      label: heavy
      description: High-commitment action with significant recovery time
    - cost: 9
      label: extreme
      description: >
        Maximum commitment. Reserved for extreme actions, major abilities,
        or specialized maneuvers. No universal base action uses this band.

base_actions:
  description: >
    Universal action families with their base rhythm and Attrition costs.
    These apply when no specific ability, aptitude, or competency bonus modifies them.
    Attrition costs assume the action is performed under meaningful scene pressure.
  actions:
    - id: free_action
      label: Free Action
      examples: [drop, speak]
      rhythm_cost: 0
      attrition_cost: 0
      constraints:
        drop: >
          Releasing an item actively part of a grip, hold, or committed joint maneuver
          is not free — it requires Interact (cost 3) instead.
        speak: >
          Communication intended to deceive, persuade, negotiate, or apply social
          pressure is not free. Brief tactical utterances and short phrases only.

    - id: interact
      label: Interact
      rhythm_cost: 3
      attrition_cost: 1
      attrition_note: >
        Generates 1 Attrition only when performed under meaningful scene pressure.
        Trivial or non-pressured interactions generate 0.
      examples:
        - grabbing something within reach
        - opening or closing something simple
        - activating a small mechanism
        - quick practical adjustment to equipment
        - picking up a nearby item

    - id: move
      label: Move
      rhythm_cost: 5
      attrition_cost: 1
      notes: >
        Terrain does not change rhythm cost. Terrain affects distance covered,
        required checks, safety, and consequences of movement.

    - id: specialization
      label: Specialization
      rhythm_cost: 4
      attrition_cost: 1
      notes: >
        Use of any specialization in a hostile scene: jumping, acrobatics, perception,
        interpretation, tracking, social reading, crafting under pressure, etc.
        The cost is the same regardless of specialization type because the reason is the same:
        the character is under active scene pressure and the action requires real attention and effort.
        Set at 4 (between Quick and Standard) to encourage creative specialization use in combat —
        specializations are the flexible action space of play and should be efficient enough to
        compete with attacking. Techniques may still modify this cost up or down.

    - id: hide
      label: Hide
      rhythm_cost: 6
      attrition_cost: 1
      notes: >
        Hide is a broad base action that changes tactical information state and therefore sits
        above simple movement or interaction. Authored concealment Techniques should usually
        feel cleaner, narrower, or more decisive than this fallback line.

    - id: attack_natural
      label: Attack with Natural Weapon
      rhythm_cost: 6
      attrition_cost: 1
      notes: >
        Covers claws, bite, horns, tail, pincers, and other built-in offensive forms at the
        base layer. Species identity should emerge primarily through authored natural-attack
        Techniques, not through this universal fallback.

    - id: attack_one_handed
      label: Attack with One-Handed Weapon
      rhythm_cost: 6
      attrition_cost: 1
      notes: >
        Covers all one-handed offensive weapon families at the base layer.
        Distinct weapon identity should emerge primarily through impact, effects, traits,
        and authored Techniques rather than through repeated base attacks.

    - id: attack_two_handed
      label: Attack with Two-Handed Weapon
      rhythm_cost: 7
      attrition_cost: 1
      notes: >
        Covers all two-handed offensive weapon families. Rhythm cost 7 already creates
        a natural Attrition disadvantage over time (fewer activations). Adding 2 Attrition
        would double-penalize heavy styles — instead, lower cadence means lower total
        Attrition accumulation, which rewards sustained heavy combat appropriately.

    - id: attack_dual_wield
      label: Attack with Two One-Handed Weapons
      rhythm_cost: 8
      attrition_cost: 1
      notes: >
        Dual-wield at the upper end of Heavy baseline due to coordination and offensive
        commitment. Attrition 1 for the same reason as two-handed: rhythm cost already governs
        the trade-off, while authored two-weapon Techniques should remain the cleaner and more
        differentiated way to exploit dual-wielding.

attrition_structural_rule:
  description: >
    Default Attrition anchors for base action commitment level, consistent with
    the Fatigue timing principle (Fatigue 1 should arrive after the enemy's
    main logic is actionable but before the threat has collapsed). Authored
    Techniques may exceed these anchors when exceptional strain is a deliberate
    balancing factor.
  standard: 1   # Standard meaningful actions under pressure
  heavy: 2      # Heavy or strongly committed actions
  extreme: 3    # Pending specific ability definitions

competency_and_rhythm:
  principle: >
    Competency rank interacts with rhythm in two ways only.
    The base action family rhythm is never automatically reduced by rank level.
  modes:
    - id: ability_unlock
      description: >
        A competency rank unlocks new abilities with their own rhythm values
        (faster or slower than the base family). The base action is unchanged;
        a new option is added.
    - id: friction_reduction
      description: >
        A specific competency bonus may reduce the rhythm cost of a specific
        ability or action. This is always ability-specific, not family-wide.

initial_position:
  steps:
    - step: 1
      label: Opening Value
      formula: "Preparation + situational_modifiers"
      description: Each participant calculates their individual score.
    - step: 2
      label: Reference Point
      formula: "max(Opening Value) across all participants"
      description: The Narrator identifies the highest Opening Value. This is the Reference Point.
    - step: 3
      label: Initial Position
      formula: "Reference Point − Opening Value"
      description: Highest Opening Value → position 0 → acts first. All others placed further right by their difference from the Reference Point.
  rule: The participant with the highest Opening Value is placed at 0 and acts first. Rhythm costs stack on top from the first activation onward.
  tiebreak: Raw Preparation (before situational modifiers). If still tied, Narrator uses a fixed secondary criterion.
  situational_modifiers:
    - situation: Ambushing
      modifier: +2
    - situation: Weapon ready or prepared stance
      modifier: +1
    - situation: Cover or dominant position
      modifier: +1
    - situation: Target exposed or distracted
      modifier: +1
    - situation: Surprised
      modifier: -2
    - situation: Drawing weapon or reorganizing
      modifier: -1
    - situation: Poor immediate terrain
      modifier: -1
    - situation: Asleep, wounded, disoriented, or poorly positioned
      modifier: "-1 to -3"
