fabrication:
  core_rule: >
    Fabrication is governed by the specialization that owns the work, not by
    Focus as a generic progress tax.
  world_layers:
    natural_materials: carry_most_standard_fabrication
    processed_materials: ordinary_transformation_layer
    living_materials: >
      usually_require_special_handling_rule_maintenance_condition_narrower_valid_domains_narrower_outputs_or_specific_environmental_requirements
  usual_domains:
    forged_weapons_metal_armor_structural_metal_parts: Herreria
    cloth_armor_garments_leatherwork_flexible_gear: Sastreria
    fine_setting_gemstone_work_precision_adornment: Joyeria
    mechanisms_assemblies_complex_structural_function: Ingenieria
    prepared_compounds_elixirs_poisons_alchemical_products: Alquimia
  requirements:
    - valid_plan_design_or_known_recipe
    - valid_material_inputs
    - valid_tools_workshop_or_kit
    - responsible_specialization
    - work_time
    - labor_cost
    - difficulty_band
  work_intervals:
    note: >
      The framework does not force hourly rolls. Each authored process should
      define meaningful intervals such as stage, session, workday, formula
      cycle, or structural pass.
    failed_roll_default:
      - time_is_spent
      - no_meaningful_progress_is_made
      - optional_material_stress_or_waste_if_authored
  complexity_bands:
    - simple
    - complex
    - advanced

refinement:
  core_rule: >
    Refinement is separate from base fabrication. It modifies an already-valid
    object through an additional material layer or authored augmentation path.
  required_fields:
    - valid_base_object
    - consumed_refinement_material
    - responsible_specialization
    - time_requirement
    - difficulty_band
    - exact_granted_property
  allowed_output_surfaces:
    - durability
    - base_potency
    - critical_break_behavior
    - resistance_or_vulnerability_trait
    - protection_profile
    - delivery_profile
    - named_equipment_property

alchemy:
  authored_through:
    - formula_or_recipe
    - reagent_requirements
    - plant_or_biological_inputs
    - alchemical_index_or_complexity_measure
    - delivery_route_if_relevant
  qualifying_roll: Alquimia

plants:
  role: sourcing_inputs
  accessibility_model:
    high:
      extraction_difficulty_band: Fundamental
      base_extraction_time: "15 min"
      minimum_kit: basic
    medium:
      extraction_difficulty_band: Rigorous
      base_extraction_time: "30 min"
      minimum_kit: advanced
    low:
