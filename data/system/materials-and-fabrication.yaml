meta:
  version: "1.1"
  status: draft
  last_updated: "2026-06-15"

system_scope:
  purpose:
    - define_materials_as_mechanical_objects
    - define_extraction_as_trained_process
    - define_conservation_as_decay_and_preservation_layer
    - define_fabrication_as_specialization_driven_production
    - define_refinement_as_separate_upgrade_layer
  not_yet_in_scope:
    - full_material_catalog
    - full_recipe_catalog
    - exact_plant_catalog
    - full_world_production_catalog

material_model:
  required_fields:
    - family
    - grade
    - accessibility
    - durability
    - base_potency
    - processing_state
    - valid_domains
    - conservation_profile
    - material_state
  taxonomy:
    natural_materials:
      note: >
        Baseline resource layer of the world. These should carry most routine
        extraction, trade, fabrication, and survival play.
      includes:
        - creature_parts
        - metals
        - minerals_and_stone
        - woods
        - fibers_and_textiles
        - leather_and_processed_hide
        - plants_and_fungi
        - fluids_and_glands
        - organs_and_sensitive_biological_components
    processed_materials:
      note: >
        Produced from natural materials through a valid fabrication domain. A
        processed material should define its source family and whether it
        inherits, replaces, or modifies source material surfaces.
    living_materials:
      note: >
        Extraordinary setting layer. Defined not by origin alone but by
        continued responsive, adaptive, growing, or behaviorally active
        material logic after becoming usable world material.
  families:
    - creature_parts
    - metals
    - minerals_and_stone
    - woods
    - fibers_and_textiles
    - leather_and_processed_hide
    - fluids_and_glands
    - organs_and_sensitive_biological_components
    - plants_and_fungi
    - precious_stones_and_fine_setting_materials
  material_states:
    inert:
      meaning: structurally_meaningful_but_not_actively_self_changing
    organic:
      meaning: derived_from_living_matter_but_not_behaviorally_active_as_material
    living:
      meaning: actively_responsive_adaptive_growing_or_self_adjusting_as_material
    tauma_reactive:
      meaning: changes_behavior_when_exposed_to_tauma_or_other_defined_extranatural_carrier
    tauma_impregnated:
      meaning: holds_residual_extranatural_charge_or_memory_without_necessarily_being_alive
  grade_model:
    note: "Grade is material quality band, not the same thing as accessibility."
    common_authored_grades:
      "1": common
      "2": rare
      "3": exceptional
    durability_and_potency_scaling:
      rule: "durability_base and potency_base are grade-1 values. Actual D = base × grade. Actual P = base × grade."
      applies_to: all_materials
  living_material_behaviors:
    - growth
    - regeneration
    - shedding
    - adhesion
    - contraction
    - pulse
    - filtering
    - attunement
    - tauma_reactivity
    - dependency

accessibility:
  note: >
    Accessibility expresses how difficult a material is to correctly extract,
    identify, process, or work. It sets a base difficulty band; actual
    thresholds still follow the universal difficulty table with NR scaling.
  tiers:
    general:
      meaning: commonly_worked_broadly_available_or_structurally_forgiving
      default_difficulty_band: Challenging
    limited:
      meaning: less_available_more_delicate_or_more_demanding_to_work
      default_difficulty_band: Demanding
    singular:
      meaning: rare_dangerous_highly_unstable_or_technically_extreme
      default_difficulty_band: Extreme

extraction:
  core_rule: >
    Extraction is always resolved through the relevant specialization, never
    through Focus as a generic continuation roll.
  usual_domains:
    creature_tissues_hides_organs_glands_fluids: Medicina
    mineral_seams_ore_stone_compacted_structural_earth: Mineria
    plants_fungi_botanical_reagents: Herboristeria
  requirements:
    - valid_physical_access_to_source
    - relevant_tool_or_kit
    - remaining_integrity_in_source
    - credible_specialization_rank
    - threshold_based_on_accessibility_source_condition_and_pressure
  tool_grades:
    - basic
    - advanced
    - specialized
  tool_grade_functions:
    - may_permit_higher_grade_material_handling
    - may_reduce_extraction_time
    - may_increase_reliable_yield
    - may_reduce_spoilage_or_self_contamination
  output_requirements:
    - unit_definition
    - source_damage_or_ruin_rule
    - size_based_yield_scaling
    - failure_consequence_rule
  creature_parts:
    default_specialization: Medicina
    tool_requirement: extraction_kit
    catalog:
      pelaje:
        unit: kg
        durability_base: 4
        potency_base: 2
        cost_formula: "10 * q"
        sensitivity_group: non_sensitive
        default_accessibility: general
      plumaje:
        unit: kg
        durability_base: 3
        potency_base: 1
        cost_formula: "10 * q"
        sensitivity_group: non_sensitive
        default_accessibility: general
      cuernos:
