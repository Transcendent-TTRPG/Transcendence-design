        unit: liter
        durability_base: 2
        potency_base: 0
        cost_formula: "20 * q"
        sensitivity_group: sensitive
        default_accessibility: general
      glandulas:
        unit: unit
        durability_base: 2
        potency_base: 0
        cost_formula: "30 * q"
        sensitivity_group: sensitive
        default_accessibility: limited
      organos:
        unit: unit
        durability_base: 2
        potency_base: 0
        cost_formula: "40 * q"
        sensitivity_group: sensitive
