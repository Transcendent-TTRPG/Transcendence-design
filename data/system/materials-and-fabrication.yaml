        unit: unit
        durability_base: 1
        potency_base: 0
        cost_formula: "150 * q"
        sensitivity_group: sensitive
        default_accessibility: singular
    sensitivity_groups:
      non_sensitive:
        note: bulk_structural_extraction_usually_measured_in_kg
      sensitive:
        note: precision_extraction_usually_measured_in_units_or_liters
    tool_grades:
      basic:
        safe_up_to_grade: 1
        time_reduction_percent: 0
        roll_bonus: 0
      advanced:
        safe_up_to_grade: 2
        time_reduction_percent: 25
        roll_bonus: 1
      specialized:
        safe_up_to_grade: 3
        time_reduction_percent: 50
        roll_bonus: 2
    base_time_and_yield:
      sensitive:
        small:
          base_time_minutes: 120
          base_yield: "1 unit"
        medium:
          base_time_minutes: 240
          base_yield: "2 units"
        large:
          base_time_minutes: 360
          base_yield: "3 units"
        huge:
          base_time_minutes: 480
          base_yield: "4 units"
        gigantic:
          base_time_minutes: 600
          base_yield: "5 units"
      non_sensitive:
        small:
          base_time_minutes: 60
          base_yield: "2 kg"
        medium:
          base_time_minutes: 120
          base_yield: "4 kg"
        large:
          base_time_minutes: 240
          base_yield: "8 kg"
        huge:
          base_time_minutes: 360
          base_yield: "15 kg"
        gigantic:
          base_time_minutes: 480
          base_yield: "25 kg"
    threshold_rule: "accessibility_base + creature_level_or_equivalent_NR_pressure"
    extraction_risk:
      infection_facing_parts:
        - pelaje
        - escamas
        - plumaje
        - organos
        - fluidos
      poison_facing_parts:
        - colmillos
        - glandulas
        - garras
      grade_to_severity:
        common: Minor
        rare: Moderate
        exceptional: Severe
    failure_outcomes:
      - time_spent_no_valid_yield
      - reduced_yield
      - reduced_grade
      - spoiled_sample
      - triggered_infection_pressure
      - triggered_poison_pressure
      - damage_to_sensitive_follow_up_part

conservation:
  classes:
    stable:
      meaning: does_not_meaningfully_decay_in_normal_storage
    perishable:
      meaning: decays_over_time_unless_preserved_correctly
    volatile:
      meaning: decays_quickly_destabilizes_or_becomes_unsafe_without_immediate_handling
  default_guidance:
    stable:
      - minerals
      - stone
      - most_metals
    perishable:
      - hides
      - fluids
      - organs
      - glands
      - many_plant_reagents
    volatile:
      - nerve_tissue
      - unstable_glands
      - fresh_venoms
  invalid_preservation_outcomes:
    - lose_usable_time
    - drop_in_grade
    - become_invalid_for_specific_process
    - become_unsafe_to_handle
  living_material_note: >
    Living materials may require maintenance rather than simple storage.
    Maintenance can include moisture, darkness, circulation, feeding medium,
    resonance exposure, taumatic quiet/charge, or species-specific handling.
  creature_parts:
    profiles:
      pelaje_plumaje:
        required_kit: basic
        conservation_time_favorable_conditions: "1 month"
        baseline_requirement: dry_cool_storage_away_from_humidity
      escamas_caparazon:
        required_kit: advanced
        conservation_time_favorable_conditions: "2 months"
        baseline_requirement: clean_organic_residue_and_store_dry
      colmillos_garras:
        required_kit: basic
        conservation_time_favorable_conditions: "6 weeks"
        baseline_requirement: dry_fully_and_keep_low_humidity
      huesos_cuernos:
        required_kit: advanced
        conservation_time_favorable_conditions: "2 months"
        baseline_requirement: remove_soft_tissue_and_treat_with_preservative
      glandulas_organos:
        required_kit: specialized
        conservation_time_favorable_conditions: "1 week"
        baseline_requirement: preserve_in_saline_alcohol_or_equivalent_medium
      fluidos:
        required_kit: basic
        conservation_time_favorable_conditions:
          blood_like_fluids: "2 weeks"
          venom_class_fluids: "1 month"
        baseline_requirement: sealed_isolated_containers
      sistema_nervioso:
        required_kit: specialized
        conservation_time_favorable_conditions: "3 days"
        baseline_requirement: controlled_preservation_in_specialized_medium

