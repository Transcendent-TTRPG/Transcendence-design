work_infrastructure:
  objects:
    note: >
      For fabrication, the important distinction is not objecthood itself but
      whether the object functions as a portable tool, consumable kit, heavy
      infrastructure, or specialized device.
  artifacts:
    note: >
      Artifacts are exceptional made things that combine authored construction
      with powered elemental or extranatural function. They are not the
      baseline assumption of ordinary fabrication and should build on top of an
      already-authored ordinary tool, kit, or infrastructure family.
  tools:
    classes:
      light_tool:
        meaning: portable_routine_low_scale_and_broadly_usable_within_domain
      heavy_tool:
        meaning: larger_more_stable_more_precise_or_more_force_capable_equipment
      specialized_tool:
        meaning: narrow_purpose_precision_implement_for_one_exact_type_of_work
  kits:
    note: >
      Compact domain-specific, partially consumable work bundles that trade
      portability and fast setup against limited uses and lower workshop power.
    required_fields:
      - owning_specialization_or_action_family
      - grade
      - uses
      - portability
      - field_only_or_full_shop_scope
    grades:
      "1": basic
      "2": advanced
      "3": specialized
    rank_bands:
      "1":
        expected_competency_ranks:
          - Novice
          - Adept
        note: baseline_field_and_apprentice_professional_work
      "2":
        expected_competency_ranks:
          - Expert
          - Master
        note: advanced_professional_work
      "3":
        expected_competency_ranks:
          - Consummate
          - Transcendent
        note: peak_or_near_peak_specialized_work
    baseline_rules:
      - cost_scales_with_grade
      - uses_scale_with_grade
      - portability_remains_roughly_constant
      - grade_sets_safe_or_credible_work_ceiling
      - basic_kits_normally_support_novice_and_adept_work
      - advanced_kits_normally_support_expert_and_master_work
      - specialized_kits_normally_support_consummate_and_transcendent_work
      - higher_rank_work_normally_requires_matching_kit_band_unless_subsystem_rule_relaxes_it
    allocation_rule:
      note: >
        Every production-facing discipline that routinely acts on matter should
        normally have a graded kit family. This also applies to support
        practices that are not broad enough to stand as specializations but
        still create a meaningful handling gate in play.
      specialization_owned_families:
        Medicina: medical_kits
        Herboristeria: herboristry_kits
        Alquimia: alchemical_kits
        Trampas: trapmaking_kits
        Mineria: mining_kits
        Herreria: smithing_kits
        Sastreria: tailoring_kits
        Joyeria: jewelers_kits
        Ingenieria: engineering_kits
      support_practice_families:
        - extraction_kits
        - conservation_kits
        - poison_handling_kits
        - repair_kits
        - mineral_refinement_kits
        - fiber_refinement_kits
        - surveying_and_appraisal_kits
        - cartography_kits
        - projectile_fletching_kits
      support_practice_roll_guidance:
        extraction: Medicina
        biological_preservation_sensitive_handling: Medicina
        botanical_sensitive_handling: Herboristeria_or_Alquimia
        repair_and_refinement: Herreria_or_Sastreria_or_Joyeria_or_Ingenieria
        surveying_appraisal_or_cartographic_interpretation: closest_relevant_knowledge_or_identification_domain
        projectile_adjustment_and_payload_fitting: closest_relevant_projectile_or_crafting_domain
    baseline_families:
      - medical_kits
      - herboristry_kits
      - alchemical_kits
      - trapmaking_kits
      - mining_kits
      - smithing_kits
      - tailoring_kits
      - jewelers_kits
      - engineering_kits
      - extraction_kits
      - conservation_kits
      - poison_handling_kits
      - repair_kits
      - mineral_refinement_kits
      - fiber_refinement_kits
      - dye_and_finishing_kits
      - surveying_and_appraisal_kits
      - cartography_kits
      - projectile_fletching_kits
  heavy_work_infrastructure:
    traits:
      - non_consumable
      - fixed_or_semi_fixed
      - harder_to_transport
      - suited_for_long_complex_or_high_throughput_work
    examples:
      - forge_bodies
      - anvils
      - cutting_tables
      - leather_presses
      - distillation_apparatus
      - jewelry_furnaces
      - fixed_precision_benches
    baseline_families:
      - forge_assemblies
      - anvils_and_shaping_surfaces
      - cutting_and_measuring_tables
      - leather_presses_and_stretching_frames
      - furnaces_and_kilns
      - distillation_and_reaction_benches
      - precision_setting_benches
      - structural_work_surfaces
  specialized_objects:
    framework_roles:
      - extraction_support
      - conservation_support
      - poison_handling
      - repair_support
      - surveying_or_appraisal
      - cartography
      - trap_assembly
      - refinement_support

production_documents:
  plans:
    scope:
      - tools
      - structures
      - manufactured_objects
    required_fields:
      - output_class
      - complexity
      - required_domains
      - required_materials
      - expected_labor
      - expected_work_time
      - availability
    complexity:
      simple:
        difficulty_band: Fundamental
        base_market_cost: 50
      complex:
        difficulty_band: Rigorous
        base_market_cost: 200
      advanced:
        difficulty_band: Extreme
        base_market_cost: 600
    availability_surcharge:
      common: 0
      moderate: 100
      specialized: 200
      rare: 300
      exceptional: 400
    design_families:
      - thrown_and_ranged_weapon_designs
      - hafted_weapon_designs
      - flexible_weapon_designs
      - light_medium_heavy_armor_designs
      - light_medium_heavy_shield_designs
      - pendant_amulet_insignia_designs
  trap_diagrams:
    required_fields:
      - trap_type
      - rarity_or_complexity
      - construction_time
      - build_difficulty
      - detection_difficulty
      - disarm_difficulty
      - specialized_reagent_or_subsystem_if_required
    rarity:
      common:
        build_time: "4 hours"
        build_difficulty: Fundamental
        detect_difficulty: Challenging
        disarm_difficulty: Challenging
      rare:
        build_time: "10 hours"
        build_difficulty: Rigorous
        detect_difficulty: Rigorous
        disarm_difficulty: Rigorous
      exceptional:
        build_time: "24 hours"
        build_difficulty: Extreme
        detect_difficulty: Demanding
        disarm_difficulty: Demanding
    type_surcharge:
      mechanism: 0
      illusory: 50
      environmental: 50
      umbral: 250
      living: 100
  formulas:
    scope:
      - elixirs
      - poisons
      - other_alchemical_compounds
    required_fields:
      - output_family
      - rarity
      - reagents
      - plant_inputs
      - required_alchemical_index
      - final_dose_logic
    rarity:
      common:
        build_time: "12 hours"
        default_doses: "1d4"
      rare:
        build_time: "24 hours"
        default_doses: "1d3"
      exceptional:
        build_time: "36 hours"
        default_doses: "1d2"
    market_cost:
      rarity:
        common: 50
        rare: 200
        exceptional: 600
      output_family_surcharge:
        elixir: 50
        poison: 100
      availability_uses_plan_table: true

work_logic:
  start_condition_requires:
    - right_specialization
    - right_material_inputs
    - right_tools_or_infrastructure
    - relevant_plan_diagram_or_formula_when_not_improvised
  support_rule:
    portable_kits_normally_cover:
      - field_extraction
      - first_pass_preservation
      - minor_repairs
      - low_scale_preparation
      - short_localized_jobs
    heavy_infrastructure_normally_expected_for:
      - long_fabrication
      - high_output_processing
      - high_precision_shaping
      - large_objects
      - work_implausible_from_handheld_kits_alone
  progress_rule: >
    Progress is tracked in meaningful work intervals owned by the relevant
    specialization, not by generic hourly Focus checks.
  specialization_owned_progress:
    Herreria: advances_forge_work
    Sastreria: advances_textile_and_leather_work
    Joyeria: advances_fine_setting_work
    Ingenieria: advances_structural_and_mechanism_work
    Alquimia: advances_compounds
    Trampas: advances_trap_assembly
    Herboristeria: advances_plant_harvesting_and_preparation
    Medicina: advances_creature_part_extraction_and_preservation_aware_anatomical_work
  failure_defaults:
    - time_spent_without_meaningful_progress
    - material_stress_or_waste
    - reduced_final_yield_or_stability
    - contamination_or_handling_danger_if_biological_or_chemical
    - blocked_continuation_until_conditions_improve

traps:
  note: >
    Traps are authored objects and should usually combine Trampas with another
    specialization when the construction materially depends on that domain.
  typical_pairings:
    - "Trampas + Ingenieria"
    - "Trampas + Herreria"
    - "Trampas + Alquimia"

technique_design_rule:
  good_interactions:
    - identify_right_extraction_point
    - preserve_volatile_material_under_pressure
    - force_one_authored_refinement_step
    - exploit_material_weakness
    - accelerate_one_bounded_fabrication_or_repair_window
  bad_interactions:
    - replace_entire_crafting_loop_with_one_action
    - invent_material_properties_not_defined_anywhere
    - create_permanent_equipment_without_material_tool_or_plan_requirements
