meta:
  version: "0.1"
  status: draft
  authority_sources:
    - data/system/specializations-catalog.yaml
    - data/system/techniques.yaml
  purpose: >
    Defines the Technique identity space of each specialization so future Technique
    writing remains differentiated, consistent, and structurally tied to practiced domains.

schema:
  fields:
    - specialization
    - specialization_en
    - associated_characteristic
    - fantasy_core
    - primary_tags
    - secondary_tags
    - rare_or_limited_tags
    - typical_targets
    - typical_types
    - usual_cost_profile
    - identity_notes
    - should_not_do

domains:
  - specialization: Saltar
    specialization_en: Jumping
    associated_characteristic: Fuerza
    fantasy_core: explosive projection, forced gap-crossing, sudden entry through bodily launch
    primary_tags: [mobility, setup, pressure]
    secondary_tags: [attack, escape, reposition]
    rare_or_limited_tags: [control, recovery, support]
    typical_targets: [self, route, enemy]
    typical_types: [active]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, occasionally high on overextension
    identity_notes: >
      Jumping Techniques should begin from the launch. They are about commitment, angle,
      forced entry, and explosive repositioning — not aerial refinement or balance.
    should_not_do:
      - sustained balance
      - subtle concealment
      - broad control
      - prolonged defense

  - specialization: Trepar
    specialization_en: Climbing
    associated_characteristic: Fuerza
    fantasy_core: vertical progress, sustained body placement, controlled ascent or descent under pressure
    primary_tags: [mobility, escape, setup]
    secondary_tags: [stability, reposition, utility]
    rare_or_limited_tags: [attack, support, pressure]
    typical_targets: [self, route, object, environment]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, environment-shaped more than hostility-shaped
    identity_notes: >
      Climbing Techniques should reward vertical access, route control, anchors, and suspension.
      They should feel like progress against a surface, not generic grip dominance.
    should_not_do:
      - direct immobilization
      - broad enemy control
      - ranged pressure
      - social utility

  - specialization: Lanzamiento
    specialization_en: Throwing
    associated_characteristic: Fuerza
    fantasy_core: projecting objects with trained force, angle, and timing to create distance pressure or utility
    primary_tags: [attack, pressure, setup]
    secondary_tags: [disruption, utility, precision]
    rare_or_limited_tags: [defense, recovery, support]
    typical_targets: [enemy, object, route, zone]
    typical_types: [active]
    usual_cost_profile: low-to-medium rhythm, low Attrition for standard projection, higher for scene-altering throws
    identity_notes: >
      Throwing Techniques should remain tied to bodily launch. They may open angles, disarm
      by distance, pin routes, or trigger objects, but should not drift into device-based shooting logic.
    should_not_do:
      - constant passive defense
      - sustained mitigation
      - non_physical_control_without_projectile_logic

  - specialization: Nadar
    specialization_en: Swimming
    associated_characteristic: Fuerza
    fantasy_core: maintaining agency in water, crossing hostile water space, and staying functional where others lose movement
    primary_tags: [mobility, survival_window, escape]
    secondary_tags: [reposition, setup, stability]
    rare_or_limited_tags: [attack, support, control]
    typical_targets: [self, route, environment]
    typical_types: [active, reactive]
    usual_cost_profile: medium rhythm, medium Attrition, highly scene-dependent
    identity_notes: >
      Swimming Techniques should feel like command of an aquatic medium: route holding,
      diving, surfacing, aquatic infiltration, or maintaining function in water pressure.
    should_not_do:
      - generic_environmental_resistance
      - direct_mitigation_without_water_logic
      - long_range_offense

  - specialization: Agarre
    specialization_en: Gripping
    associated_characteristic: Fuerza
    fantasy_core: contact dominance, hold retention, immobilizing or stabilizing through trained force at close range
    primary_tags: [control, interception, anti_displacement]
    secondary_tags: [defense, setup, pressure]
    rare_or_limited_tags: [mobility, recovery, support]
    typical_targets: [enemy, ally, object, self]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-medium rhythm, medium Attrition when sustaining contact under resistance
    identity_notes: >
      Gripping Techniques should feel like mastery of contact points: retention, restraint,
      stabilization, weapon control, and immediate physical denial.
    should_not_do:
      - ranged_pressure
      - broad_battlefield_control
      - abstract_mobility_bonus

  - specialization: Acrobacias
    specialization_en: Acrobatics
    associated_characteristic: Agilidad
    fantasy_core: dynamic bodily redirection, rolling, recovery, and fluid traversal through unstable movement
    primary_tags: [mobility, escape, reposition]
    secondary_tags: [defense, setup, spacing]
    rare_or_limited_tags: [control, support, recovery]
    typical_targets: [self, route, zone, enemy]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, higher when chained under pressure
    identity_notes: >
      Acrobatics Techniques should feel like continuity of motion: redirection, recovery from bad
      angles, traversal through danger, and elegant evasion through dynamic body control.
    should_not_do:
      - static_balance
      - fine_hand_manipulation
      - mounted_command
      - pure_force_projection

  - specialization: Destreza
    specialization_en: Dexterity
    associated_characteristic: Agilidad
    fantasy_core: fine technical manipulation through precise hand and body control under real pressure
    primary_tags: [utility, setup, precision]
    secondary_tags: [control, disruption, support]
    rare_or_limited_tags: [attack, mobility, pressure]
    typical_targets: [object, self, ally, enemy]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-medium rhythm, low Attrition for controlled work, medium under danger or extreme precision pressure
    identity_notes: >
      Dexterity Techniques should express exactness, careful placement, delicate manipulation,
      and technical execution. They should feel hand-driven, not acrobatic or opportunistic.
    should_not_do:
      - broad_locomotion
      - generic_stealth
      - brute_force_control
      - social_influence

  - specialization: Equilibrio
    specialization_en: Balance
    associated_characteristic: Agilidad
    fantasy_core: maintaining operational posture when footing, support, or external force tries to break bodily stability
    primary_tags: [defense, stability, anti_displacement]
    secondary_tags: [mobility, setup, reposition]
    rare_or_limited_tags: [attack, support, pressure]
    typical_targets: [self, route, enemy, environment]
    typical_types: [reactive, active]
    usual_cost_profile: low rhythm, low-to-medium Attrition, often triggered by hostile force or unstable terrain
    identity_notes: >
      Balance Techniques should feel like staying functional on bad footing, resisting forced
      loss of posture, and preserving tactical continuity where others would yield space.
    should_not_do:
      - complex_dynamic_traversal
      - fine_manipulation
      - mounted_control
      - inner_emotional_stability

  - specialization: Equitación
    specialization_en: Riding
    associated_characteristic: Agilidad
    fantasy_core: turning mount and rider into a single tactical system under speed, pressure, and unstable positioning
    primary_tags: [mobility, setup, pressure]
    secondary_tags: [reposition, escape, control]
    rare_or_limited_tags: [recovery, support, precision]
    typical_targets: [self, creature, route, enemy]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, medium Attrition when maneuvering hard or fighting for mounted control
    identity_notes: >
      Riding Techniques should express mounted line control, charge angles, mounted repositioning,
      and maintaining rider-mount integrity under threat. They should feel tactical, not bonded or pastoral.
    should_not_do:
      - aura_bonding
      - animal_training_in_general
      - broad_party_support
      - static_defense_without_mount_logic

  - specialization: Marcha
    specialization_en: March
    associated_characteristic: Tenacidad
    fantasy_core: sustained forward progress, route endurance, and keeping operational pace across long exertion
    primary_tags: [survival_window, mobility, stability]
    secondary_tags: [recovery, setup, escape]
    rare_or_limited_tags: [attack, control, support]
    typical_targets: [self, ally, route, environment]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-moderate rhythm, medium Attrition, often escalating over long scenes or journeys
    identity_notes: >
      March Techniques should preserve movement continuity over time: keeping pace, extending travel
      function, and refusing collapse during prolonged displacement. They are not about pain already
      inside the body.
    should_not_do:
      - direct_pain_resistance
      - environmental_adaptation_without_travel_logic
      - burst_offense
      - static_defense

  - specialization: Aclimatación
    specialization_en: Acclimation
    associated_characteristic: Tenacidad
    fantasy_core: maintaining bodily function under hostile climate, altitude, exposure, or environmental pressure
    primary_tags: [defense, mitigation, survival_window]
    secondary_tags: [recovery, stability, utility]
    rare_or_limited_tags: [attack, mobility, control]
    typical_targets: [self, ally, environment, zone]
    typical_types: [reactive, passive, active]
    usual_cost_profile: low rhythm, low-to-medium Attrition, often passive or triggered by exposure thresholds
    identity_notes: >
      Acclimation Techniques should resist what the environment is doing to the body: heat, cold,
      thin air, corrosive atmosphere, pressure, or exposure. They should not drift into generic
      toughness once suffering is already internalized.
    should_not_do:
      - prolonged_locomotion_support
      - direct_offensive_pressure
      - emotional_stabilization
      - generic_healing

  - specialization: Tolerancia
    specialization_en: Tolerance
    associated_characteristic: Tenacidad
    fantasy_core: remaining functional while pain, poison, wounds, or active physiological degradation are already inside the body
    primary_tags: [defense, mitigation, condition_reduction]
    secondary_tags: [survival_window, stability, recovery]
    rare_or_limited_tags: [attack, mobility, support]
    typical_targets: [self, ally]
    typical_types: [reactive, passive, active]
    usual_cost_profile: low rhythm, low-to-medium Attrition, sometimes high when Techniques override severe bodily collapse windows
    identity_notes: >
      Tolerance Techniques should feel like refusing physiological shutdown under suffering already
      in progress. They belong to pain endurance, poison resistance, wound function, and bodily
      persistence under internal damage, not to travel pacing or climate adaptation.
    should_not_do:
      - travel_acceleration
      - environmental_adjustment_before_harm_lands
      - mental_composure
      - broad_ally_support

  - specialization: Orientación
    specialization_en: Orientation
    associated_characteristic: Astucia
    fantasy_core: constructing usable direction from uncertain terrain, incomplete references, and shifting positional information
    primary_tags: [utility, setup, survival_window]
    secondary_tags: [mobility, reposition, stability]
    rare_or_limited_tags: [attack, control, support]
    typical_targets: [self, ally, route, environment]
    typical_types: [active, reactive]
    usual_cost_profile: low rhythm, low Attrition, usually shaped by uncertainty rather than hostility
    identity_notes: >
      Orientation Techniques should restore direction, secure route sense, avoid disorientation,
      or convert confusing space into actionable movement logic. They should not feel like reading
      another creature's trail.
    should_not_do:
      - pursuit_reading
      - deception
      - broad_offensive_pressure
      - direct_environmental_resistance

  - specialization: Rastreo
    specialization_en: Tracking
    associated_characteristic: Astucia
    fantasy_core: reconstructing another being's path from marks, disturbances, and residual traces left in the world
    primary_tags: [utility, pressure, setup]
    secondary_tags: [survival_window, reposition, control]
    rare_or_limited_tags: [attack, recovery, support]
    typical_targets: [enemy, route, environment, object]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-moderate rhythm, low Attrition, often escalating over distance or degraded traces
    identity_notes: >
      Tracking Techniques should convert remnants into pursuit logic: holding a trail, reading
      movement history, predicting route continuation, or preventing escape through trace reading.
      They should not become generic navigation.
    should_not_do:
      - self_navigation_without_traces
      - broad_social_manipulation
      - direct_damage
      - abstract_deduction_without_world_signs

  - specialization: Intuición
    specialization_en: Intuition
    associated_characteristic: Astucia
    fantasy_core: reaching useful conclusions before evidence becomes explicit by reading dissonance, pattern tension, and incomplete signals
    primary_tags: [utility, counter_read, setup]
    secondary_tags: [defense, survival_window, pattern_exploitation]
    rare_or_limited_tags: [attack, mobility, support]
    typical_targets: [self, enemy, ally, zone]
    typical_types: [reactive, passive, active]
    usual_cost_profile: low rhythm, low Attrition, often triggered by ambiguity, hidden intent, or unseen danger
    identity_notes: >
      Intuition Techniques should catch structure before it fully appears: reading motive, sensing
      a trap, anticipating an angle, or exploiting a pattern not yet visible in full. They should
      not drift into raw sensory detection or mystical instinct.
    should_not_do:
      - direct_perception
      - bodily_survival
      - overt_social_pressure
      - formal_scholarship

  - specialization: Engaño
    specialization_en: Deception
    associated_characteristic: Astucia
    fantasy_core: imposing a false frame on another mind through convincing lies, omissions, and deliberate narrative control
    primary_tags: [utility, control, setup]
    secondary_tags: [pressure, disruption, counter_read]
    rare_or_limited_tags: [attack, recovery, mobility]
    typical_targets: [enemy, ally, group, zone]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-moderate rhythm, low Attrition, rising when layered or sustained under suspicion
    identity_notes: >
      Deception Techniques should make a false version of events function long enough to alter
      action, trust, or tempo. They should manipulate belief, not fear, disguise, or bodily concealment.
    should_not_do:
      - identity_replication
      - direct_terror_pressure
      - generic_stealth
      - precision_theft

  - specialization: Improvisación
    specialization_en: Improvisation
    associated_characteristic: Astucia
    fantasy_core: producing a workable answer under immediate pressure with poor tools, incomplete plans, and whatever the scene allows
    primary_tags: [utility, setup, disruption]
    secondary_tags: [survival_window, control, recovery]
    rare_or_limited_tags: [attack, support, precision]
    typical_targets: [self, ally, object, environment, zone]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, often paid through risk, fragility, or resource consumption
    identity_notes: >
      Improvisation Techniques should make something usable out of the wrong conditions. They
      should create temporary answers, unstable fixes, opportunistic tools, or scene turns without
      becoming formal engineering or fine manual mastery.
    should_not_do:
      - robust_long_term_construction
      - exact_handcraft
      - pure_social_manipulation
      - reliable_healing

  - specialization: Hurto
    specialization_en: Theft
    associated_characteristic: Astucia
    fantasy_core: taking control of something that is not yours through opportunity, timing, distraction, and exit before response closes
    primary_tags: [utility, setup, pressure]
    secondary_tags: [control, disruption, escape]
    rare_or_limited_tags: [attack, support, recovery]
    typical_targets: [enemy, object, zone, self]
    typical_types: [active, reactive]
    usual_cost_profile: low rhythm, low Attrition, but often high exposure if the window closes or alert rises
    identity_notes: >
      Theft Techniques should feel like opportunistic acquisition under risk: lift, slip, remove,
      transfer, or strip access without open confrontation. They should not become generic fine
      manipulation or broad stealth identity.
    should_not_do:
      - pure_manual_precision_without_acquisition
      - open_combat_pressure
      - identity_deception
      - broad_navigation

  - specialization: Percepción
    specialization_en: Perception
    associated_characteristic: Sabiduría
    fantasy_core: extracting actionable detail from what is already present in the scene before it slips away or stays unnoticed
    primary_tags: [utility, counter_read, setup]
    secondary_tags: [defense, survival_window, pattern_exploitation]
    rare_or_limited_tags: [attack, recovery, support]
    typical_targets: [self, enemy, environment, object, zone]
    typical_types: [active, reactive, passive]
    usual_cost_profile: low rhythm, low Attrition, usually paid through timing and line of exposure rather than bodily strain
    identity_notes: >
      Perception Techniques should catch what is already there before it is lost: exposed detail,
      hidden motion, faint signal, or dangerous presence. They should not drift into inference,
      formal interpretation, or trace-based pursuit.
    should_not_do:
      - abstract_deduction
      - historical_analysis
      - environmental_resistance
      - deception

  - specialization: Supervivencia
    specialization_en: Survival
    associated_characteristic: Astucia
    fantasy_core: making the right practical decision to keep people alive and functional in hostile terrain or natural pressure
    primary_tags: [survival_window, utility, setup]
    secondary_tags: [recovery, mitigation, stability]
    rare_or_limited_tags: [attack, control, pressure]
    typical_targets: [self, ally, route, environment, zone]
    typical_types: [active, reactive]
    usual_cost_profile: low-to-moderate rhythm, low-to-medium Attrition, often extended over scenes of scarcity or exposure
    identity_notes: >
      Survival Techniques should feel like field judgment: shelter choice, water logic, immediate
      resource use, route safety, and practical adaptation to natural threat. They should not
      become internal bodily resistance or clinical treatment.
    should_not_do:
      - direct_body_adaptation
      - formal_healing
      - abstract_navigation_without_field_logic
      - broad_offense

  - specialization: Medicina
    specialization_en: Medicine
    associated_characteristic: Sabiduría
    fantasy_core: intervening on bodily harm with trained care to stabilize, restore function, or buy time before collapse
    primary_tags: [recovery, mitigation, survival_window]
    secondary_tags: [utility, condition_reduction, stability]
    rare_or_limited_tags: [attack, mobility, pressure]
    typical_targets: [self, ally, enemy]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, often constrained by tools, time, and patient state
    identity_notes: >
      Medicine Techniques should feel like practiced intervention on damage already present:
      stabilizing, treating, reducing consequences, or restoring immediate bodily function. They
      should not become pain endurance, ingredient identification, or compound production by themselves.
    should_not_do:
      - passive_toughness
      - environmental_adaptation
      - raw_ingredient_recognition
      - broad_mechanical_control

  - specialization: Herboristería
    specialization_en: Herbalism
    associated_characteristic: Sabiduría
    fantasy_core: recognizing, gathering, and putting plant matter to practical use before it spoils, is misread, or goes unfound
    primary_tags: [utility, setup, recovery]
    secondary_tags: [mitigation, survival_window, support]
    rare_or_limited_tags: [attack, control, precision]
    typical_targets: [self, ally, object, environment, ingredient]
    typical_types: [active, passive]
    usual_cost_profile: low rhythm, low Attrition, usually shaped by access, season, and specimen quality
    identity_notes: >
      Herbalism Techniques should feel like plant-resource mastery: finding, classifying,
      preserving, and preparing flora for use. They should not drift into clinical treatment or
      elaborate compound engineering.
    should_not_do:
      - direct_surgery
      - complex_reagent_transformation
      - structural_mechanics
      - pure_sensory_detection

  - specialization: Alquimia
    specialization_en: Alchemy
    associated_characteristic: Sabiduría
    fantasy_core: transforming ingredients into functional compounds through process, preparation, and controlled reaction
    primary_tags: [utility, setup, condition_reduction]
    secondary_tags: [recovery, attack, mitigation]
    rare_or_limited_tags: [mobility, pressure, support]
    typical_targets: [self, ally, enemy, object, ingredient]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, often paid through ingredient value, preparation time, and failure risk
    identity_notes: >
      Alchemy Techniques should feel like making effects through compounds: antitoxins, toxins,
      reactive agents, extracts, and prepared responses. They should not become ingredient gathering,
      direct healing procedure, or structural engineering.
    should_not_do:
      - raw_resource_identification
      - clinical_body_work
      - terrain_navigation
      - broad_social_control

  - specialization: Trampas
    specialization_en: Traps
    associated_characteristic: Sabiduría
    fantasy_core: shaping a delayed or conditional response that turns space, passage, or interaction into a controlled danger or lock
    primary_tags: [control, setup, pressure]
    secondary_tags: [disruption, utility, counter_positioning]
    rare_or_limited_tags: [recovery, support, mobility]
    typical_targets: [enemy, route, zone, object, environment]
    typical_types: [active, reactive, passive]
    usual_cost_profile: moderate rhythm, low-to-medium Attrition, often paid through preparation, material, and placement constraints
    identity_notes: >
      Traps Techniques should feel like conditional mechanism logic: arming, disarming, redirecting
      triggers, weaponizing passage, or securing an approach. They should not become broad
      engineering or mere fine-hand execution.
    should_not_do:
      - generic_precision_work
      - long_term_architecture
      - direct_healing
      - open_melee_pressure

  - specialization: Minería
    specialization_en: Mining
    associated_characteristic: Sabiduría
    fantasy_core: reading and extracting the earth without losing the material, the route, or the stability that makes extraction possible
    primary_tags: [utility, setup, stability]
    secondary_tags: [survival_window, recovery, control]
    rare_or_limited_tags: [attack, mobility, pressure]
    typical_targets: [environment, object, route]
    typical_types: [active, reactive]
    usual_cost_profile: moderate rhythm, medium Attrition, strongly shaped by tool load, collapse risk, and extraction duration
    identity_notes: >
      Mining Techniques should feel like subsurface judgment and extraction discipline: reading
      seams, preserving tunnels, securing access, and recovering material from stone. They should
      not become forging, general engineering, or broad exploration logic.
    should_not_do:
      - metal_shaping
      - abstract_system_design
      - direct_social_influence
      - bodily_resistance

  - specialization: Herrería
    specialization_en: Smithing
    associated_characteristic: Sabiduría
    fantasy_core: shaping or restoring functional metal through heat, force, timing, and material judgment
    primary_tags: [utility, recovery, setup]
    secondary_tags: [mitigation, attack, stability]
    rare_or_limited_tags: [mobility, pressure, counter_read]
    typical_targets: [object]
    typical_types: [active]
    usual_cost_profile: moderate rhythm, medium Attrition, often paid through labor load, heat access, and material stakes
    identity_notes: >
      Smithing Techniques should feel like functional metalwork: repair, reinforcement, reshaping,
      stress reading, or forging under pressure. They should not become fine luxury detail work or
      general system design.
    should_not_do:
      - jewel_precision
      - broad_mechanical_architecture
      - terrain_survival
      - deception

  - specialization: Sastrería
    specialization_en: Tailoring
    associated_characteristic: Sabiduría
    fantasy_core: restoring or configuring flexible material so it keeps function, fit, and integrity under use
    primary_tags: [utility, recovery, mitigation]
    secondary_tags: [setup, support, stability]
    rare_or_limited_tags: [attack, pressure, control]
    typical_targets: [object, ally, self]
    typical_types: [active]
    usual_cost_profile: low-to-moderate rhythm, low Attrition, shaped by material quality, time, and precision of adjustment
    identity_notes: >
      Tailoring Techniques should feel like practical textile mastery: fit correction, fabric
      restoration, strap or seam function, and flexible gear readiness. They should not drift into
      jewelry-scale finesse or metalwork.
    should_not_do:
      - fine_gem_work
      - structural_mechanics
      - direct_damage
      - pursuit_logic

  - specialization: Joyería
    specialization_en: Jewelry
    associated_characteristic: Sabiduría
    fantasy_core: preserving value and function in small, delicate, high-precision crafted pieces
    primary_tags: [utility, precision, setup]
    secondary_tags: [recovery, support, control]
    rare_or_limited_tags: [attack, mobility, survival_window]
    typical_targets: [object]
    typical_types: [active]
    usual_cost_profile: low rhythm, low Attrition, but high consequence on mistakes because of scale and value
    identity_notes: >
      Jewelry Techniques should feel like exact fine-scale craft: setting, separating, restoring,
      concealing detail in precious work, or manipulating small high-value pieces without ruining
      them. They should not become heavy forge labor or broad engineering.
    should_not_do:
      - structural_forging
      - field_survival
      - large_scale_repair
      - open_combat_pressure

  - specialization: Ingeniería
    specialization_en: Engineering
    associated_characteristic: Sabiduría
    fantasy_core: understanding and altering how a complex physical system functions as a whole under load, access, and failure pressure
    primary_tags: [utility, control, setup]
    secondary_tags: [mitigation, disruption, recovery]
    rare_or_limited_tags: [attack, pressure, stealth]
    typical_targets: [object, device, structure, route, environment]
    typical_types: [active, reactive, passive]
    usual_cost_profile: moderate rhythm, medium Attrition, often paid through complexity, tool demands, and cascade-failure risk
    identity_notes: >
      Engineering Techniques should feel like system logic under intervention: understanding load
      paths, bypassing mechanisms, stabilizing or redirecting function, and altering structure as a
      coherent whole. They should not become improvisation, trap logic alone, or single-material craft.
    should_not_do:
      - fragile_temporary_fix_as_identity
      - fine_manual_pickwork
      - botanical_resource_work
      - broad_party_leadership

  - specialization: Identificación
    specialization_en: Identification
    associated_characteristic: Intelecto
    fantasy_core: naming exactly what something is before action misfires through category error or false assumption
    primary_tags: [utility, counter_read, setup]
    secondary_tags: [survival_window, disruption, pattern_exploitation]
    rare_or_limited_tags: [attack, mobility, support]
    typical_targets: [object, enemy, creature, phenomenon, zone]
    typical_types: [active, reactive]
    usual_cost_profile: low rhythm, low Attrition, usually paid through sample quality and observation time
    identity_notes: >
      Identification Techniques should feel like precise classification under uncertainty: knowing
      what stands before you, what category it belongs to, and what framework applies next. They
      should not become interpretive meaning-making or pure detection.
    should_not_do:
      - symbolic_analysis_as_primary
      - sensory_search
      - direct_healing
      - route_navigation

  - specialization: Interpretación
    specialization_en: Interpretation
    associated_characteristic: Intelecto
