starting_specializations_count: 3        # from background
total_starting_specializations: 4        # 3 from background + 1 universal (any Tenacity choice)
starting_level: 1
starting_rank: novice
same_specialization_twice: false

universal_starting_specialization:
  category: tenacity
  associated_characteristic: TEN
  choice: any_tenacity_specialization
  options: [Marcha, Aclimatación, Tolerancia]
  starting_level: 1
  starting_rank: novice
  synapsis_at_creation: "+1 TEN"
  stacks_with_species_bonus: true
  description: >
    Every character begins with one Tenacity specialization of their choice at Level 1/Novice.
    This represents the foundation of their physical resilience — how they endure the world,
    not a single universal trait. A seasoned traveler may choose Marcha; a soldier who has
    taken many hits may choose Tolerancia; a wilderness survivor may choose Aclimatación.

backgrounds:
  - id: martial_artist
    name: Martial Artist
    major_affinity: physical
    starting_specializations:
      - category: physical
        count: 2
      - category: mental, social or lore
        count: 1
    special_rule: May replace any starting natural weapon competencies with crafted weapon competencies
    description: Devoted to bodily perfection through combat schools, warrior clans, arenas, or discipline rituals

  - id: artisan
    name: Artisan
    major_affinity: arts_and_crafts
    starting_specializations:
      - category: arts_and_crafts
        count: 2
      - category: any
        count: 1
    description: Dedicated to transforming matter into useful, beautiful, or dangerous objects

  - id: wanderer
    name: Wanderer
    major_affinity: mental
    starting_specializations:
      - category: mental
        count: 2
      - category: physical, social or lore
        count: 1
    description: Formed by the road — developed ingenuity, intuition, and adaptation across frontiers and ruins

  - id: custodian
    name: Custodian
    major_affinity: lore
    starting_specializations:
      - category: lore
        count: 2
      - category: physical, mental or social
        count: 1
    description: Heir to traditions tasked with preserving knowledge — archives, temples, libraries, guardian orders

  - id: noble
    name: Noble
    major_affinity: social
    starting_specializations:
      - category: social
        count: 1
      - category: any
        count: 2
    description: Born or raised in privilege, education, hierarchy, and social ties

affinity_progression:
  in_affinity: 5    # progress points to level up
  out_of_affinity: 10
