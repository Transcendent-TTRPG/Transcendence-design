# Manifestaciones del Limbo — autoridad de diseño
#
# Referencia cruzada:
#   - data/system/limbo-entities.yaml            → taxonomía y schema de entidades del Limbo
#   - data/system/environmental-conditions.yaml  → condiciones extranaturales generadas por filtración
#   - docs/system/limbo-entities.md              → referencia narrativa de entidades
#   - docs/system/environmental-conditions.md    → impacto mecánico en entorno
#   - docs/system/limbo-manifestations.md        → referencia de diseño
#
# El Limbo es la dimensión de origen del Tauma. Su energía se filtra al mundo físico
# a través de tres manifestaciones. Las condiciones extranaturales son consecuencia de
# la filtración intensa. 

meta:
  version: "1.0"
  status: draft
  last_updated: "2026-04-20"

limbo:
  nombre_es: El Limbo
  nombre_en: the Limbo
  descripcion: >
    Dimensión paralela impercibible para las criaturas normales. Origen del Tauma.
    Su energía puede filtrarse al mundo físico de tres formas: flujo ambiental,
    vestigios y vínculos.
  perceptibilidad:
    criaturas_normales: no perciben el Limbo directamente
    capacidades_de_deteccion:
      - id: instinto
        descripcion: respuesta primaria no racional; siente que algo no pertenece
      - id: taumaturgia
        descripcion: identifica la estructura taumática y su origen dimensional
      - id: teologia
        descripcion: interpreta las señales del Limbo por la doctrina de la tradición religiosa que conoce

# ──────────────────────────────────────────────────────
# MANIFESTACIONES
# ──────────────────────────────────────────────────────

manifestaciones:
  - id: flujo_ambiental
    nombre_es: Flujo ambiental
    nombre_en: Ambient flow
    descripcion: >
      Filtración continua y pasiva de energía del Limbo en un área física.
      No está anclada a un objeto ni entidad — es energía ambiental difusa.
      Puede ser constante (zona naturalmente permeable) o temporal.
    caracteristicas:
      - pasiva — no requiere agente activo
      - difusa — permea el área, no un punto específico
      - variable en intensidad
      - no necesariamente genera condiciones extranaturales; solo cuando la intensidad es suficiente
    relacion_con_entorno: >
      Un flujo ambiental intenso puede elevar la severidad de condiciones extranaturales
      en el área. Ver environmental-conditions.yaml → severidades.
    deteccion:
      instinto: primer sentido de que el área tiene algo; sin precisión
      taumaturgia: puede medir la intensidad y homogeneidad del flujo
    open_questions:
      - ¿El flujo ambiental facilita o amplifica el uso de Tauma en el área?
      - ¿Puede un flujo ambiental sostenido crear un vínculo pasivo con el tiempo?

  - id: vestigio
    nombre_es: Vestigio
    nombre_en: Vestige
    descripcion: >
      Energía taumática residual depositada en un objeto físico por contacto
      pasado con el Limbo. No hay entidad ni vínculo activo — es la huella de
      una presencia anterior. Se disipa gradualmente; no es permanente.
    caracteristicas:
      - residual — la fuente ya no está presente
      - en disipación — se debilita con el tiempo
      - localizado — en un objeto específico, no difuso
      - inerte — no genera efectos activos por sí solo
    distincion_critica: >
      Un vestigio no es un vínculo. No hay conexión activa al Limbo. Es la impresión
      que dejó la energía, no la energía misma.
    principios_de_uso:
      - objeto_fisico_limitado
      - no_crea_energia_sesga_sincroniza_o_filtra_procesos_ya_existentes
      - siempre_requiere_un_medio_local_luz_sonido_vibracion_presion_calor_u_otro_portador_real
      - fatiga_de_patron_su_agotamiento_es_impredecible_y_debe_permanecer_oculto_para_los_jugadores
      - poder_moderado_da_ventaja_pero_no_define_jerarquias
      - cada_uso_significativo_aumenta_la_intensidad_de_afliccion_del_portador
      - costo_en_uso_es_afliccion_no_cordura
      - opcion_debil_entre_objetos_del_limbo_por_su_efecto_acotado_y_sus_usos_finitos
    descubrimiento:
      undiscovered_state: >
        El portador solo conoce una presentación misteriosa y no puede usar el
        vestigio de forma intencional.
      discovered_state: >
        El portador ha comprendido el patrón real del vestigio y puede usarlo
        intencionalmente dentro de sus requisitos.
      bearer_information_on_discovery:
        - nombre_real
        - sentido_vinculado
        - requisitos_de_uso
        - identidad_del_efecto
      transfer_rule: >
        Transferir el vestigio a otro portador normalmente reinicia el estado
        de descubrimiento, salvo que la ficción establezca herencia explícita
        de la comprensión.
    agotamiento:
      model: narrator_hidden_pattern_fatigue
      rule: >
        El vestigio se agota por fatiga de patrón de manera impredecible. La
        cuenta exacta de usos no debería ser visible para jugadores.
    nota_de_autoria: >
      Los vestigios deberían construirse normalmente a partir de objetos de
      mitología, historia, superstición o folclor reales y luego adaptarse a
      la lógica mecánica de Transcendence.
    deteccion:
      taumaturgia: >
        distingue la firma "antigua" o "decreciente" de un vestigio vs. la firma activa
        de un flujo o vínculo
      instinto: puede sentir algo residual pero sin precisión
    open_questions:
      - ¿Los vestigios tienen usos taumáticos? ¿Pueden ser fuente de energía para un practicante?
      - ¿Cuál es la tasa de disipación? ¿Depende del objeto, del tiempo, de la intensidad original?
      - ¿Un vestigio muy intenso puede convertirse en un vínculo bajo ciertas condiciones?

  - id: vinculo
    nombre_es: Vínculo
    nombre_en: Link
    descripcion: >
      Puente activo entre el mundo físico y el Limbo llevado por un objeto
      físico. La energía fluye continuamente a través de él mientras exista una
      conexión real entre el usuario y la entidad vinculada.
    caracteristicas:
      - activo — la conexión con el Limbo es continua
      - anclado — a un objeto específico
      - genera flujo ambiental en su entorno como efecto secundario
      - más potente y peligroso que un vestigio
    origen_posible:
      natural: objeto surgido de una zona donde las dimensiones son naturalmente delgadas
      creado: por acción taumática — requiere diseño del sistema Tauma (D-11-a)
    relacion_con_entorno: >
      Un vínculo activo genera flujo ambiental en su área circundante. Si es
      suficientemente intenso, puede producir condiciones extranaturales persistentes.
    principios_de_uso:
      - sigue_siendo_un_objeto_fisico_pero_con_una_relacion_activa
      - es_la_opcion_mas_poderosa_entre_los_objetos_del_limbo
      - no_tiene_cargas_finitas_como_un_vestigio
      - su_poder_escala_segun_la_severidad_de_la_afliccion_vinculada_por_sentido
      - cada_camino_de_sentido_escala_independientemente
      - costo_en_uso_es_cordura_no_afliccion
      - la_afliccion_del_portador_crece_durante_el_descubrimiento_no_durante_el_uso
    requisitos_de_uso:
      regla_base: >
        El portador debe tener al menos una Aflicción activa en el sentido
        requerido por el vínculo.
      single_sense_link: usa_la_severidad_de_la_afliccion_de_ese_sentido
      multi_sense_link: usa_la_severidad_minima_entre_todos_los_sentidos_requeridos
      fail_state: >
        Si el portador no tiene la Aflicción requerida, no puede usar el
        vínculo en absoluto.
    nota_de_autoria: >
      Como los vestigios, los vínculos deberían partir normalmente de objetos
      de mitología, historia, superstición o folclor reales y luego adaptarse
      a la lógica del Limbo.
    deteccion:
      taumaturgia: firma claramente activa y direccional; puede medir intensidad y estabilidad
      instinto: reacción fuerte — claramente algo que no pertenece
      teologia: reconoce señales de presencia del Limbo según la doctrina de la tradición religiosa que conoce
    open_questions:
      - ¿Pueden los vínculos ser creados intencionalmente por practicantes de Tauma?
      - ¿Pueden los vínculos ser cerrados o sellados? ¿Por quién?
      - ¿Los vínculos tienen NR? ¿Ese NR contribuye al NR de condiciones extranaturales del área?

# ──────────────────────────────────────────────────────
# RELACIONES ENTRE MANIFESTACIONES
# ──────────────────────────────────────────────────────

relaciones:
  flujo_puede_dejar_vestigios: >
    Un flujo ambiental intenso puede depositar vestigios en objetos del área incluso
    después de que el flujo cese.
  vinculos_generan_flujo: >
    Todo vínculo activo genera flujo ambiental en su entorno. La intensidad del flujo
    depende de la potencia del vínculo.
  vestigios_vs_vinculos: >
    Un vestigio no tiene conexión activa al Limbo. La distinción es mecánicamente
    relevante para detección (Taumaturgia) y para condiciones extranaturales: un
    vestigio no genera condiciones activas; un vínculo sí puede.
  descubrimiento_vs_uso: >
    Detectar una presencia del Limbo no equivale a descubrir un vestigio, y
    descubrir un vestigio no equivale a cumplir los requisitos de uso de un
    vínculo. Son capas distintas del sistema.

# ──────────────────────────────────────────────────────
# PREGUNTAS DE DISEÑO ABIERTAS
# ──────────────────────────────────────────────────────

open_questions:
  - id: D-09
    pregunta: >
      ¿Cómo interactúa el uso de Tauma con las tres manifestaciones? ¿Un practicante
      necesita un flujo o vínculo para usar Tauma, o la energía es interna?
    destino: sistema de Tauma — cuando se diseñe

  - id: D-10
    pregunta: >
      ¿Cuál es la tasa de disipación de vestigios? ¿Depende del material del objeto,
      del tiempo, de la intensidad original, o de la proximidad a un vínculo?
    destino: sistema de Tauma — cuando se diseñe

  - id: D-11
    pregunta: >
      ¿Los vínculos tienen NR? ¿Este NR afecta directamente los umbrales de condiciones
      extranaturales en el área, o es un parámetro independiente?
    destino: sistema de Tauma / sistema de condiciones extranaturales
