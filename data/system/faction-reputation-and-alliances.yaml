relationship_to_social_specializations:
  note: >
    Social specializations resolve live scene pressure. This system determines
    what the world remembers, what a faction allows, and how hard the social
    starting position is.
  commonly_relevant_specializations:
    - Liderazgo
    - Negociacion
    - Intimidacion
    - Engaño
    - Imitacion
    - Sigilo

ability_surfaces:
  - standing_shift_with_bounded_faction_set
  - renown_gain_loss_or_reinterpretation
  - alliance_formation_maintenance_or_strain
  - access_gate_to_goods_information_or_infrastructure
  - price_modifier_or_priority_of_service
  - settlement_availability_exception
  - social_starting_position_inside_faction_controlled_scene

design_rules:
  - do_not_use_one_global_alignment_grid_for_trust_prices_or_political_access
  - use_faction_standing_for_trust_and_access
  - use_public_renown_for_action_pattern_and_public_read
  - use_alliance_status_for_formal_or_semi_formal_commitment
  - use_commerce_and_availability_for_market_reality
