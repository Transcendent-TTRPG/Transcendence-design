authority: docs/system/combat-equipment-catalog.md

purpose:
  - instantiate_named_weapon_items
  - author_shield_classes_as_catalog_entries
  - define_armor_as_compositional_slot_category_material_grade_equipment

non_goals:
  - replace_equipment_overview_structural_rules
  - duplicate_material_rules
  - define_supernatural_or_vestigial_equipment

armor_authoring:
  model: compositional
  slots:
    - Helmet
    - Chestpiece
    - Bracers
    - Trousers
    - Boots
  categories:
    - Light
    - Medium
    - Heavy
  material_rule:
    note: material_changes_durability_and_potency_pressure_not_slot_bonus_or_category_behavior

shields:
  light:
    cover_bonus: none
    dr_bonus_formula: grade
    movement_penalty_formula: none
    weight: "2 kg"
  medium:
    cover_bonus: Light_Cover
    dr_bonus_formula: grade
    movement_penalty_formula: grade
    weight: "5 kg"
  heavy:
    cover_bonus: Medium_Cover
    dr_bonus_formula: "grade + 1"
    movement_penalty_formula: "grade * 2"
    weight: "10 kg"

