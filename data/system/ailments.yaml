      The target is stunned badly enough to lose its next meaningful activation.
    severity_levels:
      minor:
        - "Resistance Rolls and Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Aturdido"
        - "lose the next meaningful ATB activation"
      moderate:
        - "Resistance Rolls and Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Aturdido"
        - "lose the next meaningful ATB activation"
        - "while Aturdido remains active, Preparation becomes 0"
        - "after each lost activation is consumed, the target must succeed on a Tolerancia Specialization Roll against the original severity or Aturdido remains active and will consume the next meaningful activation as well"
      severe:
        - "Resistance Rolls and Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Aturdido"
        - "lose the next meaningful ATB activation"
        - "while Aturdido remains active, Preparation becomes 0"
        - "after each lost activation is consumed, the target must succeed on a Tolerancia Specialization Roll against the original severity or Aturdido remains active and will consume the next meaningful activation as well"
        - "while Aturdido remains active, the target cannot voluntarily use timing-sensitive reactive lines unless it first succeeds on a Tolerancia Specialization Roll against the original severity for that attempt"
