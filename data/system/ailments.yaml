  - name: Aterrorizado
    family: Alteration
    description: >
      The target's body and immediate operational judgment are seized by acute
      terror. This is not long-term trauma or deep anomalous distortion; it is
      a live bodily fear response that makes direct opposition, approach, and
      steady execution against the feared line harder.
    severity_levels:
      minor:
        - "A.R., D.R., Characteristic Rolls, and Specialization Rolls that directly oppose, approach, handle, or commit toward the feared source or feared line suffer a penalty equal to the rank bonus of the source that applied Aterrorizado"
      moderate:
        - "A.R., D.R., Characteristic Rolls, and Specialization Rolls that directly oppose, approach, handle, or commit toward the feared source or feared line suffer a penalty equal to the rank bonus of the source that applied Aterrorizado"
        - "cannot voluntarily reduce distance to the feared source or deliberately commit into the feared line unless first succeeding on a Contención Specialization Roll against the original severity for that attempt"
      severe:
        - "A.R., D.R., Characteristic Rolls, and Specialization Rolls that directly oppose, approach, handle, or commit toward the feared source or feared line suffer a penalty equal to the rank bonus of the source that applied Aterrorizado"
        - "cannot voluntarily reduce distance to the feared source or deliberately commit into the feared line unless first succeeding on a Contención Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target tries to directly oppose, approach, handle, or commit toward the feared line, it must first attempt that Contención Specialization Roll; on a failure, the attempted action does not resolve and is lost to hesitation, recoil, or aborted commitment as the fiction requires"
    application_requirements:
      - creature_presence_or_technique_creates_an_immediate_terror_line
      - scene_revelation_grotesque_display_or_predator_presence
      - contamination_threat_or_other_fictionally_credible_urgent_fear_source
