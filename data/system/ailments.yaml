      The target suffers operational penalties whenever acting directly
      against the feared line and cannot willingly close or commit into that
      line without first steadying itself.
    duration:
      model: while_condition_persists
      notes: >
        Persists while the terror line remains active and functionally
        relevant.
    recovery:
      notes: >
        Ends when the terror line is materially broken, disproved, removed,
        contained, or no longer functionally relevant; or when the target
        succeeds on a Contención Specialization Roll against the original
        severity to regain enough inward control that the feared line no
        longer governs immediate bodily response.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        active, the preferred self-recovery is Contención, because the problem
        is not pain tolerance or medical treatment but restoring enough
        internal control to act against the fear line.
    stacking_rule: >
      The terrified state never creates parallel copies. A stronger terror
      line replaces a weaker one; an equal application usually refreshes
      persistence while the same feared line remains active.
