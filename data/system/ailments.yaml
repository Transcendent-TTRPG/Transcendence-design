taxonomy:
  canonical_term:
    es: Agravios
    en: Ailments
  definition: >
    Harmful altered states that settle on a creature and change how it
    functions until they are removed, relieved, or naturally end.
  core_families:
    - Alteration
    - Infection
    - Affliction
    - Poison
    - Curse
  source_rule: >
    An Ailment is classified by the harmful state it creates, not by the
    source that applied it. The same Ailment may come from environment,
    creature actions, hazards, exposure, gear, or other causes.

severity_model:
  universal_levels:
    - id: minor
      es: Leve
      en: Minor
    - id: moderate
      es: Moderado
      en: Moderate
    - id: severe
      es: Grave
      en: Severe
  rule: >
    All Ailments use the same three severity levels. What severity changes is
    specific to each Ailment entry.
  default_application_pressure:
    minor: "8 + NR"
    moderate: "13 + NR"
    severe: "17 + NR"
  pressure_note: >
    These are the default resistance thresholds for applying or escalating an
    Ailment by severity unless a specific entry overrides them.
  note: >
    Severity does not always increase the ongoing penalty. Some Ailments use
    severity mainly to define application pressure, resistance difficulty, or
    removal difficulty while the settled result remains functionally the same.
  ongoing_effect_scaling_note: >
    When an Ailment's main ongoing burden is a numeric penalty, prefer that
    value to come from the rank bonus of the source that applied it, not from
    severity alone. In those cases, severity should usually decide which extra
    restrictions, consequence layers, recovery burdens, or commitment costs
    activate. By contrast, more binary or structural Ailments such as
    blindness, paralysis, knockdown, or full restraint often use severity
    more for application pressure, recovery difficulty, persistence, or
    additional state burdens than for numeric penalty scaling.

duration_models:
  preferred:
    - until_removed
    - until_trigger
    - scene
    - while_source_persists
    - while_condition_persists
    - sustained_by_environment
  rule: >
    Do not default to rounds. Duration and recovery are separate fields.

shared_condition_rule:
  name: strongest_condition
  rule: >
    Equal effects never stack. A stronger application replaces a weaker one.
    An equal application usually refreshes or resets the existing one if it
    lasts longer or is harder to remove.
  does_not_allow:
    - parallel_copies_of_the_same_effect
    - additive_penalty_stacking_from_identical_condition_types

required_fields:
  - name
  - family
  - description
  - severity_levels
  - application_requirements
  - effect
  - duration
  - recovery
  - resistance_or_escape
  - stacking_rule

families:
  alteration:
    definition: >
      Physiological disruptions that directly compromise bodily function.
    resistance_formula: "1d10 + Resilience + Resistances + Bonuses"
    source_note: >
      Alterations may come from environmental exposure, creature actions,
      hazards, impacts, electricity, cold, restraint, or other causes.
    scope_note: >
      Alterations are also the main combat-facing bodily state layer of the
      system. If the result is a direct operational disruption of the body
      during play, it belongs here even when the source was environmental,
      mental, anomalous, or creature-driven.
  affliction:
    definition: >
      Mental, perceptual, or inner-state disruptions that compromise judgment,
      clarity, emotional stability, or sensory coherence.
    resistance_formula: "1d10 + Composure + Resistances + Bonuses"
    source_note: >
      Afflictions may come from terror, psychological shock, hostile presence,
      psychic pressure, or other causes that settle into inner dysfunction.
    scope_note: >
      Afflictions are a deeper subsystem tied to anomalous perception,
      trauma, and prolonged exposure. Transient states like terror,
      disorientation, confusion, or overload should usually be treated as
      transient bodily states or downstream effects, not as standalone
      Afflictions.
    progression_model:
      main_sources:
        - vestigio
        - vinculo
      interaction_rule: >
        Each meaningful interaction with a Vestigio or Vínculo may call for an
        Affliction Resistance Roll. On a failure, the relevant sensory
        Affliction intensity increases by 1.
      manifestation_track:
        latent_range: [0, 4]
        first_manifestation_at: 5
        moderate_at: 10
        severe_at: 15
      overflow_rule: >
        If intensity would increase past a Severe manifested Affliction, the
        next increase should usually manifest a new Affliction on the same
        sensory channel instead of extending the same one past Severe.
      recovery_and_worsening:
        failed_qualifying_interaction: "+1 intensity"
        no_adequate_rest: "+1 intensity per night"
        good_sleep: "-1 intensity per night"
        effective_meditation: "-1 intensity per session"
      structure_note: >
        A proper Affliction usually carries both a terrestrial impairment and
        an extranatural perception benefit. Recovery pressure should reduce the
        destabilizing burden without assuming the perception channel vanishes
        automatically.
  infection:
    definition: >
      Biological, contaminant, or invasive organism Ailments that remain in
      the body over time and may spread to others.
    resistance_formula: "1d10 + Tenacity + Resistances + Bonuses"
    structure:
      required_subsystems:
        - contagion
        - incubation
        - propagation
        - treatment_route
      contagion: >
        Initial exposure requires an Infection Resistance Roll against the
        Infection's stated difficulty.
      incubation: >
        The Infection may remain present but asymptomatic for a defined period
        before visible symptoms begin.
      propagation: >
        Once active after incubation, the Infection may spread through the
        vectors defined by its entry. Exposed creatures must make the stated
        Infection Resistance Roll to avoid contagion.
  poison:
    definition: >
      Toxic Ailments introduced through a delivery method and resolved inside
      the organism.
    resistance_formula: "1d10 + Tenacity + Resistances + Bonuses"
    delivery_methods:
      - inoculation
      - ingestion
      - inhalation
      - contact
    persistence_rule: >
      Poisons remain active until neutralized, metabolized out, removed from
      the system, or otherwise ended by their own entry.
    handling_note: >
      Identification, safe handling, application, contamination risk, and
      neutralization should be part of poison logic rather than generic
      narration.
  curse:
    definition: >
      Extranatural Ailments bound to beings, objects, places, vows, or hostile
      supernatural rules.
    resistance_formula: "defined per curse entry"
    scope_note: >
      Curses should not be collapsed into Afflictions. An Affliction distorts
      perception or inner coherence; a Curse binds a hostile extranatural rule.

template:
  name: ""
  family: ""
  description: ""
  severity_levels:
    minor: []
    moderate: []
    severe: []
  application_requirements: []
  effect: ""
  duration:
    model: ""
    notes: ""
  recovery:
    notes: ""
  resistance_or_escape:
    notes: ""
  stacking_rule: ""

entries:
  - name: Electrizado
    family: Alteration
    description: >
      Electrical disruption causes unstable motor continuity, involuntary shock
      response, and degraded physical execution.
    severity_levels:
      minor:
        - "attacks, movement, and Techniques tied to attacks or movement cost additional Rhythm equal to the rank bonus of the source that applied Electrizado"
        - "physical Specialization Rolls suffer a penalty equal to that same rank bonus"
      moderate:
        - "attacks, movement, and Techniques tied to attacks or movement cost additional Rhythm equal to the rank bonus of the source that applied Electrizado"
        - "physical Specialization Rolls suffer a penalty equal to that same rank bonus"
        - "cannot use precise reactive physical answers such as movement-dependent reactions, tight interception, or other timing-sensitive physical responses unless first succeeding on a Tolerancia Specialization Roll against the original severity for that attempt"
      severe:
        - "attacks, movement, and Techniques tied to attacks or movement cost additional Rhythm equal to the rank bonus of the source that applied Electrizado"
        - "physical Specialization Rolls suffer a penalty equal to that same rank bonus"
        - "cannot use precise reactive physical answers such as movement-dependent reactions, tight interception, or other timing-sensitive physical responses unless first succeeding on a Tolerancia Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target attempts movement, an attack, or a Technique tied to attacks or movement, it must first attempt that Tolerancia Specialization Roll; on a failure, the attempted action does not resolve and is lost to lock, spasm, or discharge recoil as the fiction requires"
    application_requirements:
      - meaningful_electrical_discharge
      - prolonged_conductive_exposure
      - other_fictionally_credible_bodily_shock_source
    effect: >
      The target loses clean physical continuity. Actions tied to attacks and
      movement become slower and physical Specialization execution degrades.
    duration:
      model: while_condition_persists
      notes: >
        The state lasts while the electrical disruption remains actively
        compromising bodily continuity.
    recovery:
      notes: >
        Usually ends when the discharge is grounded, discharged, or otherwise
        interrupted long enough for the body to recover continuity. Once the
        source is no longer actively shocking the target, a successful
        Tolerancia Specialization Roll against the original severity usually
        ends the state.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        active, recovery is primarily governed by bodily recovery rather than
        precision or mental control.
    stacking_rule: >
      The same effect never creates parallel copies. A stronger application
      replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Lacerado
    family: Alteration
    description: >
      The target has been torn, cut open, or otherwise wounded in a way that
      makes strenuous physical execution slower because movement must protect,
      compensate for, or push through the damaged tissue.
    severity_levels:
      minor:
        - "strenuous physical actions that directly stress the wound cost additional Rhythm equal to the rank bonus of the source that applied Lacerado"
      moderate:
        - "strenuous physical actions that directly stress the wound cost additional Rhythm equal to the rank bonus of the source that applied Lacerado"
        - "actions that explosively drive force, weight, leverage, or full-body motion through the wounded line require a Tolerancia Specialization Roll against the original severity for that attempt"
      severe:
        - "strenuous physical actions that directly stress the wound cost additional Rhythm equal to the rank bonus of the source that applied Lacerado"
        - "actions that explosively drive force, weight, leverage, or full-body motion through the wounded line require a Tolerancia Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target attempts one of those strenuous wound-stressing physical actions, it must first attempt that Tolerancia Specialization Roll; on a failure, the attempted action or roll does not resolve and is lost to recoil, guarded movement, protective collapse, or pain break as the fiction requires"
    application_requirements:
      - deep_cut_or_laceration
      - tearing_bite_or_claw
      - hooked_or_serrated_weapon_contact
      - open_wound_under_physical_pressure
      - other_fictionally_credible_source_of_painful_tissue_disruption
    effect: >
      The target can still act, but actions that put pressure through the
      lacerated area become slower. Strenuous physical actions include attacks,
      movement bursts, weapon Techniques, forced movement attempts, grapples,
      heavy defenses, or similar actions that clearly stress the wound.
    duration:
      model: until_removed
      notes: >
        Persists until the wound is stabilized, bound, closed, treated, or no
        longer functionally stressed by the scene.
    recovery:
      notes: >
        Ends when the target spends a suitable action to bind, brace, close,
        harden, or otherwise stabilize the wound pressure. Medicina can end the
        state when treatment is part of the fiction; some natural armor,
        regeneration, or hardening effects may provide their own recovery route.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        active, recovery is usually practical or medical rather than mental:
        stabilize the wound, change how the body is moving, or receive
        treatment.
    stacking_rule: >
      The same lacerated state never creates parallel copies. A stronger
      application replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Atrapado
    family: Alteration
    description: >
      The target is physically restrained or structurally impeded from moving
      freely.
    severity_levels:
      minor:
        - "movement becomes 0"
        - "A.R., I.R., D.R., and physical Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Atrapado whenever those rolls are made through the active restraint"
      moderate:
        - "movement becomes 0"
        - "A.R., I.R., D.R., and physical Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Atrapado whenever those rolls are made through the active restraint"
        - "cannot use large-body, full-extension, or heavily leveraged actions through the restrained line unless first succeeding on an Agarre Specialization Roll against the original severity for that attempt"
      severe:
        - "movement becomes 0"
        - "A.R., I.R., D.R., and physical Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Atrapado whenever those rolls are made through the active restraint"
        - "cannot use large-body, full-extension, or heavily leveraged actions through the restrained line unless first succeeding on an Agarre Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target attempts to attack, intercept, or break free through the restrained line, it must first attempt that Agarre Specialization Roll; on a failure, the attempted action does not resolve and is lost to bind, catch, twist, or restraint drag as the fiction requires"
    application_requirements:
      - creature_grapple_or_hold
      - restraining_net_or_mechanism
      - adhesive_or_binding_hazard
      - other_fictionally_credible_restraint_source
    effect: >
      The target loses bodily freedom and cannot move until the restraint is
      broken, released, or removed.
    duration:
      model: until_removed
      notes: >
        Persists until the restraining source stops holding the target.
    recovery:
      notes: >
        Ends when the target breaks free, is released, or the source no longer
        restrains them. The preferred self-recovery is an Agarre
        Specialization Roll against a living hold, or another physical
        Specialization Roll if the fiction is more about slipping out or
        disentangling than overpowering contact.
    resistance_or_escape:
      notes: >
        Usually escaped with an Agarre Specialization Roll, though some
        sources may instead call for another physical Specialization Roll or a
        Strength Characteristic Roll if no trained bodily technique clearly
        applies.
    stacking_rule: >
      The restrained effect never creates parallel copies. Stronger restraint
      replaces the weaker state; equal restraint usually refreshes persistence.

  - name: Congelado
    family: Alteration
    description: >
      Cold has settled into the body deeply enough to compromise temperature,
      motor response, and agile movement.
    severity_levels:
      minor:
        - "Agility Characteristic Rolls and Agility Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Congelado"
        - "movement reduced by half"
      moderate:
        - "Agility Characteristic Rolls and Agility Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Congelado"
        - "movement reduced by half"
        - "cannot voluntarily sprint, leap, climb, or use another clearly explosive mobility line unless first succeeding on an Aclimatación Specialization Roll against the original severity for that attempt"
      severe:
        - "Agility Characteristic Rolls and Agility Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Congelado"
        - "movement reduced by half"
        - "cannot voluntarily sprint, leap, climb, or use another clearly explosive mobility line unless first succeeding on an Aclimatación Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target attempts a movement action or Agility-based committed action through the cold-impaired line, it must first attempt that Aclimatación Specialization Roll; on a failure, the attempted action does not resolve and is lost to stiffness, cold lock, or slipping motor response as the fiction requires"
    application_requirements:
      - prolonged_freezing_exposure
      - ice_based_hostile_effect
      - other_fictionally_credible_source_of_bodily_cold_impairment
    effect: >
      The body loses agile responsiveness and movement efficiency because cold
      has settled into the target itself rather than remaining external.
    duration:
      model: while_condition_persists
      notes: >
        Persists while the body remains functionally compromised by cold.
    recovery:
      notes: >
        Ends when body temperature is raised and the target is no longer
        functionally impaired by the cold. If the cold source is no longer
        actively forcing the state, a successful Aclimatación Specialization
        Roll against the original severity usually ends the Alteration;
        Medicina can assist when treatment is part of the fiction.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        active, recovery is mainly environmental or physiological rather than
        positional.
    stacking_rule: >
      The same cold impairment never creates separate copies. Repeated pressure
      usually escalates severity or refreshes persistence instead.

  - name: Derribado
    family: Alteration
    description: >
      The target loses stable footing or bodily posture and is brought to the
      ground.
    severity_levels:
      minor:
        - "-3 to all rolls"
        - "the first movement action is spent getting up"
      moderate:
        - "-3 to all rolls"
        - "the first movement action is spent getting up"
      severe:
        - "-3 to all rolls"
        - "the first movement action is spent getting up"
    application_requirements:
      - impact_or_sweep
      - force_transfer_or_collision
      - terrain_failure
      - other_fictionally_credible_knockdown_source
    effect: >
      The target is on the ground, loses stable posture, and must spend the
      first movement action to stand.
    duration:
      model: until_removed
      notes: >
        Persists until the target stands up.
    recovery:
      notes: >
        Ends when the target stands up.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        suffered, removal is usually achieved by spending the first movement
        action to rise.
    stacking_rule: >
      The knocked-down effect never creates parallel copies. A stronger
      application replaces a weaker one; an equal application usually refreshes
      the state.

  - name: Conmocionado
    family: Alteration
    description: >
      A destabilizing blow or shock has compromised the target's clarity,
      mental steadiness, and cognitive continuity.
    severity_levels:
      minor:
        - "Composure and Intellect Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Conmocionado"
        - "Composure and Intellect Specialization Rolls suffer a penalty equal to that same rank bonus"
      moderate:
        - "Composure and Intellect Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Conmocionado"
        - "Composure and Intellect Specialization Rolls suffer a penalty equal to that same rank bonus"
        - "Preparation becomes 0"
      severe:
        - "Composure and Intellect Characteristic Rolls suffer a penalty equal to the rank bonus of the source that applied Conmocionado"
        - "Composure and Intellect Specialization Rolls suffer a penalty equal to that same rank bonus"
        - "Preparation becomes 0"
        - "the first time on each activation the target attempts a Composure- or Intellect-based Characteristic Roll or Specialization Roll, it must first succeed on a Contención Specialization Roll against the original severity for that attempt; on a failure, the attempted action or roll does not resolve and is lost to cognitive break, drift, or mental stall as the fiction requires"
    application_requirements:
      - impact_or_internal_shock
      - blast_force_or_collision
      - other_fictionally_credible_concussion_like_source
    effect: >
      The target's clarity and mental continuity are destabilized, degrading
      Composure- and Intellect-based execution.
    duration:
      model: until_removed
      notes: >
        Persists until the target stabilizes.
    recovery:
      notes: >
        Ends when the target regains enough internal steadiness to restore
        clarity. The preferred self-recovery is a Contención Specialization
        Roll against the original severity; Medicina can also end the state
        through treatment, and full rest may clear it between scenes if the
        fiction supports it.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        suffered, recovery is mainly about regaining internal steadiness or
        receiving treatment rather than simply enduring pain.
    stacking_rule: >
      The same cognitive destabilization never creates parallel copies.
      Stronger application replaces a weaker one; equal application usually
      refreshes persistence.

  - name: Paralizado
    family: Alteration
    description: >
      The body loses the ability to execute meaningful action through
      neuromuscular shutdown, rigid lock, or equivalent bodily arrest.
    severity_levels:
      minor:
        - "the target cannot perform meaningful actions"
      moderate:
        - "the target cannot perform meaningful actions"
      severe:
        - "the target cannot perform meaningful actions"
    application_requirements:
      - electricity_or_neuromuscular_shutdown
      - venom_or_cold_lock
      - forceful_bodily_suppression
      - other_fictionally_credible_action_arrest_source
    effect: >
      The target cannot perform meaningful actions until bodily control returns.
    duration:
      model: until_removed
      notes: >
        Persists until bodily control returns or the source no longer enforces
        the paralysis.
    recovery:
      notes: >
        Ends when bodily control returns. The preferred self-recovery is a
        Tolerancia Specialization Roll against the original severity once the
        source is no longer fully locking the body; some sources may instead
        require their own release condition before any roll is possible.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. If
        already suffered, recovery is mainly physiological unless a specific
        source overrides it.
        Use Paralizado only when meaningful bodily action is actually arrested;
        use Atrapado for restraint, Aturdido for lost activation, and Impedido
        for execution breakdown that still leaves the body meaningfully active.
    stacking_rule: >
      The paralyzed state never creates parallel copies. A stronger
      application replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Ensordecido
    family: Alteration
    description: >
      The target's hearing is functionally impaired or lost.
    severity_levels:
      minor:
        - "cannot perform Characteristic Rolls or Specialization Rolls that require hearing"
        - "cannot rely on auditory cues for responses to threats not seen"
      moderate:
        - "cannot perform Characteristic Rolls or Specialization Rolls that require hearing"
        - "cannot rely on auditory cues for responses to threats not seen"
      severe:
        - "cannot perform Characteristic Rolls or Specialization Rolls that require hearing"
        - "cannot rely on auditory cues for responses to threats not seen"
    application_requirements:
      - sonic_trauma_or_pressure_shock
      - blast_force
      - environmental_overload
      - other_fictionally_credible_hearing_disruption_source
    effect: >
      The target loses auditory function needed for hearing-based perception,
      reaction, and task resolution. Use Ensordecido only when hearing is no
      longer a usable primary sense; if a source only muddies one auditory
      line, one ear, one echo path, or one bounded read channel, use a
      procedural state instead.
    duration:
      model: until_removed
      notes: >
        Persists until auditory function returns or the source no longer
        functionally deafens the target.
    recovery:
      notes: >
        Ends when auditory function returns or the target is no longer
        functionally deafened. If the source is no longer actively deafening
        the target, a Medicina Specialization Roll is the preferred way to
        restore function; otherwise the state lasts until time, treatment, or
        source removal make recovery credible.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied.
        Recovery is primarily medical or source-dependent rather than a matter
        of concentration.
    stacking_rule: >
      The deafened state never creates parallel copies. A stronger application
      replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Cegado
    family: Alteration
    description: >
      The target cannot see.
    severity_levels:
      minor:
        - "-5 to A.R., D.R., I.R., and Specialization Rolls"
      moderate:
        - "-5 to A.R., D.R., I.R., and Specialization Rolls"
      severe:
        - "-5 to A.R., D.R., I.R., and Specialization Rolls"
    application_requirements:
      - light_or_vision_obscuration
      - trauma_or_debris
      - ocular_damage
      - other_fictionally_credible_loss_of_sight
    effect: >
      The target is functionally blind and suffers major penalties to combat
      and specialization execution. Use Cegado only when vision is no longer
      a usable primary sense; if a source only fouls one eye-line, one
      read-point, or one bounded visual channel, use a procedural state
      instead.
    duration:
      model: until_removed
      notes: >
        Persists until the blinding source dissipates or vision is restored.
    recovery:
      notes: >
        Usually ends when the blinding source is removed, dissipates, or is
        overcome through treatment, cleansing, or time as appropriate. When
        actual bodily restoration is needed, Medicina is the preferred
        recovery Specialization Roll.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied.
    stacking_rule: >
      The blinded state never creates parallel copies. A stronger application
      replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Confundido
    family: Alteration
    description: >
      The target loses clean judgment and cannot reliably distinguish friend,
      foe, or intent in the immediate scene.
    severity_levels:
      minor:
        - "A.R., I.R., and mental Specialization Rolls that require clean friend-foe discrimination, target identification, or intent reading suffer a penalty equal to the rank bonus of the source that applied Confundido"
      moderate:
        - "A.R., I.R., and mental Specialization Rolls that require clean friend-foe discrimination, target identification, or intent reading suffer a penalty equal to the rank bonus of the source that applied Confundido"
        - "before the target can deliberately choose a specific creature, side, or operative line in a crowded, ambiguous, or fast-changing scene, it must first succeed on an Enfoque Specialization Roll against the original severity for that attempt"
      severe:
        - "A.R., I.R., and mental Specialization Rolls that require clean friend-foe discrimination, target identification, or intent reading suffer a penalty equal to the rank bonus of the source that applied Confundido"
        - "before the target can deliberately choose a specific creature, side, or operative line in a crowded, ambiguous, or fast-changing scene, it must first succeed on an Enfoque Specialization Roll against the original severity for that attempt"
        - "the first time on each activation the target attempts such a directed choice, it must first attempt that Enfoque Specialization Roll; on a failure, the attempted action or roll does not resolve cleanly and the target must either hesitate, choose the nearest obvious line, or misdirect toward the wrong creature or priority as the fiction requires"
    application_requirements:
      - bodily_shock_or_sensory_overload
      - neural_disruption_or_concussion
      - toxins_or_other_fictionally_credible_operational_judgment_break
    effect: >
      The target cannot reliably direct intent during the scene and may
      misidentify targets, sides, or operative priorities.
    duration:
      model: until_removed
      notes: >
        Persists until enough operational clarity returns.
    recovery:
      notes: >
        Ends with a successful Enfoque Specialization Roll against the original
        severity once enough operational clarity returns. Medicina or removal
        of the destabilizing source may also end it if the fiction supports
        that route.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied. Once
        active, recovery is mainly about regaining judgment continuity rather
        than simply waiting out one random moment.
    stacking_rule: >
      The confused state never creates parallel copies. A stronger application
      replaces a weaker one; an equal application usually refreshes
      persistence.

  - name: Desequilibrado
    family: Alteration
    description: >
      The target's posture and bodily stability are compromised.
    severity_levels:
      minor:
        - "D.R. and physical Specialization Rolls suffer a penalty equal to the rank bonus of the source that applied Desequilibrado"
      moderate:
