      The target loses its next meaningful activation and suffers degraded
      resistance, bodily readiness, and characteristic performance. In more
      severe cases, the stun can continue across multiple activations until
      the body fully recovers continuity.
    duration:
      model: until_removed
      notes: >
        Minor usually ends after the first lost activation is consumed.
        Moderate and Severe may persist across multiple lost activations until
        recovery succeeds.
    recovery:
      notes: >
        Minor usually ends once the skipped activation is spent. Moderate and
        Severe end with a successful Tolerancia Specialization Roll against the
        original severity after a lost activation, or when treatment, bodily
        stabilization, or source removal restores operational continuity.
        Medicina can also end the state if the fiction supports direct
        intervention.
    resistance_or_escape:
      notes: >
        Normally resisted with Alteration Resistance when first applied.
    stacking_rule: >
      The stunned state never creates parallel copies. A stronger application
      replaces a weaker one; an equal application usually refreshes persistence
      and which upcoming activation is threatened next.

