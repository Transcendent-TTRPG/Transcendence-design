        the system. It does not clear spontaneously.
    recovery:
      notes: >
        Requires Kit de Medicina Especializado to flush the renal system.
        Entendimiento (Alquimia) at Exigente difficulty is needed for
        identification. Given its role in amplifying all other ailments,
        Saturado should be prioritized in treatment.
    resistance_or_escape:
      notes: >
        Resisted with T.R. de Venenos when first delivered. Once active,
        full removal requires Kit de Medicina Especializado — there is no
        partial removal route at this complexity level.
    stacking_rule: >
      Saturado does not create parallel copies on the same target.
      A stronger application replaces a weaker one. Coexists with ailments
      from all other Veneno families on the same target — and actively
      worsens the target's ability to resist them.

  - name: Inhibido
    family: Poison
    delivery_method: inoculation
    alchemic_index: 9
    treatment_kit:
      minor: Básico
      moderate: Especializado
      severe: Especializado
    description: >
      A hepatotoxic compound that suppresses the liver's synthesis of
      repair-enabling proteins — clotting factors, growth factors,
      inflammatory modulators. While active, the body cannot process or
      benefit from healing substances or techniques. The organism remains
      in metabolic stasis: neither deteriorating rapidly from the poison
      alone nor able to recover from any damage received.
    severity_levels:
      minor:
        - "Kit de Medicina actions targeting this creature operate at one difficulty tier higher than normal"
        - "healing techniques restore half their normal amount (round down)"
      moderate:
        - "Kit de Medicina actions for wound treatment targeting this creature have no effect"
        - "healing techniques restore one-quarter their normal amount (round down)"
        - "neutralizing Inhibido itself requires Kit de Medicina Especializado and functions normally — treating the poison compound is distinct from wound healing and is not blocked by this restriction"
      severe:
        - "no wound treatment (Kit de Medicina), healing technique, or recovery action targeting this creature has any effect while Inhibido is active"
        - "neutralizing Inhibido itself requires Kit de Medicina Especializado and a T.E. Medicina at Exigente difficulty"
        - "once Inhibido is successfully neutralized, normal healing and treatment resume"
    application_requirements:
      - successful_inoculation_through_stated_delivery_route
      - target_fails_T.R._Venenos
    effect: >
      The target's capacity to benefit from healing is chemically suppressed.
      Medical treatment and healing techniques cannot function effectively
      until the compound is neutralized. Inhibido must be addressed before
      any other damage on the same target can be treated.
    duration:
      model: until_removed
      notes: >
        The compound persists until neutralized. It does not end when the
        applying creature is no longer present or when the scene ends.
    recovery:
      notes: >
        Inhibido must be neutralized before wounds or other ailments on the
        same target can be treated. Neutralizing the compound is direct
        treatment of the poison — it is not blocked by the compound's own
        restriction. Severity determines the kit tier required.
    resistance_or_escape:
      notes: >
        Resisted with T.R. de Venenos when first delivered. Once active,
        only direct neutralization of the compound ends the state. Recovery
        from wounds sustained while Inhibido was active can only begin after
        Inhibido is cleared.
    stacking_rule: >
      Inhibido does not create parallel copies on the same target.
      A stronger application replaces a weaker one. Coexists with ailments
      from other Veneno families on the same target.
