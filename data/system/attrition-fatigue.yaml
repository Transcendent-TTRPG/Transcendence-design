endurance:
  id: endurance
  name: Endurance
  name_es: Aguante
  type: derived_attribute
  formula: "size_base + (TEN * 2)"
  components:
    size_base: "base constant by size category; see data/system/size-modifiers.yaml endurance_base"
    size_base_values: {pequeño: 2, mediano: 4, grande: 6}
    characteristic: TEN
  starting_minimum: 8  # Mediano base 4 + TEN 2 (reaches at least 2 after universal Tenacity Synapsis)

fatigue_thresholds:
  comparison: accumulated_attrition vs endurance
  levels:
    - id: fatigue_0
      name: No Fatigue
      condition: "attrition < endurance"
    - id: fatigue_1
      name: Fatigue 1
      condition: "attrition >= endurance"
    - id: fatigue_2
      name: Fatigue 2
      condition: "attrition >= 2 * endurance"
    - id: fatigue_3
      name: Fatigue 3
      condition: "attrition >= 3 * endurance"
    - id: fatigue_4
      name: Fatigue 4
      condition: "attrition >= 4 * endurance"
    - id: fatigue_5
      name: Fatigue 5
      condition: "attrition >= 5 * endurance"
  overflow_rule: >
    The base scale does not create levels above Fatigue 5. If any rule would
    add Fatigue while the character is already at Fatigue 5, the character
    becomes Incapacitated by exhaustion and cannot take Active Actions,
    Reactions, or Techniques until they can rest, receive help, or apply a
    specific rule that removes them from that state.

fatigue_effects:
  stacking_rule: cumulative
  stacking_note: >
    Each Fatigue level adds its own restriction on top of all lower levels.
    A character at Fatigue 3 is under the effects of Fatigue 1, 2, and 3
    simultaneously.
  levels:
    - id: fatigue_1
      effect_type: check_before_action
      target: physical_specializations
      rule: >
        Physical Specialization Rolls (T.E. Físicas) require a successful
        T.R. Tenacidad before execution. On failure, the Specialization Roll
        is lost.
    - id: fatigue_2
      effect_type: restriction
      target: high_rhythm_actions
      rule: >
        Actions with a rhythm cost of 5 or higher are not available.
    - id: fatigue_3
      effect_type: cost_increase
      target: all_non_free_actions
      rule: >
        All non-free actions cost +1 Attrition.
    - id: fatigue_4
      effect_type: restriction
      target: reactions
      rule: >
        Reactions are not available. Only Active Actions can be taken.
    - id: fatigue_5
      effect_type: payload_strip
      target: techniques
      rule: >
        Techniques resolve only their primary effect (T.A., T.I., or base
        utility effect). Secondary effects — free repositioning, applied
        Alterations, and position control — do not activate.
  overflow:
    trigger: "fatigue would exceed 5"
    state: unconscious
    name_es: Inconsciente
    description: >
      The body shuts down. The character loses consciousness. Cannot take
      Active Actions, Reactions, or Techniques until they rest, receive
      help, or a specific rule removes this state.

fatigue_timing:
  structural_rule: >
    Fatigue 1 must arrive after the enemy's main logic has become actionable,
    but before that logic has been fully exploited and the threat has already collapsed.
  projected:
    id: projected_fatigue
    name_es: Fatiga proyectada
    description: >
      During an active hostile scene, the player tracks accumulated Attrition and
      can see what Fatigue level would apply if the scene ended at that moment.
      Penalties are not yet applied. The character is pushing their margin.
    applies: false
    visible: true
    trigger: scene_active
  settled:
    id: settled_fatigue
    name_es: Fatiga asentada
    description: >
      When the hostile scene ends or clearly drops in intensity, adrenaline stops
      sustaining performance artificially. Projected Fatigue becomes real Fatigue
      and its effects are applied.
    applies: true
    visible: true
    trigger: scene_ends_or_intensity_drops

carrying_capacity:
  formula_components:
    strength: "Fuerza efectiva, minimum 1"
    tenacity: "Tenacidad efectiva, minimum 1"
    size_multiplier: "by creature size"
  formula: "max(1, Fuerza) * max(1, Tenacidad) * size_multiplier_kg"
  size_multipliers_kg:
    diminuto: 1
    pequeno: 15
    mediano: 35
    grande: 80
    enorme: 200
    gigantesco: 800
  load_bands:
    light:
      name_es: Carga Ligera
      range: "up_to_50_percent_capacity"
      sustained_fatigue: none
    medium:
      name_es: Carga Media
      range: "more_than_50_up_to_75_percent_capacity"
      sustained_fatigue: "+1 Fatigue per 2 hours"
    heavy:
      name_es: Carga Pesada
      range: "more_than_75_up_to_100_percent_capacity"
      sustained_fatigue: "+1 Fatigue per 1 hour"
  rule: >
    Sustained load Fatigue does not check Attrition thresholds. It is direct
    Fatigue from prolonged transport or exploration burden. If a new sustained
    load application would push the character beyond Fatigue 5, the character
    becomes Incapacitated by exhaustion and must rest or receive help.
  scope: "travel, exploration, marching, transport, or prolonged physical work; not checked each combat round"
  over_capacity: "more than 100% capacity cannot be carried functionally without help, equipment, Technique, pack creature, or specific rule"

attrition_cost_scale:
  name: Attrition Cost Scale
  name_es: Escala de Desgaste
  description: >
    Actions are classified by functional demand within the scene, not by attribute type.
    Physical, mental, and social actions can all generate Attrition if they impose
    real effort under pressure.
  levels:
    - cost: 0
      label: trivial
      description: Non-significant or purely narrative action with no real scene demand
      examples:
        - obvious observation with no risk
        - brief remark with no tactical weight
        - minor interaction with no pressure
    - cost: 1
      label: standard
      description: Standard meaningful action in a hostile scene
      examples:
        - standard attack
        - simple defense
        - meaningful movement under pressure
        - active enemy observation
        - basic creature behavior reading
        - moderate tactical use of mental or social action
    - cost: 2
      label: high_demand
      description: Action of significant exertion that alters the scene's rhythm or absorbs serious pressure
      examples:
        - intercepting a charge
        - protecting another character by absorbing pressure
        - deep enemy analysis during combat
        - maneuver that genuinely changes scene rhythm
        - mental or social action that removes a key advantage
        - especially demanding reaction
    - cost: 3
      label: extreme
      description: Extreme or overextension action beyond the character's normal operating margin
      examples:
        - limit effort when already under heavy pressure
        - heroic intervention clearly beyond safe margin
        - maneuver that forces the character past their normal pace

reactions:
  cost_basis: demand_not_category
  description: >
    Reactions are not more costly because they are reactions, but because
    they are typically executed under high pressure with little margin.
  cost_guidelines:
    simple: 1
    demanding: 2
    limit: 3

conditions_and_environment:
  principle: >
    Environmental NR expresses difficulty through the threshold (Base + NR) — the only
    fixed rule. Restrict and Accelerate are Narrator tools applied when narratively
    justified. No automatic trigger; not every severity requires both.
  narrator_tools:
    - id: restrict
      description: Narrator eliminates available actions when the condition justifies it
    - id: accelerate
      description: Narrator adds +1 Attrition cost to all non-free actions when the condition justifies it
  example_condition:
    id: cold
    levels:
      - level: 1
        attrition_modifier: 0
        effect: "threshold (Mild, 5+NR) expresses difficulty; no action restrictions"
      - level: 2
        attrition_modifier: 0
        effect: "no sprint or dash (Restrict)"
      - level: 3
        attrition_modifier: "+1 to attrition cost of physical actions"
        effect: "half movement (Restrict); +1 Attrition cost (Accelerate)"

rest_recovery:
  short_rest:
    description: >
      Brief pause to catch breath and stabilize. Only the first Short Rest after
      a hostile scene reduces Attrition normally. Subsequent pauses allow tasks
      but do not reduce Attrition again unless a specific rule allows it.
    durations:
      - minutes: 15
        attrition_recovery: 1
        tasks: 1
        task_type: brief
      - minutes: 30
        attrition_recovery: 2
        tasks: 1
        task_type: significant
      - minutes: 60
        attrition_recovery: 3
        tasks: 2
        task_type: significant
        favorable_condition_bonus: 1
  full_rest:
    description: >
      8-hour recovery requiring reasonably adequate conditions. Reduces Attrition,
      progresses affliction relief, allows equipment repair, and recovers daily resources.
    attrition_recovery: "2 × Endurance"
    affliction_progression: -1  # per active affliction, per day of Full Rest
    equipment_durability_recovery: 5  # per relevant item, on successful specialization roll
    daily_resources: "all abilities marked 'per day' or 'after full rest'"

encounter_category_and_pressure:
  principle: >
    Encounter category does not change a character's Endurance.
    What changes between categories is the pressure of the encounter:
    the number of attrition sources, the frequency of high-demand actions,
    the environmental pressure, and how difficult it is to reach a phase
    of operational control.
  endurance_belongs_to: character
  attrition_belongs_to: scene
  fatigue_belongs_to: consequence_of_excess
  category_effect: pressure_shape_and_speed  # not threshold value

# ─── PSYCHIC PARALLEL SYSTEM ────────────────────────────────────────────────
# Mirror structure to Attrition / Endurance / Fatigue.
# Applies only to humanoid characters with active vínculo connections.
# Eco accumulates from Aspecto use; Cordura is the reserve; Disonancia is
# the settled consequence when Eco exceeds Cordura.

resonance_echo:
  id: eco
  name: Echo
  name_es: Eco
  type: accumulated_cost
  description: >
    Eco is the accumulated psychic load left in a character by activating
    Aspectos through a vínculo. It is the psychic parallel to Attrition.
    Eco does not represent damage; it represents the residue of the vínculo
    pressing its perceptual reality into the character's mind.
  applies_to: humanoid characters with at least one active vínculo
  cost_basis: per Aspecto activation (cost defined per Aspecto entry)
  projected_vs_settled: same timing rule as Attrition — projected during
    the scene, settled when the scene ends or intensity drops.

sanity:
  id: cordura
  name: Sanity
  name_es: Cordura
  type: derived_attribute
  formula: "3 + (CMP * 2)"
  components:
    base_reserve: 3
    base_reserve_rationale: >
      Minimum operational coherence. Parallel to Endurance's base reserve
      across body, mind, and composure.
    characteristic: CMP
  minimum_value: 3  # when CMP = 0
  starting_minimum: 5  # CMP reaches at least 1 at creation

dissonance_thresholds:
  comparison: accumulated_echo vs sanity
  name_es: Umbrales de Disonancia
  levels:
    - id: dissonance_0
      name: No Dissonance
      name_es: Disonancia 0
      condition: "eco < cordura"
    - id: dissonance_1
      name: Dissonance 1
      name_es: Disonancia 1
      condition: "eco >= cordura"
    - id: dissonance_2
      name: Dissonance 2
      name_es: Disonancia 2
      condition: "eco >= 2 * cordura"
    - id: dissonance_3
      name: Dissonance 3
      name_es: Disonancia 3
      condition: "eco >= 3 * cordura"
    - id: dissonance_4
      name: Dissonance 4
      name_es: Disonancia 4
      condition: "eco >= 4 * cordura"
    - id: dissonance_5
      name: Dissonance 5
      name_es: Disonancia 5
      condition: "eco >= 5 * cordura"
  overflow_rule: >
    If any rule would add Dissonance while the character is already at
    Dissonance 5, the character becomes Incapacitated. The brain activates
    an automatic cutoff to prevent permanent damage. No Aspecto can be
    activated. All vínculo connections are suspended until the character
    rests, receives help, or a specific rule removes this state.

dissonance_effects:
  stacking_rule: cumulative
  stacking_note: >
    Each Dissonance level adds its restriction on top of all lower levels.
    A character at Dissonance 3 is under the effects of Dissonance 1, 2,
    and 3 simultaneously. Parallel to Fatigue stacking.
  levels:
    - id: dissonance_1
      effect_type: check_before_action
      target: mental_and_knowledge_specializations
      rule: >
        Mental and knowledge Specialization Rolls (T.E. Mentales y Saberes)
        require a successful T.R. Compostura before execution. On failure,
        the Specialization Roll is lost.
    - id: dissonance_2
      effect_type: restriction
      target: grave_aspectos
      rule: >
        Aspectos at Grave stage are not available, regardless of affliction
        intensity. Perception cannot sustain that depth of processing.
    - id: dissonance_3
      effect_type: cost_increase
      target: all_aspectos
      rule: >
        All Aspecto activations cost +1 Eco.
    - id: dissonance_4
      effect_type: restriction
      target: multi_camino_vinculos
      rule: >
        Vínculos with more than one camino become completely unusable — no
        camino can be activated. Even inactive caminos actively generate
        Affliction load; at this level that dual burden cannot be sustained.
        Only single-camino vínculos remain available.
    - id: dissonance_5
      effect_type: payload_strip
      target: aspecto_escalation
      rule: >
        Aspectos resolve only their Leve stage effect, regardless of the
        affliction intensity level. Moderado and Grave stage effects do not
        activate. The vínculo connection persists but the mind cannot process
        deeper perception into meaningful action.
  overflow:
    trigger: "dissonance would exceed 5"
    state: unconscious
    name_es: Inconsciente
    description: >
      The brain activates an automatic cutoff to prevent permanent damage.
      The character loses consciousness. No Aspecto can be activated and all
      vínculo connections are suspended until they rest, receive help, or a
      specific rule removes this state. Afflictions record whatever perceptual
      damage accumulated; unconsciousness is the temporary total shutdown.

psychic_system_parallel:
  note: >
    The physical and psychic systems accumulate independently — Fatiga does
    not affect Eco and Disonancia does not affect Desgaste. Overflow on
    either track renders the character Unconscious. This is an OR condition,
    not AND.
  physical_track:
    accumulated: Desgaste
    reserve: Aguante
    settled_consequence: Fatiga
    overflow: Inconsciente
  psychic_track:
    accumulated: Eco
    reserve: Cordura
    settled_consequence: Disonancia
    overflow: Inconsciente
