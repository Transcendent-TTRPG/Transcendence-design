meta:
  version: "0.1"
  status: draft
  last_updated: "2026-04-30"

taxonomy:
  canonical_term:
    es: Superficies de Interaccion de Tecnicas
    en: Technique Interaction Surfaces
  purpose: >
    Catalog of existing mechanical surfaces that Techniques may modify. Use
    this file as a design index when creating Techniques so new abilities touch
    named systems instead of inventing disconnected effects.
  authoring_rule: >
    Every Technique should declare at least one primary mechanical surface, the
    operation used on that surface, and the counterplay or limitation that keeps
    the effect bounded.

mechanical_surface_field:
  recommended_shape:
    mechanical_surfaces:
      primary: ""
      secondary: []
      operations: []
      counterplay: []
      balance_notes: ""

operation_verbs:
