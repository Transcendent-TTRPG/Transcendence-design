  - impose_penalty
  - reroll
  - convert
  - replace
  - trigger
  - suppress
  - extend
  - reduce
  - escalate
  - downgrade
  - mark
  - reveal
  - hide
  - relocate
  - intercept
  - break
  - degrade
  - restore
