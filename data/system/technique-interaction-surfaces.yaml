authoring_checklist:
  - What is the primary mechanical surface?
  - What secondary surface exists, if any?
  - Which operation verb is being used?
  - Which canonical glossary term does it touch?
  - When is the Technique declared?
  - Does it resolve before or after the relevant roll?
  - Are range, area, and duration defined?
  - What are the Rhythm and Attrition costs?
  - What resists, stops, or mitigates it?
  - Does it stack, replace, or expire?
  - Does it depend on equipment, zone, part, cover, sense, or material?
  - Does the effect still matter if the numerical bonus is removed?
