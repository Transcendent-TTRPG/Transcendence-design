[project]
name = "transcendence-sim"
version = "0.1.0"
description = "Simulation lab for Transcendence combat and balance questions"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
