  - id: trabar_el_gesto
    name: Trabar el Gesto
    species: naghii
    category: attack
    type: reactive
    origin: Flexible Weapons
    rhythm: 5
    attrition: 1
    trigger: user_is_target_of_weapon_rooted_attack_from_enemy_within_weapon_reach
    roll:
      family: specialization
      competency: Flexible Weapons
      opposed_by: attacker_ta
      notes:
        - user substitutes T.D. with T.A. in the incoming exchange
        - if T.A. exceeds attacker's T.A.: no damage taken, user deals T.I., attacker makes Alteration R.R. against Impedido
        - if T.A. does not exceed: counter fails, attack resolves normally
    requirements:
      competencies:
        - Flexible Weapons
      tags:
        - interruption_access
        - user_is_declared_target_of_triggering_attack
        - attacker_within_weapon_reach
        - credible_flexible_contact_line_to_attackers_weapon_arm_or_execution_line
    effects:
      - id: weapon_exchange_primary
        parameters:
          slot: primary
          role: counter_attacker
      - id: apply_ailment
        parameters:
          ailment_id: impedido
          severity: minor
          source_competency: Flexible Weapons
    restrictions:
      - only triggers when user is the declared target of a weapon-rooted attack
      - attacker must be within weapon reach
      - T.A. replaces T.D. — does not supplement it
      - does not prevent non-weapon actions or movement
      - applies to one attacker only
      - Impedido cleared by successful Enfoque S.R. against original severity
    duration_model: ailment_persistence
    notes:
      - runtime_gap: small_runtime_extension
      - missing_1: counter_attacker_exchange_role — weapon_exchange_primary currently only handles standard attacker role; counter-exchange where defender uses T.A. as defense substitute needs new exchange variant
      - missing_2: ailment_gated_on_successful_counter — apply_ailment currently fires unconditionally; needs conditional gate on exchange outcome
      - Impedido added to sim/data/ailments/ailments.yaml as part of this port
      - severity param uses minor as Novice proxy; rank-scaled severity needs runtime support
      - design revised: category changed from utility to attack; trigger changed from enemy-declaration to incoming-attack-on-user

  - id: plantar_la_guardia
    name: Plantar la Guardia
    species: naghii
    category: utility
    type: active
    origin: Spear
    rhythm: 3
    attrition: 1
    trigger: user_establishes_spear_ward_zone_at_current_position
    roll:
      family: none
      competency: null
      opposed_by: null
      notes:
        - no attack roll; zone activates on declaration
        - zone Rhythm tax at Novice = 1 + rank_bonus(Novice) = 2
    requirements:
      competencies:
        - Spear
      tags:
        - ward_access
        - stable_footing
    effects:
      - id: apply_procedural_state
        parameters:
          state_id: ward_zone
          zone_radius: weapon_reach_plus_1m
          enemy_rhythm_tax: rank_bonus_plus_1
          cleanup_path: user_moves_or_turns_or_displaced
          affects: enemies_within_zone
    restrictions:
      - zone collapses if user moves beyond negligible distance from declared position
      - zone collapses if user turns the ward away or loses threat posture
      - zone collapses on successful knockdown or displacement
      - does not affect allies
      - enemies may leave the zone freely without penalty
      - cannot maintain while Derribado or Desequilibrado
    duration_model: until_cleanup
    notes:
      - runtime_gap: new_state_family
      - missing: ward_zone_procedural_state — apply_procedural_state effect ID is supported but ward_zone state type has no handler; needs spatial zone geometry, ATB rhythm-tax integration, and cleanup-on-movement tracking
      - cost corrected from R=7/A=2 (authored error) to R=3/A=1; high Rhythm cost defeats ATB viability for a hold-position technique
      - Seed Naghii spear zone-control technique using Ward profile

  - id: leer_el_calor_del_paso
    name: Leer el Calor del Paso
    species: naghii
    category: utility
    type: active
    origin: Percepcion
    rhythm: 3
    attrition: 1
    trigger: living_creature_or_immediate_trace_within_sensory_reach
    roll:
      family: specialization
      competency: Percepcion
      opposed_by: null
      notes:
        - Percepcion specialization check against living creature or trace
        - opposition is T.E. (Sigilo) — only when target actively suppresses physical signal; not yet modeled in sim
        - treated as uncontested (always succeeds when triggered); Sigilo-opposed surface is a future small_runtime_extension
    requirements:
      competencies:
        - Percepcion
      tags:
        - living_creature_present_or_immediate_trace_available
    effects: []
    restrictions:
      - requires a living creature or immediate living trace within sensory reach
      - cannot be used without physical signs to read
      - reveals one immediate truth only — Narrator-side, no mechanical sim state
      - does not create a bonus to another roll by itself
      - does not create persistent tracking
    duration_model: immediate
    notes:
      - data_only — Percepcion specialization roll resolves through existing path; information output is Narrator-side and carries no mechanical state in the sim
      - contextual_masking_opposition not modeled: full read vs. Sigilo matchup needs a Percepcion-opposed-by-masking surface
      - Seed Naghii Perception utility technique for non-weapon information-reveal coverage

  - id: pesar_el_umbral
    name: Pesar el Umbral
    species: naghii
    category: utility
    type: active
    origin: Sigilo
    rhythm: 3
    attrition: 1
    trigger: user_in_real_hidden_position_with_creature_within_4m_threshold_range
    roll:
      family: specialization
      competency: Sigilo
      opposed_by: alteration_resistance
      notes:
        - Sigilo check from hidden position; opposed by target's Alteration R.R.
        - if user wins the opposed roll, Aterrorizado applies at rank-appropriate severity
    requirements:
      competencies:
        - Sigilo
      tags:
        - user_in_real_hidden_position
        - target_within_4m_and_capable_of_registering_nearby_unseen_threat
    effects:
      - id: apply_ailment
        parameters:
          ailment_id: aterrorizado
          severity: minor
          source_competency: Sigilo
    restrictions:
      - requires a real hidden position — cover, concealment, darkness, broken sightline
      - does not function in open exposure where the user is plainly registered
      - does not work on mindless targets or targets with no self-preservation instinct
      - target must be within 4 meters
    duration_model: ailment_persistence
    notes:
      - data_only — all surfaces exist: Sigilo specialization roll + alteration_resistance opposed_by + apply_ailment with aterrorizado
      - type corrected from reactive to active: the user in hidden position takes the initiative, not the creature
      - range corrected to 4 meters from hidden position; original "nearby line / hidden presence reach" was not concrete enough
      - severity param uses minor as Novice proxy; rank-scaled severity follows standard ailment bands (Minor novice, Moderate adept, Severe master+)
      - same structural pattern as reir_donde_mas_suena (Zarnag) — Sigilo replaces Intimidacion

  - id: leer_la_linea_ausente
    name: Leer la Línea Ausente
    species: naghii
    category: utility
    type: active
    origin: Interpretacion
    rhythm: 3
    attrition: 1
    trigger: incomplete_or_suspicious_pattern_record_route_ritual_scene_testimony_formation_or_sequence_present
    roll:
      family: specialization
      competency: Interpretacion
      opposed_by: null
      notes:
        - uncontested by default; opposed only when another creature deliberately falsified or staged the absence
        - Sigilo-like masking opposition not yet modeled in sim
    requirements:
      competencies:
        - Interpretacion
      tags:
        - incomplete_or_suspicious_pattern_present
    effects: []
    restrictions:
      - requires an incomplete or suspicious pattern to read
      - reveals one absence category only
      - does not reveal the full missing content
      - does not identify the responsible party by itself
      - does not reconstruct the entire event
      - does not create a bonus to another roll by itself
      - does not bypass deliberate staging without contextual opposition
    duration_model: immediate
    notes:
      - data_only — Interpretacion specialization roll resolves through existing path; output is Narrator-side, no mechanical sim state
      - deliberate-staging opposition not modeled: contextual masking matchup needs Interpretacion-opposed-by-masking surface
      - Seed Naghii archive-reading technique for absence-evidence and gap-read coverage
