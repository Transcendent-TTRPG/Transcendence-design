techniques:
  - id: doblar_el_tiro
    name: Doblar el Tiro
    species: naghii
    category: attack
    type: active
    origin: Ranged Weapons
    rhythm: 4
    attrition: 1
    trigger: indirect_line_available_through_declared_surface
    roll:
      family: attack
      competency: Ranged Weapons
      opposed_by: Defense
      notes:
        - one-surface rebound or skip attack
    requirements:
      competencies:
        - Ranged Weapons
      tags:
        - ricochet_access
        - rebound_capable_projectile
        - usable_rebound_surface_present
        - physically_plausible_indirect_path
    effects:
      - id: indirect_surface_ranged_attack
        parameters:
          bypasses_original_cover_edge: true
          declared_surface_count: 1
          final_defense_applies_normally: true
    restrictions:
      - does not ignore total cover or sealed barriers
      - does not curve freely in open air
      - does not seek a target the user cannot reasonably locate
      - only one declared rebound or skip surface at novice
    duration_model: immediate
    notes:
      - Seed Naghii ranged ricochet technique for material indirect-line attack geometry.

  - id: nublar_la_senal
