    effects:
      - id: advance_before_exchange_distance
        parameters:
          meters: 2
      - id: weapon_exchange_primary
        parameters:
          slot: primary
    restrictions:
      - advance and attack are one committed action
      - user remains committed forward after the exchange
      - technique does not create broad zone control by itself
    duration_model: immediate
    notes:
      - Seed Naghii spear technique that closes up to two meters before resolving a standard attack exchange.

  - id: recuperar_la_distancia
