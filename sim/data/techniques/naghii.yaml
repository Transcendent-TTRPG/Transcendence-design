    duration_model: until_next_movement_or_concealment_or_mark_clear
    notes:
      - Seed Naghii ranged precision marking technique for immediate-route readability.
      - Base cleanup path is Interactuar rather than trained technical neutralization.

  - id: robar_el_angulo
