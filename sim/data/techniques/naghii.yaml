      - does not disable all sensory channels
      - does not prevent movement
      - does not create a scene-wide penalty
    duration_model: until_cleanup_or_next_channel_dependent_action
    notes:
      - Seed Naghii ranged residue technique for bounded sensory-pressure coverage.

  - id: marcar_la_lectura
    name: Marcar la Lectura
    species: naghii
    category: attack
