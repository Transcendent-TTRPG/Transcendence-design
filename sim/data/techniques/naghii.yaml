        parameters:
          slot: primary
    restrictions:
      - only applies against a movement-driven entry window
      - does not function as a generic reactive attack against any hostile action
      - on success the enemy's entry should not convert into clean melee contact
    duration_model: immediate
    notes:
      - Seed Naghii reactive spear interception technique.

  - id: clavar_el_paso
    name: Clavar el Paso
    species: naghii
    category: attack
    type: active
    origin: Spear
    rhythm: 5
    attrition: 1
    trigger: committed_forward_close_and_strike
    requirements:
      competencies:
        - Spear
      tags:
