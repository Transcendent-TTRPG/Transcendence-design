  - id: anudar_el_paso
    name: Anudar el Paso
    species: naghii
    category: attack
    type: reactive
    origin: Flexible Weapons
    rhythm: 4
    attrition: 1
    trigger: enemy_inside_profile_reach_attempts_clean_separation
    roll:
      family: specialization
      competency: Flexible Weapons
      opposed_by: defense
      notes:
        - reactive anti-disengagement torsion attack
    requirements:
      competencies:
        - Flexible Weapons
      tags:
        - torsion_access
        - profile_reach_contested
    effects:
      - id: weapon_exchange_primary
        parameters:
          zone: torso
      - id: deny_clean_separation_if_check_succeeds
        parameters:
          scope: single_enemy_within_profile_reach
    restrictions:
      - only applies after the enemy is already inside the user's profile-bearing reach
      - does not stop entry from outside reach
      - denies clean withdrawal or superior angle rather than creating full immobilization
    duration_model: immediate
    notes:
      - Seed Naghii flexible-weapon anti-disengagement technique.

  - id: cerrar_la_linea
    name: Cerrar la Línea
    species: naghii
    category: attack
    type: reactive
    origin: Spear
    rhythm: 4
    attrition: 1
